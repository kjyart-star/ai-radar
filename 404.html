<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AI 레이더</title>
<style>
  body{ margin:0; min-height:100vh; display:grid; place-items:center;
        background:#07110d; color:rgba(255,255,255,.72);
        font-family:system-ui,-apple-system,"Pretendard","Noto Sans KR",sans-serif; }
  div{ text-align:center; padding:24px; }
  p{ margin:0 0 18px; font-size:14px; line-height:1.7; word-break:keep-all; }
  a{ color:#b6ff3f; font-size:12px; font-weight:800; letter-spacing:.12em;
     text-transform:uppercase; text-decoration:none; }
</style>
</head>
<body>

<div>
  <p>페이지를 찾을 수 없습니다.</p>
  <a href="./">돌아가기</a>
</div>

<script>
/* GitHub Pages SPA 폴백.
   게시판 글 주소(/board/{slug})와 프로필 주소(/u/{slug})에는 아직 실제 파일이 없어
   이 페이지가 대신 뜬다.
   원래 주소를 sessionStorage 에 담아 사이트 루트로 보내면, index.html 이 시작할 때
   꺼내서 history.replaceState 로 되돌리고 그 글을 그린다. 주소는 그대로 남는다.

   나중에 /board/{slug}.html 같은 실제 파일이 생기면 여기를 타지 않고 바로 열린다 —
   주소가 안 바뀌는 것이 이 구조의 핵심이다.

   베이스 경로(로컬 "/" · 배포 "/ai-radar/")를 하드코딩하지 않는다.
   경로에서 board·u 앞부분을 잘라 쓰므로 어디에 올려도 같게 동작한다.
   index.html 의 BASE 계산과 같은 정규식이어야 한다 — 한쪽만 고치면 어긋난다.
   그 둘이 아닌 404 는 되돌려 보낼 곳을 알 수 없으므로 위의 링크만 보여준다 —
   짐작해서 보내면 루트가 또 404 일 때 무한히 튕긴다. */
(function(){
  "use strict";
  var p = location.pathname;
  var m = p.match(/^(.*\/)(?:board|u)(?:\/|$)/);
  if (!m) return;
  try { sessionStorage.setItem("airadar_path", p + location.search + location.hash); } catch(e){}
  location.replace(m[1]);
})();
</script>

</body>
</html>
