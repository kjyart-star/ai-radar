<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 레이더 — AI 공모전·영화제·지원사업·뉴스</title>
<meta name="description" content="AI 공모전, AI 영화제, AI 지원사업, 아침 뉴스 브리핑과 유튜브 영상을 한 화면에서 봅니다. 로그인 없이 열립니다.">
<meta property="og:title" content="AI 레이더">
<meta property="og:description" content="AI 공모전·영화제·지원사업·뉴스를 한 화면에서. 마감이 가까운 순으로.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" sizes="any" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2048%2048'%3E%3Crect%20width='48'%20height='48'%20fill='%2307110d'/%3E%3Ccircle%20cx='24'%20cy='24'%20r='17'%20fill='none'%20stroke='%23b6ff3f'%20stroke-width='2.4'%20opacity='.55'/%3E%3Ccircle%20cx='24'%20cy='24'%20r='9'%20fill='none'%20stroke='%23b6ff3f'%20stroke-width='2.4'%20opacity='.85'/%3E%3Cpath%20d='M24%2024%20L40%2015'%20stroke='%23b6ff3f'%20stroke-width='3'%20stroke-linecap='round'/%3E%3Ccircle%20cx='33'%20cy='15'%20r='4'%20fill='%23b6ff3f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<style>
  /* =========================================================================
     AI 레이더 — lime-lab-editorial 디자인 시스템
     팔레트를 라임 온 다크로 유지한 이유: 라임 링 위의 스위프는 레이더 화면이고,
     서비스 이름이 곧 그 화면이다. 색만 빌린 게 아니라 주제에서 나온 선택이다.
     ========================================================================= */
  :root{
    --ink:#07110d;          /* 다크 배경 — 순수 검정이 아니라 초록기 도는 검정 */
    --ink-2:#0d1c16;
    --paper:#f2f1e9;        /* 크림 — 페이지 절반을 이 색이 가진다 */
    --paper-2:#e7e8dc;
    --lime:#b6ff3f;         /* 유일한 액센트. 숫자·D-day·액티브·CTA 에만 */
    --coral:#ff7358;        /* 페이퍼 섹션 전용 */
    --line-dark:rgba(255,255,255,.16);
    --line-light:rgba(7,17,13,.18);
    --muted-dark:rgba(255,255,255,.64);
    --muted-light:rgba(7,17,13,.62);
    --max:1320px;
    --navh:70px;
    /* 디스플레이와 본문을 다른 패밀리로 나눈다. 같은 패밀리로 통일하는 것이
       가장 흔한 기본값이라, 라틴 디스플레이만 Wanted Sans 로 분리했다. */
    --display:"Wanted Sans Variable","Wanted Sans",Pretendard,system-ui,sans-serif;
    --body:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--ink); color:#fff; font-family:var(--body);
        overflow-x:hidden; }
  button,a,input{ font:inherit; color:inherit; }
  button{ cursor:pointer; background:none; border:0; }
  a{ text-decoration:none; }
  img{ display:block; max-width:100%; }
  :focus-visible{ outline:2px solid var(--lime); outline-offset:3px; }
  .tnum{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  /* ---------- chrome ---------- */
  .progress{ position:fixed; inset:0 auto auto 0; z-index:100; height:3px; width:0;
             background:var(--lime); }
  .nav{ position:fixed; z-index:90; top:0; left:0; right:0; height:var(--navh);
        display:flex; align-items:center; justify-content:space-between; gap:20px;
        padding:0 32px; border-bottom:1px solid var(--line-dark);
        background:rgba(7,17,13,.82); backdrop-filter:blur(20px); }
  /* 로고를 키웠다 (대표 지시 2026-08-12). 서비스 이름이 내비에서 가장 큰 글자여야
     한다 — 여기가 유일하게 브랜드를 말하는 자리다. 마크 26→34px, 워드마크 12→17px. */
  .brand{ display:flex; align-items:center; gap:13px; font-family:var(--display);
          font-size:17px; letter-spacing:.13em; font-weight:900; white-space:nowrap; }
  .brand svg{ width:34px; height:34px; display:block; }
  /* 한글 라벨이라 uppercase 와 넓은 자간을 뺐다 — 한글에는 대문자가 없고,
     자간을 벌리면 낱자가 흩어져 읽기 더 어려워진다. 크기는 12px 로 올렸다. */
  .nav-links{ display:flex; gap:24px; font-size:12px; letter-spacing:.01em;
              color:var(--muted-dark); font-weight:700;
              overflow-x:auto; scrollbar-width:none; }
  .nav-links::-webkit-scrollbar{ display:none; }
  .nav-links a{ white-space:nowrap; padding:6px 0; border-bottom:2px solid transparent; }
  .nav-links a:hover{ color:#fff; }
  .nav-links a.on{ color:var(--lime); border-bottom-color:var(--lime); }

  /* ---------- hero ---------- */
  /* 히어로를 96vh 가 아니라 74vh 로 낮췄다. 이건 리스팅 서비스라 목록이
     첫 화면 안에 걸쳐 보여야 스크롤할 이유가 생긴다. */
  .hero{ position:relative; min-height:min(74vh, 700px); display:flex; align-items:flex-end;
         overflow:hidden; border-bottom:1px solid var(--line-dark); }
  .hero-radar{ position:absolute; inset:0; pointer-events:none; }
  .hero-radar i{ position:absolute; left:76%; top:46%; translate:-50% -50%;
                 border:1px solid rgba(182,255,63,.24); border-radius:50%; }
  .hero-radar i:nth-child(1){ width:26vw; height:26vw; }
  .hero-radar i:nth-child(2){ width:52vw; height:52vw; }
  .hero-radar i:nth-child(3){ width:78vw; height:78vw; }
  .hero-radar i:nth-child(4){ width:104vw; height:104vw; opacity:.6; }
  .hero-sweep{ position:absolute; left:76%; top:46%; width:104vw; height:104vw;
               translate:-50% -50%; border-radius:50%;
               background:conic-gradient(from 0deg,
                 rgba(182,255,63,.10) 0deg, rgba(182,255,63,0) 40deg,
                 rgba(182,255,63,0) 360deg);
               animation:sweep 9s linear infinite; }
  /* 스위프의 앞날을 1px 실선으로 못박는다. 이게 없으면 원뿔형 조명처럼 보인다 —
     레이더는 빛이 아니라 선이 도는 화면이다. */
  .hero-sweep::before{ content:""; position:absolute; left:50%; top:0; width:1px;
                       height:50%; background:rgba(182,255,63,.55); }
  @keyframes sweep{ to{ rotate:360deg; } }
  .hero::after{ content:""; position:absolute; inset:0; pointer-events:none;
                background:linear-gradient(90deg, rgba(7,17,13,.96) 0%,
                  rgba(7,17,13,.72) 46%, rgba(7,17,13,.30) 100%); }
  .hero-content{ position:relative; z-index:2; width:min(var(--max), calc(100% - 64px));
                 margin:0 auto; padding:calc(var(--navh) + 62px) 0 58px; }
  .kicker{ display:flex; gap:9px; flex-wrap:wrap; margin-bottom:22px; }
  .pill{ border:1px solid rgba(255,255,255,.35); border-radius:999px; padding:7px 12px;
         font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; }
  .pill.accent{ background:var(--lime); color:var(--ink); border-color:var(--lime);
                font-weight:900; }
  /* 라틴 디스플레이에만 강한 음수 자간을 준다. 한글에 -.075em 을 주면 글자가
     뭉개져서 오히려 싸구려가 된다 — 한글 라인은 -.02em 까지만. */
  .hero h1{ margin:0; max-width:960px; font-family:var(--display); font-weight:900;
            font-size:clamp(64px, 10.5vw, 152px); letter-spacing:-.075em;
            line-height:.82; text-transform:uppercase; }
  .hero h1 em{ display:block; margin-top:20px; color:var(--lime); font-style:normal;
               font-family:var(--body); font-weight:800; font-size:.26em;
               letter-spacing:-.02em; line-height:1.15; text-transform:none; }
  .hero-bottom{ margin-top:36px; display:grid;
                grid-template-columns:minmax(0,600px) 1fr; gap:60px; align-items:end; }
  .hero-copy{ margin:0; color:rgba(255,255,255,.8); font-size:clamp(16px, 1.7vw, 21px);
              line-height:1.65; word-break:keep-all; }
  .hero-facts{ display:grid; grid-template-columns:repeat(3,1fr);
               border-top:1px solid var(--line-dark); }
  .hero-fact{ padding:15px 12px 0 0; min-width:0; }
  .hero-fact b{ display:block; color:var(--lime); font-family:var(--display);
                font-size:clamp(24px,3.2vw,34px); letter-spacing:-.05em; line-height:1; }
  .hero-fact span{ display:block; margin-top:7px; color:var(--muted-dark); font-size:10px;
                   letter-spacing:.1em; text-transform:uppercase; font-weight:700;
                   word-break:keep-all; }

  /* ---------- section shell ---------- */
  .section{ padding:104px 32px; scroll-margin-top:var(--navh); }
  .inner{ width:min(var(--max),100%); margin:0 auto; }
  .paper{ background:var(--paper); color:var(--ink); }
  .paper-alt{ background:var(--paper-2); color:var(--ink); }
  .dark{ background:var(--ink); color:#fff; }
  .section-head{ display:grid; grid-template-columns:1fr minmax(260px,440px); gap:56px;
                 align-items:end; margin-bottom:40px; }
  .eyebrow{ margin:0 0 14px; font-family:var(--display); font-size:11px; font-weight:800;
            letter-spacing:.18em; text-transform:uppercase; color:var(--coral); }
  .dark .eyebrow{ color:var(--lime); }
  .section h2{ margin:0; font-size:clamp(36px,5vw,68px); letter-spacing:-.025em;
               line-height:1.08; font-weight:800; word-break:keep-all; }
  .section-intro{ margin:0; color:var(--muted-light); font-size:15px; line-height:1.75;
                  word-break:keep-all; }
  .dark .section-intro{ color:var(--muted-dark); }
  .count{ font-family:var(--display); font-size:12px; font-weight:800; letter-spacing:.12em;
          text-transform:uppercase; color:var(--muted-light); white-space:nowrap; }
  .dark .count{ color:var(--muted-dark); }
  .count b{ color:var(--ink); font-size:15px; }
  .dark .count b{ color:var(--lime); }

  /* ---------- filters ---------- */
  .controls{ display:flex; flex-wrap:wrap; gap:10px; align-items:center;
             margin-bottom:26px; }
  .chip{ border:1px solid var(--line-light); border-radius:999px; padding:9px 14px;
         font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:700;
         min-height:38px; }
  .chip:hover,.chip.on{ background:var(--ink); color:var(--paper);
                        border-color:var(--ink); }
  .dark .chip{ border-color:var(--line-dark); color:#fff; }
  .dark .chip:hover,.dark .chip.on{ background:var(--lime); color:var(--ink);
                                    border-color:var(--lime); }
  .search{ flex:1 1 220px; min-width:0; min-height:38px; padding:9px 13px;
           border:1px solid var(--line-light); background:transparent; font-size:14px; }
  .search::placeholder{ color:var(--muted-light); }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }

  /* ---------- list rows (핵심 반복 단위) ---------- */
  .rows{ border-top:1px solid var(--line-light); }
  .dark .rows{ border-top-color:var(--line-dark); }
  .row{ display:grid; grid-template-columns:96px 1fr; gap:26px; align-items:start;
        padding:22px 16px 24px; border-bottom:1px solid var(--line-light);
        transition:background .18s ease, color .18s ease; }
  .dark .row{ border-bottom-color:var(--line-dark); }
  @media (hover:hover){
    .row:hover{ background:var(--ink); color:#fff; }
    .dark .row:hover{ background:var(--lime); color:var(--ink); }
    .row:hover .r-meta,.row:hover .r-sum{ color:rgba(255,255,255,.72); }
    .dark .row:hover .r-meta,.dark .row:hover .r-sum{ color:rgba(7,17,13,.72); }
    .row:hover .tag{ border-color:rgba(255,255,255,.4); }
    .dark .row:hover .tag{ border-color:rgba(7,17,13,.4); }
    .row:hover .dd{ color:var(--lime); }
    .dark .row:hover .dd{ color:var(--ink); }
  }
  .dd{ font-family:var(--display); font-weight:800; font-size:29px; letter-spacing:-.045em;
       line-height:1; text-align:right; padding-top:2px; }
  .dd.soon{ color:var(--coral); }
  .dark .dd.soon{ color:var(--lime); }
  .dd.over{ opacity:.38; }
  .dd.tbd{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; opacity:.55;
           padding-top:9px; }
  .r-main{ min-width:0; }
  .r-title{ font-size:clamp(17px,1.5vw,20px); font-weight:800; letter-spacing:-.02em;
            line-height:1.35; word-break:keep-all; }
  .tag{ display:inline-block; margin-left:8px; border:1px solid var(--line-light);
        border-radius:999px; padding:3px 9px; font-size:10px; font-weight:700;
        letter-spacing:.08em; vertical-align:middle; white-space:nowrap; }
  .dark .tag{ border-color:var(--line-dark); }
  .r-meta{ margin-top:9px; color:var(--muted-light); font-size:12.5px; line-height:1.6;
           word-break:keep-all; }
  .dark .r-meta{ color:var(--muted-dark); }
  .r-meta i{ font-style:normal; opacity:.4; margin:0 7px; }
  .r-meta b{ font-weight:700; }
  .r-sum{ margin-top:8px; color:var(--muted-light); font-size:13px; line-height:1.6;
          word-break:keep-all; display:-webkit-box; -webkit-line-clamp:2;
          -webkit-box-orient:vertical; overflow:hidden; }
  .dark .r-sum{ color:var(--muted-dark); }

  /* ---------- fold ---------- */
  .fold-head{ display:flex; align-items:end; justify-content:space-between; gap:24px;
              width:100%; text-align:left; padding:0 0 24px;
              border-bottom:1px solid var(--line-light); margin-bottom:0; }
  .dark .fold-head{ border-bottom-color:var(--line-dark); }
  .fold-sign{ font-family:var(--display); font-size:26px; font-weight:800; line-height:1; }
  [data-foldsec] .fold-body{ padding-top:26px; }
  [data-foldsec].collapsed .fold-body{ display:none; }
  [data-foldsec] .fold-sign::after{ content:"–"; }
  [data-foldsec].collapsed .fold-sign::after{ content:"+"; }

  /* ---------- briefing body (richReport 출력물) ---------- */
  .brief-head{ display:grid; grid-template-columns:1fr auto; gap:24px; align-items:end;
               padding-bottom:22px; border-bottom:1px solid var(--line-light);
               margin-bottom:30px; }
  .brief-head h3{ margin:0; font-size:clamp(26px,3.4vw,44px); letter-spacing:-.03em;
                  line-height:1.1; font-weight:800; word-break:keep-all; }
  .brief-date{ font-family:var(--display); font-size:clamp(18px,2.2vw,28px); font-weight:800;
               letter-spacing:-.04em; white-space:nowrap; }
  .brief-body{ white-space:pre-wrap; word-break:keep-all; font-size:15px; line-height:1.8;
               color:var(--muted-light); }
  .dark .brief-body{ color:var(--muted-dark); }
  /* 본문에 섞인 맨 링크만 밑줄. 카드는 테두리가 이미 링크임을 말한다. */
  .brief-body a:not(.item-card):not(.yt-thumb):not(.news-card){
    text-decoration:underline; text-underline-offset:3px; }
  /* 원문에 이미 빈 줄이 있고 .brief-body 가 pre-wrap 이라 여백이 두 번 들어간다.
     여기 마진은 작게 잡는다. */
  .sec-label{ display:block; margin:20px 0 14px; font-size:clamp(21px,2.4vw,29px);
              font-weight:800; letter-spacing:-.025em; line-height:1.2;
              color:var(--ink); white-space:normal; word-break:keep-all; }
  .dark .sec-label{ color:#fff; }
  .sec-label:first-child{ margin-top:0; }
  /* 1단계 헤더는 브리핑 제목과 겹친다. 지우지는 않고 작은 라벨로 낮춘다. */
  .sec-label.meta{ margin:0 0 6px; font-family:var(--display); font-size:11px;
                   font-weight:800; letter-spacing:.16em; text-transform:uppercase;
                   color:var(--coral); }
  .dark .sec-label.meta{ color:var(--lime); }
  .card-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px;
              margin:14px 0 20px; white-space:normal; }
  .item-card{ display:grid; grid-template-columns:112px 1fr; gap:14px; align-items:start;
              border:1px solid var(--line-light); padding:13px;
              transition:background .18s ease, color .18s ease; }
  .dark .item-card{ border-color:var(--line-dark); }
  .item-card img{ width:112px; height:63px; object-fit:cover; background:var(--ink-2); }
  .item-card:not(.photo):not(.yt) img{ width:38px; height:38px; object-fit:contain;
                                       background:none; }
  @media (hover:hover){
    .item-card:hover{ background:var(--ink); color:#fff; }
    .dark .item-card:hover{ background:var(--lime); color:var(--ink); }
  }
  .ic-body{ display:block; min-width:0; }
  .ic-title{ display:block; font-size:14px; font-weight:800; line-height:1.4;
             letter-spacing:-.015em; word-break:keep-all; }
  .ic-desc{ display:-webkit-box; margin-top:5px; font-size:12.5px; line-height:1.55;
            opacity:.68; word-break:keep-all; -webkit-line-clamp:2;
            -webkit-box-orient:vertical; overflow:hidden; }
  .ic-url{ display:block; margin-top:8px; font-size:10px; font-weight:700;
           letter-spacing:.08em; text-transform:uppercase; opacity:.5; }
  .yt-thumb,.news-card{ display:inline-grid; grid-auto-flow:column; gap:10px;
                        align-items:center; border:1px solid var(--line-light);
                        padding:9px 12px; margin:5px 0; white-space:normal;
                        vertical-align:middle; }
  .dark .yt-thumb,.dark .news-card{ border-color:var(--line-dark); }
  .yt-thumb img{ width:96px; height:54px; object-fit:cover; }
  .nc-ico{ width:18px; height:18px; }
  .nc-domain{ font-size:12px; font-weight:700; }
  .nc-go{ font-size:10px; letter-spacing:.08em; text-transform:uppercase; opacity:.55; }

  /* ---------- archive ---------- */
  .arch{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:0;
         border-top:1px solid var(--line-dark); }
  .arch button{ text-align:left; padding:20px 18px; border-bottom:1px solid var(--line-dark);
                border-right:1px solid var(--line-dark); display:block; width:100%;
                transition:background .18s ease, color .18s ease; }
  .arch button:hover{ background:var(--lime); color:var(--ink); }
  .arch button.on{ background:var(--lime); color:var(--ink); }
  .arch .a-date{ display:block; font-family:var(--display); font-size:21px; font-weight:800;
                 letter-spacing:-.04em; }
  .arch .a-title{ display:block; margin-top:7px; font-size:12px; opacity:.62;
                  word-break:keep-all; }

  /* ---------- states ---------- */
  .note{ padding:52px 16px; text-align:center; color:var(--muted-light);
         font-size:14px; word-break:keep-all; }
  .dark .note{ color:var(--muted-dark); }
  .fail{ border:1px solid var(--line-light); padding:38px 26px; text-align:center; }
  .dark .fail{ border-color:var(--line-dark); }
  .fail h3{ margin:0 0 10px; font-size:22px; letter-spacing:-.02em; font-weight:800; }
  .fail p{ margin:0 0 18px; color:var(--muted-light); font-size:14px; line-height:1.7;
           word-break:keep-all; }
  .dark .fail p{ color:var(--muted-dark); }
  .btn{ display:inline-block; border:1px solid var(--ink); padding:11px 18px; font-size:11px;
        font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
  .btn:hover{ background:var(--ink); color:var(--paper); }
  .dark .btn{ border-color:var(--lime); color:var(--lime); }
  .dark .btn:hover{ background:var(--lime); color:var(--ink); }

  /* ---------- footer ---------- */
  footer{ padding:52px 32px; background:#030705; border-top:1px solid var(--line-dark); }
  .footer-inner{ width:min(var(--max),100%); margin:0 auto; display:flex; align-items:end;
                 justify-content:space-between; gap:30px; }

<script>
(function(){
"use strict";

/* ============ 공개 API (키 불필요·읽기 전용) ============
   ⚠️ 2026-08-12: 옛 주소가 404 로 죽어 다섯 메뉴가 전부 "데이터를 불러오지 못했습니다" 였다.
   관리시스템 웹앱에 **새 배포**를 만들면 URL 이 바뀌는데, 이 파일은 그걸 모른 채 옛 주소를
   계속 불렀다. 화면 자체는 떠서 겉으로는 멀쩡해 보인다 — 조용히 죽는 부류다.
   주소를 바꿀 일이 생기면 반드시 살아 있는지 먼저 확인한다:
     curl -sL "<주소>?action=pub" | head -c 80     → {"generated": … 가 나와야 한다 */
var API = "https://script.google.com/macros/s/AKfycbxqPn36E8gpmKp3RzUR60XTaNL7G4wY_-xyUMXszOUUj8mQh3OoSOcWCzFZ-rkxdHU5/exec";

/* ============ 상태 ============ */
var state = { data:null, loading:true, error:null };
var C = document.getElementById("view");

/* ============ 유틸 ============ */
function esc(s){ s = (s==null?"":String(s));
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* 본문 속 URL을 새 탭으로 열리는 링크로 변환 (이스케이프 후 치환 — 괄호·따옴표는 URL에서 제외).
   유튜브 링크는 썸네일 카드로 렌더링 */
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s)<>"'　]+)/g, function(u){
    var m = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{6,20})/);
    if (m) {
      return "<a class='yt-thumb' href='"+u+"' target='_blank' rel='noopener noreferrer'>"+
        "<img src='https://i.ytimg.com/vi/"+m[1]+"/mqdefault.jpg' alt='유튜브 썸네일' loading='lazy'>"+
        "<span>영상 보기</span></a>";
    }
    var h = u.match(/^https?:\/\/([^\/]+)/);
    var host = h ? h[1].replace(/^www\./,"") : "";
    return "<a class='news-card' href='"+u+"' target='_blank' rel='noopener noreferrer'>"+
      "<img class='nc-ico' src='https://www.google.com/s2/favicons?domain="+host+"&amp;sz=64' alt='' loading='lazy'>"+
      "<span class='nc-domain'>"+host+"</span><span class='nc-go'>기사 보기 ↗</span></a>";
  });
}

/* 리포트 본문을 리치 카드로 렌더링: "• 제목 — 요약 (출처: URL)" 줄을
   [썸네일 | 제목·설명·링크] 가로 카드로 변환 (유튜브=영상 썸네일, 뉴스=언론사 아이콘/기사 사진) */
function richReport(s){
  var lines = String(s==null?"":s).replace(/\*\*/g,"").split("\n");
  var out = [], cardBuf = [];
  /* 연속된 카드 라인은 2열 그리드(card-grid)로 묶는다 */
  function flushCards(){
    if (cardBuf.length){
      out.push("<span class='card-grid'>"+cardBuf.join("")+"</span>");
      cardBuf = [];
    }
  }
  for (var i=0;i<lines.length;i++){
    var t = lines[i].trim();
    /* (img: URL) 마커 = 기사 사진 → 사진 카드로 렌더 */
    var imgM = t.match(/[\(（]\s*img\s*:\s*(https?:\/\/[^\s)）]+)\s*[\)）]/i);
    var photo = imgM ? imgM[1] : "";
    if (imgM) t = t.replace(imgM[0], "").trim();
    var um = t.match(/(https?:\/\/[^\s)<>"'　]+)/);
    if (/^[•\-*]/.test(t) && um){
      var url = um[1];
      var body = t.replace(/^[•\-*]+\s*/,"")
        .replace(/[\(（]\s*(?:출처|링크)\s*:?\s*https?:\/\/[^\s)）]+\s*[\)）]?/g,"")
        .replace(/https?:\/\/[^\s)<>"'　]+/g,"")
        .replace(/[\(（]\s*[\)）]/g,"").trim();
      var title = body, desc = "";
      var dash = body.indexOf(" — "); if (dash < 0) dash = body.indexOf(" - ");
      if (dash > -1){ title = body.slice(0,dash).trim(); desc = body.slice(dash+3).trim(); }
      var ym = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{6,20})/);
      var hh = url.match(/^https?:\/\/([^\/]+)/); var hst = hh ? hh[1].replace(/^www\./,"") : "";
      var img, cls, go;
      if (ym){ img = "https://i.ytimg.com/vi/"+ym[1]+"/mqdefault.jpg"; cls = "yt"; go = "youtube.com · 영상 보기"; }
      else if (photo){ img = photo; cls = "news photo"; go = hst+" · 기사 보기 ↗"; }
      else { img = "https://www.google.com/s2/favicons?domain="+hst+"&sz=128"; cls = "news"; go = hst+" · 기사 보기 ↗"; }
      /* 사진 로드 실패 시 파비콘으로 대체 (깨진 이미지 방지) */
      var onerr = photo ? " onerror=\"this.onerror=null;this.src='https://www.google.com/s2/favicons?domain="+esc(hst)+"&sz=128';this.closest('.item-card').classList.remove('photo')\"" : "";
      cardBuf.push("<a class='item-card "+cls+"' href='"+esc(url)+"' target='_blank' rel='noopener noreferrer'>"+
        "<img src='"+img+"' alt='' loading='lazy'"+onerr+">"+
        "<span class='ic-body'><span class='ic-title'>"+esc(title)+"</span>"+
        (desc ? "<span class='ic-desc'>"+esc(desc)+"</span>" : "")+
        "<span class='ic-url'>"+esc(go)+"</span></span></a>");
    } else {
      if (t === "" && cardBuf.length){ continue; } /* 카드 사이 빈 줄로 그리드가 끊기지 않게 */
      flushCards();
      /* "# 제목", "## [생성형 AI]" 같은 헤더 줄을 라벨로 조판한다. 원문 문자열은
         건드리지 않고 보이는 형태만 바꾼다 — 그냥 두면 #이 그대로 찍힌다. */
      var hm = t.match(/^(#{1,6})\s+(.+)$/);
      if (hm){
        out.push("<span class='sec-label"+(hm[1].length===1?" meta":"")+"'>"+
          esc(hm[2].replace(/^\[/,"").replace(/\]$/,""))+"</span>");
      } else {
        out.push(linkify(lines[i]));
      }
    }
  }
  flushCards();
  return out.join("\n");
}

/* Asia/Seoul 현재 시각 */
function seoulNow(){
  var s = new Date().toLocaleString("en-US",{timeZone:"Asia/Seoul"});
  return new Date(s);
}
function parseDate(s){ if(!s) return null; var p=String(s).slice(0,10).split("-"); if(p.length<3) return null;
  return new Date(+p[0], +p[1]-1, +p[2]); }
function ddayInfo(due, today){
  var dd = parseDate(due), cls="far", txt="—";
  if (dd){ var diff = Math.round((dd-today)/86400000);
    txt = diff===0?"D-DAY": diff>0?("D-"+diff):("D+"+(-diff));
    cls = diff<0?"over": diff<=3?"soon": diff<=7?"mid":"far"; }
  return { cls:cls, txt:txt };
}
function findById(list, id){ for(var i=0;i<(list||[]).length;i++){ if(String(list[i].id)===String(id)) return list[i]; } return null; }
function bindFold(root){
  root.querySelectorAll("[data-fold]").forEach(function(h){
    h.onclick = function(){
      var sec = h.closest("[data-foldsec]");
      sec.classList.toggle("collapsed");
      h.setAttribute("aria-expanded", String(!sec.classList.contains("collapsed")));
    };
  });
}
function ctSafeUrl(u){ return /^https?:\/\//i.test(String(u||"")) ? String(u) : ""; }
function todaySeoul(){ var n = seoulNow(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
/* 마감이 오늘부터 N일 이내인 건수 — 히어로 숫자에 쓴다 */
function dueWithin(list, key, days, today){
  var n = 0;
  (list||[]).forEach(function(it){
    var d = parseDate(it[key]); if (!d) return;
    var diff = Math.round((d-today)/86400000);
    if (diff >= 0 && diff <= days) n++;
  });
  return n;
}

/* ============ 메뉴 ============
   이모지 아이콘을 뺐다. 이 시스템은 타이포와 숫자로만 말한다.

   내비 라벨은 한글이다 (대표 지시 2026-08-12). 영문 대문자가 에디토리얼 문법에
   맞긴 하지만, 한국어 서비스에서 CONTESTS·FUNDING 을 매번 해석하게 만드는 건
   멋을 위해 사용성을 깎는 것이다. 영문 대문자 대비는 히어로의 거대 라틴 제목과
   eyebrow 가 이미 충분히 만들고 있다. (세 번째 값은 그 히어로 제목에 계속 쓴다)

   순서는 뉴스리포트가 먼저다 — 매일 아침 갱신되는 유일한 메뉴라 가장 자주 본다.
   첫 화면(DEFAULT_ROUTE)과 첫 메뉴가 어긋나면 "왜 두 번째가 열리지"가 된다.

   라벨은 대표 지시(2026-08-12)로 AI 접두를 붙였다. 띄어쓰기 없이 "AI공모전" 인 것도
   지시 그대로다 — 폭이 줄어 375px 에 다섯 개를 넣기가 오히려 수월하다.
   문서 제목에는 히어로의 전체 이름(HERO[route].ko)을 쓴다. */
var MENU = [
  ["newsrep","뉴스리포트","BRIEFING"],
  ["contests","AI공모전","CONTESTS"],
  ["festivals","AI영화제","FESTIVALS"],
  ["gov","AI지원사업","FUNDING"],
  ["youtube","AI유튜브정보","WATCH"]
];
var TITLES = {};
MENU.forEach(function(it){ TITLES[it[0]] = it[1]; });
var DEFAULT_ROUTE = "newsrep";

/* ============ 구조 판단 ============
   메뉴별 해시 라우팅이고, 한 번에 한 화면만 그린다. 한 페이지 스크롤로 합치지
   않은 이유는 지원사업 263 + 영화제 89 + 공모전 71 = 400행이 넘어서다.
   에디토리얼 스크롤 서사는 "빨리 찾아야 하는 정보"에서는 스크롤 감옥이 된다.
   대신 다섯 화면 각각이 히어로 → 페이퍼 → 다크 → 페이퍼 리듬을 그대로 갖는다.
   데이터는 메모리에 캐시되므로 메뉴 이동은 네트워크 없이 즉시 끝난다. */
function curRoute(){ var h = location.hash.replace(/^#/,"").split("/")[0]; return TITLES[h] ? h : DEFAULT_ROUTE; }

function buildNav(){
  var cur = curRoute();
  document.getElementById("navLinks").innerHTML = MENU.map(function(it){
    /* it[1] = 한글 라벨. it[2](영문)는 히어로 제목 전용이다 */
    return "<a class='"+(it[0]===cur?"on":"")+"' href='#"+it[0]+"'"+
      (it[0]===cur?" aria-current='page'":"")+">"+esc(it[1])+"</a>";
  }).join("");
}

/* ============ 히어로 ============ */
var HERO = {
  contests:{ latin:"CONTESTS", ko:"AI 공모전",
    copy:"국내와 해외 AI 공모전을 마감이 가까운 순으로 세웁니다. 카드를 누르면 원문 공고로 갑니다." },
  festivals:{ latin:"FESTIVALS", ko:"AI 영화제",
    copy:"AI로 만든 영화를 받는 영화제를 전 세계에서 모읍니다. 목록은 매일 아침 다시 조사합니다." },
  gov:{ latin:"FUNDING", ko:"AI 지원사업",
    copy:"K-Startup에 올라온 창업지원 공고 가운데 AI와 관련된 것을 골라 둡니다. 필터를 끄면 전체가 보입니다." },
  newsrep:{ latin:"BRIEFING", ko:"뉴스리포트",
    copy:"밤사이 나온 AI 소식을 아침에 한 번 정리합니다. 요약 옆에 기사 원문 링크를 그대로 답니다." },
  youtube:{ latin:"WATCH", ko:"AI 유튜브",
    copy:"아침 브리핑에서 걸러낸 AI 영상을 날짜별로 쌓아 둡니다. 생성형 AI, 바이브코딩, AI 영상 제작." }
};
function drawHero(route){
  var h = HERO[route] || HERO[DEFAULT_ROUTE];
  document.getElementById("heroTitle").innerHTML =
    esc(h.latin) + "<em>" + esc(h.ko) + "</em>";
  document.getElementById("heroCopy").textContent = h.copy;
}
/* 히어로 상단 pill — 첫 개는 라임 채움 */
function setKicker(list){
  document.getElementById("heroKicker").innerHTML = (list||[]).map(function(p,i){
    return "<span class='pill"+(i===0?" accent":"")+"'>"+esc(p)+"</span>";
  }).join("");
}
/* 히어로 숫자 세 칸. 데이터가 늦게 오는 화면은 로드 후 다시 부른다. */
function setFacts(list){
  document.getElementById("heroFacts").innerHTML = (list||[]).map(function(f){
    return "<div class='hero-fact'><b class='tnum'>"+esc(f[0])+"</b><span>"+esc(f[1])+"</span></div>";
  }).join("");
}

/* ============ 공용 조각 ============ */
function sectionHead(eyebrow, h2, intro, count){
  return "<div class='section-head'><div><p class='eyebrow'>"+esc(eyebrow)+"</p>"+
    "<h2>"+h2+"</h2></div><div>"+
    (intro?"<p class='section-intro'>"+intro+"</p>":"")+
    (count?"<p class='count' style='margin:14px 0 0'>"+count+"</p>":"")+
    "</div></div>";
}
function foldSection(cls, eyebrow, h2, count, body){
  return "<section class='section "+cls+" collapsed' data-foldsec><div class='inner'>"+
    "<button class='fold-head' data-fold aria-expanded='false'>"+
    "<span><span class='eyebrow' style='display:block'>"+esc(eyebrow)+"</span>"+
    "<span style='display:block;font-size:clamp(28px,4vw,52px);letter-spacing:-.025em;font-weight:800;line-height:1.1'>"+esc(h2)+"</span></span>"+
    "<span style='display:flex;align-items:center;gap:16px'><span class='count'><b>"+esc(count)+"</b></span>"+
    "<span class='fold-sign'></span></span></button>"+
    "<div class='fold-body'>"+body+"</div></div></section>";
}
/* 목록 한 줄 — 다섯 화면이 전부 이 단위를 쓴다 */
function row(o){
  var dd = "<div class='dd tnum "+esc(o.ddCls)+"'>"+esc(o.dd)+"</div>";
  var tags = (o.tags||[]).filter(Boolean).map(function(t){
    return "<span class='tag'>"+esc(t)+"</span>"; }).join("");
  var inner = dd + "<div class='r-main'>"+
    "<div class='r-title'>"+esc(o.title)+tags+"</div>"+
    (o.meta && o.meta.length ? "<div class='r-meta'>"+o.meta.filter(Boolean).join("<i>·</i>")+"</div>" : "")+
    (o.sum ? "<div class='r-sum'>"+esc(o.sum)+"</div>" : "")+"</div>";
  var url = ctSafeUrl(o.url);
  if (url) return "<a class='row' href='"+esc(url)+"' target='_blank' rel='noopener noreferrer'>"+inner+"</a>";
  return "<div class='row'>"+inner+"</div>";
}
function emptyNote(msg){ return "<p class='note'>"+esc(msg)+"</p>"; }
function failBox(msg, extra){
  return "<div class='fail'><h3>데이터를 불러오지 못했습니다</h3>"+
    "<p>"+esc(msg||"네트워크 상태를 확인한 뒤 다시 시도해 주세요.")+"</p>"+
    (extra||"<button class='btn' data-retry>다시 시도</button>")+"</div>";
}
function bindRetry(root){
  var b = root.querySelector("[data-retry]");
  if (!b) return;
  b.onclick = function(){
    state.loading = true; state.error = null; render();
    loadData().catch(function(e){ state.loading=false; state.error=e.message||String(e); }).then(render);
  };
}

/* ============ 데이터 (공개 목록 API — 읽기 전용) ============ */
function loadData(){
  return fetch(API + "?action=pub&t=" + Date.now(), { cache:"no-store" })
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(j){
      if (!j || (!j.reports && !j.festivals)) throw new Error("응답 형식이 올바르지 않습니다");
      state.data = j; state.loading = false; state.error = null;
      stamp();
      return j;
    });
}
function stamp(){
  var el = document.getElementById("footStamp");
  if (el && state.data && state.data.generated) el.textContent = "목록 갱신 " + state.data.generated + " (KST)";
}

/* ============ AI 유튜브 (브리핑의 [유튜브 최신 영상] 섹션만 날짜별 모음) ============ */
var YT_MARK = "[유튜브 최신 영상]";
function ytSectionOf(content){
  var c = String(content||"");
  var i = c.indexOf(YT_MARK);
  if (i < 0) return "";
  var rest = c.slice(i + YT_MARK.length);
  var nx = rest.search(/\n\[[^\[\]\n]+\]/);   /* 다음 섹션 헤더 직전까지 */
  return (nx > -1 ? rest.slice(0, nx) : rest).trim();
}
function stripYtSection(content){
  var c = String(content||"");
  var i = c.indexOf(YT_MARK);
  if (i < 0) return c;
  var rest = c.slice(i + YT_MARK.length);
  var nx = rest.search(/\n\[[^\[\]\n]+\]/);
  return (c.slice(0, i) + (nx > -1 ? rest.slice(nx) : "")).replace(/\n{3,}/g, "\n\n").trim();
}
function renderYoutube(){
  var briefs = sortedReports()
    .filter(function(r){ return !!ytSectionOf(r.content); })
    .slice(0, 30);
  if (!briefs.length){
    setKicker(["대기 중"]);
    setFacts([["0","모인 영상"],["0","수집한 날"],["매일 아침","수집 주기"]]);
    C.innerHTML = "<section class='section paper'><div class='inner'>"+
      sectionHead("Watch","아직 모인 영상이<br>없습니다.",
        "아침 브리핑이 올라올 때 영상도 함께 쌓입니다.","")+
      "</div></section>";
    return;
  }
  var counts = briefs.map(function(r){ return (ytSectionOf(r.content).match(/^•/gm)||[]).length; });
  var total = counts.reduce(function(a,b){ return a+b; }, 0);
  setKicker(["브리핑에서 수집", briefs.length + "일치", total + "편"]);
  setFacts([
    [String(total), "모인 영상"],
    [String(briefs.length), "수집한 날"],
    [String(briefs[0].report_date||"").slice(5,10).replace("-","/"), "가장 최근 수집"]
  ]);

  var top = briefs[0];
  var html = "<section class='section paper'><div class='inner'>"+
    sectionHead("Latest","가장 최근에<br>걸린 영상.",
      "브리핑이 그날 고른 영상입니다. 썸네일을 누르면 유튜브로 갑니다.",
      "<b>"+counts[0]+"</b>편 · "+esc(String(top.report_date||"").slice(0,10)))+
    "<div class='brief-body'>"+richReport(ytSectionOf(top.content))+"</div>"+
    "</div></section>";

  if (briefs.length > 1){
    var body = briefs.slice(1).map(function(r,i){
      return "<div style='margin-bottom:34px'>"+
        "<p class='count' style='margin:0 0 12px'><b>"+esc(String(r.report_date||"").slice(0,10))+"</b> · "+counts[i+1]+"편</p>"+
        "<div class='brief-body'>"+richReport(ytSectionOf(r.content))+"</div></div>";
    }).join("");
    html += foldSection("dark","Archive","지난 날짜", (briefs.length-1)+"일치", body);
  }
  C.innerHTML = html;
  bindFold(C);
}

function festRow(f, today){
  var isD = /^\d{4}-\d{2}-\d{2}$/.test(String(f.deadline||""));
  var di = isD ? ddayInfo(f.deadline, today) : { cls:"tbd", txt:"미정" };
  var meta = [];
  if (f.host) meta.push("<b>"+esc(f.host)+"</b>");
  if (f.place) meta.push(esc(f.place));
  if (isD) meta.push("마감 "+esc(f.deadline));
  if (f.event && f.event!=="미정") meta.push("개최 "+esc(f.event));
  return row({ dd:di.txt, ddCls:di.cls, title:f.name||"(이름 없음)", tags:[f.region],
               meta:meta, sum:f.note, url:f.url });
}

  if (!served) intro += " 지금은 서버 목록을 받지 못해 저장된 기본 목록을 보여 주는 중입니다.";

  var html = "<section class='section paper'><div class='inner'>"+
    sectionHead("Open calls","지금 출품할 수<br>있는 곳.", intro,
      "<b>"+open.length+"</b>곳 · 마감 임박순")+
    "<div class='rows'>"+
    (open.length ? open.map(function(f){ return festRow(f, today); }).join("")
                 : emptyNote("지금 접수 중인 영화제가 없습니다."))+
    "</div></div></section>";

  if (tbd.length){
    html += foldSection("dark","Not announced","차기 일정 미공고", tbd.length+"곳",
      "<div class='rows'>"+tbd.map(function(f){ return festRow(f, today); }).join("")+"</div>");
  }
  if (closed.length){
    closed.sort(function(a,b){ return String(b.deadline).localeCompare(String(a.deadline)); });
    html += foldSection("paper-alt","Closed","이미 끝난 회차", closed.length+"곳",
      "<div class='rows'>"+closed.map(function(f){ return festRow(f, today); }).join("")+"</div>");
  }
  C.innerHTML = html;
  bindFold(C);
}

/* ============ AI 공모전 (외부 공개 JSON 직접 조회) ============ */
var CONTEST_URLS = {
  domestic: "https://junyeo217.github.io/ai-contest-board/data/contests.json",
  overseas: "https://junyeo217.github.io/ai-contest-board/data/overseas-contests.json"
};
var CONTEST_BOARD = "https://junyeo217.github.io/ai-contest-board/";
var CONTEST_TTL = 10*60*1000; /* 10분 모듈 캐시 (두 파일 각각) */
var contestCache = {};
var contestTab = "domestic", contestCat = "전체", contestSearch = "";
function fetchContests(kind, force){
  var c = contestCache[kind];
  if (!force && c && (Date.now()-c.t) < CONTEST_TTL) return Promise.resolve(c.data);
  return fetch(CONTEST_URLS[kind], { cache:"no-store" }).then(function(r){
    if (!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(j){ contestCache[kind] = { t:Date.now(), data:j }; return j; });
}
function ctFmtGen(g){ if(!g) return ""; return String(g).replace("T"," ").replace(/(:\d\d)(\.\d+)?(Z|[+-]\d\d:?\d\d)?$/,"$1").slice(0,16); }
function renderContests(){
  var today = todaySeoul();
  setKicker(["AI 공모전 보드", "자동 갱신"]);
  setFacts([["—","진행 중"],["—","7일 안에 마감"],["—","발표 대기"]]);

  C.innerHTML =
    "<section class='section paper'><div class='inner'>"+
      "<div class='section-head'><div><p class='eyebrow'>Open calls</p>"+
      "<h2>마감이 가까운<br>순서로.</h2></div>"+
      "<div><p class='section-intro'>출처는 <a href='"+esc(CONTEST_BOARD)+"' target='_blank' rel='noopener noreferrer' style='text-decoration:underline'>AI 공모전 보드</a>이고 하루에 여러 번 갱신됩니다. 카드를 누르면 원문 공고로 갑니다.</p>"+
      "<p class='count' style='margin:14px 0 0' data-gen>불러오는 중</p></div></div>"+
      "<div class='controls'>"+
        [["domestic","국내"],["overseas","해외"]].map(function(t){
          return "<button type='button' class='chip"+(t[0]===contestTab?" on":"")+"' data-tab='"+esc(t[0])+"'>"+esc(t[1])+"</button>";
        }).join("")+
        "<input class='search' type='search' placeholder='제목·주최 검색' data-search aria-label='공모전 검색'>"+
      "</div>"+
      "<div class='controls'><div class='chips' data-cats></div></div>"+
      "<div data-body>"+emptyNote("공모전 보드를 불러오는 중입니다.")+"</div>"+
    "</div></section>"+
    "<div data-await></div>";

  var bodyEl = C.querySelector("[data-body]");
  var awaitEl = C.querySelector("[data-await]");
  var catsEl = C.querySelector("[data-cats]");
  var genEl  = C.querySelector("[data-gen]");
  var searchEl = C.querySelector("[data-search]");
  searchEl.value = contestSearch;
  var curData = null;

  function collectCats(data){
    var set = {}, order = [];
    ["starting_today","ongoing","awaiting_results"].forEach(function(k){
      ((data.sections&&data.sections[k])||[]).forEach(function(it){
        var c = String(it.category||"").trim();
        if (c && !set[c]){ set[c]=1; order.push(c); }
      });
    });
    return order;
  }
  function drawCats(){
    var chips = ["전체"].concat(curData ? collectCats(curData) : []);
    if (contestCat!=="전체" && chips.indexOf(contestCat)<0) contestCat = "전체";
    catsEl.innerHTML = chips.map(function(c){
      return "<button type='button' class='chip"+(c===contestCat?" on":"")+"' data-cat='"+esc(c)+"' aria-pressed='"+(c===contestCat)+"'>"+esc(c)+"</button>";
    }).join("");
    catsEl.querySelectorAll("[data-cat]").forEach(function(b){
      b.onclick = function(){ contestCat = b.getAttribute("data-cat"); drawCats(); drawBody(); };
    });
  }
  function match(it){
    if (contestCat!=="전체" && String(it.category||"")!==contestCat) return false;
    var q = String(contestSearch||"").trim().toLowerCase();
    if (!q) return true;
    return String(it.title||"").toLowerCase().indexOf(q)>=0 ||
           String(it.organizer||"").toLowerCase().indexOf(q)>=0;
  }
  function contestRow(it){
    var di = ddayInfo(it.submission_end, today);
    var meta = [];
    if (it.organizer) meta.push("<b>"+esc(it.organizer)+"</b>");
    var sd = String(it.submission_start||"").slice(0,10), ed = String(it.submission_end||"").slice(0,10);
    if (sd || ed) meta.push("접수 "+esc(sd||"미정")+" ~ "+esc(ed||"미정"));
    var rd = String(it.result_date||"").trim();
    if (rd && rd!=="미정") meta.push("발표 "+esc(rd.slice(0,10)));
    return row({ dd:di.txt, ddCls:di.cls, title:it.title||"(제목 없음)",
                 tags:[it.category, it.country], meta:meta, sum:it.summary, url:it.url });
  }
  function drawBody(){
    if (!curData) return;
    var sec = curData.sections || {};
    var ongoing = ((sec.ongoing||[]).concat(sec.starting_today||[])).filter(match)
      .sort(function(a,b){ return String(a.submission_end||"9999").localeCompare(String(b.submission_end||"9999")); });
    var awaiting = (sec.awaiting_results||[]).filter(match);

    setFacts([
      [String(ongoing.length), "진행 중"],
      [String(dueWithin(ongoing,"submission_end",7,today)), "7일 안에 마감"],
      [String(awaiting.length), "발표 대기"]
    ]);

    bodyEl.innerHTML = "<div class='rows'>"+
      (ongoing.length ? ongoing.map(contestRow).join("")
                      : emptyNote("조건에 맞는 진행 중 공모전이 없습니다."))+"</div>";

    awaitEl.innerHTML = foldSection("dark","Awaiting","결과 발표를 기다리는 중", awaiting.length+"건",
      "<div class='rows'>"+
      (awaiting.length ? awaiting.map(function(it){
          var rd = String(it.result_date||"").trim();
          return row({ dd:"발표", ddCls:"tbd", title:it.title||"(제목 없음)",
                       tags:[it.category, it.country],
                       meta:[ it.organizer?"<b>"+esc(it.organizer)+"</b>":"",
                              "발표 "+esc(rd && rd!=="미정" ? rd.slice(0,10) : "미정") ],
                       url:it.url });
        }).join("") : emptyNote("발표를 기다리는 공모전이 없습니다."))+
      "</div>");
    bindFold(awaitEl);
  }
  function showFail(){
    curData = null;
    genEl.textContent = "불러오기 실패";
    catsEl.innerHTML = "";
    awaitEl.innerHTML = "";
    bodyEl.innerHTML = failBox("공모전 보드에 연결하지 못했습니다.",
      "<a class='btn' href='"+esc(CONTEST_BOARD)+"' target='_blank' rel='noopener noreferrer'>원본 보드 열기 ↗</a>");
  }
  function load(force){
    bodyEl.innerHTML = emptyNote("공모전 보드를 불러오는 중입니다.");
    genEl.textContent = "불러오는 중";
    fetchContests(contestTab, force).then(function(j){
      if (curRoute()!=="contests") return;   /* 라우트 이탈 시 무시 */
      curData = j;
      genEl.textContent = j.generated_at ? ("보드 갱신 "+ctFmtGen(j.generated_at)) : "";
      drawCats(); drawBody();
    }).catch(function(){ if (curRoute()==="contests") showFail(); });
  }

  C.querySelectorAll("[data-tab]").forEach(function(b){
    b.onclick = function(){
      var k = b.getAttribute("data-tab"); if (k===contestTab) return;
      contestTab = k; contestCat = "전체";
      C.querySelectorAll("[data-tab]").forEach(function(x){ x.classList.toggle("on", x.getAttribute("data-tab")===contestTab); });
      load(false);
    };
  });
  searchEl.oninput = function(){ contestSearch = searchEl.value; if (curData) drawBody(); };
  load(false);
}

/* ============ AI 지원사업 (공개 API: action=pubgov) ============ */
var GOV_TTL = 10*60*1000, govCache = null;
var govAiOnly = true, govCls = "전체", govSearch = "";
var GOV_AI_RE = /AI|인공지능|생성형|딥테크|디지털|데이터/i;
function fetchGov(force){
  if (!force && govCache && (Date.now()-govCache.t) < GOV_TTL) return Promise.resolve(govCache.data);
  var u = API + "?action=pubgov" + (force?"&reload=1":"") + "&t=" + Date.now();
  return fetch(u, { cache:"no-store" }).then(function(r){
    if (!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(j){ govCache = { t:Date.now(), data:j }; return j; });
}
function renderGov(){
  var today = todaySeoul();
  setKicker(["K-Startup 공고", "공공데이터포털"]);
  setFacts([["—","조건 일치"],["—","전체 공고"],["—","7일 안에 마감"]]);

  C.innerHTML =
    "<section class='section paper'><div class='inner'>"+
      "<div class='section-head'><div><p class='eyebrow'>Funding</p>"+
      "<h2>정부·기관이<br>돈을 내는 곳.</h2></div>"+
      "<div><p class='section-intro'>K-Startup 창업지원 공고를 그대로 가져와 AI와 관련된 것만 먼저 보여 줍니다. 필터를 끄면 전체 공고가 나옵니다.</p>"+
      "<p class='count' style='margin:14px 0 0' data-gen>불러오는 중</p></div></div>"+
      "<div class='controls'>"+
        "<button type='button' class='chip"+(govAiOnly?" on":"")+"' data-ai aria-pressed='"+govAiOnly+"'>AI 관련만</button>"+
        "<input class='search' type='search' placeholder='공고명·기관 검색' data-search aria-label='지원사업 검색'>"+
      "</div>"+
      "<div class='controls'><div class='chips' data-chips></div></div>"+
      "<div data-body>"+emptyNote("지원사업 공고를 불러오는 중입니다.")+"</div>"+
    "</div></section>"+
    "<div data-rest></div>";

  var bodyEl = C.querySelector("[data-body]");
  var restEl = C.querySelector("[data-rest]");
  var chipsEl = C.querySelector("[data-chips]");
  var genEl = C.querySelector("[data-gen]");
  var searchEl = C.querySelector("[data-search]");
  var aiBtn = C.querySelector("[data-ai]");
  searchEl.value = govSearch;
  var cur = null;

  function clsList(){
    var set = {}, order = [];
    ((cur && cur.items) || []).forEach(function(it){
      var c = String(it.cls||"").trim();
      if (c && !set[c]){ set[c]=1; order.push(c); }
    });
    return order;
  }
  function drawChips(){
    var chips = ["전체"].concat(clsList());
    if (govCls!=="전체" && chips.indexOf(govCls)<0) govCls = "전체";
    chipsEl.innerHTML = chips.map(function(c){
      return "<button type='button' class='chip"+(c===govCls?" on":"")+"' data-cls='"+esc(c)+"' aria-pressed='"+(c===govCls)+"'>"+esc(c)+"</button>";
    }).join("");
    chipsEl.querySelectorAll("[data-cls]").forEach(function(b){
      b.onclick = function(){ govCls = b.getAttribute("data-cls"); drawChips(); drawBody(); };
    });
  }
  function isAi(it){ return GOV_AI_RE.test((it.nm||"")+" "+(it.trgt||"")+" "+(it.cls||"")); }
  /* 분류·검색만 적용한 1차 통과. AI 키워드 판정은 여기서 떼어 놓는다 —
     걸러진 공고를 아래 접힌 섹션에서 그대로 다시 보여주기 위해서다. */
  function matchBase(it){
    if (govCls!=="전체" && String(it.cls||"")!==govCls) return false;
    var q = String(govSearch||"").trim().toLowerCase();
    if (!q) return true;
    return String(it.nm||"").toLowerCase().indexOf(q)>=0 ||
           String(it.org||"").toLowerCase().indexOf(q)>=0 ||
           String(it.inst||"").toLowerCase().indexOf(q)>=0;
  }
  function match(it){
    if (govAiOnly && !isAi(it)) return false;
    return matchBase(it);
  }
  function govRow(it){
    var di = ddayInfo(it.end, today);
    var orgTxt = [it.org, it.inst].filter(function(x){return x;}).filter(function(x,i,a){return a.indexOf(x)===i;}).join(" · ");
    var meta = [];
    if (orgTxt) meta.push("<b>"+esc(orgTxt)+"</b>");
    meta.push("접수 "+esc(it.bgng||"미정")+" ~ "+esc(it.end||"미정"));
    return row({ dd:di.txt, ddCls:di.cls, title:it.nm||"(공고명 없음)",
                 tags:[it.cls, it.regin], meta:meta,
                 sum:it.trgt ? "대상 " + String(it.trgt).slice(0,120) : "", url:it.url });
  }
  function drawBody(){
    if (!cur || !cur.ok) return;
    var list = (cur.items||[]).filter(match);
    setFacts([
      [String(list.length), govAiOnly ? "AI 관련 공고" : "조건 일치"],
      [String(cur.total||(cur.items||[]).length), "전체 공고"],
      [String(dueWithin(list,"end",7,today)), "7일 안에 마감"]
    ]);
    bodyEl.innerHTML = "<div class='rows'>"+
      (list.length ? list.map(govRow).join("")
                   : emptyNote("조건에 맞는 공고가 없습니다. 'AI 관련만'을 끄면 전체 공고가 보입니다."))+
      "</div>";

    /* AI 필터가 걸러낸 나머지. 히어로가 263건이라고 말해 놓고 23건만 보이면
       나머지가 어디 갔는지 알 수 없다 — 접어 두되 숨기지는 않는다. */
    var rest = govAiOnly ? (cur.items||[]).filter(function(it){ return matchBase(it) && !isAi(it); }) : [];
    restEl.innerHTML = rest.length
      ? foldSection("dark","Rest","AI 키워드에 걸리지 않은 공고", rest.length+"건",
          "<div class='rows'>"+rest.map(govRow).join("")+"</div>")
      : "";
    bindFold(restEl);
  }
  function load(force){
    bodyEl.innerHTML = emptyNote("지원사업 공고를 불러오는 중입니다.");
    fetchGov(force).then(function(j){
      if (curRoute()!=="gov") return;
      cur = j;
      if (!j || !j.ok){
        genEl.textContent = "";
        bodyEl.innerHTML = failBox(j && j.error ? String(j.error) : "잠시 뒤 다시 시도해 주세요.",
          "<a class='btn' href='https://www.k-startup.go.kr' target='_blank' rel='noopener noreferrer'>K-Startup 열기 ↗</a>");
        return;
      }
      genEl.textContent = "공고 갱신 " + (j.generated||"") + " · 총 " + (j.total||0) + "건";
      drawChips(); drawBody();
    }).catch(function(e){
      if (curRoute()!=="gov") return;
      genEl.textContent = "";
      bodyEl.innerHTML = failBox(String(e && e.message || e),
        "<a class='btn' href='https://www.k-startup.go.kr' target='_blank' rel='noopener noreferrer'>K-Startup 열기 ↗</a>");
    });
  }
  aiBtn.onclick = function(){
    govAiOnly = !govAiOnly;
    aiBtn.classList.toggle("on", govAiOnly);
    aiBtn.setAttribute("aria-pressed", String(govAiOnly));
    drawBody();
  };
  searchEl.oninput = function(){ govSearch = searchEl.value; drawBody(); };
  load(false);
}

/* ============ 라우팅 ============ */
var ROUTES = {
  contests:renderContests, festivals:renderFestivals, gov:renderGov,
  newsrep:renderReports, youtube:renderYoutube
};
/* 공개 목록 API(action=pub) 데이터가 반드시 필요한 화면 */
var NEEDS_PUB = { newsrep:1, youtube:1 };

function render(){
  var route = curRoute();
  buildNav();
  drawHero(route);
  /* 제목은 내비의 짧은 라벨이 아니라 전체 이름을 쓴다 — 브라우저 탭·검색 결과·
     공유 링크에서는 "공모전"보다 "AI 공모전"이 무엇인지 분명하다. */
  document.title = ((HERO[route] || {}).ko || TITLES[route]) + " — AI 레이더";
  if (NEEDS_PUB[route]){
    if (state.loading){
      setKicker(["불러오는 중"]);
      setFacts([["—","발행된 브리핑"],["—","최신 발행일"],["—","항목 수"]]);
      C.innerHTML = "<section class='section paper'><div class='inner'>"+
        emptyNote("데이터를 불러오는 중입니다.")+"</div></section>";
      return;
    }
    if (state.error){
      setKicker(["연결 실패"]);
      setFacts([["—",""],["—",""],["—",""]]);
      C.innerHTML = "<section class='section paper'><div class='inner'>"+failBox(state.error)+"</div></section>";
      bindRetry(C);
      return;
    }
  }
  (ROUTES[route] || renderReports)();
  observeReveal();
}

/* ============ 모션 ============ */
var io = null;
function observeReveal(){
  if (!("IntersectionObserver" in window)) return;
  if (!io) io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("visible"); io.unobserve(e.target); } });
  }, { threshold:.12 });
  C.querySelectorAll(".reveal:not(.visible)").forEach(function(el){ io.observe(el); });
}
var bar = document.getElementById("progress");
function onScroll(){
  var h = document.documentElement.scrollHeight - window.innerHeight;
  bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + "%";
}
window.addEventListener("scroll", onScroll, { passive:true });

/* ============ 액션 ============ */
document.getElementById("refreshBtn").onclick = function(){
  var btn = this, label = btn.textContent;
  btn.textContent = "↻ …";
  govCache = null; contestCache = {};
  state.loading = true; state.error = null; render();
  loadData().catch(function(e){ state.loading=false; state.error=e.message||String(e); })
    .then(function(){ render(); btn.textContent = label; });
};
window.addEventListener("hashchange", function(){
  render();
  window.scrollTo({ top:0, behavior:"auto" });
});

/* ============ 초기화 ============ */
(function init(){
  if (!location.hash) location.replace("#" + DEFAULT_ROUTE);
  render();
  onScroll();
  loadData().catch(function(e){ state.loading=false; state.error=e.message||String(e); }).then(render);
  /* 탭이 보일 때만 10분마다 목록 갱신 */
  setInterval(function(){
    if (document.hidden) return;
    loadData().then(function(){
      if (NEEDS_PUB[curRoute()] || curRoute()==="festivals") render();
    }).catch(function(){});
  }, 600000);
})();

})();
