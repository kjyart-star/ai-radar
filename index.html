/* ============================================================================
   자유게시판 — 스레드형 피드
   제목 없이 본문 한 덩어리로 올리고, 답글이 같은 컬렉션에 parentId 로 붙는다.
   읽기는 누구나, 쓰기만 로그인이다 — 공유 링크로 들어온 사람이 로그인 벽을 먼저
   만나면 그 링크는 아무도 안 누른 것과 같다.

   ⚠️ 여기 있는 길이·개수 검증은 사람이 실수를 덜 하게 하는 것뿐이다.
   실제로 막는 것은 firestore.rules 다. 아래 상수는 그 파일과 같은 값이어야 한다 —
   어긋나면 화면에서는 통과한 글이 서버에서 조용히 거부된다.
   ============================================================================ */
var BD_TAGS = ["생성형AI","바이브코딩","AI정보"];   /* Firestore 가 비어도 늘 보이는 기본 태그 */
var BD_PAGE = 20;
var BD_BODY_MAX = 2000;    /* rules: body.size() <= 2000 */
var BD_TAG_MAX = 3;        /* rules: tags.size() <= 3 */
var BD_FOLD = 300;         /* 이 길이를 넘으면 카드에서 접는다 */

var FB_SDK = [
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js",
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js",
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"
];
var fbAuth = null, fbDb = null, fbPromise = null, fbScripts = {};
var bdUser = null;
var bdTagsDb = [], bdTag = "전체";
var bdFeed = [], bdCursor = null, bdMore = false, bdBusy = false;
var bdLiked = {};                       /* 내가 하트를 누른 글 (likes 문서로 확인한 값) */
var bdDraft = { body:"", tags:[] };     /* 로그인하러 다녀와도 쓰던 글이 남아 있어야 한다 */
var bdRef = null;                       /* 다른 화면의 "이야기하기"가 넘겨준 인용 대상 */
var bdReplyTo = null;
var bdRedrawComposer = null;
var bdBodyCache = {}, bdTagCache = {};  /* 카드에서 수정창을 열 때 원문을 되살리기 위한 값 */

/* ---- SDK 지연 로딩 ----
   <head> 에 정적으로 넣지 않는다. gstatic 이 느리거나 막히면 사이트 전체가 같이 죽는데,
   게시판 하나 때문에 나머지 여섯 메뉴가 안 뜨는 건 말이 안 된다.
   게시판을 처음 열 때만 세 파일을 순서대로 받고, 15초 안에 못 받으면 게시판만 포기한다. */
function bdLoadScript(src){
  if (fbScripts[src]) return fbScripts[src];
  fbScripts[src] = new Promise(function(res, rej){
    var s = document.createElement("script");
    s.src = src;
    s.async = false;
    s.onload = function(){ res(true); };
    s.onerror = function(){ rej(new Error("SDK 를 내려받지 못했습니다: " + src)); };
    document.head.appendChild(s);
  });
  return fbScripts[src];
}
function fbInit(){
  if (fbPromise) return fbPromise;
  fbPromise = new Promise(function(res, rej){
    var settled = false;
    var timer = setTimeout(function(){
      if (settled) return;
      settled = true; rej(new Error("시간이 초과되었습니다"));
    }, 15000);
    var chain = Promise.resolve();
    FB_SDK.forEach(function(src){ chain = chain.then(function(){ return bdLoadScript(src); }); });
    chain.then(function(){
      if (settled) return;
      settled = true; clearTimeout(timer);
      try {
        if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
        fbAuth = firebase.auth();
        fbDb = firebase.firestore();
        fbAuth.onAuthStateChanged(function(u){
          bdUser = u || null;
          bdLiked = {};
          if (curRoute()==="board") renderBoard();   /* 게시판 화면만 다시 그린다 */
        });
        res(true);
      } catch(e){ rej(e); }
    }, function(e){
      if (settled) return;
      settled = true; clearTimeout(timer); rej(e);
    });
  });
  /* 실패한 약속을 캐시에 남기면 "다시 시도"가 영영 같은 실패를 되돌려준다 */
  fbPromise["catch"](function(){ fbPromise = null; fbScripts = {}; });
  return fbPromise;
}

/* ---- 공용 조각 ---- */
function bdAlive(el){ return curRoute()==="board" && C.contains(el); }
function bdReset(){ bdFeed = []; bdCursor = null; bdMore = false; }
function bdText(s){ return esc(String(s==null?"":s)).replace(/\r?\n/g, "<br>"); }
function bdMs(ts){ return (ts && ts.toDate) ? ts.toDate().getTime() : NaN; }
/* serverTimestamp 는 쓰기 직후 잠깐 비어 있다 — 그때는 "방금"이 사실에 가깝다 */
function bdWhen(ts){
  var t = bdMs(ts);
  if (isNaN(t)) return "방금";
  var m = Math.floor((Date.now()-t)/60000);
  if (m < 1) return "방금";
  if (m < 60) return m+"분 전";
  var h = Math.floor(m/60);
  if (h < 24) return h+"시간 전";
  var d = Math.floor(h/24);
  if (d === 1) return "어제";
  if (d <= 7) return d+"일 전";
  return ymdKST(new Date(t).toISOString());
}
function bdExcerpt(body){
  var s = String(body||"").replace(/\s+/g," ").trim();
  return s.length > 160 ? s.slice(0,160) : s;
}
/* ---- 슬러그 ----
   한 번 만들면 바뀌지 않는다. 글을 고쳐도 그대로다 — 주소가 바뀌면 이미 공유된
   링크가 전부 죽는다. 원글은 이 값을 Firestore 문서 ID 로 그대로 쓴다.
   그래야 주소만으로 doc(slug).get() 이라 조회 색인도 필요 없다. */
function bdSlugify(body){
  var s = String(body||"")
    .replace(/https?:\/\/\S+/g, " ")
    .replace(/[^0-9A-Za-z가-힣ㄱ-ㅎㅏ-ㅣ\s-]/g, " ")
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-+|-+$/g, "")
    .toLowerCase();
  if (s.length > 48) s = s.slice(0,48).replace(/-+$/,"");
  return s;
}
function bdRandHex(){
  var c = "0123456789abcdef", s = "";
  for (var i=0;i<4;i++) s += c.charAt(Math.floor(Math.random()*16));
  return s;
}
function bdMakeSlug(body){
  var base = bdSlugify(body);
  /* 문서 ID 로 못 쓰는 이름들. 위 필터가 대부분 걸러내지만 한 겹 더 둔다 */
  if (!base || base === "." || base === ".." || /^__.*__$/.test(base)) base = "post";
  return base + "-" + bdRandHex();
}
/* set() 은 같은 ID 가 있으면 덮어쓴다. 같은 사람이 같은 슬러그를 두 번 만들면
   규칙상 update 로 허용되어 먼저 쓴 글이 조용히 사라진다 — 쓰기 전에 반드시 확인한다. */
function bdClaimSlug(body, tries){
  var slug = bdMakeSlug(body);
  return fbDb.collection("posts").doc(slug).get().then(function(d){
    if (!d.exists) return slug;
    if (tries <= 1) return null;
    return bdClaimSlug(body, tries-1);
  });
}

/* ---- 태그 ---- */
function bdTagList(){
  var out = [], seen = {};
  BD_TAGS.concat(bdTagsDb).forEach(function(t){
    t = String(t||"").trim();
    if (t && !seen[t]){ seen[t]=1; out.push(t); }
  });
  return out;
}
function bdFetchTags(){
  if (!fbDb) return Promise.resolve([]);
  return fbDb.collection("tags").get().then(function(sn){
    var out = [];
    sn.forEach(function(d){ var n = (d.data()||{}).name || d.id; if (n) out.push(String(n)); });
    bdTagsDb = out;
    return out;
  }, function(){ return []; });
}
function bdTagError(n){
  n = String(n||"").trim();
  if (n.length < 1 || n.length > 20) return "태그 이름은 1자 이상 20자 이하입니다.";
  if (n.indexOf("/") >= 0) return "태그 이름에 / 는 넣을 수 없습니다.";
  if (n === "." || n === "..") return "쓸 수 없는 이름입니다.";
  if (/^__.*__$/.test(n)) return "쓸 수 없는 이름입니다.";
  if (bdTagList().indexOf(n) >= 0) return "이미 있는 태그입니다.";
  return "";
}
/* 칩을 눌러 고르는 태그 목록. sel 배열을 제자리에서 고치고 다시 그리는 함수를 돌려준다 */
function bdTagPicker(host, sel){
  function draw(){
    host.innerHTML = bdTagList().map(function(t){
      var on = sel.indexOf(t) >= 0;
      return "<button type='button' class='chip"+(on?" on":"")+"' data-tpick='"+esc(t)+"'"+
        " aria-pressed='"+on+"'>"+esc(t)+"</button>";
    }).join("");
    host.querySelectorAll("[data-tpick]").forEach(function(b){
      b.onclick = function(){
        var t = b.getAttribute("data-tpick"), i = sel.indexOf(t);
        if (i >= 0) sel.splice(i,1);
        else {
          if (sel.length >= BD_TAG_MAX){ bdToast("태그는 "+BD_TAG_MAX+"개까지 고를 수 있습니다."); return; }
          sel.push(t);
        }
        draw();
      };
    });
  }
  draw();
  return draw;
}

/* ---- 오류 안내 ----
   Firestore 는 복합 색인이 없으면 failed-precondition 을 주고, 그 메시지 안에
   "색인 만들기" 링크를 넣어 준다. 그 링크를 삼키면 대표가 누를 것이 없어진다 —
   화면에는 짧게 안내하고 원본은 콘솔에 그대로 남긴다. */
function bdIsIndexErr(e){
  var c = (e && e.code) ? String(e.code) : "";
  var m = (e && e.message) ? String(e.message) : String(e||"");
  return c === "failed-precondition" || /index/i.test(m);
}
function bdQueryFail(host, e, retry){
  if (window.console && console.error) console.error("[자유게시판]", e);
  if (bdIsIndexErr(e)){
    host.innerHTML = emptyNote("게시판 준비를 마무리하는 중입니다. 잠시 후 다시 열어 주세요.");
    return;
  }
  host.innerHTML = "<div class='fail'><h3>글을 불러오지 못했습니다</h3>"+
    "<p>네트워크 상태를 확인한 뒤 다시 시도해 주세요.</p>"+
    "<button type='button' class='btn' data-bdretry>다시 시도</button></div>";
  var b = host.querySelector("[data-bdretry]");
  if (b && retry) b.onclick = retry;
}

/* ---- 토스트 · 공유 ---- */
function bdToast(msg){
  var el = document.getElementById("bdToast");
  if (!el){
    el = document.createElement("div");
    el.id = "bdToast";
    el.className = "bd-toast";
    el.setAttribute("role","status");
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(el.hideTimer);
  el.hideTimer = setTimeout(function(){ el.classList.remove("on"); }, 1800);
}
function bdCanShare(){
  return !!(navigator.share || (navigator.clipboard && navigator.clipboard.writeText));
}
function bdShare(slug, text){
  /* 공유는 언제나 자체 도메인으로 나간다. location.origin + boardUrl() 을 쓰면
     옛 프로젝트 주소(github.io/ai-radar/)로 들어온 사람이 그 경로째 복사해 가고,
     SITE_URL 에 그 경로를 붙이면 ai-radar.kr/ai-radar/... 가 되어 깨진다.
     그래서 베이스를 섞지 않고 도메인 루트 기준으로 새로 만든다. */
  var url = SITE_URL + "/board/" + (slug ? encodeURIComponent(slug) : "");
  if (navigator.share){
    try {
      navigator.share({ title:"AI 레이더 자유게시판", text:String(text||"").slice(0,80), url:url })
        ["catch"](function(){});
      return;
    } catch(e){}
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){ bdToast("복사했습니다"); }, function(){});
  }
}

/* ---- 카드 ----
   피드와 스레드가 같은 카드를 쓴다. 같은 글이 자리마다 달라 보이면 어디서 본
   글인지 매번 다시 읽게 된다. opt.depth 는 답글 들여쓰기(0·1·2)다. */
function bdCard(p, opt){
  opt = opt || {};
  var body = String(p.body||"");
  bdBodyCache[p.id] = body;
  bdTagCache[p.id] = (p.tags||[]).slice();
  var folded = !opt.full && (body.length > BD_FOLD || body.split(/\r?\n/).length > 6);
  var ph = ctSafeUrl(p.photo||"");
  var mine = !!(bdUser && p.uid && p.uid === bdUser.uid);
  var refUrl = (p.ref && p.ref.url) ? ctSafeUrl(p.ref.url) : "";
  var root = p.rootId || p.id;
  var h = "<article class='bd-card"+(opt.depth?" d"+Math.min(opt.depth,2):"")+
          "' data-post='"+esc(p.id)+"'>";
  h += "<div class='bd-head'>"+
       (ph ? "<img class='bd-ava' src='"+esc(ph)+"' alt='' loading='lazy' referrerpolicy='no-referrer'>"
           : "<span class='bd-ava bd-ava-x' aria-hidden='true'></span>")+
       "<b class='bd-name'>"+esc(p.author||"익명")+"</b>"+
       "<span class='bd-time'>"+esc(bdWhen(p.createdAt))+"</span></div>";
  if (p.ref && (p.ref.title || refUrl)){
    h += "<div class='bd-ref'><span class='bd-ref-k'>"+esc(p.ref.type||"링크")+"</span>"+
      (refUrl
        ? "<a href='"+esc(refUrl)+"' target='_blank' rel='noopener noreferrer nofollow'>"+
          esc(p.ref.title||refUrl)+"</a>"
        : "<span>"+esc(p.ref.title||"")+"</span>")+"</div>";
  }
  h += "<div class='bd-text"+(folded?" fold":"")+"' data-text>"+bdText(body)+"</div>";
  if (folded) h += "<button type='button' class='bd-unfold' data-unfold>더 보기</button>";
  if ((p.tags||[]).length){
    h += "<div class='bd-tags'>"+(p.tags||[]).map(function(t){
      return "<span class='tag'>"+esc(t)+"</span>"; }).join("")+"</div>";
  }
  h += "<div class='bd-acts'>";
  h += opt.thread
    ? "<span class='bd-act'>답글 <b class='tnum'>"+nfmt(p.replyCount||0)+"</b></span>"
    : "<a class='bd-act' href='"+esc(boardUrl(root))+"'>답글 <b class='tnum'>"+nfmt(p.replyCount||0)+"</b></a>";
  h += "<button type='button' class='bd-act"+(bdLiked[p.id]?" on":"")+"' data-like='"+esc(p.id)+"'"+
       " aria-pressed='"+(!!bdLiked[p.id])+"'>♥ <b class='tnum'>"+nfmt(p.likeCount||0)+"</b></button>";
  if (opt.thread) h += "<button type='button' class='bd-act' data-reply='"+esc(p.id)+"'>답글 쓰기</button>";
  if (bdCanShare() && !p.parentId) h += "<button type='button' class='bd-act' data-share='"+esc(p.id)+"'>공유</button>";
  if (mine){
    h += "<button type='button' class='bd-act' data-edit='"+esc(p.id)+"'>수정</button>";
    h += "<button type='button' class='bd-act' data-del='"+esc(p.id)+"'>삭제</button>";
  }
  h += "</div></article>";
  return h;
}

/* 내가 하트를 눌렀는지는 likes/{uid} 문서가 진실이다. 화면을 그린 뒤 조용히 확인해
   하트만 채운다 — 전체를 다시 그리면 펼쳐 둔 글이 도로 접힌다. */
function bdPrefetchLikes(list){
  if (!bdUser || !fbDb || !list.length) return;
  list.forEach(function(p){
    fbDb.collection("posts").doc(p.id).collection("likes").doc(bdUser.uid).get()
      .then(function(d){
        if (!d.exists) return;
        bdLiked[p.id] = true;
        var b = C.querySelector("[data-like='"+p.id+"']");
        if (b){ b.classList.add("on"); b.setAttribute("aria-pressed","true"); }
      }, function(){});
  });
}

/* ---- 카드 액션 ---- */
function bdToggleLike(el){
  if (!bdUser){ bdToast("로그인하면 좋아요를 누를 수 있습니다."); return; }
  if (!fbDb) return;
  var id = el.getAttribute("data-like");
  var on = !bdLiked[id];
  var numEl = el.querySelector("b");
  var n = Number(String(numEl.textContent||"0").replace(/[^\d]/g,"")) || 0;
  bdLiked[id] = on;
  el.classList.toggle("on", on);
  el.setAttribute("aria-pressed", String(on));
  numEl.textContent = nfmt(Math.max(0, n + (on?1:-1)));
  var doc = fbDb.collection("posts").doc(id);
  var like = doc.collection("likes").doc(bdUser.uid);
  var w = on
    ? like.set({ uid:bdUser.uid, createdAt:firebase.firestore.FieldValue.serverTimestamp() })
    : like["delete"]();
  /* likeCount 는 규칙이 "likeCount 만 ±1" 인 별도 쓰기로만 허용한다. replyCount 와
     같은 update 에 담으면 통째로 거부된다. 숫자 갱신 실패는 조용히 넘긴다 —
     하트의 진실은 likes 문서고, 숫자 하나 때문에 화면을 막지 않는다. */
  w.then(function(){
    return doc.update({ likeCount: firebase.firestore.FieldValue.increment(on?1:-1) });
  })["catch"](function(){});
}
function bdShareFrom(el){

  box.querySelector("[data-esave]").onclick = function(){

    }

    /* 본인 글이라 규칙의 첫 절이 허용한다 — slug 는 건드리지 않는다 */

      body: body, tags: sel.slice(0,BD_TAG_MAX), excerpt: bdExcerpt(body),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function(){ bdReset(); render(); }, function(e){

      msg.textContent = "저장하지 못했습니다. 잠시 후 다시 시도해 주세요.";
    });

}

/* ---- 입력창 ----
   비로그인에게도 보인다. 로그인 벽을 먼저 세우면 대부분은 거기서 돌아간다 —
   쓰려고 마음먹은 다음에 물어보는 편이 훨씬 적게 잃는다.
   opt.parentId 가 있으면 답글, 없으면 원글이다. */
function bdComposer(host, opt){
  if (!host) return;
  opt = opt || {};
  var isReply = !!opt.parentId;
  var sel = isReply ? [] : bdDraft.tags;
  var toName = isReply ? String(opt.toName||"") : "";
  var ph = isReply ? "답글을 남겨 보세요" : "AI를 쓰면서 알게 된 것을 남겨 보세요";

  host.innerHTML = "<div class='bd-composer'>"+
    (isReply ? (toName ? "<p class='bd-lead' style='margin-top:0'>"+esc(toName)+" 님에게</p>" : "")
             : "<div data-refbox></div>")+
    "<textarea class='bd-in bd-grow' rows='1' maxlength='"+BD_BODY_MAX+"' data-cbody"+
      " placeholder='"+esc(ph)+"' aria-label='"+esc(ph)+"'></textarea>"+
    (isReply ? "" :
      "<div class='bd-taglane'><div class='chips' data-ctags></div>"+
        "<button type='button' class='chip' data-newtag>+ 태그</button></div>"+
      "<div class='bd-newtagbox' data-newtagbox hidden>"+
        "<input class='bd-in' type='text' maxlength='20' placeholder='새 태그 이름'"+
          " data-newtagname aria-label='새 태그 이름'>"+
        "<button type='button' class='chip' data-newtagadd>추가</button></div>")+
    "<p class='bd-msg' data-cmsg></p>"+
    "<div class='bd-cfoot'>"+
      (bdUser
        ? "<span class='bd-me'>"+
            (ctSafeUrl(bdUser.photoURL||"")
              ? "<img class='bd-ava' src='"+esc(ctSafeUrl(bdUser.photoURL))+"' alt='' referrerpolicy='no-referrer'>"
              : "<span class='bd-ava bd-ava-x' aria-hidden='true'></span>")+
            "<span class='bd-name'>"+esc(bdUser.displayName || "익명")+"</span></span>"+
          "<button type='button' class='bd-act' data-logout>로그아웃</button>"+
          "<span class='bd-count tnum' data-ccount></span>"+
          "<button type='button' class='btn' data-csend>"+(isReply?"답글 올리기":"올리기")+"</button>"
        : "<span class='bd-hint'>구글 계정으로 3초면 시작합니다</span>"+
          "<button type='button' class='btn' data-login>Google로 시작하기</button>")+
    "</div></div>";

  var ta = host.querySelector("[data-cbody]");
  var msg = host.querySelector("[data-cmsg]");
  var countEl = host.querySelector("[data-ccount]");
  var drawTags = null;

  function grow(){ ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 420) + "px"; }
  function count(){ if (countEl) countEl.textContent = ta.value.length + " / " + nfmt(BD_BODY_MAX); }
  ta.value = isReply ? "" : String(bdDraft.body||"");
  ta.oninput = function(){
    grow(); count();
    if (!isReply) bdDraft.body = ta.value;   /* 로그인하러 다녀와도 남아 있게 */
  };
  grow(); count();

  /* 인용 블록 — "이야기하기"로 건너온 항목 */
  function drawRef(){
    var box = host.querySelector("[data-refbox]");
    if (!box) return;
    if (!bdRef || (!bdRef.title && !bdRef.url)){ box.innerHTML = ""; return; }
    box.innerHTML = "<div class='bd-ref'><span class='bd-ref-k'>"+esc(bdRef.type||"링크")+"</span>"+
      (bdRef.url
        ? "<a href='"+esc(bdRef.url)+"' target='_blank' rel='noopener noreferrer nofollow'>"+
          esc(bdRef.title||bdRef.url)+"</a>"
        : "<span>"+esc(bdRef.title||"")+"</span>")+
      "<button type='button' class='bd-act' data-refclear>인용 빼기</button></div>";
    box.querySelector("[data-refclear]").onclick = function(){ bdRef = null; drawRef(); };
  }
  drawRef();

  if (!isReply){
    drawTags = bdTagPicker(host.querySelector("[data-ctags]"), sel);
    var ntBtn = host.querySelector("[data-newtag]");
    var ntBox = host.querySelector("[data-newtagbox]");
    ntBtn.onclick = function(){
      if (!bdUser){ bdToast("로그인하면 태그를 만들 수 있습니다."); return; }
      ntBox.hidden = !ntBox.hidden;
      if (!ntBox.hidden) host.querySelector("[data-newtagname]").focus();
    };
    host.querySelector("[data-newtagadd]").onclick = function(){
      var b = this, nameEl = host.querySelector("[data-newtagname]");
      var n = String(nameEl.value||"").trim();
      var err = bdTagError(n);
      if (err){ msg.textContent = err; return; }
      b.disabled = true;
      /* 문서 ID 가 곧 태그 이름이라, 같은 이름이 이미 있으면 규칙이 거부한다 —
         중복은 화면이 아니라 DB 가 막는다 */
      fbDb.collection("tags").doc(n).set({
        name:n, uid:bdUser.uid, createdAt:firebase.firestore.FieldValue.serverTimestamp()
      }).then(function(){
        bdTagsDb = bdTagsDb.concat([n]);
        if (sel.length < BD_TAG_MAX) sel.push(n);
        nameEl.value = ""; ntBox.hidden = true; msg.textContent = ""; b.disabled = false;
        if (drawTags) drawTags();
      }, function(){
        b.disabled = false;
        msg.textContent = "이미 있는 태그이거나 만들지 못했습니다.";
      });
    };
  }

  var send = host.querySelector("[data-csend]");
  if (!send) return;
  send.onclick = function(){
    var body = String(ta.value||"").trim();
    if (body.length < 1 || body.length > BD_BODY_MAX){
      msg.textContent = "내용은 1자 이상 "+nfmt(BD_BODY_MAX)+"자 이하로 남겨 주세요."; return;
    }
    var tags = (isReply ? (opt.tags||[]) : sel).slice(0, BD_TAG_MAX);
    if (!isReply && tags.length < 1){ msg.textContent = "태그를 하나 이상 골라 주세요."; return; }
    send.disabled = true; msg.textContent = "올리는 중입니다.";
    var now = firebase.firestore.FieldValue.serverTimestamp();
    var doc = {
      uid: bdUser.uid,
      author: bdUser.displayName || "익명",
      photo: bdUser.photoURL || "",
      body: body,
      tags: tags,
      excerpt: bdExcerpt(body),
      parentId: isReply ? opt.parentId : null,
      ref: (!isReply && bdRef && (bdRef.title || bdRef.url))
             ? { type:String(bdRef.type||""), title:String(bdRef.title||""), url:String(bdRef.url||"") }
             : null,
      replyCount: 0,   /* 규칙이 0 을 요구한다 — 처음부터 부풀린 값으로 만들 수 없게 */
      likeCount: 0,
      createdAt: now,
      updatedAt: now
    };
    function fail(e){
      send.disabled = false;
      if (window.console && console.error) console.error("[자유게시판]", e);
      msg.textContent = "올리지 못했습니다. 잠시 후 다시 시도해 주세요.";
    }
    if (isReply){
      /* 답글은 슬러그가 필요 없다 — 주소를 갖지 않는다. rootId 는 원글의 슬러그다 */
      doc.slug = null;
      doc.rootId = opt.rootId;
      fbDb.collection("posts").add(doc).then(function(){
        /* 답글 수는 "replyCount 만 +1" 인 별도 쓰기로만 허용된다. 실패해도 답글 자체는
           이미 올라갔으므로 조용히 넘긴다 */
        return fbDb.collection("posts").doc(opt.rootId)
          .update({ replyCount: firebase.firestore.FieldValue.increment(1) })["catch"](function(){});
      }).then(function(){
        bdReplyTo = null; render();
      }, fail);
      return;
    }
    bdClaimSlug(body, 3).then(function(slug){
      if (!slug){ send.disabled = false; msg.textContent = "잠시 후 다시 시도해 주세요."; return; }
      doc.slug = slug;
      doc.rootId = slug;   /* 원글의 rootId 는 자기 자신이다 — 쓰기 한 번으로 끝난다 */
      return fbDb.collection("posts").doc(slug).set(doc).then(function(){
        bdDraft.body = ""; bdDraft.tags = []; bdRef = null;
        bdReset();
        bdGo(slug);   /* 방금 올린 글로 — 공유할 주소가 바로 손에 들어온다 */
      });
    })["catch"](fail);
  };
}

/* ---- ③ 빈 피드 방지: 오늘의 브리핑 카드 ----
   이미 쓰고 있는 공개 데이터에서 가져오고 여기서는 아무것도 쓰지 않는다.
   Firebase 가 비어 있어도 이 카드는 뜬다 — 처음 온 사람이 빈 화면을 보지 않게. */
function bdBriefCard(host){
  if (!host) return;
  var r = sortedReports()[0];
  if (!r){ host.innerHTML = ""; return; }
  var lines = String(r.content||"").split(/\r?\n/), picked = [];
  for (var i=0; i<lines.length && picked.length<4; i++){
    var t = lines[i].replace(/\*\*/g,"").trim();
    if (!t || /^#{1,6}\s/.test(t)) continue;
    t = t.replace(/^[•\-*]+\s*/,"")
         .replace(/[\(（]\s*(?:출처|링크|img)\s*:?\s*https?:\/\/[^\s)）]+\s*[\)）]?/gi,"")
         .replace(/https?:\/\/[^\s)<>"'　]+/g,"")
         .replace(/[\(（]\s*[\)）]/g,"").trim();
    if (t.length < 8) continue;
    picked.push(t.length > 120 ? t.slice(0,120)+"…" : t);
  }
  if (!picked.length){ host.innerHTML = ""; return; }
  host.innerHTML = "<div class='bd-brief'><p class='eyebrow'>오늘의 브리핑</p>"+
    "<h3>"+esc(r.title||"AI 브리핑")+"</h3>"+
    "<ul>"+picked.map(function(t){ return "<li>"+esc(t)+"</li>"; }).join("")+"</ul>"+
    "<a class='btn' href='"+esc(menuHref("newsrep"))+"'>전체 보기</a></div>";
}

/* ---- 피드 ---- */
function bdFeedView(el){
  bdRedrawComposer = null;
  el.innerHTML =
    "<div data-brief></div>"+
    "<div class='controls'><div class='chips' data-filter></div></div>"+
    "<div data-comp></div>"+
    "<div data-rows></div>"+
    "<div class='bd-more' data-more></div>";
  bdBriefCard(el.querySelector("[data-brief]"));
  bdComposer(el.querySelector("[data-comp]"), {});
  var filterEl = el.querySelector("[data-filter]");
  var rowsEl = el.querySelector("[data-rows]");
  var moreEl = el.querySelector("[data-more]");
  var sentIo = null;
  var hasIo = ("IntersectionObserver" in window);

  function drawFilter(){
    var list = ["전체"].concat(bdTagList());
    if (list.indexOf(bdTag) < 0) bdTag = "전체";
    filterEl.innerHTML = list.map(function(t){
      return "<button type='button' class='chip"+(t===bdTag?" on":"")+"' data-f='"+esc(t)+"'"+
        " aria-pressed='"+(t===bdTag)+"'>"+esc(t)+"</button>";
    }).join("");
    filterEl.querySelectorAll("[data-f]").forEach(function(b){
      b.onclick = function(){ bdTag = b.getAttribute("data-f"); drawFilter(); load(true); };
    });
  }
  function watchSentinel(){
    if (sentIo){ sentIo.disconnect(); sentIo = null; }
    if (!bdMore || !hasIo) return;
    var s = moreEl.querySelector("[data-sentinel]");
    if (!s) return;
    sentIo = new IntersectionObserver(function(en){
      if (en[0] && en[0].isIntersecting) load(false);
    }, { rootMargin:"400px" });
    sentIo.observe(s);
  }
  function paint(){
    rowsEl.innerHTML = bdFeed.length
      ? bdFeed.map(function(p){ return bdCard(p, {}); }).join("")
      : "<div class='bd-empty'><p>아직 글이 없습니다. 첫 글을 남겨 보세요.</p>"+
        (bdUser ? "" : "<button type='button' class='btn' data-login>Google로 시작하기</button>")+"</div>";
    /* 무한 스크롤이 기본이고, IntersectionObserver 가 없는 브라우저에서만 버튼이 남는다 */
    moreEl.innerHTML = !bdMore ? ""
      : (hasIo ? "<span class='bd-sentinel' data-sentinel></span><span class='bd-loading'>더 불러오는 중…</span>"
               : "<button type='button' class='btn' data-loadmore>더 보기</button>");
    var mb = moreEl.querySelector("[data-loadmore]");
    if (mb) mb.onclick = function(){ load(false); };
    watchSentinel();
  }
  function load(first){
    if (bdBusy) return;
    bdBusy = true;
    if (first){
      if (!bdFeed.length) rowsEl.innerHTML = emptyNote("글을 불러오는 중입니다.");
      bdCursor = null;
    }
    /* 원글만 본다. 태그 필터는 서버에서 건다 — 클라이언트에서 거르면 무한 스크롤이
       20개를 받아 3개만 보여주는 일이 생긴다. 대신 복합 색인이 하나 더 필요하다. */
    var q = fbDb.collection("posts").where("parentId","==",null);
    if (bdTag !== "전체") q = q.where("tags","array-contains",bdTag);
    q = q.orderBy("createdAt","desc");
    if (!first && bdCursor) q = q.startAfter(bdCursor);
    q.limit(BD_PAGE).get().then(function(sn){
      bdBusy = false;
      if (!bdAlive(el)) return;
      var got = [];
      sn.forEach(function(d){ var o = d.data()||{}; o.id = d.id; got.push(o); });
      if (sn.docs && sn.docs.length) bdCursor = sn.docs[sn.docs.length-1];
      bdMore = got.length === BD_PAGE;
      bdFeed = first ? got : bdFeed.concat(got);
      paint(); bdFacts(); bdPrefetchLikes(got);
    }, function(e){
      bdBusy = false;
      if (!bdAlive(el)) return;
      moreEl.innerHTML = "";
      bdQueryFail(rowsEl, e, function(){ bdReset(); load(true); });
    });
  }
  drawFilter();
  if (bdFeed.length){ paint(); bdFacts(); }   /* 캐시가 있으면 먼저 보여주고 뒤에서 새로 받는다 */
  load(true);
}

/* ---- 스레드 ---- */
function bdThreadView(el, slug){
  bdReplyTo = null;
  el.innerHTML = "<a class='bd-back' href='"+esc(boardUrl(""))+"'>← 피드</a>"+
    "<div data-thread>"+emptyNote("글을 불러오는 중입니다.")+"</div>";
  var te = el.querySelector("[data-thread]");
  var rootP = null;

  function draw(root, replies){
    var byId = {};
    replies.forEach(function(r){ byId[r.id] = r; });
    /* 3단계 이상 답글도 2단계로 눕힌다 — 375px 에서 더 들여쓰면 본문 자리가 사라진다 */
    function depthOf(p){
      var n = 1, cur = p, guard = 0;
      while (cur && cur.parentId && cur.parentId !== root.id && guard < 12){
        cur = byId[cur.parentId]; n++; guard++;
        if (!cur) break;
      }
      return Math.min(n, 2);
    }
    te.innerHTML = bdCard(root, { full:true, thread:true })+
      "<p class='bd-lead'>답글 <b class='tnum'>"+nfmt(replies.length)+"</b></p>"+
      (replies.length
        ? replies.map(function(r){ return bdCard(r, { full:true, thread:true, depth:depthOf(r) }); }).join("")
        : emptyNote("아직 답글이 없습니다. 먼저 이어 보세요."))+
      "<div data-replycomp></div>";
    bdRedrawComposer = function(){
      var to = (bdReplyTo && (bdReplyTo.id === root.id || byId[bdReplyTo.id])) ? bdReplyTo : null;
      bdComposer(te.querySelector("[data-replycomp]"), {
        parentId: to ? to.id : root.id,
        rootId: root.id,
        tags: (root.tags||[]),
        toName: to ? to.name : ""
      });
    };
    bdRedrawComposer();
    setFacts([[nfmt(replies.length),"답글"], [nfmt(root.likeCount||0),"좋아요"],
              [bdWhen(root.createdAt),"올린 때"]]);
    /* 크롤러는 JS 를 안 돌려 og 태그는 그대로지만, 탭 제목·북마크·방문 기록에는 남는다 */
    var head = String(root.excerpt || root.body || "").slice(0,40);
    document.title = (head || "글") + " — AI 레이더";
    bdPrefetchLikes([root].concat(replies));
  }

  function load(){
    fbDb.collection("posts").doc(slug).get().then(function(d){
      if (!bdAlive(el)) return null;
      if (!d.exists){
        te.innerHTML = emptyNote("글을 찾을 수 없습니다. 지워졌거나 주소가 잘못되었을 수 있습니다.");
        return null;
      }
      rootP = d.data()||{}; rootP.id = d.id;
      var root = rootP.rootId || rootP.id;
      /* 답글 주소로 들어왔으면 그 스레드의 원글로 옮겨 준다 */
      if (root !== rootP.id){ bdGo(root); return null; }
      return fbDb.collection("posts").where("rootId","==",root).orderBy("createdAt","asc").get();
    }).then(function(sn){
      if (!sn || !bdAlive(el)) return;
      var replies = [];
      sn.forEach(function(d){
        if (d.id === rootP.id) return;   /* 원글은 rootId 가 자기 자신이라 같이 딸려 온다 */
        var o = d.data()||{}; o.id = d.id; replies.push(o);
      });
      draw(rootP, replies);
    }, function(e){
      if (!bdAlive(el)) return;
      bdQueryFail(te, e, load);
    });
  }
  load();
}

function bdShell(inner){

function renderBoard(){
  setKicker(["자유게시판"]);
  setFacts([["—","글"],[String(bdTagList().length),"태그"],["—","최근 글"]]);

  /* config 가 비면 SDK 를 아예 부르지 않는다. 브리핑 카드는 Firebase 와 무관하므로 그대로 뜬다 */
  if (!fbReady()){
    C.innerHTML = bdShell("<div data-brief></div>"+emptyNote("게시판 준비 중입니다."));
    bdBriefCard(C.querySelector("[data-brief]"));
    return;
  }
  C.innerHTML = bdShell("<div data-bd>"+emptyNote("게시판을 여는 중입니다.")+"</div>");
  var el = C.querySelector("[data-bd]");
  fbInit().then(function(){
    if (!bdAlive(el)) return;
    return bdFetchTags().then(function(){
      if (!bdAlive(el)) return;
      var slug = boardPath();
      if (slug) bdThreadView(el, slug);
      else bdFeedView(el);
    });
  }, function(e){
    if (!bdAlive(el)) return;
    if (window.console && console.error) console.error("[자유게시판]", e);
    el.innerHTML = "<div class='fail'><h3>게시판을 불러오지 못했습니다</h3>"+
      "<p>잠시 후 다시 열어 주세요.</p>"+
      "<button type='button' class='btn' data-bdreload>다시 시도</button></div>";
    el.querySelector("[data-bdreload]").onclick = function(){ renderBoard(); };
  });
}

/* 카드 액션은 한 곳에서 위임으로 받는다. 화면을 다시 그릴 때마다 버튼마다
   onclick 을 다시 매다는 대신 여기 하나만 둔다 — 다시 그려도 끊기지 않는다. */
C.addEventListener("click", function(e){
  var t = e.target, el;
  if (!t || !t.closest) return;
  if ((el = t.closest("[data-talk]"))){ e.preventDefault(); bdTalk(el); return; }
  if ((el = t.closest("[data-unfold]"))){
    var card = el.closest(".bd-card");
    var tx = card ? card.querySelector("[data-text]") : null;
    if (tx) tx.classList.remove("fold");
    if (el.parentNode) el.parentNode.removeChild(el);
    return;
  }
  if ((el = t.closest("[data-share]"))){ bdShareFrom(el); return; }
  if ((el = t.closest("[data-like]"))){ bdToggleLike(el); return; }
  if ((el = t.closest("[data-del]"))){ bdDelete(el); return; }
  if ((el = t.closest("[data-edit]"))){ bdEditCard(el); return; }
  if ((el = t.closest("[data-reply]"))){ bdOpenReply(el); return; }
  if ((el = t.closest("[data-login]"))){ bdLogin(); return; }
  if ((el = t.closest("[data-logout]"))){ bdLogout(); return; }
});

function homeIsDate(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s||"")); }

/* 세 소스는 마감 필드 이름이 전부 다르다(submission_end · deadline · end).
   한 목록에 세우려면 여기서 한 번만 같은 모양으로 바꾼다. */
function homeFromContests(j){
  var out = [];
  CONTEST_SECS.forEach(function(k){
    (((j && j.sections || {})[k]) || []).forEach(function(it){
      if (!homeIsDate(it.submission_end)) return;
      out.push({ kind:"공모전", title:it.title, due:it.submission_end,
                 org:it.organizer, url:it.url, extra:it._region || it.country || "" });
    });
  });
  return out;
}
function homeFromFestivals(list){
  var out = [];
  (list || []).forEach(function(f){
    if (!homeIsDate(f.deadline)) return;
    out.push({ kind:"영화제", title:f.name, due:f.deadline,
               org:f.host, url:f.url, extra:f.region || "" });
  });
  return out;
}
/* 지원사업은 AI 지원사업 화면과 같은 기준으로 거른다 — 저쪽 기본값이 "AI 관련만"인데
   여기서만 전체를 세면 같은 데이터에서 다른 숫자가 나온다(274 대 29). */
function homeFromGov(j){
  var out = [];
  ((j && j.items) || []).forEach(function(it){
    if (!homeIsDate(it.end)) return;
    if (!GOV_AI_RE.test((it.nm||"") + " " + (it.trgt||"") + " " + (it.cls||""))) return;
    out.push({ kind:"지원사업", title:it.nm, due:it.end,
               org:it.org, url:it.url, extra:it.regin || "" });
  });
  return out;
}

/* 같은 공고가 두 소스에 들어 있는 경우가 있다(영화제이면서 해외 공모전으로도 수집된 건).
   제목과 마감일이 같으면 한 줄로 본다. */
function homeMerge(list){
  var seen = {}, out = [];
  (list || []).forEach(function(it){
    if (!it || !it.title) return;
    var key = String(it.title).replace(/\s+/g, "").toLowerCase() + "|" + it.due;
    if (seen[key]) return;
    seen[key] = 1;
    out.push(it);
  });
  out.sort(function(a, b){ return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; });
  return out;
}
function homeDays(due, today){
  var d = parseDate(due);
  if (!d) return null;
  return Math.round((d - today) / 86400000);
}
/* 오늘 마감은 "D-DAY"가 아니라 "오늘"이라고 쓴다. 남은 날짜를 세는 칸에서 오늘만은
   셀 것이 없다 — 지금 넣어야 한다는 말이 더 빨리 읽힌다. 칸이 좁아(모바일 62px)
   큰 글씨로는 두 글자까지이므로 나머지 한마디는 아래 meta 줄이 받는다. */
function homeDueRow(it, today){
  var n = homeDays(it.due, today);
  var di = ddayInfo(it.due, today);
  var meta = [];
  if (it.org) meta.push("<b>" + esc(it.org) + "</b>");
  meta.push(n === 0 ? "오늘 마감" : "마감 " + esc(it.due));
  return row({ dd:(n === 0 ? "오늘" : di.txt), ddCls:di.cls, title:it.title || "(제목 없음)",
               tags:[it.kind, it.extra], meta:meta, url:it.url });
}

/* 영화제는 pub 데이터에 들어 있다. 이미 받아 둔 것이 있으면 그걸 쓰고, 없으면 저장소
   스냅샷을, 그것도 안 되면 파일에 박아 둔 목록을 쓴다 — 영화제 화면과 같은 순서다. */
function homeFestList(){

  return fetch(PUB_SNAPSHOT, { cache:"no-store" })

    .catch(function(){ return FESTIVALS || []; });
}

/* ---- 히어로 레이더 ----
   배경의 동심원에 실제 마감을 점으로 찍는다. 장식이 아니라 이 서비스가 하는 일의 그림이다 —
   가운데에 가까울수록 마감이 임박했고, 사흘 안쪽은 붉다. 링을 한 바퀴 도는 스윕과 합쳐
   "지금 무엇이 잡히고 있는지"가 한 장으로 보인다.

   이미지를 쓰지 않는다. 첫 화면에 그림 파일을 물리면 그만큼 늦게 뜨는데, 여기서 필요한 건
   원 몇 개와 점 몇십 개라 CSS 로 충분하다. 링과 같은 중심(76%,46%)에 좌표만 맞추면 되므로
   SVG 도 필요 없다 — 점 하나가 요소 하나다. */
function homeRadarDots(list, today){
  var el = document.getElementById("heroDots");
  if (!el) return;
  list = list || [];
  /* 앞에서부터 서른 개를 찍으면 전부 사흘 안쪽이라 화면이 온통 붉어진다(실측 30개 중 28개).
     그러면 "임박한 것이 붉다"는 뜻이 사라진다. 목록 전체에서 고르게 건너뛰며 뽑아
     오늘부터 한 달 넘게까지가 안에서 바깥으로 퍼지게 한다. */
  var out = [], n = Math.min(list.length, 30);
  var step = Math.max(1, Math.floor(list.length / n));
  for (var i = 0; i < n; i++){
    var it = list[i * step];
    if (!it) break;
    var d = homeDays(it.due, today);
    if (d === null || d < 0) continue;
    /* 반지름은 남은 날짜다. 가장 안쪽 링이 13vw 이므로 오늘 마감이 그 안에 들어온다 */
    var r = 9 + Math.min(d, 45) * 0.92;
    /* 황금각으로 흩는다 — 규칙적으로 놓으면 눈금처럼 보이고, 난수를 쓰면 그릴 때마다 달라진다 */
    var a = i * 2.39996;
    var cls = d <= 3 ? " hot" : (d <= 7 ? " warm" : "");
    /* i 가 아니라 span 이다 — 링을 그리는 .hero-radar i 규칙이 자손 i 를 전부 잡아
       점까지 26vw~104vw 짜리 원으로 만들어 버린다(2026-08-15 실측). */
    out.push("<span class='dot" + cls + "' style='left:calc(76% + " + (r * Math.cos(a)).toFixed(2) +
      "vw); top:calc(46% + " + (r * Math.sin(a)).toFixed(2) + "vw)'></span>");
  }
  el.innerHTML = out.join("");
}

/* 오늘 들어온 뉴스 개수. 수집물의 date 는 UTC 라 앞 10자만 자르면 하루가 밀린다 */
function homeYmd(d){
  var m = d.getMonth() + 1, dd = d.getDate();
  return d.getFullYear() + "-" + (m < 10 ? "0" + m : m) + "-" + (dd < 10 ? "0" + dd : dd);
}
function homeTodayNews(j, today){
  var ymd = homeYmd(today), n = 0;
  ((j && j.items) || []).forEach(function(it){ if (ymdKST(it.date) === ymd) n++; });
  return n;
}
function homeTechCount(j){
  if (!j) return 0;
  return ((j.github || []).length) + ((j.huggingface || []).length) + ((j.arxiv || []).length);
}

/* 세 소스를 각각 붙잡는다. 하나가 죽어도 나머지 두 종류는 그대로 나온다 —
   목록 전체가 사라지는 것보다 낫다. */
function homeFillDue(){
  var el = document.getElementById("homeDue");
  if (!el) return;
  var today = todaySeoul();
  var pC = fetchContests("all", false).then(homeFromContests, function(){ return []; });
  var pF = homeFestList().then(homeFromFestivals, function(){ return []; });
  var pG = fetchGov(false).then(homeFromGov, function(){ return []; });
  /* 숫자 줄이 마감 일색이면 공모전 사이트로 읽힌다. 성격이 다른 두 칸을 붙여
     여기가 무엇을 다루는 곳인지 숫자만 보고도 알게 한다. 둘 다 실패하면 그 칸이 빠질 뿐이다 */
  var pN = loadFeed("news").then(function(j){ return j; }, function(){ return null; });
  var pT = loadFeed("tech").then(function(j){ return j; }, function(){ return null; });

  Promise.all([pC, pF, pG, pN, pT]).then(function(res){
    if (curRoute() !== "home") return;
    var all = homeMerge(res[0].concat(res[1]).concat(res[2]));
    var open = [], today0 = 0, per = { "공모전":0, "영화제":0, "지원사업":0 };
    all.forEach(function(it){
      var n = homeDays(it.due, today);
      if (n === null || n < 0) return;
      open.push(it);
      if (n === 0) today0++;
      if (per[it.kind] != null) per[it.kind]++;
    });
    homeCounts = per;
    homeRadarDots(open, today);
    /* 오늘 마감이 있는 날에만 그 칸을 경고색으로 둔다. 전부 같은 색이면
       "오늘"과 "이번 달"이 같은 무게로 읽힌다.
       뉴스·기술 동향은 0이면 칸을 빼 버린다 — 0 을 보여 주면 비어 있는 서비스로 읽힌다. */
    var facts = [[String(open.length), "접수 중"],
                 [String(today0), "오늘 마감", today0 > 0 ? "hot" : ""]];
    var newsN = homeTodayNews(res[3], today);
    var techN = homeTechCount(res[4]);
    if (newsN > 0) facts.push([String(newsN), "오늘 새 소식"]);
    if (techN > 0) facts.push([String(techN), "기술 동향"]);
    setFacts(facts);
    var top = open.slice(0, 20);
    el.innerHTML = top.length
      ? top.map(function(it){ return homeDueRow(it, today); }).join("")
      : emptyNote("지금 접수 중인 공고가 없습니다.");
    homeFillMenu();
    observeReveal();
  });
}

/* ---- 마감 알림 구독 ----
   마감 목록 바로 아래에 둔다. "놓치면 안 되겠다"고 느낀 그 자리에서 받아야 한다.
   페이지 맨 아래로 내리면 아무도 보지 않는다.

   받는 값은 이메일 하나다. 이름·전화를 같이 물으면 칸이 늘어난 만큼 사람이 준다.
   로그인도 시키지 않는다 — 마감 알림 하나 받자고 계정을 만들 사람은 없다.
   명단은 화면·공개 JSON·로그 어디에도 내보내지 않는다. firestore.rules 에서
   subscribers 는 create 만 열려 있고 read 는 아무에게도 열려 있지 않다.

   ⚠️ 화면에 "마감 3일 전에 알려드립니다"라고 적었다. 발송을 붙이는 쪽은 이 약속대로
   만들어야 한다 — 마감 사흘 전(D-3)에 그날 걸리는 공고를 보낸다. 문구를 먼저 걸어 두고
   발송이 다르게 나가면 그때부터는 거짓말이 된다. */
function homeCanSubscribe(){ return fbReady(); }
function homeSubscribe(email){
  return fbInit().then(function(){
    /* 메일 주소를 문서 ID 로 쓴다 — 같은 사람이 두 번 눌러도 줄이 하나만 생긴다 */
    var write = fbDb.collection("subscribers").doc(email).set({
      email: email,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      source: "home"
    });
    /* ⚠️ Firestore 는 서버에 닿지 못하면 쓰기를 대기열에 넣고 약속을 계속 붙잡고 있는다.
       거절하지 않으므로 버튼이 "등록 중…"에서 영영 멈춘다 (2026-08-15 실측: 21초까지
       아무 반응 없음). 그러면 누른 사람은 고장으로 읽고 떠난다.
       10초까지만 기다리고 실패로 돌린다. 문서 ID 가 메일 주소라서 밀렸던 쓰기가 나중에
       도착하든 그 사람이 다시 누르든 줄은 하나뿐이다 — 재시도가 안전하다. */
    return new Promise(function(resolve, reject){
      var done = false;
      var timer = setTimeout(function(){
        if (done) return;
        done = true;
        reject(new Error("시간이 초과되었습니다"));
      }, 10000);
      write.then(function(v){
        if (done) return;
        done = true; clearTimeout(timer); resolve(v);
      }, function(e){
        if (done) return;
        done = true; clearTimeout(timer); reject(e);
      });
    });
  });
}
function homeValidEmail(s){
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(s || "").trim());
}
function homeSubNote(txt){
  var el = document.querySelector("#homeSubBox .sub-note");
  if (el) el.textContent = txt;
}
function homeFillSub(){
  var wrap = document.getElementById("homeSubBox");
  if (!wrap) return;
  /* Firebase 가 아직 안 붙었으면 폼 대신 메일 링크를 둔다 —
     받을 방법이 없다고 신청 의사까지 버릴 이유는 없다 */
  if (!homeCanSubscribe()){
    wrap.innerHTML = "<p style='margin:0'><a class='btn' href='" + HOME_MAIL_ALERT +
      "'>메일로 신청하기</a></p>";
    return;
  }
  wrap.innerHTML =
    "<form class='sub-form' id='homeSubForm' novalidate>" +
      "<label class='sr' for='homeSubEmail'>이메일 주소</label>" +
      "<input class='search sub-input' id='homeSubEmail' type='email' name='email' " +
        "inputmode='email' autocomplete='email' placeholder='이메일 주소'>" +
      "<button class='btn' type='submit' id='homeSubBtn'>" + esc(HOME_COPY.alertBtn) + "</button>" +
    "</form>" +
    "<p class='sub-note'>" + esc(HOME_COPY.alertNote) + "</p>";

  document.getElementById("homeSubForm").onsubmit = function(e){
    e.preventDefault();
    var input = document.getElementById("homeSubEmail");
    var btn = document.getElementById("homeSubBtn");
    var email = String(input.value || "").trim().toLowerCase();
    if (!homeValidEmail(email)){
      homeSubNote(HOME_COPY.alertBad);
      input.focus();
      return;
    }
    homeSubNote(HOME_COPY.alertNote);   /* 앞서 뜬 오류 안내를 지우고 시작한다 */
    btn.disabled = true;
    btn.textContent = "등록 중…";
    homeSubscribe(email).then(function(){
      wrap.innerHTML = "<p class='sub-msg'>" + esc(HOME_COPY.alertDone) + "</p>";
    }, function(err){
      /* 규칙이 create 만 허용하므로 이미 있는 주소를 다시 넣으면 거절당한다.
         그 사람 입장에서는 이미 등록된 것이 맞다 — 실패라고 말할 일이 아니다. */
      if (err && err.code === "permission-denied"){
        wrap.innerHTML = "<p class='sub-msg'>" + esc(HOME_COPY.alertDup) + "</p>";
        return;
      }
      btn.disabled = false;
      btn.textContent = HOME_COPY.alertBtn;
      homeSubNote(HOME_COPY.alertFail);
    });
  };
}

/* ---- 오늘의 브리핑 ----
   뉴스리포트 화면이 쓰는 데이터를 그대로 읽는다. 본문에서 출처·이미지 주소를 걷어내고
   앞 네 줄만 보여준다 — 첫 화면에서 브리핑을 다 읽게 할 생각이 없다. */
function homeBriefLines(content, n){
  var lines = String(content || "").split("\n"), out = [];
  for (var i = 0; i < lines.length && out.length < n; i++){
    var s = lines[i].replace(/\s*\(img:[^)]*\)/g, "").replace(/\s*\(출처:[^)]*\)/g, "").trim();
    if (s.indexOf("•") !== 0) continue;
    out.push(s);
  }
  return out;
}
function homeFillBrief(){
  var sec = document.getElementById("homeBriefSec");
  var el = document.getElementById("homeBrief");
  if (!sec || !el) return;
  var all = sortedReports();
  if (!all.length){ sec.style.display = "none"; return; }
  var r = all[0];
  var lines = homeBriefLines(stripYtSection(r.content || ""), 4);
  if (!lines.length){ sec.style.display = "none"; return; }
  sec.style.display = "";
  el.innerHTML =
    "<div class='brief-head'><h3>" + esc(r.title || "(제목 없음)") + "</h3>" +
    "<div class='brief-date tnum'>" + esc(String(r.report_date || "").slice(0, 10)) + "</div></div>" +
    "<div class='brief-body'>" + esc(lines.join("\n")) + "</div>" +
    "<p style='margin:26px 0 0'><a class='btn' href='" + esc(menuHref("newsrep")) + "'>전체 보기</a></p>";
}

/* ---- 커뮤니티 최근 글 ----
   자유게시판이 쓰는 질의를 그대로 쓴다(원글만·최신순). 색인도 같은 것을 쓰므로
   게시판이 뜨는 환경이면 여기도 뜬다.
   Firebase 설정 전이거나 글이 없으면 이 블록은 조용히 없는 채로 둔다 —
   "준비 중"이라고 적힌 빈 껍데기는 안 만든 것만 못하다. */
function homeCommRow(p){
  /* row() 를 쓰지 않는 이유는 링크 하나뿐이다. row() 는 바깥 링크용이라 새 탭으로 열지만
     게시판은 우리 사이트 안이라 그대로 이동해야 한다. 생김새는 같은 클래스를 쓴다. */
  var tags = (p.tags || []).slice(0, 2).map(function(t){
    return "<span class='tag'>" + esc(t) + "</span>"; }).join("");
  return "<a class='row' href='" + esc(boardUrl(p.id)) + "'>" +
    "<div class='dd tnum tbd'>" + esc(bdWhen(p.createdAt)) + "</div>" +
    "<div class='r-main'><div class='r-title'>" + esc(bdExcerpt(p.body) || "(내용 없음)") + tags + "</div>" +
    "<div class='r-meta'><b>" + esc(p.author || "익명") + "</b></div></div></a>";
}
function homeFillCommunity(){
  var sec = document.getElementById("homeCommSec");
  var el = document.getElementById("homeComm");
  if (!sec || !el || !fbReady()) return;
  fbInit().then(function(){
    return fbDb.collection("posts").where("parentId", "==", null)
      .orderBy("createdAt", "desc").limit(5).get();
  }).then(function(sn){
    if (curRoute() !== "home" || !C.contains(sec)) return;
    var got = [];
    sn.forEach(function(d){ var o = d.data() || {}; o.id = d.id; got.push(o); });
    if (!got.length) return;              /* 아직 글이 없다 — 숨긴 채로 둔다 */
    sec.style.display = "";
    el.innerHTML = got.map(homeCommRow).join("");
    observeReveal();
  }, function(){});                        /* 색인 없음·네트워크 실패도 조용히 숨긴다 */
}

/* ---- 메뉴 안내 ----
   숫자는 위 마감 목록과 같은 계산에서 나온다. 한 화면에서 다른 숫자가 보이면 둘 다 못 믿는다. */
var homeCounts = null;
var HOME_MENU_CARDS = [
  ["contests", "AI 공모전", "공모전"],
  ["festivals", "AI 영화제", "영화제"],

/* ============ 라우팅 ============ */
var ROUTES = {
  home:renderHome,
  contests:renderContests, festivals:renderFestivals, gov:renderGov,
  newsrep:renderReports, youtube:renderYoutube, aivideo:renderAiVideo,
  board:renderBoard
};
/* 공개 목록 API(action=pub) 데이터가 필요한 화면 */
var NEEDS_PUB = { newsrep:1, youtube:1 };
/* 그중 youtube 는 브리핑이 없어도 유튜브 수집분만으로 그려진다 —
   로딩은 기다리되 실패했다고 화면 전체를 에러로 덮지 않는다. */
var PUB_OPTIONAL = { youtube:1 };

function render(){
  var route = curRoute();
  buildNav();
  drawHero(route);
  /* 제목은 내비의 짧은 라벨이 아니라 전체 이름을 쓴다 — 브라우저 탭·검색 결과·
     공유 링크에서는 "공모전"보다 "AI 공모전"이 무엇인지 분명하다. */
  /* 홈만 "AI 레이더 — AI 레이더"가 되므로 무엇을 보는 곳인지로 뒤를 채운다 */
  document.title = route === "home"
    ? "AI 레이더 — AI 공모전 · 지원사업 · 영화제 마감"
    : ((HERO[route] || {}).ko || TITLES[route]) + " — AI 레이더";
  if (NEEDS_PUB[route]){
    if (state.loading){
      setKicker(["불러오는 중"]);
      setFacts([["—","발행된 브리핑"],["—","최신 발행일"],["—","항목 수"]]);
      C.innerHTML = "<section class='section paper'><div class='inner'>"+
        emptyNote("데이터를 불러오는 중입니다.")+"</div></section>";
      return;
    }
    if (state.error && !PUB_OPTIONAL[route]){
      setKicker(["연결 실패"]);
      setFacts([["—",""],["—",""],["—",""]]);
      C.innerHTML = "<section class='section paper'><div class='inner'>"+failBox(state.error)+"</div></section>";
      bindRetry(C);
      return;
    }
  }
  (ROUTES[route] || renderReports)();
  observeReveal();
}

/* ============ 모션 ============ */
var io = null;
function observeReveal(){
  if (!("IntersectionObserver" in window)) return;
  if (!io) io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("visible"); io.unobserve(e.target); } });
  }, { threshold:.12 });
  C.querySelectorAll(".reveal:not(.visible)").forEach(function(el){ io.observe(el); });
}
var bar = document.getElementById("progress");
function onScroll(){
  var h = document.documentElement.scrollHeight - window.innerHeight;
  bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + "%";
}
window.addEventListener("scroll", onScroll, { passive:true });

/* ============ 액션 ============ */
document.getElementById("refreshBtn").onclick = function(){
  var btn = this, label = btn.textContent;
  btn.textContent = "↻ …";
  govCache = null; contestCache = {};
  state.loading = true; state.error = null; render();
  loadData().catch(function(e){ state.loading=false; state.error=e.message||String(e); })
    .then(function(){ render(); btn.textContent = label; });
};
/* ============ 이동 ============
   해시 이동(hashchange)과 경로 이동(popstate)이 같은 곳으로 모인다.
   해시만 바뀔 때는 두 이벤트가 같이 울리기도 해서, 주소가 실제로 달라졌을 때만 그린다. */
var navKey = "";
function onNav(){
  var k = location.pathname + location.hash;
  if (k === navKey) return;
  navKey = k;
  render();
  window.scrollTo({ top:0, behavior:"auto" });
}
/* 게시판 안에서의 이동. 주소를 바꾸고 그린다 — 브라우저 뒤로가기는 popstate 가 받는다 */
function bdGo(slug){
  var url = boardUrl(slug);
  if (location.pathname === url && !location.hash){
    /* 이미 그 주소다 — 주소를 또 쌓지 않고 화면만 다시 그린다 (예: 인용을 들고 피드로) */
    render(); window.scrollTo({ top:0, behavior:"auto" });
    return;
  }
  history.pushState(null, "", url);
  onNav();
}
window.addEventListener("hashchange", onNav);
window.addEventListener("popstate", onNav);

/* 같은 사이트 안에서 경로가 바뀌는 링크는 새로고침 없이 처리한다.
   href 는 그대로 진짜 주소로 두므로 새 탭·링크 복사·크롤러는 평소대로 동작한다. */
document.addEventListener("click", function(e){
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  var a = (e.target && e.target.closest) ? e.target.closest("a[href]") : null;
  if (!a || (a.target && a.target !== "_self") || a.hasAttribute("download")) return;
  var u;
  try { u = new URL(a.href, location.href); } catch(err){ return; }
  if (u.origin !== location.origin) return;
  if (u.pathname === location.pathname) return;   /* 같은 문서 안의 해시 이동은 기본 동작대로 */
  if (u.pathname !== BASE && u.pathname.indexOf(BASE + "board") !== 0) return;
  e.preventDefault();
  history.pushState(null, "", u.pathname + u.search + u.hash);
  onNav();
});

/* ============ 초기화 ============ */
(function init(){
  if (boardPath() === null && !location.hash) location.replace("#" + DEFAULT_ROUTE);
  navKey = location.pathname + location.hash;
  render();
  onScroll();
  /* 스냅샷 먼저 그리고(0.3초), 라이브는 뒤에서 받아 다를 때만 다시 그린다(6~68초) */
  var drawn = false;
  loadPubSnapshot().then(function(j){ if (!j) return; drawn = true; render(); }, function(){});
  loadData().then(function(){
    if (!drawn || state.pubChanged) render();
  }, function(e){
    if (state.data) return;   /* 스냅샷으로 이미 그려져 있다 — 멀쩡한 화면을 에러로 덮지 않는다 */
    state.loading = false; state.error = e.message||String(e); render();
  });
  /* 탭이 보일 때만 10분마다 목록 갱신 */
  setInterval(function(){
    if (document.hidden) return;
    loadData().then(function(){
      if (NEEDS_PUB[curRoute()] || curRoute()==="festivals") render();
    }).catch(function(){});
  }, 600000);
})();

})();
