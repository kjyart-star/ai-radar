<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 레이더 — AI 공모전·영화제·지원사업·뉴스</title>
<meta name="description" content="AI 공모전, AI 영화제, AI 지원사업, 아침 뉴스 브리핑과 유튜브 영상을 한 화면에서 봅니다. 로그인 없이 열립니다.">
<meta property="og:title" content="AI 레이더">
<meta property="og:description" content="AI 공모전·영화제·지원사업·뉴스를 한 화면에서. 마감이 가까운 순으로.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" sizes="any" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2048%2048'%3E%3Crect%20width='48'%20height='48'%20fill='%2307110d'/%3E%3Ccircle%20cx='24'%20cy='24'%20r='17'%20fill='none'%20stroke='%23b6ff3f'%20stroke-width='2.4'%20opacity='.55'/%3E%3Ccircle%20cx='24'%20cy='24'%20r='9'%20fill='none'%20stroke='%23b6ff3f'%20stroke-width='2.4'%20opacity='.85'/%3E%3Cpath%20d='M24%2024%20L40%2015'%20stroke='%23b6ff3f'%20stroke-width='3'%20stroke-linecap='round'/%3E%3Ccircle%20cx='33'%20cy='15'%20r='4'%20fill='%23b6ff3f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<style>
  /* =========================================================================
     AI 레이더 — lime-lab-editorial 디자인 시스템
     팔레트를 라임 온 다크로 유지한 이유: 라임 링 위의 스위프는 레이더 화면이고,
     서비스 이름이 곧 그 화면이다. 색만 빌린 게 아니라 주제에서 나온 선택이다.
     ========================================================================= */
  :root{
    --ink:#07110d;          /* 다크 배경 — 순수 검정이 아니라 초록기 도는 검정 */
    --ink-2:#0d1c16;
    --paper:#f2f1e9;        /* 크림 — 페이지 절반을 이 색이 가진다 */
    --paper-2:#e7e8dc;
    --lime:#b6ff3f;         /* 유일한 액센트. 숫자·D-day·액티브·CTA 에만 */
    --coral:#ff7358;        /* 페이퍼 섹션 전용 */
    --line-dark:rgba(255,255,255,.16);
    --line-light:rgba(7,17,13,.18);
    --muted-dark:rgba(255,255,255,.64);
    --muted-light:rgba(7,17,13,.62);
    --max:1320px;
    --navh:70px;
    /* 디스플레이와 본문을 다른 패밀리로 나눈다. 같은 패밀리로 통일하는 것이
       가장 흔한 기본값이라, 라틴 디스플레이만 Wanted Sans 로 분리했다. */
    --display:"Wanted Sans Variable","Wanted Sans",Pretendard,system-ui,sans-serif;
    --body:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--ink); color:#fff; font-family:var(--body);
        overflow-x:hidden; }
  button,a,input{ font:inherit; color:inherit; }
  button{ cursor:pointer; background:none; border:0; }
  a{ text-decoration:none; }
  img{ display:block; max-width:100%; }
  :focus-visible{ outline:2px solid var(--lime); outline-offset:3px; }
  .tnum{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  /* ---------- chrome ---------- */
  .progress{ position:fixed; inset:0 auto auto 0; z-index:100; height:3px; width:0;
             background:var(--lime); }
  .nav{ position:fixed; z-index:90; top:0; left:0; right:0; height:var(--navh);
        display:flex; align-items:center; justify-content:space-between; gap:20px;
        padding:0 32px; border-bottom:1px solid var(--line-dark);
        background:rgba(7,17,13,.82); backdrop-filter:blur(20px); }
  /* 로고를 키웠다 (대표 지시 2026-08-12). 서비스 이름이 내비에서 가장 큰 글자여야
     한다 — 여기가 유일하게 브랜드를 말하는 자리다. 마크 26→34px, 워드마크 12→17px. */
  .brand{ display:flex; align-items:center; gap:13px; font-family:var(--display);
          font-size:17px; letter-spacing:.13em; font-weight:900; white-space:nowrap; }
  .brand svg{ width:34px; height:34px; display:block; }
  /* 한글 라벨이라 uppercase 와 넓은 자간을 뺐다 — 한글에는 대문자가 없고,
     자간을 벌리면 낱자가 흩어져 읽기 더 어려워진다. 크기는 13px 로 올렸다(로고 17px 대비). */
  .nav-links{ display:flex; gap:24px; font-size:13px; letter-spacing:.01em;
              color:var(--muted-dark); font-weight:700;
              overflow-x:auto; scrollbar-width:none; }
  .nav-links::-webkit-scrollbar{ display:none; }
  .nav-links a{ white-space:nowrap; padding:6px 0; border-bottom:2px solid transparent; }
  .nav-links a:hover{ color:#fff; }
  .nav-links a.on{ color:var(--lime); border-bottom-color:var(--lime); }

  /* ---------- hero ---------- */
  /* 히어로를 96vh 가 아니라 74vh 로 낮췄다. 이건 리스팅 서비스라 목록이
     첫 화면 안에 걸쳐 보여야 스크롤할 이유가 생긴다. */
  .hero{ position:relative; min-height:min(74vh, 700px); display:flex; align-items:flex-end;
         overflow:hidden; border-bottom:1px solid var(--line-dark); }
  .hero-radar{ position:absolute; inset:0; pointer-events:none; }
  .hero-radar i{ position:absolute; left:76%; top:46%; translate:-50% -50%;
                 border:1px solid rgba(182,255,63,.24); border-radius:50%; }
  .hero-radar i:nth-child(1){ width:26vw; height:26vw; }
  .hero-radar i:nth-child(2){ width:52vw; height:52vw; }
  .hero-radar i:nth-child(3){ width:78vw; height:78vw; }
  .hero-radar i:nth-child(4){ width:104vw; height:104vw; opacity:.6; }
  .hero-sweep{ position:absolute; left:76%; top:46%; width:104vw; height:104vw;
               translate:-50% -50%; border-radius:50%;
               background:conic-gradient(from 0deg,
                 rgba(182,255,63,.10) 0deg, rgba(182,255,63,0) 40deg,
                 rgba(182,255,63,0) 360deg);
               animation:sweep 9s linear infinite; }
  /* 스위프의 앞날을 1px 실선으로 못박는다. 이게 없으면 원뿔형 조명처럼 보인다 —
     레이더는 빛이 아니라 선이 도는 화면이다. */
  .hero-sweep::before{ content:""; position:absolute; left:50%; top:0; width:1px;
                       height:50%; background:rgba(182,255,63,.55); }
  @keyframes sweep{ to{ rotate:360deg; } }
  .hero::after{ content:""; position:absolute; inset:0; pointer-events:none;
                background:linear-gradient(90deg, rgba(7,17,13,.96) 0%,
                  rgba(7,17,13,.72) 46%, rgba(7,17,13,.30) 100%); }
  .hero-content{ position:relative; z-index:2; width:min(var(--max), calc(100% - 64px));
                 margin:0 auto; padding:calc(var(--navh) + 62px) 0 58px; }
  .kicker{ display:flex; gap:9px; flex-wrap:wrap; margin-bottom:22px; }
  .pill{ border:1px solid rgba(255,255,255,.35); border-radius:999px; padding:7px 12px;
         font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; }
  .pill.accent{ background:var(--lime); color:var(--ink); border-color:var(--lime);
                font-weight:900; }
  /* 라틴 디스플레이에만 강한 음수 자간을 준다. 한글에 -.075em 을 주면 글자가
     뭉개져서 오히려 싸구려가 된다 — 한글 라인은 -.02em 까지만. */
  .hero h1{ margin:0; max-width:960px; font-family:var(--display); font-weight:900;
            font-size:clamp(64px, 10.5vw, 152px); letter-spacing:-.075em;
            line-height:.82; text-transform:uppercase; }
  .hero h1 em{ display:block; margin-top:20px; color:var(--lime); font-style:normal;
               font-family:var(--body); font-weight:800; font-size:.26em;
               letter-spacing:-.02em; line-height:1.15; text-transform:none; }
  .hero-bottom{ margin-top:36px; display:grid;
                grid-template-columns:minmax(0,600px) 1fr; gap:60px; align-items:end; }
  .hero-copy{ margin:0; color:rgba(255,255,255,.8); font-size:clamp(16px, 1.7vw, 21px);
              line-height:1.65; word-break:keep-all; }
  .hero-facts{ display:grid; grid-template-columns:repeat(3,1fr);
               border-top:1px solid var(--line-dark); }
  .hero-fact{ padding:15px 12px 0 0; min-width:0; }
  .hero-fact b{ display:block; color:var(--lime); font-family:var(--display);
                font-size:clamp(24px,3.2vw,34px); letter-spacing:-.05em; line-height:1; }
  .hero-fact span{ display:block; margin-top:7px; color:var(--muted-dark); font-size:10px;
                   letter-spacing:.1em; text-transform:uppercase; font-weight:700;
                   word-break:keep-all; }

  /* ---------- section shell ---------- */
  .section{ padding:104px 32px; scroll-margin-top:var(--navh); }
  .inner{ width:min(var(--max),100%); margin:0 auto; }
  .paper{ background:var(--paper); color:var(--ink); }
  .paper-alt{ background:var(--paper-2); color:var(--ink); }
  .dark{ background:var(--ink); color:#fff; }
  .section-head{ display:grid; grid-template-columns:1fr minmax(260px,440px); gap:56px;
                 align-items:end; margin-bottom:40px; }
  .eyebrow{ margin:0 0 14px; font-family:var(--display); font-size:11px; font-weight:800;
            letter-spacing:.18em; text-transform:uppercase; color:var(--coral); }
  .dark .eyebrow{ color:var(--lime); }
  .section h2{ margin:0; font-size:clamp(36px,5vw,68px); letter-spacing:-.025em;
               line-height:1.08; font-weight:800; word-break:keep-all; }
  .section-intro{ margin:0; color:var(--muted-light); font-size:15px; line-height:1.75;
                  word-break:keep-all; }
  .dark .section-intro{ color:var(--muted-dark); }
  .count{ font-family:var(--display); font-size:12px; font-weight:800; letter-spacing:.12em;
          text-transform:uppercase; color:var(--muted-light); white-space:nowrap; }
  .dark .count{ color:var(--muted-dark); }
  .count b{ color:var(--ink); font-size:15px; }
  .dark .count b{ color:var(--lime); }

  /* ---------- filters ---------- */
  .controls{ display:flex; flex-wrap:wrap; gap:10px; align-items:center;
             margin-bottom:26px; }
  .chip{ border:1px solid var(--line-light); border-radius:999px; padding:9px 14px;
         font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:700;
         min-height:38px; }
  .chip:hover,.chip.on{ background:var(--ink); color:var(--paper);
                        border-color:var(--ink); }
  .dark .chip{ border-color:var(--line-dark); color:#fff; }
  .dark .chip:hover,.dark .chip.on{ background:var(--lime); color:var(--ink);
                                    border-color:var(--lime); }
  .search{ flex:1 1 220px; min-width:0; min-height:38px; padding:9px 13px;
           border:1px solid var(--line-light); background:transparent; font-size:14px; }
  .search::placeholder{ color:var(--muted-light); }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }

  /* ---------- list rows (핵심 반복 단위) ---------- */
  .rows{ border-top:1px solid var(--line-light); }
  .dark .rows{ border-top-color:var(--line-dark); }
  .row{ display:grid; grid-template-columns:96px 1fr; gap:26px; align-items:start;
        padding:22px 16px 24px; border-bottom:1px solid var(--line-light);
        transition:background .18s ease, color .18s ease; }
  .dark .row{ border-bottom-color:var(--line-dark); }
  @media (hover:hover){
    .row:hover{ background:var(--ink); color:#fff; }
    .dark .row:hover{ background:var(--lime); color:var(--ink); }
    .row:hover .r-meta,.row:hover .r-sum,.row:hover .r-title-en{ color:rgba(255,255,255,.72); }
    .dark .row:hover .r-meta,.dark .row:hover .r-sum,.dark .row:hover .r-title-en{ color:rgba(7,17,13,.72); }
    .row:hover .tag{ border-color:rgba(255,255,255,.4); }
    .dark .row:hover .tag{ border-color:rgba(7,17,13,.4); }
    .row:hover .dd{ color:var(--lime); }
    .dark .row:hover .dd{ color:var(--ink); }
  }
  .dd{ font-family:var(--display); font-weight:800; font-size:29px; letter-spacing:-.045em;
       line-height:1; text-align:right; padding-top:2px; }
  .dd.soon{ color:var(--coral); }
  .dark .dd.soon{ color:var(--lime); }
  .dd.over{ opacity:.38; }
  .dd.tbd{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; opacity:.55;
           padding-top:9px; }
  .r-main{ min-width:0; }
  /* keep-all 은 한글 어절을 지키려고 남긴다. 다만 그것만 있으면 공백 없는 긴 문자열
     (HF 모델 ID, GitHub owner/repo)이 375px 에서 안 끊겨 문서에 가로 스크롤이 생긴다.
     anywhere 는 넘칠 때만 개입해서 한글 줄바꿈은 그대로 둔다. */
  .r-title{ font-size:clamp(17px,1.5vw,20px); font-weight:800; letter-spacing:-.02em;
            line-height:1.35; word-break:keep-all; overflow-wrap:anywhere; }
  /* 번역 제목 아래 붙는 영문 원문. 기계번역은 틀릴 때가 있어 원문을 지우면 확인할 길이
     없어진다. 다만 읽는 순서는 한글이 먼저라 원문은 메타 정보 크기로 낮춘다.
     긴 영문 제목이 375px 를 넘지 않도록 break-word 를 준다. */
  .r-title-en{ margin-top:6px; font-size:12.5px; font-weight:600; letter-spacing:0;
               line-height:1.45; color:var(--muted-light); overflow-wrap:break-word; }
  .dark .r-title-en{ color:var(--muted-dark); }
  .tag{ display:inline-block; margin-left:8px; border:1px solid var(--line-light);
        border-radius:999px; padding:3px 9px; font-size:10px; font-weight:700;
        letter-spacing:.08em; vertical-align:middle; white-space:nowrap; }
  .dark .tag{ border-color:var(--line-dark); }
  .r-meta{ margin-top:9px; color:var(--muted-light); font-size:12.5px; line-height:1.6;
           word-break:keep-all; }
  .dark .r-meta{ color:var(--muted-dark); }
  .r-meta i{ font-style:normal; opacity:.4; margin:0 7px; }
  .r-meta b{ font-weight:700; }
  .r-sum{ margin-top:8px; color:var(--muted-light); font-size:13px; line-height:1.6;
          word-break:keep-all; display:-webkit-box; -webkit-line-clamp:2;
          -webkit-box-orient:vertical; overflow:hidden; }
  .dark .r-sum{ color:var(--muted-dark); }

  /* ---------- fold ---------- */
  .fold-head{ display:flex; align-items:end; justify-content:space-between; gap:24px;
              width:100%; text-align:left; padding:0 0 24px;
              border-bottom:1px solid var(--line-light); margin-bottom:0; }
  .dark .fold-head{ border-bottom-color:var(--line-dark); }
  .fold-sign{ font-family:var(--display); font-size:26px; font-weight:800; line-height:1; }
  [data-foldsec] .fold-body{ padding-top:26px; }
  [data-foldsec].collapsed .fold-body{ display:none; }
  [data-foldsec] .fold-sign::after{ content:"–"; }
  [data-foldsec].collapsed .fold-sign::after{ content:"+"; }

  /* ---------- briefing body (richReport 출력물) ---------- */
  .brief-head{ display:grid; grid-template-columns:1fr auto; gap:24px; align-items:end;
               padding-bottom:22px; border-bottom:1px solid var(--line-light);
               margin-bottom:30px; }
  .brief-head h3{ margin:0; font-size:clamp(26px,3.4vw,44px); letter-spacing:-.03em;
                  line-height:1.1; font-weight:800; word-break:keep-all; }
  .brief-date{ font-family:var(--display); font-size:clamp(18px,2.2vw,28px); font-weight:800;
               letter-spacing:-.04em; white-space:nowrap; }
  .brief-body{ white-space:pre-wrap; word-break:keep-all; font-size:15px; line-height:1.8;
               color:var(--muted-light); }
  .dark .brief-body{ color:var(--muted-dark); }
  /* 본문에 섞인 맨 링크만 밑줄. 카드는 테두리가 이미 링크임을 말한다. */
  .brief-body a:not(.item-card):not(.yt-thumb):not(.news-card){
    text-decoration:underline; text-underline-offset:3px; }
  /* 원문에 이미 빈 줄이 있고 .brief-body 가 pre-wrap 이라 여백이 두 번 들어간다.
     여기 마진은 작게 잡는다. */
  .sec-label{ display:block; margin:20px 0 14px; font-size:clamp(21px,2.4vw,29px);
              font-weight:800; letter-spacing:-.025em; line-height:1.2;
              color:var(--ink); white-space:normal; word-break:keep-all; }
  .dark .sec-label{ color:#fff; }
  .sec-label:first-child{ margin-top:0; }
  /* 1단계 헤더는 브리핑 제목과 겹친다. 지우지는 않고 작은 라벨로 낮춘다. */
  .sec-label.meta{ margin:0 0 6px; font-family:var(--display); font-size:11px;
                   font-weight:800; letter-spacing:.16em; text-transform:uppercase;
                   color:var(--coral); }
  .dark .sec-label.meta{ color:var(--lime); }
  .card-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px;
              margin:14px 0 20px; white-space:normal; }
  /* 썸네일을 112 → 184px 로 키웠다 (대표 지시 2026-08-12, "썸네일이 잘 보이게").
     16:9 는 그대로 두고 칸만 넓혔다. 카드가 한 칸에 580px 가까이 되므로 제목 자리는
     380px 넘게 남는다 — 제목이 더 접히지 않는 선에서 최대로 키운 값이다. */
  .item-card{ display:grid; grid-template-columns:184px 1fr; gap:15px; align-items:start;
              border:1px solid var(--line-light); padding:13px;
              transition:background .18s ease, color .18s ease; }
  .dark .item-card{ border-color:var(--line-dark); }
  .item-card img{ width:184px; height:104px; object-fit:cover; background:var(--ink-2); }
  .item-card:not(.photo):not(.yt) img{ width:38px; height:38px; object-fit:contain;
                                       background:none; }
  /* 원문에 아이콘이 없을 때 쓰는 우리 마크. 구글 파비콘 서비스는 아이콘이 없으면
     404 를 주므로(2026-08-13 실측: k-startup.go.kr) onerror 로 이 자리로 떨어진다.
     그림 대신 타이포로 간다 — 소스마다 그림을 만들면 아이덴티티가 흩어진다 */
  .ic-mark{ width:38px; height:38px; display:grid; place-items:center;
            background:var(--ink); color:var(--lime);
            font-size:13px; font-weight:900; letter-spacing:.02em; }
  .dark .ic-mark{ background:var(--lime); color:var(--ink); }
  .item-card:hover .ic-mark{ background:var(--lime); color:var(--ink); }
  .dark .item-card:hover .ic-mark{ background:var(--ink); color:var(--lime); }
  @media (hover:hover){
    .item-card:hover{ background:var(--ink); color:#fff; }
    .dark .item-card:hover{ background:var(--lime); color:var(--ink); }
  }
  .ic-body{ display:block; min-width:0; }
  .ic-title{ display:block; font-size:14px; font-weight:800; line-height:1.4;
             letter-spacing:-.015em; word-break:keep-all; }
  .ic-desc{ display:-webkit-box; margin-top:5px; font-size:12.5px; line-height:1.55;

<script>
(function(){
"use strict";

/* ============ 공개 API (키 불필요·읽기 전용) ============
   ⚠️ 2026-08-12: 옛 주소가 404 로 죽어 다섯 메뉴가 전부 "데이터를 불러오지 못했습니다" 였다.
   관리시스템 웹앱에 **새 배포**를 만들면 URL 이 바뀌는데, 이 파일은 그걸 모른 채 옛 주소를
   계속 불렀다. 화면 자체는 떠서 겉으로는 멀쩡해 보인다 — 조용히 죽는 부류다.
   주소를 바꿀 일이 생기면 반드시 살아 있는지 먼저 확인한다:
     curl -sL "<주소>?action=pub" | head -c 80     → {"generated": … 가 나와야 한다 */
var API = "https://script.google.com/macros/s/AKfycbxqPn36E8gpmKp3RzUR60XTaNL7G4wY_-xyUMXszOUUj8mQh3OoSOcWCzFZ-rkxdHU5/exec";

/* ============ 자기 저장소 JSON (같은 출처 — CORS 없음) ============
   Google News·TechCrunch·Reddit·Devpost·힉스필드는 CORS 헤더를 주지 않아 브라우저에서
   직접 못 부른다. 그래서 GitHub Actions(.github/workflows/collect.yml)가 매일 아침
   수집해 data/*.json 으로 커밋하고, 여기서는 같은 출처 파일만 읽는다.
   관리시스템(Apps Script) 할당량을 쓰지 않는 것도 이 구조를 고른 이유다.
   파일이 없거나 실패하면 그 섹션만 조용히 빠진다 — 다른 화면은 영향을 받지 않는다. */
var FEED_FILES = {
  news:"data/news.json", community:"data/community.json", tech:"data/tech.json",
  devpost:"data/devpost.json", higgsfield:"data/higgsfield.json"
};
var feedCache = {};
function loadFeed(key){
  if (!feedCache[key]){
    feedCache[key] = fetch(FEED_FILES[key], { cache:"no-store" })
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
  }
  return feedCache[key];
}

/* ============ AI 영상 작품 API ============
   유튜브 전역 검색은 YouTube Data API 키가 필요하다. 키를 이 공개 저장소에 둘 수 없으므로
   수집은 수신부(Apps Script)가 하고 여기서는 결과만 읽는다.
   응답에 키는 실리지 않는다 — 키는 유튜브 API 주소를 만들 때만 쓰인다.

   수집은 수신부가 하루 한 번만 하고 여기서는 캐시된 결과를 받는다.
   방문자마다 수집하면 무료 할당량이 하루도 못 간다. */
var AIVIDEO_API = "https://script.google.com/macros/s/AKfycbww9cob2CYg8PVnQO35WesnTaZRIPVmYg-ClLQbyWN7q-b2skKmXZG1XAjLbQhntnYA/exec";

/* ============ 상태 ============ */
var state = { data:null, loading:true, error:null, pubLive:false, pubChanged:true };
var C = document.getElementById("view");

/* ============ 유틸 ============ */
function esc(s){ s = (s==null?"":String(s));
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

/* 본문 속 URL을 새 탭으로 열리는 링크로 변환 (이스케이프 후 치환 — 괄호·따옴표는 URL에서 제외).
   유튜브 링크는 썸네일 카드로 렌더링 */
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s)<>"'　]+)/g, function(u){
    var m = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{6,20})/);
    if (m) {
      return "<a class='yt-thumb' href='"+u+"' target='_blank' rel='noopener noreferrer'>"+
        "<img src='https://i.ytimg.com/vi/"+m[1]+"/mqdefault.jpg' alt='유튜브 썸네일' loading='lazy'>"+
        "<span>영상 보기</span></a>";
    }
    var h = u.match(/^https?:\/\/([^\/]+)/);
    var host = h ? h[1].replace(/^www\./,"") : "";
    return "<a class='news-card' href='"+u+"' target='_blank' rel='noopener noreferrer'>"+
      "<img class='nc-ico' src='https://www.google.com/s2/favicons?domain="+host+"&amp;sz=64' alt='' loading='lazy'>"+
      "<span class='nc-domain'>"+host+"</span><span class='nc-go'>기사 보기 ↗</span></a>";
  });
}

/* 리포트 본문을 리치 카드로 렌더링: "• 제목 — 요약 (출처: URL)" 줄을
   [썸네일 | 제목·설명·링크] 가로 카드로 변환 (유튜브=영상 썸네일, 뉴스=언론사 아이콘/기사 사진) */
function richReport(s){
  var lines = String(s==null?"":s).replace(/\*\*/g,"").split("\n");
  var out = [], cardBuf = [];
  /* 연속된 카드 라인은 2열 그리드(card-grid)로 묶는다 */
  function flushCards(){
    if (cardBuf.length){
      out.push("<span class='card-grid'>"+cardBuf.join("")+"</span>");
      cardBuf = [];
    }
  }
  for (var i=0;i<lines.length;i++){
    var t = lines[i].trim();
    /* (img: URL) 마커 = 기사 사진 → 사진 카드로 렌더 */
    var imgM = t.match(/[\(（]\s*img\s*:\s*(https?:\/\/[^\s)）]+)\s*[\)）]/i);
    var photo = imgM ? imgM[1] : "";
    if (imgM) t = t.replace(imgM[0], "").trim();
    var um = t.match(/(https?:\/\/[^\s)<>"'　]+)/);
    if (/^[•\-*]/.test(t) && um){
      var url = um[1];
      var body = t.replace(/^[•\-*]+\s*/,"")
        .replace(/[\(（]\s*(?:출처|링크)\s*:?\s*https?:\/\/[^\s)）]+\s*[\)）]?/g,"")
        .replace(/https?:\/\/[^\s)<>"'　]+/g,"")
        .replace(/[\(（]\s*[\)）]/g,"").trim();
      var title = body, desc = "";
      var dash = body.indexOf(" — "); if (dash < 0) dash = body.indexOf(" - ");
      if (dash > -1){ title = body.slice(0,dash).trim(); desc = body.slice(dash+3).trim(); }
      var ym = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{6,20})/);
      var hh = url.match(/^https?:\/\/([^\/]+)/); var hst = hh ? hh[1].replace(/^www\./,"") : "";
      var img, cls, go;
      if (ym){ img = "https://i.ytimg.com/vi/"+ym[1]+"/mqdefault.jpg"; cls = "yt"; go = "youtube.com · 영상 보기"; }
      else if (photo){ img = photo; cls = "news photo"; go = hst+" · 기사 보기 ↗"; }
      else { img = "https://www.google.com/s2/favicons?domain="+hst+"&sz=128"; cls = "news"; go = hst+" · 기사 보기 ↗"; }
      /* 사진 → 파비콘 → 우리 마크 순으로 떨어진다.
         원문 이미지를 최대한 쓰되, 없으면 지구본 대신 우리 것을 세운다 (대표 지시 2026-08-13) */
      var mk = " onerror=\"icMark(this,'"+esc(hst)+"')\" onload=\"icCheck(this,'"+esc(hst)+"')\"";
      var onerr = photo
        ? " onerror=\"this.onerror=null;this.src='https://www.google.com/s2/favicons?domain="+esc(hst)+"&sz=128';"+
          "this.closest('.item-card').classList.remove('photo');"+
          "this.onerror=function(){icMark(this,'"+esc(hst)+"')};this.onload=function(){icCheck(this,'"+esc(hst)+"')}\""
        : mk;
      cardBuf.push("<a class='item-card "+cls+"' href='"+esc(url)+"' target='_blank' rel='noopener noreferrer'>"+
        "<img src='"+esc(ctSafeUrl(img))+"' alt='' loading='lazy'"+onerr+">"+
        "<span class='ic-body'><span class='ic-title'>"+esc(title)+"</span>"+
        (desc ? "<span class='ic-desc'>"+esc(desc)+"</span>" : "")+
        "<span class='ic-url'>"+esc(go)+"</span></span></a>");
    } else {
      if (t === "" && cardBuf.length){ continue; } /* 카드 사이 빈 줄로 그리드가 끊기지 않게 */
      flushCards();
      /* "# 제목", "## [생성형 AI]" 같은 헤더 줄을 라벨로 조판한다. 원문 문자열은
         건드리지 않고 보이는 형태만 바꾼다 — 그냥 두면 #이 그대로 찍힌다. */
      var hm = t.match(/^(#{1,6})\s+(.+)$/);
      if (hm){
        out.push("<span class='sec-label"+(hm[1].length===1?" meta":"")+"'>"+
          esc(hm[2].replace(/^\[/,"").replace(/\]$/,""))+"</span>");
      } else {
        out.push(linkify(lines[i]));
      }
    }
  }
  flushCards();
  return out.join("\n");
}

/* Asia/Seoul 현재 시각 */
function seoulNow(){
  var s = new Date().toLocaleString("en-US",{timeZone:"Asia/Seoul"});
  return new Date(s);
}
function parseDate(s){ if(!s) return null; var p=String(s).slice(0,10).split("-"); if(p.length<3) return null;
  return new Date(+p[0], +p[1]-1, +p[2]); }
/* 수집물의 date 는 RSS 원문 그대로라 UTC 다. 앞 10자만 자르면 9시간이 밀려
   오늘 아침 7시 기사가 어제 날짜로 찍힌다 (2026-08-13 실측: 07:26 KST → "2026-08-12").
   회사 규칙이 "날짜는 절대 표기"이므로 보이는 날짜는 KST 로 맞춘다.
   날짜만 있고 시각이 없는 값(2026-08-12)은 변환하지 않고 그대로 쓴다 — 이미 날짜다. */
function ymdKST(s){
  var v = String(s||"");
  if (!v) return "";
  if (v.length <= 10) return v.slice(0,10);
  var d = new Date(v);
  if (isNaN(d)) return v.slice(0,10);
  try {
    return d.toLocaleDateString("sv-SE", { timeZone:"Asia/Seoul" });  /* sv-SE → YYYY-MM-DD */
  } catch(e){ return v.slice(0,10); }
}
function ddayInfo(due, today){
  var dd = parseDate(due), cls="far", txt="—";
  if (dd){ var diff = Math.round((dd-today)/86400000);
    txt = diff===0?"D-DAY": diff>0?("D-"+diff):("D+"+(-diff));
    cls = diff<0?"over": diff<=3?"soon": diff<=7?"mid":"far"; }
  return { cls:cls, txt:txt };
}
function findById(list, id){ for(var i=0;i<(list||[]).length;i++){ if(String(list[i].id)===String(id)) return list[i]; } return null; }
function bindFold(root){
  root.querySelectorAll("[data-fold]").forEach(function(h){
    h.onclick = function(){
      var sec = h.closest("[data-foldsec]");
      sec.classList.toggle("collapsed");
      h.setAttribute("aria-expanded", String(!sec.classList.contains("collapsed")));
    };
  });
}
function ctSafeUrl(u){ try { var p = new URL(String(u||"")); return (p.protocol === "http:" || p.protocol === "https:") ? p.href : ""; } catch(e){ return ""; } }
/* 원문 아이콘이 없을 때 <img> 를 우리 마크로 바꾼다.
   도메인의 알파벳·숫자 앞 두 글자를 쓴다 — k-startup.go.kr → KS, arxiv.org → AR.
   window 에 붙이는 이유: onerror 는 인라인 속성이라 IIFE 안의 이름을 못 본다.

   ⚠️ onerror 만으로는 못 잡는다. 구글 파비콘 서비스는 아이콘이 없는 도메인에
   curl 에는 404 를 주지만 브라우저에는 **16×16 기본 지구본을 200 으로** 내려준다
   (2026-08-13 실측, k-startup.go.kr). 정상 파비콘은 sz=128 요청에 64px 이상으로 온다.
   그래서 로드 성공 뒤에도 크기를 보고 판정한다. */
window.icMark = function(img, host){
  if (!img || !img.parentNode) return;
  img.onerror = null;
  var s = String(host||"").replace(/^www\./,"").replace(/[^a-z0-9]/gi,"").toUpperCase();
  var span = document.createElement("span");
  span.className = "ic-mark";
  span.setAttribute("aria-hidden","true");
  span.textContent = s.slice(0,2) || "AI";
  img.parentNode.replaceChild(span, img);
};
/* 로드가 "성공"해도 기본 지구본이면 우리 마크로 바꾼다 */
window.icCheck = function(img, host){
  if (!img) return;
  if (img.naturalWidth && img.naturalWidth <= 24) window.icMark(img, host);
};
function todaySeoul(){ var n = seoulNow(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
/* ---- 수집물 공용 포맷 ----
   뉴스·커뮤니티·기술동향은 마감이 없어 D-day 를 쓸 수 없다. 대신 왼쪽 큰 칸에
   "얼마나 최근인가"를 넣는다 — 피드에서 실제로 궁금한 건 그것이다.
   세 섹션이 같은 의미의 칸을 쓰도록 통일했다. 칸마다 뜻이 다르면 읽을 때마다 다시 배워야 한다. */
function agoText(iso){
  var t = Date.parse(iso||"");
  if (isNaN(t)) return "—";
  var m = Math.round((Date.now()-t)/60000);
  if (m < 1) return "방금";
  if (m < 60) return m+"분 전";
  var h = Math.round(m/60);
  if (h < 24) return h+"시간 전";
  var d = Math.round(h/24);
  return d < 30 ? d+"일 전" : Math.round(d/30)+"개월 전";
}
function nfmt(n){
  n = Number(n);
  if (!isFinite(n)) return "";
  return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}
/* 큰 수를 한 칸에 넣기 위한 축약. 385950 → 386K, 12345678 → 1,235만 */
function kfmt(n){
  n = Number(n);
  if (!isFinite(n) || n < 0) return "";
  if (n >= 100000000) return (n/100000000).toFixed(1).replace(/\.0$/,"")+"억";
  if (n >= 10000) return nfmt(n/10000)+"만";
  if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,"")+"K";
  return String(n);
}
/* "$1,000,000" → "$1M" (왼쪽 큰 칸에 넣을 상금 축약. 원본은 meta 에 그대로 남긴다) */
function prizeShort(s){
  var n = Number(String(s||"").replace(/[^\d]/g,""));
  if (!n) return "";
  if (n >= 1000000) return "$"+(n/1000000).toFixed(n%1000000?1:0).replace(/\.0$/,"")+"M";
  if (n >= 1000) return "$"+Math.round(n/1000)+"K";
  return "$"+n;
}
/* 수집 시각은 UTC 로 찍히고 대표는 KST 로 본다. 로케일 문자열을 정규식으로 주무르면
   브라우저마다 다른 모양이 나오므로 조각(formatToParts)으로 직접 조립한다.
   KST 라고 명시한다 — 어느 시간대인지 모르면 "언제 수집했나"가 답이 안 된다. */
function fmtGen(iso){
  var d = new Date(iso||"");
  if (isNaN(d)) return String(iso||"");
  var g = {};
  new Intl.DateTimeFormat("en-CA",{ timeZone:"Asia/Seoul", year:"numeric", month:"2-digit",
    day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false })
    .formatToParts(d).forEach(function(p){ g[p.type] = p.value; });
  return g.year+"-"+g.month+"-"+g.day+" "+g.hour+":"+g.minute+" KST";
}

/* 마감이 오늘부터 N일 이내인 건수 — 히어로 숫자에 쓴다 */
function dueWithin(list, key, days, today){
  var n = 0;
  (list||[]).forEach(function(it){
    var d = parseDate(it[key]); if (!d) return;
    var diff = Math.round((d-today)/86400000);
    if (diff >= 0 && diff <= days) n++;
  });
  return n;
}

   이모지 아이콘을 뺐다. 이 시스템은 타이포와 숫자로만 말한다.

   내비 라벨은 한글이다 (대표 지시 2026-08-12). 영문 대문자가 에디토리얼 문법에
   맞긴 하지만, 한국어 서비스에서 CONTESTS·FUNDING 을 매번 해석하게 만드는 건
   멋을 위해 사용성을 깎는 것이다. 영문 대문자 대비는 히어로의 거대 라틴 제목과
   eyebrow 가 이미 충분히 만들고 있다. (세 번째 값은 그 히어로 제목에 계속 쓴다)

   순서는 뉴스리포트가 먼저다 — 매일 아침 갱신되는 유일한 메뉴라 가장 자주 본다.
   첫 화면(DEFAULT_ROUTE)과 첫 메뉴가 어긋나면 "왜 두 번째가 열리지"가 된다.

   라벨은 대표 지시(2026-08-12)로 AI 접두를 붙였다. 띄어쓰기 없이 "AI공모전" 인 것도
   지시 그대로다 — 폭이 줄어 375px 에 다섯 개를 넣기가 오히려 수월하다.
   문서 제목에는 히어로의 전체 이름(HERO[route].ko)을 쓴다.

   여섯 번째로 "AI작품소개"가 붙었다 (대표 지시 2026-08-12). AI유튜브정보 바로 옆이다 —
   둘 다 영상이라 붙어 있어야 비교가 된다. 다만 다섯 개도 375px 에 빠듯했으므로
   모바일 내비는 두 줄로 접힌다(아래 @media 760px). 가로 스크롤은 쓰지 않는다.
   여섯 번째 메뉴가 있는 줄 모르는 사람이 생기면 안 붙인 것과 같다. */
var MENU = [
  ["newsrep","뉴스리포트","BRIEFING"],
  ["contests","AI공모전","CONTESTS"],
  ["festivals","AI영화제","FESTIVALS"],
  ["gov","AI지원사업","FUNDING"],
  ["youtube","AI유튜브정보","WATCH"],
  ["aivideo","AI작품소개","SHOWCASE"]
];
var TITLES = {};
MENU.forEach(function(it){ TITLES[it[0]] = it[1]; });
var DEFAULT_ROUTE = "newsrep";

/* ============ 구조 판단 ============
   메뉴별 해시 라우팅이고, 한 번에 한 화면만 그린다. 한 페이지 스크롤로 합치지
   않은 이유는 지원사업 263 + 영화제 89 + 공모전 71 = 400행이 넘어서다.
   에디토리얼 스크롤 서사는 "빨리 찾아야 하는 정보"에서는 스크롤 감옥이 된다.
   대신 다섯 화면 각각이 히어로 → 페이퍼 → 다크 → 페이퍼 리듬을 그대로 갖는다.
   데이터는 메모리에 캐시되므로 메뉴 이동은 네트워크 없이 즉시 끝난다. */
function curRoute(){ var h = location.hash.replace(/^#/,"").split("/")[0]; return TITLES[h] ? h : DEFAULT_ROUTE; }

function buildNav(){
  var cur = curRoute();
  document.getElementById("navLinks").innerHTML = MENU.map(function(it){
    /* it[1] = 한글 라벨. it[2](영문)는 히어로 제목 전용이다 */
    return "<a class='"+(it[0]===cur?"on":"")+"' href='#"+it[0]+"'"+
      (it[0]===cur?" aria-current='page'":"")+">"+esc(it[1])+"</a>";
  }).join("");
}

/* 목록 한 줄 — 다섯 화면이 전부 이 단위를 쓴다 */
function row(o){
  var dd = "<div class='dd tnum "+esc(o.ddCls)+"'>"+esc(o.dd)+"</div>";
  var tags = (o.tags||[]).filter(Boolean).map(function(t){
    return "<span class='tag'>"+esc(t)+"</span>"; }).join("");
  var inner = dd + "<div class='r-main'>"+
    "<div class='r-title'>"+esc(o.title)+tags+"</div>"+
    /* titleEn 은 번역문을 제목 자리에 올렸을 때만 채워진다 (수집기의 titleKo).
       원문을 지우지 않는 이유는 CSS 주석(.r-title-en)에 적어 뒀다. */
    (o.titleEn ? "<div class='r-title-en'>"+esc(o.titleEn)+"</div>" : "")+
    (o.meta && o.meta.length ? "<div class='r-meta'>"+o.meta.filter(Boolean).join("<i>·</i>")+"</div>" : "")+
    (o.sum ? "<div class='r-sum'>"+esc(o.sum)+"</div>" : "")+"</div>";
  var url = ctSafeUrl(o.url);
  if (url) return "<a class='row' href='"+esc(url)+"' target='_blank' rel='noopener noreferrer'>"+inner+"</a>";
  return "<div class='row'>"+inner+"</div>";
}

function bindRetry(root){
  var b = root.querySelector("[data-retry]");
  if (!b) return;
  b.onclick = function(){
    state.loading = true; state.error = null; render();
    loadData().catch(function(e){ state.loading=false; state.error=e.message||String(e); }).then(render);
  };
}

/* ============ 데이터 (공개 목록 API — 읽기 전용) ============
   목록은 두 곳에서 온다. 순서가 곧 첫 로딩 속도다.
   (1) data/pub.json — 우리 저장소 스냅샷. 같은 출처라 0.05~0.27초에 온다. 이걸로 먼저 그린다
   (2) ?action=pub — 살아있는 값. 2026-08-12 실측 6.0~68.5초, 세 번에 한 번은 404 였다.
       늦게 와서 스냅샷과 내용이 다를 때만 조용히 다시 그린다. 같으면 그리지 않는다 —
       멀쩡한 화면을 다시 세우면 그게 깜빡임이다
   라이브가 끝내 실패해도 스냅샷이 있으면 화면은 정상이다. 그때 stamp() 가 보여주는 시각은
   스냅샷 안에 든 서버 생성 시각이다 — 없는 신선도를 지어내지 않는다. */
var PUB_SNAPSHOT = "data/pub.json";

function validPub(j){ return !!(j && (j.reports || j.festivals)); }
/* 다시 그릴지 판단하는 최소 지문 — 리포트 수 · 최신 발행일 · 영화제 수.
   generated 는 넣지 않는다. 매번 달라져 내용이 같아도 다시 그리게 된다 */
function pubSig(j){
  var rs = (j && j.reports) || [], last = "";
  for (var i=0;i<rs.length;i++){ var d = String(rs[i].report_date||""); if (d > last) last = d; }
  return rs.length + "/" + last + "/" + (((j && j.festivals) || []).length);
}
function applyPub(j){
  state.data = j; state.loading = false; state.error = null;
  stamp();
}
function loadPubSnapshot(){
  return fetch(PUB_SNAPSHOT, { cache:"no-store" })
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(j){
      if (!validPub(j)) throw new Error("스냅샷 형식이 올바르지 않습니다");
      if (state.pubLive) return null;   /* 라이브가 먼저 왔으면 스냅샷은 버린다 */
      applyPub(j);
      return j;
    });
}
function loadData(){
  return fetch(API + "?action=pub&t=" + Date.now(), { cache:"no-store" })
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(j){
      if (!validPub(j)) throw new Error("응답 형식이 올바르지 않습니다");
      state.pubChanged = !state.data || pubSig(state.data) !== pubSig(j);
      state.pubLive = true;
      applyPub(j);
      return j;
    });
}
function stamp(){
  var el = document.getElementById("footStamp");
  if (el && state.data && state.data.generated) el.textContent = "목록 갱신 " + state.data.generated + " (KST)";
}

/* ============ 뉴스리포트 — 바깥 소스 섹션 ============
   관리시스템 브리핑(위쪽)은 하루 한 번 사람이 읽을 수 있게 정리된 것이고,
   아래 세 섹션은 원문 피드를 그대로 세운 것이다. 성격이 달라 섞지 않는다.
   전부 우리 저장소의 JSON 을 읽는다 — 원본 소스는 CORS 를 열어 주지 않는다. */
function newsSection(){
  return loadFeed("news").then(function(j){
    var items = (j && j.items) || [];
    if (!items.length) return "";
    var rows = items.map(function(it){
      var meta = [];
      if (it.source && it.source !== it.feed) meta.push("<b>"+esc(it.source)+"</b>");
      if (it.date) meta.push(esc(ymdKST(it.date)));
      return row({ dd:agoText(it.date), ddCls:"tbd",
                   title:it.titleKo || it.title, titleEn:it.titleKo ? it.title : "",
                   tags:[it.feed], meta:meta, sum:it.summary, url:it.url });
    }).join("");
    return "<section class='section paper-alt'><div class='inner'>"+
      sectionHead("Newswire","오늘의<br>AI 뉴스.",
        "국내외 AI 뉴스를 최신순으로 모았습니다. "+esc(fmtGen(j.generated))+" 기준.",
        "<b>"+items.length+"</b>건")+
      "<div class='rows'>"+rows+"</div></div></section>";
  }).catch(function(){ return ""; });
}
function communitySection(){
  return loadFeed("community").then(function(j){
    var items = (j && j.items) || [];
    if (!items.length) return "";
    var rows = items.map(function(it){
      var meta = [];
      if (it.points != null) meta.push("<b>"+nfmt(it.points)+"점</b>");
      if (it.comments != null) meta.push("댓글 "+nfmt(it.comments));
      if (it.date) meta.push(esc(ymdKST(it.date)));
      return row({ dd:agoText(it.date), ddCls:"tbd",
                   title:it.titleKo || it.title, titleEn:it.titleKo ? it.title : "",
                   tags:[it.source], meta:meta, sum:it.summary, url:it.url });
    }).join("");
    return "<section class='section dark'><div class='inner'>"+
      sectionHead("Community","커뮤니티에서<br>도는 이야기.",
        "기사가 되기 전에 개발자들 사이에서 먼저 도는 이야기입니다. "+esc(fmtGen(j.generated))+" 기준.",
        "<b>"+items.length+"</b>건")+
      "<div class='rows'>"+rows+"</div></div></section>";
  }).catch(function(){ return ""; });
}
/* 기술 동향은 매일 볼 것이 아니라 필요할 때 여는 자료다 — 접어 둔다.
   메뉴를 새로 만들지 않은 이유이기도 하다(대표가 방금 메뉴를 확정했다). */
function techSection(){
  return loadFeed("tech").then(function(j){
    if (!j) return "";
    var ax = j.arxiv||[], gh = j.github||[], hf = j.huggingface||[];
    var n = ax.length + gh.length + hf.length;
    if (!n) return "";
    function group(label, note, rows){
      return "<p class='count' style='margin:0 0 14px'><b>"+esc(label)+"</b> · "+esc(note)+"</p>"+
             "<div class='rows' style='margin-bottom:38px'>"+rows+"</div>";
    }
    /* 바로 써 볼 수 있는 것을 위에 둔다 — 코드(GitHub) → 모델(Hugging Face) → 논문(arXiv) 순.
       논문은 읽고 이해하는 데 시간이 들어 맨 아래가 맞다. */
    var body = "";
    if (gh.length) body += group("GitHub", gh.length+"곳 · 최근 7일 안에 갱신된 ai 토픽 저장소를 별 많은 순으로",
      gh.map(function(it){
        var meta = [];
        if (it.language) meta.push(esc(it.language));
        if (it.date) meta.push("갱신 "+esc(ymdKST(it.date)));
        return row({ dd:kfmt(it.stars), ddCls:"far", title:it.title,
                     tags:["별 "+nfmt(it.stars)], meta:meta, sum:it.summary, url:it.url });
      }).join(""));
    if (hf.length) body += group("Hugging Face", hf.length+"개 · 트렌딩 모델",
      hf.map(function(it){
        var meta = [];
        if (it.task) meta.push(esc(it.task));
        if (it.downloads != null) meta.push("내려받기 "+nfmt(it.downloads));
        if (it.date) meta.push(esc(ymdKST(it.date)));
        return row({ dd:it.likes != null ? kfmt(it.likes) : "—", ddCls:"far", title:it.title,
                     tags:["좋아요"], meta:meta, url:it.url });
      }).join(""));
    if (ax.length) body += group("arXiv cs.AI", ax.length+"편 · 최근 등록순",
      ax.map(function(it){
        return row({ dd:agoText(it.date), ddCls:"tbd",
                     title:it.titleKo || it.title, titleEn:it.titleKo ? it.title : "",
                     tags:["논문"], meta:[esc(ymdKST(it.date))], sum:it.summary, url:it.url });
      }).join(""));
    body = "<p class='section-intro' style='margin:0 0 30px'>"+
      "새 논문과 모델이 어디로 향하는지 봅니다. "+
      esc(fmtGen(j.generated))+" 기준.</p>" + body;
    return foldSection("paper-alt","Research","기술 동향", n+"건", body);
  }).catch(function(){ return ""; });
}

function fillNewsExtra(){
  var el = C.querySelector("[data-extra]");
  if (!el) return;

    if (curRoute()!=="newsrep") return;   /* 라우트를 떠났으면 버린다 */
    el.innerHTML = parts.join("");
    bindFold(el);
  });
}

/* reportSelId 는 "사람이 지난 브리핑을 눌러서 고른 것"만 담는다.
   자동으로 채우면 스냅샷(어제)으로 먼저 그릴 때 어제 것이 고정되고,
   라이브(오늘)가 와서 다시 그려도 어제 것이 목록에 남아 있어 그대로 머문다.
   2026-08-13 실측 — 지표는 21호인데 본문은 8/12 였다. */
var reportSelId = null;
function sortedReports(){
  return ((state.data && state.data.reports) || []).slice()
    .sort(function(a,b){ return String(b.report_date||"").localeCompare(String(a.report_date||"")); });
}
function renderReports(){
  var all = sortedReports();
  if (!all.length){
    setKicker(["대기 중"]);
    setFacts([["0","발행된 브리핑"],["—","최신 발행일"],["매일 아침","발행 주기"]]);
    C.innerHTML = "<section class='section paper'><div class='inner'>"+
      sectionHead("Briefing","아직 발행된 브리핑이<br>없습니다.",
        "브리핑은 매일 아침 자동으로 올라옵니다. 잠시 뒤 다시 열어 주세요.","")+
      "</div></section><div data-extra></div>";
    fillNewsExtra();
    return;
  }
  /* 고른 것이 목록에서 사라졌으면 선택을 버리고 최신으로 돌아간다.
     남아 있으면 그대로 둔다 — 사람이 지난 브리핑을 보는 중일 수 있다 */
  if (reportSelId && !findById(all, reportSelId)) reportSelId = null;
  var latest = String(all[0].report_date||"").slice(0,10);
  setKicker(["매일 아침 발행", latest + " 발행", all.length + "호"]);

  C.innerHTML =
    "<section class='section paper' id='brief'><div class='inner'>"+
      "<div class='section-head'><div><p class='eyebrow'>Today</p>"+
      "<h2>오늘 아침의<br>AI 브리핑.</h2></div>"+
      "<p class='section-intro'>밤사이 나온 AI 소식을 매일 아침 한 장으로 정리합니다.</p></div>"+
      "<div data-brief></div>"+
    "</div></section>"+
    /* 바깥 소스 세 섹션은 브리핑 바로 아래에 온다. 보관함(지난 브리핑)은 다시 찾아볼 때
       쓰는 자리라 맨 끝으로 내렸다 — 매일 새로 오는 것이 위, 쌓아 두는 것이 아래다. */
    "<div data-extra></div>"+
    "<section class='section dark'><div class='inner'>"+
      sectionHead("Archive","지난 브리핑","날짜를 누르면 맨 위 본문이 그 날짜로 바뀝니다.",
        "<b>"+all.length+"</b>호 보관")+
      "<div class='arch' data-arch></div>"+
    "</div></section>";
  fillNewsExtra();

  var briefEl = C.querySelector("[data-brief]");
  var archEl = C.querySelector("[data-arch]");

  function drawBrief(){
    var r = findById(all, reportSelId) || all[0];
    var body = richReport(stripYtSection(r.content||""));
    var items = (String(r.content||"").match(/^[•\-*]\s/gm)||[]).length;
    setFacts([
      [String(all.length), "발행된 브리핑"],
      [String(r.report_date||"").slice(5,10).replace("-","/"), "이 브리핑 발행일"],
      [String(items), "이 회차 항목 수"]
    ]);
    briefEl.innerHTML =
      "<div class='brief-head'><h3>"+esc(r.title||"(제목 없음)")+"</h3>"+
      "<div class='brief-date tnum'>"+esc(String(r.report_date||"").slice(0,10))+"</div></div>"+
      "<div class='brief-body'>"+body+"</div>";
  }
  function drawArch(){
    archEl.innerHTML = all.map(function(r){
      var on = String(r.id)===String(reportSelId) ? " class='on'" : "";
      return "<button type='button'"+on+" data-pick='"+esc(r.id)+"'>"+
        "<span class='a-date tnum'>"+esc(String(r.report_date||"").slice(0,10))+"</span>"+
        "<span class='a-title'>"+esc(r.title||"(제목 없음)")+"</span></button>";
    }).join("");
    archEl.querySelectorAll("[data-pick]").forEach(function(b){
      b.onclick = function(){
        reportSelId = b.getAttribute("data-pick");
        drawBrief(); drawArch();
        document.getElementById("brief").scrollIntoView({ behavior:"smooth", block:"start" });
      };
    });
  }
  drawBrief(); drawArch();
}

/* ============ 브리핑 본문의 [유튜브 최신 영상] 섹션 ============
   뉴스리포트 본문에서는 빼고(stripYtSection), AI 유튜브 화면에서 날짜별로 모아 보여준다(ytSectionOf). */
var YT_MARK = "[유튜브 최신 영상]";
function ytSectionOf(content){
  var c = String(content||"");
  var i = c.indexOf(YT_MARK);
  if (i < 0) return "";
  var rest = c.slice(i + YT_MARK.length);
  var nx = rest.search(/\n\[[^\[\]\n]+\]/);   /* 다음 섹션 헤더 직전까지 */
  return (nx > -1 ? rest.slice(0, nx) : rest).trim();
}
function stripYtSection(content){
  var c = String(content||"");
  var i = c.indexOf(YT_MARK);
  if (i < 0) return c;
  var rest = c.slice(i + YT_MARK.length);
  var nx = rest.search(/\n\[[^\[\]\n]+\]/);
  return (c.slice(0, i) + (nx > -1 ? rest.slice(nx) : "")).replace(/\n{3,}/g, "\n\n").trim();
}
/* ============ AI 유튜브 (수집 2섹션 + 브리핑 아카이브 1섹션) ============
   자료가 두 갈래다.
   (1) 유튜브 수집 — AI 작품소개와 같은 엔드포인트(action=aivideos)를 쓰고 aivideoCache 를
       공유한다. 저쪽은 AI로 만든 영상 작품, 이쪽은 뉴스와 바이브코딩이다.
   (2) 아침 브리핑이 그날 고른 영상 — 브리핑 본문의 [유튜브 최신 영상] 섹션을 날짜별로 쌓아 둔다.
   한쪽이 없어도 다른 쪽은 그린다. 둘 다 없을 때만 안내 문구를 낸다. */
function renderYoutube(){
  setKicker(["유튜브 검색", "뉴스·바이브코딩"]);
  setFacts([["—","AI 뉴스"],["—","바이브코딩"],["—","브리핑 수집"]]);
  C.innerHTML = "<section class='section paper'><div class='inner'>"+
    emptyNote("영상을 불러오는 중입니다.")+"</div></section>";

  /* 수집이 실패해도 아카이브는 그려야 하므로 실패를 null 로 받아 넘긴다 */
  fetchAiVideos().catch(function(){ return null; }).then(function(j){
    if (curRoute()!=="youtube") return;
    var news = (j && j.news) || [], vibe = (j && j.vibe) || [];
    var briefs = sortedReports()
      .filter(function(r){ return !!ytSectionOf(r.content); })
      .slice(0, 30);
    var counts = briefs.map(function(r){ return (ytSectionOf(r.content).match(/^•/gm)||[]).length; });
    var total = counts.reduce(function(a,b){ return a+b; }, 0);

    if (!news.length && !vibe.length && !briefs.length){
      setKicker(["대기 중"]);
      setFacts([["—","AI 뉴스"],["—","바이브코딩"],["0","브리핑 수집"]]);
      C.innerHTML = "<section class='section paper'><div class='inner'>"+
        sectionHead("Watch","아직 모인 영상이<br>없습니다.",
          "아직 모인 영상이 없습니다. 내일 아침에 다시 확인해 주세요.","")+
        "</div></section>";
      return;
    }

    var kick = [];
    if (j) kick.push("유튜브 검색", "뉴스·바이브코딩");
    if (briefs.length) kick.push("브리핑 " + briefs.length + "일치");
    kick.push((news.length + vibe.length + total) + "편");
    setKicker(kick);
    setFacts([
      [j ? String(news.length) : "—", "AI 뉴스"],
      [j ? String(vibe.length) : "—", "바이브코딩"],
      [String(total), "브리핑 수집"]
    ]);

    /* 배경은 섹션이 나올 때마다 paper·dark 를 번갈아 쓴다 — 이 사이트의 기존 규칙 */
    var alt = 0;
    function bg(){ return (alt++ % 2) ? "dark" : "paper"; }

    var html = "";
    if (j){
      html += videoSection(bg(),"News","AI 소식을<br>영상으로.", news, (j.queries||{}).news, j.generated)+
              videoSection(bg(),"Vibe Coding","바이브코딩<br>지금 뭐가 되나.", vibe, (j.queries||{}).vibe, j.generated);
    }
    if (briefs.length){
      var top = briefs[0];
      html += "<section class='section "+bg()+"'><div class='inner'>"+
        sectionHead("Briefing","아침 브리핑이<br>고른 영상.",
          "브리핑이 그날 고른 영상입니다. 썸네일을 누르면 유튜브로 갑니다.",
          "<b>"+counts[0]+"</b>편 · "+esc(String(top.report_date||"").slice(0,10)))+
        "<div class='brief-body'>"+richReport(ytSectionOf(top.content))+"</div>"+
        "</div></section>";
      if (briefs.length > 1){
        var body = briefs.slice(1).map(function(r,i){
          return "<div style='margin-bottom:34px'>"+
            "<p class='count' style='margin:0 0 12px'><b>"+esc(String(r.report_date||"").slice(0,10))+"</b> · "+counts[i+1]+"편</p>"+
            "<div class='brief-body'>"+richReport(ytSectionOf(r.content))+"</div></div>";
        }).join("");
        html += foldSection(bg(),"Archive","지난 날짜", (briefs.length-1)+"일치", body);
      }
    }
    C.innerHTML = html;
    bindFold(C);
    observeReveal();
  });
}

/* ============ AI 공모전 (외부 공개 JSON 직접 조회) ============ */
var CONTEST_URLS = {
  domestic: "https://junyeo217.github.io/ai-contest-board/data/contests.json",
  overseas: "https://junyeo217.github.io/ai-contest-board/data/overseas-contests.json"
};
/* junyeo217 은 남의 저장소다. 사라지거나 죽으면 위 주소가 통째로 실패한다 —
   그때 우리 저장소가 매일 아침 떠 둔 미러로 폴백한다(scripts/collect-feeds.mjs collectContests).
   같은 JSON 을 가공 없이 저장하므로 아래 파싱 코드가 그대로 읽는다. */
var CONTEST_SNAP = {
  domestic: "data/contests.json",
  overseas: "data/overseas-contests.json"
};
var CONTEST_BOARD = "https://junyeo217.github.io/ai-contest-board/";
var CONTEST_TTL = 10*60*1000; /* 10분 모듈 캐시 (두 파일 각각) */
var contestCache = {};
var CONTEST_SECS = ["starting_today","ongoing","awaiting_results"];
/* 탭에 "전체"를 넣었다 (대표 지시 2026-08-12). 칩 줄이 이미 "전체"로 시작하니 맨 앞이 맞다.
   기본은 국내로 둔다 — 건수는 국내 37 / 해외 34 로 비슷하지만, 한국 회사가 바로 낼 수 있는
   쪽은 국내다. 전체는 한 번 눌러 보는 자리지 매번 여는 자리가 아니다. */
var CONTEST_TABS = [["all","전체"],["domestic","국내"],["overseas","해외"]];
var contestTab = "domestic", contestCat = "전체", contestSearch = "";
/* 전체 탭은 두 파일을 합친다. 각 파일 캐시를 그대로 쓰므로 탭을 오가도 새 요청이 없다. */
function mergeContests(a, b){
  var out = { generated_at:a.generated_at, generated_pair:[a.generated_at, b.generated_at], sections:{} };
  CONTEST_SECS.forEach(function(k){
    out.sections[k] = (((a.sections||{})[k])||[]).concat(((b.sections||{})[k])||[]);
  });
  return out;
}
function fetchContests(kind, force){
  if (kind === "all"){
    return Promise.all([fetchContests("domestic",force), fetchContests("overseas",force)])
      .then(function(r){ return mergeContests(r[0], r[1]); });
  }
  var c = contestCache[kind];
  if (!force && c && (Date.now()-c.t) < CONTEST_TTL) return Promise.resolve(c.data);
  /* 국내 파일에는 country 가 없다(전부 null). 합쳤을 때 어느 쪽인지 알 수 있게
     어느 파일에서 왔는지를 여기서 새겨 둔다 — 나중에 추측할 수 없는 정보다. */
  function useContest(j){
    var reg = kind === "domestic" ? "국내" : "해외";
    CONTEST_SECS.forEach(function(k){
      (((j.sections||{})[k])||[]).forEach(function(it){ it._region = reg; });
    });
    contestCache[kind] = { t:Date.now(), data:j };
    return j;
  }
  function grab(url){
    return fetch(url, { cache:"no-store" }).then(function(r){
      if (!r.ok) throw new Error("HTTP "+r.status);
      return r.json();
    });
  }
  /* 우리 스냅샷(자체 수집)을 먼저 읽는다. sections 가 있어야 쓸 수 있는 값으로 본다 —
     형식이 깨졌거나(스냅샷에 sections 없음) 못 읽으면 junyeo217 라이브로 폴백한다. */
  function validSnap(j){ return j && j.sections && typeof j.sections === "object"; }
  return grab(CONTEST_SNAP[kind]).then(function(j){
    if (!validSnap(j)) throw new Error("스냅샷에 sections 가 없다");
    return useContest(j);
  }).catch(function(){
    return grab(CONTEST_URLS[kind]).then(useContest);
  });
}
function ctFmtGen(g){ if(!g) return ""; return String(g).replace("T"," ").replace(/(:\d\d)(\.\d+)?(Z|[+-]\d\d:?\d\d)?$/,"$1").slice(0,16); }

/* ---- Devpost 해커톤·공모전 ----
   "Jun 17 - Sep 01, 2026" / "Aug 08 - 12, 2026" 두 형태가 온다.
   뒤쪽에 달이 없으면 앞쪽 달을 쓴다. 연도는 문자열 끝에 한 번만 붙는다. */
var DP_MON = { Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12 };
function dpEnd(s){
  s = String(s||"");
  var year = (s.match(/(\d{4})\s*$/)||[])[1];
  var parts = s.split(/\s+[–—-]\s+/);
  if (!year || parts.length < 2) return "";
  var em = parts[1].match(/([A-Z][a-z]{2})\s+(\d{1,2})/);
  var mon = em ? DP_MON[em[1]] : DP_MON[(parts[0].match(/([A-Z][a-z]{2})/)||[])[1]];
  var day = em ? em[2] : (parts[1].match(/(\d{1,2})/)||[])[1];
  if (!mon || !day) return "";
  return year+"-"+("0"+mon).slice(-2)+"-"+("0"+day).slice(-2);
}
function dpRow(it, today){
  var end = dpEnd(it.dates);
  var di = end ? ddayInfo(end, today) : { cls:"tbd", txt:"미정" };
  var meta = [];
  var money = Number(String(it.prize||"").replace(/[^\d]/g,""));
  if (money) meta.push("<b>상금 "+esc(it.prize)+"</b>");
  if (it.dates) meta.push(esc(it.dates));
  if (it.location) meta.push(esc(it.location));
  if (it.registrations) meta.push(nfmt(it.registrations)+"명 등록");
  return row({ dd:di.txt, ddCls:di.cls, title:it.title||"(제목 없음)",
               tags:(it.themes||[]).slice(0,2), meta:meta, url:it.url });
}

    var chips = ["전체"].concat(curData ? collectCats(curData) : []);

    catsEl.innerHTML = chips.map(function(c){
      return "<button type='button' class='chip"+(c===contestCat?" on":"")+"' data-cat='"+esc(c)+"' aria-pressed='"+(c===contestCat)+"'>"+esc(c)+"</button>";
    }).join("");
    catsEl.querySelectorAll("[data-cat]").forEach(function(b){
      b.onclick = function(){ contestCat = b.getAttribute("data-cat"); drawCats(); drawBody(); };
    });
  }
  function match(it){
    if (contestCat!=="전체" && String(it.category||"")!==contestCat) return false;
    var q = String(contestSearch||"").trim().toLowerCase();
    if (!q) return true;
    return String(it.title||"").toLowerCase().indexOf(q)>=0 ||
           String(it.organizer||"").toLowerCase().indexOf(q)>=0;
  }
  function contestRow(it){
    var di = ddayInfo(it.submission_end, today);
    var meta = [];
    if (it.organizer) meta.push("<b>"+esc(it.organizer)+"</b>");
    var sd = String(it.submission_start||"").slice(0,10), ed = String(it.submission_end||"").slice(0,10);
    if (sd || ed) meta.push("접수 "+esc(sd||"미정")+" ~ "+esc(ed||"미정"));
    var rd = String(it.result_date||"").trim();
    if (rd && rd!=="미정") meta.push("발표 "+esc(rd.slice(0,10)));
    /* 전체 탭에서는 국내인지 해외인지가 가장 먼저 알고 싶은 것이라 그걸 태그로 세운다.
       국내·해외 탭에서는 이미 아는 사실이므로 원래대로 나라 이름을 보여준다. */
    return row({ dd:di.txt, ddCls:di.cls, title:it.title||"(제목 없음)",
                 tags:[it.category, contestTab==="all" ? it._region : it.country],
                 meta:meta, sum:it.summary, url:it.url });
  }
  function drawBody(){
    if (!curData) return;
    var sec = curData.sections || {};
    var ongoing = ((sec.ongoing||[]).concat(sec.starting_today||[])).filter(match)
      .sort(function(a,b){ return String(a.submission_end||"9999").localeCompare(String(b.submission_end||"9999")); });
    var awaiting = (sec.awaiting_results||[]).filter(match);

    /* 숫자가 어느 범위인지 라벨에 박는다. "진행 중 37"만 있으면 국내인지 전체인지 모른다. */
    var scope = contestTab==="all" ? "전체" : contestTab==="domestic" ? "국내" : "해외";
    setFacts([
      [String(ongoing.length), scope+" 진행 중"],
      [String(dueWithin(ongoing,"submission_end",7,today)), "7일 안에 마감"],
      [String(awaiting.length), "발표 대기"]
    ]);

    bodyEl.innerHTML = "<div class='rows'>"+
      (ongoing.length ? ongoing.map(contestRow).join("")
                      : emptyNote("조건에 맞는 진행 중 공모전이 없습니다."))+"</div>";

    /* 다크였다가 페이퍼로 바꿨다. 이 화면에 힉스필드(다크)·Devpost(페이퍼)·
       Devpost 예정(다크) 세 섹션이 앞에 붙으면서 다크가 두 번 연달아 왔다 —
       다크↔페이퍼 교차가 이 디자인의 리듬이라 마지막 칸을 페이퍼로 넘긴다. */
    awaitEl.innerHTML = foldSection("paper-alt","Awaiting","결과 발표를 기다리는 중", awaiting.length+"건",
      "<div class='rows'>"+
      (awaiting.length ? awaiting.map(function(it){
          var rd = String(it.result_date||"").trim();
          return row({ dd:"발표", ddCls:"tbd", title:it.title||"(제목 없음)",
                       tags:[it.category, it.country],
                       meta:[ it.organizer?"<b>"+esc(it.organizer)+"</b>":"",
                              "발표 "+esc(rd && rd!=="미정" ? rd.slice(0,10) : "미정") ],
                       url:it.url });
        }).join("") : emptyNote("발표를 기다리는 공모전이 없습니다."))+
      "</div>");
    bindFold(awaitEl);
  }
  function showFail(){
    curData = null;
    genEl.textContent = "불러오기 실패";
    catsEl.innerHTML = "";
    awaitEl.innerHTML = "";
    bodyEl.innerHTML = failBox("공모전 보드에 연결하지 못했습니다.",
      "<a class='btn' href='"+esc(CONTEST_BOARD)+"' target='_blank' rel='noopener noreferrer'>원본 보드 열기 ↗</a>");
  }
  function load(force){
    bodyEl.innerHTML = emptyNote("공모전 보드를 불러오는 중입니다.");
    genEl.textContent = "불러오는 중";
    fetchContests(contestTab, force).then(function(j){
      if (curRoute()!=="contests") return;   /* 라우트 이탈 시 무시 */
      curData = j;
      /* 전체 탭은 두 파일을 합친 것이라 갱신 시각도 둘이다. 하나만 적으면 나머지 절반이
         언제 것인지 알 수 없다 — 둘 다 적는다. */
      genEl.textContent = j.generated_pair
        ? ("보드 갱신 국내 "+ctFmtGen(j.generated_pair[0])+" · 해외 "+ctFmtGen(j.generated_pair[1]))
        : (j.generated_at ? "보드 갱신 "+ctFmtGen(j.generated_at) : "");
      drawCats(); drawBody();
    }).catch(function(){ if (curRoute()==="contests") showFail(); });
  }

  C.querySelectorAll("[data-tab]").forEach(function(b){
    b.onclick = function(){
      var k = b.getAttribute("data-tab"); if (k===contestTab) return;
      contestTab = k; contestCat = "전체";
      C.querySelectorAll("[data-tab]").forEach(function(x){ x.classList.toggle("on", x.getAttribute("data-tab")===contestTab); });
      load(false);
    };
  });
  searchEl.oninput = function(){ contestSearch = searchEl.value; if (curData) drawBody(); };
  load(false);
}

/* ============ AI 지원사업 (공개 API: action=pubgov) ============ */
var GOV_TTL = 10*60*1000, govCache = null;
var govAiOnly = true, govCls = "전체", govSearch = "";
var GOV_AI_RE = /AI|인공지능|생성형|딥테크|디지털|데이터/i;
/* pub·aivideos 와 같은 구조다 — data/gov-pub.json 스냅샷으로 먼저 그리고, 라이브가 늦게 와서
   다르면 화면을 다시 세우지 않고 제자리에서 갱신한다. ?action=pubgov 는 K-Startup 공고를
   전부 훑어 오느라 pub 보다도 느려서 2분 타임아웃까지 응답이 없던 적도 있다(2026-08-12 실측). */
var GOV_SNAPSHOT = "data/gov-pub.json";
var govOnLive = null;   /* 지금 그려져 있는 지원사업 화면을 제자리에서 갱신하는 함수 (renderGov 가 채운다) */

function validGov(j){ return !!(j && j.ok && (j.items||[]).length); }
/* 다시 그릴지 판단하는 최소 지문 — 공고 수 + 첫 공고명 */
function govSig(j){ var it = (j && j.items) || []; return it.length + "/" + String((it[0]||{}).nm || ""); }

function govLiveFetch(force){
  var u = API + "?action=pubgov" + (force?"&reload=1":"") + "&t=" + Date.now();
  return fetch(u, { cache:"no-store" }).then(function(r){
    if (!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(j){ govCache = { t:Date.now(), data:j, live:true }; return j; });
}
function fetchGov(force){
  if (force) return govLiveFetch(true);   /* 수동 새로고침은 라이브 직행 — 그게 이 버튼의 용도다 */
  if (govCache && (Date.now()-govCache.t) < GOV_TTL) return Promise.resolve(govCache.data);
  var live = govLiveFetch(false);
  live.catch(function(){});   /* 스냅샷으로 끝난 경우의 미처리 거부를 막는다 */
  return fetch(GOV_SNAPSHOT, { cache:"no-store" }).then(function(r){
    if (!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(j){
    if (!validGov(j)) throw new Error("bad-snapshot");
    if (govCache && govCache.live) return govCache.data;   /* 라이브가 먼저 왔으면 그쪽을 쓴다 */
    govCache = { t:Date.now(), data:j, live:false };
    live.then(function(k){
      if (curRoute()!=="gov" || !govOnLive) return;
      /* 200 인데 내용이 망가진 응답({ok:false}·빈 목록)으로 멀쩡한 스냅샷 화면을 덮지 않는다.
         이 엔드포인트는 실제로 404 HTML 을 내는 일이 있다 — 그때 에러 박스가 뜨면 손해다 */
      if (!validGov(k)) return;
      if (govSig(k) === govSig(j)) return;   /* 같으면 다시 그리지 않는다 */
      govOnLive(k);
    }, function(){});
    return j;
  }).catch(function(){ return live; });    /* 스냅샷이 없으면 지금처럼 라이브를 기다린다 */
}
function renderGov(){
  var today = todaySeoul();
  setKicker(["창업지원 공고", "매일 갱신"]);
  setFacts([["—","조건 일치"],["—","전체 공고"],["—","7일 안에 마감"]]);

  C.innerHTML =
    "<section class='section paper'><div class='inner'>"+
      /* "돈을 내는 곳"이었다. "돈을 낸다"는 보통 지불한다는 뜻이라 지원금을 주는 쪽인지
         내는 쪽인지 두 갈래로 읽혔다 (대표가 바로 걸렸다, 2026-08-12).
         영화제의 "지금 출품할 수 있는 곳."과 대구를 이루는 문장으로 바꿨다.
         이 목록이 실제로 접수 중인 공고만 담는지 확인하고 골랐다 —
         action=pubgov 응답 263건이 전부 마감 전이었다(2026-08-12 실측). */
      "<div class='section-head'><div><p class='eyebrow'>Funding</p>"+
      "<h2>지금 신청할 수<br>있는 지원사업.</h2></div>"+
      "<div><p class='section-intro'>지금 신청할 수 있는 AI 관련 창업지원 공고를 모았습니다.</p>"+
      "<p class='count' style='margin:14px 0 0' data-gen>불러오는 중</p></div></div>"+
      "<div class='controls'>"+
        "<button type='button' class='chip"+(govAiOnly?" on":"")+"' data-ai aria-pressed='"+govAiOnly+"'>AI 관련만</button>"+
        "<input class='search' type='search' placeholder='공고명·기관 검색' data-search aria-label='지원사업 검색'>"+
      "</div>"+
      "<div class='controls'><div class='chips' data-chips></div></div>"+
      "<div data-body>"+emptyNote("지원사업 공고를 불러오는 중입니다.")+"</div>"+
    "</div></section>"+
    "<div data-rest></div>";

  var bodyEl = C.querySelector("[data-body]");
  var restEl = C.querySelector("[data-rest]");
  var chipsEl = C.querySelector("[data-chips]");
  var genEl = C.querySelector("[data-gen]");
  var searchEl = C.querySelector("[data-search]");
  var aiBtn = C.querySelector("[data-ai]");
  searchEl.value = govSearch;
  var cur = null;

  function clsList(){
    var set = {}, order = [];
    ((cur && cur.items) || []).forEach(function(it){
      var c = String(it.cls||"").trim();
      if (c && !set[c]){ set[c]=1; order.push(c); }
    });
    return order;
  }
  function drawChips(){
    var chips = ["전체"].concat(clsList());
    if (govCls!=="전체" && chips.indexOf(govCls)<0) govCls = "전체";
    chipsEl.innerHTML = chips.map(function(c){
      return "<button type='button' class='chip"+(c===govCls?" on":"")+"' data-cls='"+esc(c)+"' aria-pressed='"+(c===govCls)+"'>"+esc(c)+"</button>";
    }).join("");
    chipsEl.querySelectorAll("[data-cls]").forEach(function(b){
      b.onclick = function(){ govCls = b.getAttribute("data-cls"); drawChips(); drawBody(); };
    });
  }
  function isAi(it){ return GOV_AI_RE.test((it.nm||"")+" "+(it.trgt||"")+" "+(it.cls||"")); }
  /* 분류·검색만 적용한 1차 통과. AI 키워드 판정은 여기서 떼어 놓는다 —
     걸러진 공고를 아래 접힌 섹션에서 그대로 다시 보여주기 위해서다. */
  function matchBase(it){
    if (govCls!=="전체" && String(it.cls||"")!==govCls) return false;
    var q = String(govSearch||"").trim().toLowerCase();
    if (!q) return true;
    return String(it.nm||"").toLowerCase().indexOf(q)>=0 ||
           String(it.org||"").toLowerCase().indexOf(q)>=0 ||
           String(it.inst||"").toLowerCase().indexOf(q)>=0;
  }
  function match(it){
    if (govAiOnly && !isAi(it)) return false;
    return matchBase(it);
  }
  function govRow(it){
    var di = ddayInfo(it.end, today);
    var orgTxt = [it.org, it.inst].filter(function(x){return x;}).filter(function(x,i,a){return a.indexOf(x)===i;}).join(" · ");
    var meta = [];
    if (orgTxt) meta.push("<b>"+esc(orgTxt)+"</b>");
    meta.push("접수 "+esc(it.bgng||"미정")+" ~ "+esc(it.end||"미정"));
    return row({ dd:di.txt, ddCls:di.cls, title:it.nm||"(공고명 없음)",
                 tags:[it.cls, it.regin], meta:meta,
                 sum:it.trgt ? "대상 " + String(it.trgt).slice(0,120) : "", url:it.url });
  }
  function drawBody(){
    if (!cur || !cur.ok) return;
    var list = (cur.items||[]).filter(match);
    setFacts([
      [String(list.length), govAiOnly ? "AI 관련 공고" : "조건 일치"],
      [String(cur.total||(cur.items||[]).length), "전체 공고"],
      [String(dueWithin(list,"end",7,today)), "7일 안에 마감"]
    ]);
    bodyEl.innerHTML = "<div class='rows'>"+
      (list.length ? list.map(govRow).join("")
                   : emptyNote("조건에 맞는 공고가 없습니다. 'AI 관련만'을 끄면 전체 공고를 보실 수 있습니다."))+
      "</div>";

    /* AI 필터가 걸러낸 나머지. 히어로가 263건이라고 말해 놓고 23건만 보이면
       나머지가 어디 갔는지 알 수 없다 — 접어 두되 숨기지는 않는다. */
    var rest = govAiOnly ? (cur.items||[]).filter(function(it){ return matchBase(it) && !isAi(it); }) : [];
    restEl.innerHTML = rest.length
      ? foldSection("dark","Rest","AI 키워드에 걸리지 않은 공고", rest.length+"건",
          "<div class='rows'>"+rest.map(govRow).join("")+"</div>")
      : "";
    bindFold(restEl);
  }
  /* 스냅샷으로 먼저 그리고, 라이브가 다르게 오면 이 함수로 제자리 갱신한다.
     renderGov 를 다시 부르지 않는 이유: 검색어 입력칸과 스크롤을 건드리지 않으려고. */
  function show(j){
    cur = j;
    if (!j || !j.ok){
      genEl.textContent = "";
      bodyEl.innerHTML = failBox(j && j.error ? String(j.error) : "잠시 뒤 다시 시도해 주세요.",
        "<a class='btn' href='https://www.k-startup.go.kr' target='_blank' rel='noopener noreferrer'>공고 사이트 열기 ↗</a>");
      return;
    }
    /* 갱신 시각은 응답에 든 서버 값 그대로다 — 스냅샷으로 그렸으면 스냅샷 시각이 보인다 */
    genEl.textContent = "총 " + (j.total||0) + "건 · " + (j.generated||"") + " 기준";
    drawChips(); drawBody();
  }
  govOnLive = show;
  function load(force){
    bodyEl.innerHTML = emptyNote("지원사업 공고를 불러오는 중입니다.");
    fetchGov(force).then(function(j){
      if (curRoute()!=="gov") return;
      show(j);
    }).catch(function(e){
      if (curRoute()!=="gov") return;
      genEl.textContent = "";
      bodyEl.innerHTML = failBox(String(e && e.message || e),
        "<a class='btn' href='https://www.k-startup.go.kr' target='_blank' rel='noopener noreferrer'>공고 사이트 열기 ↗</a>");
    });
  }
  aiBtn.onclick = function(){
    govAiOnly = !govAiOnly;
    aiBtn.classList.toggle("on", govAiOnly);
    aiBtn.setAttribute("aria-pressed", String(govAiOnly));
    drawBody();
  };
  searchEl.oninput = function(){ govSearch = searchEl.value; drawBody(); };
  load(false);
}

/* ============ AI 작품소개 (유튜브 검색 — AI로 만든 영상 작품) ============
   AI유튜브정보와 같은 엔드포인트를 쓰지만 보는 목록이 다르다. 저쪽은 news·vibe(AI 뉴스·바이브코딩),
   이쪽은 works(AI로 만든 영상 작품)다. 두 화면 설명에 각각 그렇게 적었다.
   순위표가 아니라 소개 화면이다 — 강의·도구 소개·리뷰는 수집에서 걸러지고, 순서도 조회수
   단독이 아니라 화제성·반응·신선도를 함께 본다. 화면 문구에 "조회수순"이라 적으면 안 된다.

   국내/해외 구분은 없앴다 (대표 지시 2026-08-12). 국내 AI 작품이 아직 드물어 국내 섹션이
   계속 1편 이하로 비어 보였다. 서버가 works 하나로 합쳐서 준다. 옛 응답(domestic·overseas)만
   오는 동안에도 화면이 살아야 하므로 works 가 없으면 둘을 이어 붙여 쓴다.

   수집은 관리시스템(Apps Script)이 한다 — 유튜브 전역 검색에는 API 키가 필요하고
   키는 이 공개 저장소에 둘 수 없다. 주소가 정해지면 AIVIDEO_API 한 줄만 채우면 된다.
   비어 있는 동안에는 목록 자리에 "아직 연결되지 않았다"고 적는다. 에러 박스는 띄우지 않는다 —
   고장난 게 아니라 아직 안 붙은 것이다. */
/* 목록과 같은 구조다 — data/aivideos.json 스냅샷으로 먼저 그리고, 라이브가 늦게 와서
   다르면 조용히 다시 그린다. 라이브(?action=aivideos)는 2026-08-12 실측 6.3~37.7초에
   404 도 잦았다. 스냅샷은 0.05초대이고, 화면에 찍히는 "수집" 시각은 스냅샷 안의 generated 다. */
var AIVIDEO_SNAPSHOT = "data/aivideos.json";
var aivideoCache = null;        /* 화면이 지금 쓰는 값 (스냅샷이거나 라이브) */
var aivideoLivePromise = null;  /* 라이브는 한 번만 부른다 */

function validAiVideos(j){ return !!(j && j.ok); }

function fetchAiVideosLive(){
  if (aivideoLivePromise) return aivideoLivePromise;
  if (!AIVIDEO_API){ aivideoLivePromise = Promise.reject(new Error("no-endpoint")); return aivideoLivePromise; }
  var u = AIVIDEO_API + (AIVIDEO_API.indexOf("?")>=0 ? "&" : "?") + "action=aivideos&t=" + Date.now();
  aivideoLivePromise = fetch(u, { cache:"no-store" })
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){ if(!validAiVideos(j)) throw new Error("bad-response"); return j; });
  aivideoLivePromise.then(function(j){
    var had = aivideoCache;
    aivideoCache = j;
    if (!had) return;                                                   /* 첫 표시는 부른 쪽이 그린다 */
    if (String(had.generated||"") === String(j.generated||"")) return;   /* 같으면 다시 그리지 않는다 */
    if (curRoute()==="aivideo") renderAiVideo();                         /* 보고 있는 화면만 */
    else if (curRoute()==="youtube") renderYoutube();
  }, function(){});
  return aivideoLivePromise;
}
function fetchAiVideos(){
  if (aivideoCache) return Promise.resolve(aivideoCache);
  var live = fetchAiVideosLive();
  live.catch(function(){});   /* 스냅샷으로 끝난 경우의 미처리 거부를 막는다 */
  return fetch(AIVIDEO_SNAPSHOT, { cache:"no-store" })
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){
      if (!validAiVideos(j)) throw new Error("bad-snapshot");
      if (!aivideoCache) aivideoCache = j;   /* 라이브가 먼저 왔으면 그쪽을 쓴다 */
      return aivideoCache;
    })
    .catch(function(){ return live; });      /* 스냅샷이 없으면 지금처럼 라이브를 기다린다 */
}
/* 브리핑 본문이 쓰는 카드(.card-grid/.item-card)를 그대로 쓴다. 영상 카드는 이미 이 시스템에 있다 */
function videoCards(list){
  return "<span class='card-grid'>"+(list||[]).map(function(v){
    var sub = v.subscribers != null ? " · 구독 "+kfmt(v.subscribers) : "";
    var when = v.published ? " · "+String(v.published).slice(0,10) : "";
    return "<a class='item-card yt' href='"+esc(ctSafeUrl(v.url))+"' target='_blank' rel='noopener noreferrer'>"+
      /* 썸네일 주소도 http(s) 인지 보고 넣는다. 바깥에서 온 값이 그대로 src 로 들어가는 자리다 */
      "<img src='"+esc(ctSafeUrl(v.thumbnail))+"' alt='' loading='lazy'>"+
      "<span class='ic-body'>"+
        "<span class='ic-title'>"+esc(v.title||"(제목 없음)")+"</span>"+
        "<span class='ic-desc'>"+esc(v.channel||"")+esc(sub)+"</span>"+
        "<span class='ic-url'>조회수 "+esc(nfmt(v.views))+esc(when)+"</span>"+
      "</span></a>";
  }).join("")+"</span>";
}
function videoSection(cls, eyebrow, h2, list, queries, generated){
  return "<section class='section "+cls+"'><div class='inner'>"+
    sectionHead(eyebrow, h2, esc(fmtGen(generated))+" 기준.",
      "<b>"+(list||[]).length+"</b>편")+
    ((list||[]).length ? videoCards(list) : emptyNote("아직 모인 영상이 없습니다."))+
    "</div></section>";
}
function renderAiVideo(){
  setKicker(["AI 작품"]);
  setFacts([["—","작품"],["—","최고 조회수"],["—","수집"]]);
  C.innerHTML = "<section class='section paper'><div class='inner'>"+
    emptyNote("작품을 불러오는 중입니다.")+"</div></section>";

  fetchAiVideos().then(function(j){
    if (curRoute()!=="aivideo") return;
    var works = j.works || (j.domestic||[]).concat(j.overseas||[]);
    var top = 0;
    for (var w = 0; w < works.length; w++) if ((works[w].views||0) > top) top = works[w].views;
    setKicker(["AI 작품", works.length+"편"]);
    setFacts([[String(works.length),"작품"],[top ? kfmt(top) : "—","최고 조회수"],
              [fmtGen(j.generated).slice(0,10)||"—","수집"]]);
    C.innerHTML =
      videoSection("paper","Showcase","AI로 만든<br>영상 작품.", works, (j.queries||{}).works, j.generated);
    observeReveal();
  }).catch(function(){
    if (curRoute()!=="aivideo") return;
    setKicker(["연결 준비 중"]);
    setFacts([["—","작품"],["—","최고 조회수"],["—","수집"]]);
    C.innerHTML = "<section class='section paper'><div class='inner'>"+
      sectionHead("Showcase","아직 영상 수집이<br>연결되지 않았습니다.",
        "유튜브 검색 수집이 붙으면 이 자리에 AI 영상 작품이 올라옵니다.","")+
      "</div></section>";
  });
}

/* ============ 라우팅 ============ */
var ROUTES = {
  contests:renderContests, festivals:renderFestivals, gov:renderGov,
  newsrep:renderReports, youtube:renderYoutube, aivideo:renderAiVideo
};
/* 공개 목록 API(action=pub) 데이터가 필요한 화면 */
var NEEDS_PUB = { newsrep:1, youtube:1 };
/* 그중 youtube 는 브리핑이 없어도 유튜브 수집분만으로 그려진다 —
   로딩은 기다리되 실패했다고 화면 전체를 에러로 덮지 않는다. */
var PUB_OPTIONAL = { youtube:1 };

function render(){
  var route = curRoute();
  buildNav();
  drawHero(route);
  /* 제목은 내비의 짧은 라벨이 아니라 전체 이름을 쓴다 — 브라우저 탭·검색 결과·
     공유 링크에서는 "공모전"보다 "AI 공모전"이 무엇인지 분명하다. */
  document.title = ((HERO[route] || {}).ko || TITLES[route]) + " — AI 레이더";
  if (NEEDS_PUB[route]){
    if (state.loading){
      setKicker(["불러오는 중"]);
      setFacts([["—","발행된 브리핑"],["—","최신 발행일"],["—","항목 수"]]);
      C.innerHTML = "<section class='section paper'><div class='inner'>"+
        emptyNote("데이터를 불러오는 중입니다.")+"</div></section>";
      return;
    }
    if (state.error && !PUB_OPTIONAL[route]){
      setKicker(["연결 실패"]);
      setFacts([["—",""],["—",""],["—",""]]);
      C.innerHTML = "<section class='section paper'><div class='inner'>"+failBox(state.error)+"</div></section>";
      bindRetry(C);
      return;
    }
  }
  (ROUTES[route] || renderReports)();
  observeReveal();
}

/* ============ 모션 ============ */
var io = null;
function observeReveal(){
  if (!("IntersectionObserver" in window)) return;
  if (!io) io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("visible"); io.unobserve(e.target); } });
  }, { threshold:.12 });
  C.querySelectorAll(".reveal:not(.visible)").forEach(function(el){ io.observe(el); });
}
var bar = document.getElementById("progress");
function onScroll(){
  var h = document.documentElement.scrollHeight - window.innerHeight;
  bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + "%";
}
window.addEventListener("scroll", onScroll, { passive:true });

/* ============ 액션 ============ */
document.getElementById("refreshBtn").onclick = function(){
  var btn = this, label = btn.textContent;
  btn.textContent = "↻ …";
  govCache = null; contestCache = {};
  state.loading = true; state.error = null; render();
  loadData().catch(function(e){ state.loading=false; state.error=e.message||String(e); })
    .then(function(){ render(); btn.textContent = label; });
};
window.addEventListener("hashchange", function(){
  render();
  window.scrollTo({ top:0, behavior:"auto" });
});

/* ============ 초기화 ============ */
(function init(){
  if (!location.hash) location.replace("#" + DEFAULT_ROUTE);
  render();
  onScroll();
  /* 스냅샷 먼저 그리고(0.3초), 라이브는 뒤에서 받아 다를 때만 다시 그린다(6~68초) */
  var drawn = false;
  loadPubSnapshot().then(function(j){ if (!j) return; drawn = true; render(); }, function(){});
  loadData().then(function(){
    if (!drawn || state.pubChanged) render();
  }, function(e){
    if (state.data) return;   /* 스냅샷으로 이미 그려져 있다 — 멀쩡한 화면을 에러로 덮지 않는다 */
    state.loading = false; state.error = e.message||String(e); render();
  });
  /* 탭이 보일 때만 10분마다 목록 갱신 */
  setInterval(function(){
    if (document.hidden) return;
    loadData().then(function(){
      if (NEEDS_PUB[curRoute()] || curRoute()==="festivals") render();
    }).catch(function(){});
  }, 600000);
})();

})();
</script>
