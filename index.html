  }, function(e){
    if (!wpAlive(el)) return;
    if (window.console && console.error) console.error("[프로필]", e);
    el.innerHTML = emptyNote("지금은 열 수 없습니다. 잠시 후 다시 시도해 주세요.");
  });
}
/* 주소(슬러그) → uid → 프로필. 문서 두 번을 읽을 뿐 색인은 필요 없다 */
function wpPublicView(el, slug){
  fbDb.collection("slugs").doc(slug).get().then(function(d){
    if (!wpAlive(el)) return;
    var uid = d.exists ? (d.data()||{}).uid : "";
    if (!uid){ el.innerHTML = emptyNote("이 주소의 프로필을 찾을 수 없습니다."); return; }
    return wpFetch(uid);
  }).then(function(pf){
    if (!wpAlive(el) || pf === undefined) return;   /* undefined = 위에서 이미 안내를 그렸다 */
    if (!pf){ el.innerHTML = emptyNote("이 주소의 프로필을 찾을 수 없습니다."); return; }
    wpDraw(el, pf);
  }, function(e){
    if (!wpAlive(el)) return;
    if (window.console && console.error) console.error("[프로필]", e);
    el.innerHTML = emptyNote("프로필을 불러오지 못했습니다.");
  });
}
function wpDraw(el, pf){
  var mine = !!(bdUser && pf.uid && pf.uid === bdUser.uid);
  var ph = ctSafeUrl(pf.photoURL||"");
  var link = ctSafeUrl(pf.link||"");
  wpCache[pf.uid] = pf;                /* 아래 작품 카드가 작성자를 여기서 읽는다 */
  document.title = (pf.nick || "프로필") + " — AI 레이더";
  setKicker(["프로필", pf.nick || ""]);
  el.innerHTML =
    "<div class='pf-head'>"+
      wpAva("pf-ava", ph, pf.nick)+
      "<div><h2 class='pf-nick'>"+esc(pf.nick||"")+"</h2>"+
      (link ? "<a class='pf-link' href='"+esc(link)+"' target='_blank' rel='noopener noreferrer nofollow'>"+
              esc(link.replace(/^https?:\/\//,""))+"</a>" : "")+
      "</div></div>"+
    (pf.bio ? "<p class='pf-bio'>"+esc(pf.bio)+"</p>" : "")+
    (mine ? "<p style='margin:18px 0 0'><a class='btn' href='"+esc(profUrl(""))+"'>프로필 수정</a></p>" : "")+
    "<p class='bd-lead'>작품</p><div data-pfw>"+emptyNote("불러오는 중입니다.")+"</div>"+
    "<p class='bd-lead'>게시판 글</p><div class='rows' data-pfp>"+emptyNote("불러오는 중입니다.")+"</div>";
  wpFillWorks(el.querySelector("[data-pfw]"), pf);
  wpFillPosts(el.querySelector("[data-pfp]"), pf);
}
function wpFillWorks(host, pf){
  if (!host) return;
  Promise.all([
    fbDb.collection("works").where("uid","==",pf.uid).orderBy("createdAt","desc").limit(24).get(),
    wpContestMap()["catch"](function(){ return {}; })
  ]).then(function(r){
    if (!wpAlive(host)) return;
    var got = [];
    r[0].forEach(function(d){ var o = d.data()||{}; o.id = d.id; got.push(o); });
    wpFactW = String(got.length); wpFacts(pf);
    host.innerHTML = got.length ? wkGrid(got) : emptyNote("아직 등록한 작품이 없습니다.");
    wkPrefetchLikes(got);
    observeReveal();
  }, function(e){
    if (!wpAlive(host)) return;
    if (window.console && console.error) console.error("[프로필]", e);
    host.innerHTML = emptyNote("작품을 불러오지 못했습니다.");
  });
}
function wpFillPosts(host, pf){
  if (!host) return;
  /* 원글만 본다 — 답글까지 섞으면 남의 글에 단 한 줄이 이 사람의 포트폴리오처럼 보인다 */
  fbDb.collection("posts").where("uid","==",pf.uid).where("parentId","==",null)
    .orderBy("createdAt","desc").limit(10).get().then(function(sn){
    if (!wpAlive(host)) return;
    var got = [];
    sn.forEach(function(d){ var o = d.data()||{}; o.id = d.id; got.push(o); });
    wpFactP = String(got.length); wpFacts(pf);
    host.innerHTML = got.length ? got.map(homeCommRow).join("")
                                : emptyNote("아직 남긴 글이 없습니다.");
  }, function(e){
    if (!wpAlive(host)) return;
    if (window.console && console.error) console.error("[프로필]", e);
    host.innerHTML = emptyNote("글을 불러오지 못했습니다.");
  });
}
/* ---- 내 프로필 편집 ----
   처음이면 닉네임 하나만 묻는다. 한 줄 소개·대표 링크를 함께 물으면 만들기 전에
   생각할 것이 셋이 되고, 거기서 반은 그냥 나간다. 나머지는 만든 뒤에 채운다. */
function wpEditView(el){
  if (!bdUser){
    el.innerHTML = "<div class='bd-composer'><p class='bd-lead' style='margin-top:0'>내 프로필</p>"+
      "<p class='bd-hint'>로그인하면 내 프로필 주소가 생깁니다.</p>"+
      "<div class='bd-cfoot'><span class='bd-hint'>구글 계정으로 3초면 시작합니다</span>"+
      "<button type='button' class='btn' data-login>구글 계정으로 로그인</button></div></div>";
    return;
  }
  if (wpMine === undefined){
    el.innerHTML = emptyNote("확인하는 중입니다.");
    wpMineLoad().then(function(){ if (wpAlive(el)) wpEditView(el); });
    return;
  }
  var pf = wpMine;
  var isNew = !pf;
  el.innerHTML = "<div class='bd-composer'>"+
    "<p class='bd-lead' style='margin-top:0'>"+(isNew ? "프로필 만들기" : "내 프로필")+"</p>"+
    (isNew ? "<p class='bd-hint'>닉네임 하나면 시작합니다. 소개와 링크는 나중에 채우셔도 됩니다.</p>"
           : "<p class='bd-hint'>내 주소: "+esc(SITE_URL+"/u/"+encodeURIComponent(pf.slug||""))+"</p>")+
    /* ⚠️ 라벨은 눈에 보이게 둔다. 예전에는 placeholder 만 있어서 값이 채워지고 나면
       어느 칸이 무엇인지 알 수 없었다 — 대표가 "프로필 사진 기능이 없다"고 한 것이
       기능이 없어서가 아니라 그 칸이 무슨 칸인지 보이지 않아서였다(2026-08-15). */
    "<div class='pf-form'>"+
      "<div class='pf-lab'>닉네임 <span style='color:var(--coral)'>*</span>"+
        "<div class='pf-nick-row'>"+
          "<input class='bd-in' type='text' maxlength='"+WP_NICK_MAX+"' data-pnick"+
            " placeholder='예: 레이더장인' aria-label='닉네임'>"+
          "<button type='button' class='btn btn-check' data-pnick-check>중복 확인</button>"+
        "</div>"+
        "<p class='pf-nick-msg' data-pnick-msg></p>"+
      "</div>"+
      /* 소개·링크·사진·관심분야는 항상 보여준다. isNew 뒤에 숨겨 두면 프로필 로드가
         한 번 어긋나 wpMine 이 비었을 때 사진 편집칸이 통째로 사라진다 — 대표가 "프로필
         사진 편집 기능 없어짐"이라 한 것이 이 경우였다(2026-08-16). 신규도 처음부터 채운다. */
      "<label class='pf-lab'>한 줄 소개"+
        "<input class='bd-in' type='text' maxlength='"+WP_BIO_MAX+"' data-pbio"+
          " placeholder='선택 · 무엇을 만드는 사람인지' aria-label='한 줄 소개'></label>"+
      "<label class='pf-lab'>대표 링크"+
        "<input class='bd-in' type='url' inputmode='url' maxlength='"+WP_LINK_MAX+"' data-plink"+
          " placeholder='선택 · https://' aria-label='대표 링크'></label>"+
      /* 사진: 기기에서 올리거나(캔버스로 축소해 data URL) · 구글 사진 · 주소 붙여넣기.
         파일은 우리 서버에 두지 않는다 — 축소한 이미지를 프로필 문서에 바로 담는다. */
      "<div class='pf-lab'>프로필 사진"+
        "<div class='pf-photo'>"+
          "<span data-ppreview></span>"+
          "<input class='bd-in' type='url' inputmode='url' maxlength='"+WP_PHOTO_MAX+"' data-pphoto"+
            " placeholder='사진 주소 · https://' aria-label='프로필 사진 주소'>"+
          "<label class='chip' style='cursor:pointer'>사진 올리기"+
            "<input type='file' accept='image/*' data-pfile style='display:none'></label>"+
          "<button type='button' class='chip' data-pgoogle>구글 사진으로</button>"+
        "</div>"+
        "<span class='pf-help'>기기에서 올리거나 사진 주소를 넣으면 바로 위 원에 미리 보입니다. "+
          "비워 두면 닉네임 첫 글자가 대신 들어갑니다.</span>"+
      "</div>"+
      /* 관심 분야 — 고른 분야의 마감이 홈 맨 위(관심 분야 마감 임박)에 모인다.
         '내 계획'(카드마다 ♡로 직접 담는 것)과 헷갈린다는 지적이 있어 차이를 적어 둔다. */
      "<div class='pf-lab'>관심 분야"+
        "<div class='chips pf-int' data-pint></div>"+
        "<span class='pf-help'>고르면 그 분야에 <b>접수 중인 공고의 마감</b>이 홈 맨 위 '관심 분야 마감 임박'에 자동으로 모입니다. "+
          "카드마다 ♡로 직접 담는 '내 계획'과는 다릅니다 — 이건 분야만 정해 두면 저절로 채워지는 맞춤 추천이에요. 여러 개 고를 수 있어요.</span>"+
      "</div>"+
    "</div>"+
    "<p class='bd-msg' data-pmsg></p>"+
    "<div class='bd-cfoot'>"+
      (isNew ? "" : "<a class='bd-act' href='"+esc(profUrl(pf.slug))+"'>내 프로필 보기</a>")+
      "<button type='button' class='bd-act' data-logout>로그아웃</button>"+
      "<button type='button' class='btn' data-psave>"+(isNew ? "프로필 만들기" : "저장")+"</button>"+
    "</div></div>";
  var nickEl = el.querySelector("[data-pnick]");
  var nickCheckBtn = el.querySelector("[data-pnick-check]");
  var nickMsg = el.querySelector("[data-pnick-msg]");
  var bioEl = el.querySelector("[data-pbio]");
  var linkEl = el.querySelector("[data-plink]");
  var msg = el.querySelector("[data-pmsg]");
  var save = el.querySelector("[data-psave]");
  var photoEl = el.querySelector("[data-pphoto]");
  var prevEl = el.querySelector("[data-ppreview]");
  var intSel = ((pf && pf.interests) || []).slice();
  var intBox = el.querySelector("[data-pint]");

  var initialNick = (pf && pf.nick) ? String(pf.nick).trim() : "";
  /* 기존 사용자는 현재 닉네임을 이미 쓰고 있으므로 확인된 것으로 본다.
     신규 사용자는 닉네임을 새로 정해야 하므로 미확인 상태다. */
  var isNickChecked = !isNew && !!initialNick;
  var lastCheckedNick = initialNick;

  function drawPreview(){
    if (!prevEl) return;
    /* 넣는 즉시 보여 준다 — 저장하고 나서야 깨진 걸 아는 것이 제일 나쁘다 */
    prevEl.innerHTML = wpAva("pf-ava", photoEl.value, nickEl.value || (pf && pf.nick));
  }
  function drawInt(){
    if (!intBox) return;
    intBox.innerHTML = INTEREST_CATS.map(function(c){
      var on = intSel.indexOf(c) >= 0;
      return "<button type='button' class='chip"+(on?" on":"")+"' data-ic='"+esc(c)+
        "' aria-pressed='"+on+"'>"+esc(c)+"</button>";
    }).join("");
    intBox.querySelectorAll("[data-ic]").forEach(function(b){
      b.onclick = function(){
        var c = b.getAttribute("data-ic"), i = intSel.indexOf(c);
        if (i >= 0) intSel.splice(i, 1);
        else {
          if (intSel.length >= WP_INT_MAX){ msg.textContent = "관심 분야는 "+WP_INT_MAX+"개까지 고를 수 있습니다."; return; }
          intSel.push(c);
        }
        drawInt();
      };
    });
  }
  if (pf){
    nickEl.value = String(pf.nick||"");
    bioEl.value = String(pf.bio||"");
    linkEl.value = String(pf.link||"");
    photoEl.value = String(pf.photoURL||"");
    if (nickMsg){
      nickMsg.className = "pf-nick-msg ok";
      nickMsg.textContent = "현재 사용 중인 닉네임입니다.";
    }
  } else {
    /* 신규도 구글 사진을 기본으로 채워 둔다 — 비워 두면 첫 글자 아바타가 대신 들어간다 */
    photoEl.value = String((bdUser && bdUser.photoURL) || "");
  }
  /* 배선은 신규·기존 모두 건다. 예전에는 !isNew 안에만 있어서, 프로필이 아직 없거나
     로드가 어긋난 순간에는 미리보기·구글사진·관심분야 칩이 죽어 있었다(2026-08-16). */
  drawPreview();
  drawInt();
  photoEl.oninput = drawPreview;

  function onNickInput(){
    var cur = String(nickEl.value||"").trim();
    if (initialNick && cur === initialNick){
      isNickChecked = true;
      lastCheckedNick = cur;
      if (nickMsg){
        nickMsg.className = "pf-nick-msg ok";
        nickMsg.textContent = "현재 사용 중인 닉네임입니다.";
      }
    } else if (lastCheckedNick && cur === lastCheckedNick){
      isNickChecked = true;
      if (nickMsg){
        nickMsg.className = "pf-nick-msg ok";
        nickMsg.textContent = "사용 가능한 닉네임입니다. ✓";
      }
    } else {
      isNickChecked = false;
      if (nickMsg){
        if (cur.length >= 2){
          nickMsg.className = "pf-nick-msg hint";
          nickMsg.textContent = "닉네임이 변경되었습니다. [중복 확인]을 눌러주세요.";
        } else {
          nickMsg.className = "pf-nick-msg";
          nickMsg.textContent = "";
        }
      }
    }
    drawPreview();
  }
  nickEl.oninput = onNickInput;

  function doCheckNick(){
    var cur = String(nickEl.value||"").trim();
    if (!cur){
      if (nickMsg){ nickMsg.className = "pf-nick-msg err"; nickMsg.textContent = "닉네임을 입력해 주세요."; }
      nickEl.focus();
      return Promise.resolve(false);
    }
    if (cur.length < 2 || cur.length > WP_NICK_MAX){
      if (nickMsg){ nickMsg.className = "pf-nick-msg err"; nickMsg.textContent = "닉네임은 2자 이상 " + WP_NICK_MAX + "자 이하로 입력해 주세요."; }
      nickEl.focus();
      return Promise.resolve(false);
    }
    if (initialNick && cur === initialNick){
      isNickChecked = true;
      lastCheckedNick = cur;
      if (nickMsg){ nickMsg.className = "pf-nick-msg ok"; nickMsg.textContent = "현재 회원님이 사용 중인 닉네임입니다."; }
      return Promise.resolve(true);
    }
    if (nickCheckBtn) nickCheckBtn.disabled = true;
    if (nickMsg){ nickMsg.className = "pf-nick-msg hint"; nickMsg.textContent = "중복 확인 중입니다..."; }

    return wpCheckNickDuplicate(cur, bdUser ? bdUser.uid : "").then(function(res){
      if (nickCheckBtn) nickCheckBtn.disabled = false;
      if (res.ok){
        isNickChecked = true;
        lastCheckedNick = cur;
        if (nickMsg){ nickMsg.className = "pf-nick-msg ok"; nickMsg.textContent = res.msg; }
        return true;
      } else {
        isNickChecked = false;
        if (nickMsg){ nickMsg.className = "pf-nick-msg err"; nickMsg.textContent = res.msg; }
        nickEl.focus();
        return false;
      }
    });
  }
  if (nickCheckBtn) nickCheckBtn.onclick = function(){ doCheckNick(); };

  el.querySelector("[data-pgoogle]").onclick = function(){
    photoEl.value = String((bdUser && bdUser.photoURL) || "");
    drawPreview();
    msg.textContent = photoEl.value ? "" : "구글 계정에 사진이 없습니다.";
  };
  var fileEl = el.querySelector("[data-pfile]");
  if (fileEl) fileEl.onchange = function(){
    var f = fileEl.files && fileEl.files[0];
    if (!f) return;
    msg.textContent = "사진을 줄이는 중입니다.";
    wpResizePhoto(f, function(err, url){
      fileEl.value = "";   /* 같은 파일을 다시 고를 수 있게 비운다 */
      if (err){ msg.textContent = err; return; }
      photoEl.value = url; drawPreview(); msg.textContent = "사진을 올렸습니다. [저장]을 눌러 주세요.";
    });
  };
  save.onclick = function(){
    var nick = String(nickEl.value||"").trim();
    var bio = bioEl ? String(bioEl.value||"").trim() : "";
    var link = linkEl ? String(linkEl.value||"").trim() : "";
    var photo = photoEl ? String(photoEl.value||"").trim() : "";
    var err = wpFieldError(nick, bio, link) || wpPhotoError(photo);
    if (err){ msg.textContent = err; return; }

    function proceedSave(){
      save.disabled = true; msg.textContent = "저장하는 중입니다.";
      function fail(e){
        save.disabled = false;
        if (window.console && console.error) console.error("[프로필]", e);
        msg.textContent = "저장하지 못했습니다. 잠시 후 다시 시도해 주세요.";
      }
      if (!isNew){
        /* 슬러그는 손대지 않는다 — 규칙도 바뀌면 거부한다 */
        fbDb.collection("profiles").doc(bdUser.uid)
          .update({ nick:nick, bio:bio, link:link, photoURL:photo,
                    interests:intSel.slice(0, WP_INT_MAX) }).then(function(){
            wpCache[bdUser.uid] = undefined; wpMine = undefined;
            nvAuth();            /* 상단바 이름도 같이 바뀌어야 한다 */
            wpGo(pf.slug);
          }, fail);
        return;
      }
      /* 주소를 먼저 선점하고 프로필을 쓴다. 순서를 바꾸면 같은 주소를 가진 프로필이
         둘 생길 수 있다 — slugs 문서가 주소의 주인을 가리는 유일한 기록이다. */
      wpClaimSlug(nick, 3).then(function(slug){
        if (!slug){ save.disabled = false; msg.textContent = "잠시 후 다시 시도해 주세요."; return; }
        var now = firebase.firestore.FieldValue.serverTimestamp();
        return fbDb.collection("slugs").doc(slug).set({ uid:bdUser.uid, createdAt:now })
          .then(function(){
            return fbDb.collection("profiles").doc(bdUser.uid).set({
              nick: nick,
              slug: slug,
              bio: bio,
              link: link,
              photoURL: photo,   /* 칸에 채운 값을 그대로 쓴다(기본은 구글 사진, 비우면 빈 값) */
              interests: intSel.slice(0, WP_INT_MAX),
              createdAt: now
            });
          })
          .then(function(){
            wpCache[bdUser.uid] = undefined; wpMine = undefined;
            nvAuth();            /* "닉네임 정하기" 로 남아 있던 상단바를 방금 정한 이름으로 */
            wpGo(slug);
          });
      })["catch"](fail);
    }

    /* 닉네임이 변경됐거나 아직 중복확인을 하지 않은 경우 저장을 막는다.
       자동으로 확인하지 않고 사용자가 직접 [중복 확인]을 누르도록 안내한다 —
       본인 의사 없이 닉네임이 바뀌는 것을 방지하기 위해서다. */
    if (!isNickChecked || lastCheckedNick !== nick){
      if (nickMsg){ nickMsg.className = "pf-nick-msg err"; nickMsg.textContent = "닉네임 [중복 확인]을 먼저 눌러 주세요."; }
      if (nickCheckBtn){ nickCheckBtn.focus(); }
      else { nickEl.focus(); }
      return;
    }
    proceedSave();
  };
}

/* ---- 작품 주소 ----
   유튜브·비메오만 받는다. 받은 주소를 그대로 저장하지 않고 영상 ID 만 뽑아 우리가 다시
   만든다 — 추적 파라미터가 딸려 오지 않고, 규칙에서 한 줄로 검사할 수 있다. */
function wkParse(u){
  var s = String(u||"").trim(), p, m, v;
  if (!/^https?:\/\//i.test(s)) return null;
  try { p = new URL(s); } catch(e){ return null; }
  var host = p.hostname.toLowerCase().replace(/^www\./,"");
  if (host === "youtu.be"){
    m = p.pathname.match(/^\/([A-Za-z0-9_-]{6,20})/);
    return m ? { kind:"youtube", id:m[1] } : null;
  }
  if (host === "youtube.com" || host === "m.youtube.com" || host === "music.youtube.com"){
    v = p.searchParams ? p.searchParams.get("v") : "";
    if (v && /^[A-Za-z0-9_-]{6,20}$/.test(v)) return { kind:"youtube", id:v };
    m = p.pathname.match(/^\/(?:shorts|embed|live|v)\/([A-Za-z0-9_-]{6,20})/);
    return m ? { kind:"youtube", id:m[1] } : null;
  }
  if (host === "vimeo.com" || host === "player.vimeo.com"){
    m = p.pathname.match(/\/(\d{6,12})/);
    return m ? { kind:"vimeo", id:m[1] } : null;
  }
  return null;
}
function wkCanon(kind, id){
  return kind === "vimeo" ? "https://vimeo.com/"+id : "https://www.youtube.com/watch?v="+id;
}
/* 저장한 주소가 곧 어디 것인지 말해 준다 — 문서에 종류를 따로 두지 않는다 */
function wkIsVimeo(w){ return String((w && w.url) || "").indexOf("//vimeo.com/") >= 0; }
/* 유튜브 썸네일은 ID 로 주소가 정해져 있다. 비메오는 서버에 물어야 알 수 있어 쓰지 않는다 */
function wkThumb(w){
  return wkIsVimeo(w) ? ""
    : "https://i.ytimg.com/vi/"+encodeURIComponent(String((w && w.videoId) || ""))+"/hqdefault.jpg";
}
/* 공모전 이름표는 data/slugs.json 에서 온다(슬러그 ↔ 제목). 파일이 커서 작품 화면을
   열 때만 한 번 받고, 실패하면 이름표만 빠진다.
   상대 경로로 적으면 /u/xxx 에서 /u/data/... 로 풀려 404 다 — 베이스를 붙인다. */
function wpSlugRaw(){
  if (wpSlugPromise) return wpSlugPromise;
  wpSlugPromise = fetch(BASE + "data/slugs.json", { cache:"no-store" })
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){ return (j && j.entries) || {}; });
  wpSlugPromise["catch"](function(){ wpSlugPromise = null; });
  return wpSlugPromise;
}
function wpContestMap(){
  return wpSlugRaw()
    .then(function(e){
      var out = {};
      Object.keys(e).forEach(function(k){
        if (k.indexOf("contest|") !== 0) return;   /* 키는 "contest|제목|주최" 꼴이다 */
        var s = (e[k]||{}).slug;
        if (s && !out[s]) out[s] = k.split("|")[1] || s;
      });
      wpSlugName = out;
      return out;
    });
}

/* ---- 작품 카드 ----
   썸네일을 누르면 원본으로 나간다. 여기서 재생하지 않는다 — 우리가 플레이어를 만들면
   조회수도 저작자 표시도 원저작자에게 가지 않는다.
   작성자·좋아요·신고는 카드 바깥 줄에 둔다. 카드 전체가 링크라 안에 넣으면 링크 안의
   링크가 된다. */
function wkCard(w){
  var vim = wkIsVimeo(w);
  var pf = wpCache[w.uid] || null;
  var mine = !!(bdUser && w.uid && w.uid === bdUser.uid);
  var ct = w.contestSlug ? (wpSlugName[w.contestSlug] || "") : "";
  var ph = pf ? ctSafeUrl(pf.photoURL||"") : "";
  /* 모달이 값을 꺼내 쓴다. 카드를 그릴 때 채워 두면 어느 화면에서 눌러도 같게 열린다 */
  wkById[w.id] = w;
  w.by = (pf && pf.nick) || "";
  /* 새 탭으로 내보내지 않고 이 자리에서 연다(대표 지시 2026-08-15).
     그래서 링크가 아니라 버튼이다 — 하는 일이 "이동"이 아니라 "창 열기"다. */
  var play = " type='button' data-wkplay='"+esc(w.id)+"'";
  var h = "<article class='wk-card' data-work='"+esc(w.id)+"'>";
  /* 썸네일이 먼저, 정보는 그 아래 두 줄 — 영상 목록은 이 배치가 표준이다 */
  h += "<button class='wk-thumb'"+play+" aria-label='"+esc(w.title||"작품")+" 재생'>"+
       (vim ? "<span class='wk-noimg'>VIMEO</span>"
            : "<img src='"+esc(wkThumb(w))+"' alt='' loading='lazy'>")+
       "</button>";
  h += "<div class='wk-info'>";
  h += "<button class='wk-title'"+play+">"+esc(w.title||"(제목 없음)")+"</button>";
  h += "<div class='wk-by'>"+
       wpAva("bd-ava", ph, (pf && pf.nick) || "")+
       ((pf && pf.slug)
         ? "<a class='bd-name' href='"+esc(profUrl(pf.slug))+"'>"+esc(pf.nick||"익명")+"</a>"
         : "<span class='bd-name'>"+esc((pf && pf.nick) || "익명")+"</span>")+
       "</div>";
  h += "<div class='wk-meta'>";
  if (ct) h += "<span class='wk-badge'>"+esc(ct)+"</span>";
  h += "<button type='button' class='bd-act"+(wkLiked[w.id]?" on":"")+"'"+
       " data-wklike='"+esc(w.id)+"' aria-pressed='"+(!!wkLiked[w.id])+"'>"+
       "♥ <b class='tnum'>"+nfmt(w.likeCount||0)+"</b></button>";
  h += "<span>"+esc(bdWhen(w.createdAt))+"</span>";
  /* 신고는 조용히 둔다. 크게 세우면 서로를 감시하는 화면이 된다 */
  h += "<a class='bd-act' href='"+homeMail("[AI 레이더] 작품 신고: "+w.id)+"'>신고</a>";
  if (mine) h += "<button type='button' class='bd-act' data-wkdel='"+esc(w.id)+"'>삭제</button>";
  h += "</div></div></article>";
  return h;
}
/* 영상을 모달에 등록하고 열쇠를 돌려준다. 추출에 실패하면 빈 문자열이고,
   그때 부르는 쪽은 예전처럼 새 탭 링크로 둔다 — 깨진 모달보다 낫다.
   갤러리 작품은 videoId 를 저장해 두지만 수집된 영상(유튜브정보·작품소개)은
   전체 주소만 있다. 그래서 추출은 wkParse 한 곳으로 모은다. */
function wkReg(o){
  o = o || {};
  var v = null;
  if (o.videoId && /^[A-Za-z0-9_-]{6,20}$/.test(String(o.videoId))){
    v = { kind: (String(o.url||"").indexOf("//vimeo.com/") >= 0 ? "vimeo" : "youtube"),
          id: String(o.videoId) };
  } else {
    v = wkParse(o.url);
  }
  if (!v) return "";
  var key = "v-" + v.kind + "-" + v.id;
  wkById[key] = { id:key, videoId:v.id, url:wkCanon(v.kind, v.id),
                  title:o.title || "", by:o.by || "", orig:ctSafeUrl(o.url||"") };
  return key;
}

/* ---- 그 자리에서 재생 (모달) ----
   격자가 3열이라 카드 안에서 그대로 틀면 플레이어가 너무 작다. 어두운 바탕 위에
   16:9 큰 화면으로 띄운다.
   ⚠️ iframe 은 열 때 만들고 닫을 때 지운다. 카드마다 미리 깔아 두면 화면이 무거워지고,
   닫아도 소리가 남는다. 지우는 것이 소리를 끊는 가장 확실한 방법이다.
   ⚠️ youtube-nocookie 를 쓴다 — 일반 도메인은 재생 전부터 쿠키를 심는다. */
function wkPlayUrl(w){
  var id = String((w && w.videoId) || "");
  /* 규칙에서 이미 막지만 화면에서도 한 번 더 본다 — 주소를 문자열로 잇는 자리다 */
  if (!/^[A-Za-z0-9_-]{6,20}$/.test(id)) return "";
  id = encodeURIComponent(id);
  return wkIsVimeo(w)
    ? "https://player.vimeo.com/video/"+id+"?autoplay=1"
    : "https://www.youtube-nocookie.com/embed/"+id+"?autoplay=1&rel=0";
}
function wkClose(){
  if (!wkModal) return;
  wkModal.classList.remove("on");
  wkModal.innerHTML = "";                       /* iframe 제거 = 소리 정지 */
  document.documentElement.style.overflow = wkPrevOverflow;
  document.removeEventListener("keydown", wkKey);
  if (wkLastFocus && wkLastFocus.focus){ try { wkLastFocus.focus({ preventScroll:true }); } catch(e){} }
  wkLastFocus = null;
}
function wkKey(e){
  if (e.key === "Escape"){ e.preventDefault(); wkClose(); }
}
function wkOpen(id){
  var w = wkById[id];
  if (!w) return;
  var src = wkPlayUrl(w);
  var orig = ctSafeUrl(w.url||"");
  var pf = wpCache[w.uid] || null;
  var vim = wkIsVimeo(w);
  var by = w.by || (pf && pf.nick) || "익명";
  if (w.orig) orig = w.orig;                    /* 수집 영상은 원래 주소를 그대로 둔다 */
  if (!src && orig){
    if (orig.match(/\.(jpg|jpeg|png|webp|gif)$/i) || orig.indexOf("user-attachments") > 0){
      bdOpenImg(orig, w.title||"작품 이미지");
      return;
    }
    var pv = wkParse(orig);
    if (pv){
      w.videoId = pv.id;
      src = wkPlayUrl(w);
    }
  }
  if (!src){ if (orig) window.open(orig, "_blank", "noopener"); return; }
  wkLastFocus = document.activeElement;
  if (!wkModal){
    wkModal = document.createElement("div");
    wkModal.className = "wk-modal";
    wkModal.setAttribute("role", "dialog");
    wkModal.setAttribute("aria-modal", "true");
    wkModal.setAttribute("aria-label", "작품 재생");
    /* 바깥(어두운 바탕)을 누르거나 × 를 누르면 닫는다 */
    wkModal.onclick = function(e){
      var t = e.target;
      if (t === wkModal){ wkClose(); return; }
      if (t && t.closest && t.closest("[data-wkclose]")) wkClose();
    };
    document.body.appendChild(wkModal);
  }
  wkModal.innerHTML =
    "<div class='wk-box'>"+
      "<div class='wk-mhead'>"+
        "<div>"+
          "<h2 class='wk-mtitle'>"+esc(w.title||"(제목 없음)")+"</h2>"+
          "<p class='wk-mby'>"+esc(by)+"</p>"+
        "</div>"+
        "<button type='button' class='wk-x' data-wkclose aria-label='닫기'>×</button>"+
      "</div>"+
      "<div class='wk-frame'>"+
        "<iframe src='"+esc(src)+"' title='"+esc(w.title||"작품")+"'"+
          " allow='autoplay; fullscreen; picture-in-picture' allowfullscreen"+
          " referrerpolicy='strict-origin-when-cross-origin'></iframe>"+
      "</div>"+
      /* 임베드를 막아 둔 영상은 여기서 재생되지 않는다 — 나갈 문을 남긴다 */
      "<p class='wk-mfoot'>"+
        (orig ? "<a href='"+esc(orig)+"' target='_blank' rel='noopener noreferrer'>"+
                (vim ? "비메오" : "유튜브")+"에서 보기 ↗</a>" : "")+
      "</p>"+
    "</div>";
  wkPrevOverflow = document.documentElement.style.overflow || "";
  document.documentElement.style.overflow = "hidden";   /* 배경 스크롤 잠금(위치는 그대로) */
  wkModal.classList.add("on");
  document.addEventListener("keydown", wkKey);
  var x = wkModal.querySelector("[data-wkclose]");
  if (x){ try { x.focus({ preventScroll:true }); } catch(e){ x.focus(); } }
}
function wkGrid(list){
  return "<div class='wk-grid'>"+(list||[]).map(wkCard).join("")+"</div>";
}
/* 좋아요는 게시판과 같은 구조다 — works/{id}/likes/{uid} 문서가 진실이고 숫자는 따로 센다 */
function wkPrefetchLikes(list){
  if (!bdUser || !fbDb || !(list||[]).length) return;
  list.forEach(function(w){
    fbDb.collection("works").doc(w.id).collection("likes").doc(bdUser.uid).get()
      .then(function(d){
        if (!d.exists) return;
        wkLiked[w.id] = true;
        var b = C.querySelector("[data-wklike='"+w.id+"']");
        if (b){ b.classList.add("on"); b.setAttribute("aria-pressed","true"); }
      }, function(){});
  });
}
function wkToggleLike(el){
  if (!bdUser){ bdToast("로그인하면 좋아요를 누를 수 있습니다."); return; }
  if (!fbDb) return;
  var id = el.getAttribute("data-wklike");
  var on = !wkLiked[id];
  var numEl = el.querySelector("b");
  var n = Number(String(numEl.textContent||"0").replace(/[^\d]/g,"")) || 0;
  wkLiked[id] = on;
  el.classList.toggle("on", on);
  el.setAttribute("aria-pressed", String(on));
  numEl.textContent = nfmt(Math.max(0, n + (on?1:-1)));
  var doc = fbDb.collection("works").doc(id);
  var like = doc.collection("likes").doc(bdUser.uid);
  var w = on
    ? like.set({ uid:bdUser.uid, createdAt:firebase.firestore.FieldValue.serverTimestamp() })
    : like["delete"]();
  w.then(function(){
    return doc.update({ likeCount: firebase.firestore.FieldValue.increment(on?1:-1) });
  })["catch"](function(){});
}
function wkDelete(el){
  if (!fbDb) return;
  var id = el.getAttribute("data-wkdel");
  if (!window.confirm("이 작품을 내릴까요? 되돌릴 수 없습니다.")) return;
  el.disabled = true;
  fbDb.collection("works").doc(id)["delete"]().then(function(){
    var card = el.closest(".wk-card");
    if (card && card.parentNode) card.parentNode.removeChild(card);
  }, function(){
    el.disabled = false;
    bdToast("지우지 못했습니다.");
  });
}

/* ---- 등록 폼 ----
   칸은 셋(주소·제목·관련 공모전)뿐이고 공모전은 선택이다. 본인 작품 확인은 체크 하나.
   프로필이 없으면 등록 대신 프로필부터 만들게 한다 — 작품에 이름을 걸 곳이 프로필뿐이라
   (구글 이름·메일은 쓰지 않는다) 순서가 이렇게 된다. */
function wkForm(host, done, opt){
  if (!host) return;
  opt = opt || {};
  var coll = opt.coll || "works";   /* 기본은 갤러리(works). 작품소개 관리자 폼은 picks 로 저장한다 */
  var isPick = coll === "picks";
  if (!bdUser){
    host.innerHTML = "<div class='bd-composer'>"+
      "<p class='bd-lead' style='margin-top:0'>내 작품 올리기</p>"+
      "<div class='bd-cfoot'><span class='bd-hint'>구글 계정으로 3초면 시작합니다</span>"+
      "<button type='button' class='btn' data-login>구글 계정으로 로그인</button></div></div>";
    return;
  }
  if (wpMine === undefined){
    host.innerHTML = "<div class='bd-composer'>"+emptyNote("확인하는 중입니다.")+"</div>";
    wpMineLoad().then(function(){ if (C.contains(host)) wkForm(host, done, opt); });
    return;
  }
  /* ⚠️ 프로필이 있든 없든 여기서 막지 않는다. 예전에는 "먼저 프로필을 만들어 주세요"로
     돌려보냈는데, 올리러 온 사람이 화면을 떠나야 해서 사실상 막다른 길이었다 —
     대표가 "작품 갤러리 올릴 수 없음"이라고 한 지점이다(2026-08-15).
     프로필은 로그인할 때 저절로 만들어지고(wpAutoProfile), 없어도 올리는 데 지장이 없다. */
  host.innerHTML = "<div class='bd-composer'>"+
    "<p class='bd-lead' style='margin-top:0'>"+(isPick ? "작품 소개에 올리기" : "내 작품 올리기")+"</p>"+
    "<div class='pf-form'>"+
      "<label class='pf-lab'>작품 주소"+
        "<input class='bd-in' type='url' inputmode='url' maxlength='300' data-wkurl"+
          " placeholder='유튜브 · 비메오 주소를 붙여넣으세요' aria-label='작품 주소'></label>"+
      "<label class='pf-lab'>제목"+
        "<input class='bd-in' type='text' maxlength='"+WK_TITLE_MAX+"' data-wktitle"+
          " placeholder='작품 제목' aria-label='작품 제목'></label>"+
      "<label class='pf-lab'>관련 공모전 (선택)"+
        "<select class='bd-in' data-wkct aria-label='관련 공모전(선택)'>"+
          "<option value=''>선택 안 함</option></select></label>"+
    "</div>"+
    "<p class='bd-msg' data-wkmsg></p>"+
    "<div class='bd-cfoot'>"+
      (isPick ? "" : "<label class='bd-hint'><input type='checkbox' data-wkown> 본인이 만든 작품입니다</label>")+
      "<button type='button' class='btn' data-wksend>등록</button>"+
    "</div></div>";
  var urlEl = host.querySelector("[data-wkurl]");
  var titleEl = host.querySelector("[data-wktitle]");
  var ctEl = host.querySelector("[data-wkct]");
  var ownEl = host.querySelector("[data-wkown]");
  var msg = host.querySelector("[data-wkmsg]");
  var send = host.querySelector("[data-wksend]");

  /* 공모전 목록은 늦게 채운다 — 목록이 아직 없어도 나머지 칸은 바로 쓸 수 있어야 한다 */
  wpContestMap().then(function(map){
    if (!C.contains(ctEl)) return;
    var keys = Object.keys(map).sort(function(a,b){ return map[a] < map[b] ? -1 : 1; });
    ctEl.innerHTML = "<option value=''>선택 안 함</option>"+
      keys.map(function(s){
        return "<option value='"+esc(s)+"'>"+esc(map[s])+"</option>";
      }).join("");
  }, function(){});

  send.onclick = function(){
    var v = wkParse(urlEl.value);
    if (!v){ msg.textContent = "유튜브 또는 비메오 주소만 등록할 수 있습니다."; return; }
    var title = String(titleEl.value||"").trim();
    if (title.length < 1 || title.length > WK_TITLE_MAX){
      msg.textContent = "제목은 1자 이상 "+WK_TITLE_MAX+"자 이하로 적어 주세요."; return;
    }
    if (!isPick && (!ownEl || !ownEl.checked)){ msg.textContent = "본인이 만든 작품인지 확인해 주세요."; return; }
    send.disabled = true; msg.textContent = "등록하는 중입니다.";
    /* 갤러리(works)만 하루 상한을 센다. 관리자 큐레이션(picks)에는 상한을 두지 않는다 */
    var guard = isPick ? Promise.resolve(0) : wkCountToday();
    guard.then(function(n){
      if (!isPick && n >= WK_DAY_MAX){
        send.disabled = false;
        msg.textContent = "하루에 "+WK_DAY_MAX+"건까지 등록하실 수 있습니다.";
        return;
      }
      return fbDb.collection(coll).add({
        uid: bdUser.uid,
        title: title,
        url: wkCanon(v.kind, v.id),
        videoId: v.id,
        contestSlug: String(ctEl.value||""),
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        likeCount: 0   /* 규칙이 0 을 요구한다 — 처음부터 부풀린 값으로 만들 수 없게 */
      }).then(function(){
        urlEl.value = ""; titleEl.value = ""; ctEl.value = ""; if (ownEl) ownEl.checked = false;
        send.disabled = false; msg.textContent = "";
        bdToast("등록했습니다");
        if (done) done();
      });
    })["catch"](function(e){
      send.disabled = false;
      if (window.console && console.error) console.error("[작품]", e);
      msg.textContent = "등록하지 못했습니다. 잠시 후 다시 시도해 주세요.";
    });
  };
}
/* 하루 상한은 화면에서 센다. Firestore 규칙은 "이 사람이 오늘 몇 건 올렸나"를 셀 수 없다 —
   규칙이 막을 수 있는 것은 createdAt 위조까지다(반드시 서버 시각이어야 한다).
   그러니 이 숫자는 실수 방지선이지 마지막 방어선이 아니다. */
function wkCountToday(){

/* ---- 내 계획 ----
   담아 둔 것을 마감 가까운 순으로 보여 준다. 목록 하나로 끝낸다 —
   연간 타임라인 같은 것은 담긴 게 쌓인 다음에 생각할 일이다. */
var SV_LABEL = { contest:"공모전", festival:"영화제", gov:"지원사업" };
function svRow(o, today){
  var due = String(o.deadline||"");
  var has = /^\d{4}-\d{2}-\d{2}$/.test(due);
  var di = has ? ddayInfo(due, today) : { cls:"tbd", txt:"미정" };
  var meta = [];
  meta.push("<b>"+esc(SV_LABEL[o.kind] || "항목")+"</b>");
  meta.push(has ? "마감 "+esc(due) : "마감일 미정");
  return row({ dd:di.txt, ddCls:di.cls, title:o.title || "(제목 없음)",
               meta:meta, url:o.url,
               save:{ key:o.key || o.id, kind:o.kind, title:o.title,
                      deadline:due, url:o.url } });
}
function renderPlan(){
  setKicker(["내 계획"]);

      "<p class='cta-row'><a class='btn solid' href='"+esc(joinUrl())+"'>로그인하고 시작하기</a></p>"+
      "</div></div></section>";
    return;
  }
  C.innerHTML = "<section class='section paper'><div class='inner'>"+
    sectionHead("My plan","담아 둔 것을<br>한자리에.","마감이 가까운 순입니다.","")+
    "<div data-planbody>"+emptyNote("불러오는 중입니다.")+"</div>"+
    "</div></section>";
  var host = C.querySelector("[data-planbody]");
  svLoaded = false;                       /* 이 화면에서는 늘 새로 읽는다 */
  svLoad().then(function(m){
    if (curRoute()!=="plan" || !C.contains(host)) return;
    var today = todaySeoul();
    var all = [], k;
    for (k in m){ if (m.hasOwnProperty(k)) all.push(m[k]); }
    function ms(o){
      var d = String(o.deadline||"");
      return /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : "9999-99-99";   /* 미정은 뒤로 */
    }
    var live = [], past = [];
    all.forEach(function(o){
      var d = String(o.deadline||"");
      var p = /^\d{4}-\d{2}-\d{2}$/.test(d) ? parseDate(d) : null;
      (p && p < today ? past : live).push(o);
    });
    live.sort(function(a,b){ return ms(a).localeCompare(ms(b)); });
    past.sort(function(a,b){ return ms(b).localeCompare(ms(a)); });
    setFacts([[String(all.length),"담은 것"],
              [String(dueWithin(live,"deadline",7,today)),"이번 주 마감"],
              [String(past.length),"지난 것"]]);
    if (!all.length){
      host.innerHTML = "<div class='bd-empty'><p>아직 담은 것이 없습니다. "+
        "마음에 드는 공모전에서 담기를 눌러 보세요.</p>"+
        "<a class='btn' href='"+esc(menuHref("contests"))+"'>AI 공모전 보기</a></div>";
      return;
    }
    host.innerHTML = "<div class='rows plan-rows'>"+
      (live.length ? live.map(function(o){ return svRow(o, today); }).join("")
                   : emptyNote("마감이 남은 것이 없습니다."))+"</div>"+
      (past.length ? foldSection("paper-alt","Passed","지난 것", past.length+"건",
        "<div class='rows'>"+past.map(function(o){ return svRow(o, today); }).join("")+"</div>") : "");
    bindFold(C);
    observeReveal();
  }, function(){
    if (!C.contains(host)) return;
    host.innerHTML = emptyNote("목록을 불러오지 못했습니다. 잠시 후 다시 열어 주세요.");
  });

/* 한글 자모 분해형(NFD)을 합쳐진 형(NFC)으로. 맥에서 올린 제목은 자모가 분해돼 있어
   그대로 비교하면 같은 글자도 안 맞는다. normalize 없는 옛 브라우저는 원문 그대로 둔다. */
function wkNfc(s){ s = String(s || ""); return s.normalize ? s.normalize("NFC") : s; }
/* 페이지네이션 상태 — 게시판(bdCursor/bdMore/bdBusy)과 같은 방식이다. 폼을 여닫으면
   renderGallery 가 다시 불려 처음부터 받는다. WK_PAGE 는 이제 상한이 아니라 페이지 크기다. */
var wkCursor = null, wkMore = false, wkBusy = false;
var wkSearch = "";   /* 갤러리 제목 검색어 — 이미 로드된 작품(wkFeed)만 거른다 */
function wkReset(){ wkFeed = []; wkCursor = null; wkMore = false; wkBusy = false; }
/* 이미 로드된 작품만 제목으로 거른다(Firestore 부분일치 쿼리는 없다). '더 보기'로 더 받은
   것도 함께 걸린다. ⚠️ 제목은 NFC 로 맞춰 소문자 비교한다(맥 NFD 대응, 검색어도 같게). */
function wkFilter(list){
  var q = wkNfc(String(wkSearch||"").trim()).toLowerCase();
  if (!q) return list;
  var out = [], i, t;
  for (i = 0; i < list.length; i++){
    t = wkNfc(String((list[i] && list[i].title) || "")).toLowerCase();
    if (t.indexOf(q) >= 0) out.push(list[i]);
  }
  return out;
}
/* 대표 지시(2026-08-17): 이 두 작품은 갤러리 맨 아래로 내린다. 나머지는 최신순 그대로.
   createdAt 은 서버 고정값이라 못 바꾸므로 화면에서 정렬로 내린다(제목 포함 매칭).
   ⚠️ 맥에서 올린 제목은 한글이 자모 분해형(NFD)이라 NFC 로 맞춘 뒤 비교한다.
   'The Last Signal' 은 영문 제목이라 'Last Signal' 로 잡는다.
   페이지네이션과 안 싸우게 누적 목록(wkFeed)에 그릴 때마다 적용한다. */
function wkSort(list){
  var SINK = ["혈계", "Last Signal"];
  var keep = [], sink = [], i, k, t, s;
  for (i = 0; i < list.length; i++){
    t = wkNfc((list[i] && list[i].title) || ""); s = false;
    for (k = 0; k < SINK.length; k++){ if (t.indexOf(wkNfc(SINK[k])) >= 0){ s = true; break; } }
    (s ? sink : keep).push(list[i]);
  }
  return keep.concat(sink);
}
/* 누적 목록을 이어 받는다 — WK_PAGE 만큼 받고, 그만큼 꽉 차면 아래 "더 보기"(무한 스크롤
   sentinel · 폴백 버튼)로 다음 페이지를 잇는다. 상한이 없다(대표 지시 2026-08-17). */
function wkLoad(rows){
  if (!rows.querySelector("[data-wkgrid]")){
    rows.innerHTML = "<div data-wkgrid></div><div class='bd-more' data-wkmore></div>";
  }
  var gridEl = rows.querySelector("[data-wkgrid]");
  var moreEl = rows.querySelector("[data-wkmore]");
  /* 검색창은 grid 바깥(wk-bar)에 있어 다시 그려도 포커스·값이 유지된다. 입력하면 서버를
     다시 부르지 않고 이미 받은 목록만 필터해 그린다(paint). */
  var searchEl = C.querySelector("[data-wksearch]");
  if (searchEl){
    searchEl.value = wkSearch;
    searchEl.oninput = function(){ wkSearch = searchEl.value; paint(); };
  }
  var hasIo = ("IntersectionObserver" in window);
  var sentIo = null;
  function watchSentinel(){
    if (sentIo){ sentIo.disconnect(); sentIo = null; }
    if (!wkMore || !hasIo) return;
    var s = moreEl.querySelector("[data-sentinel]");
    if (!s) return;
    sentIo = new IntersectionObserver(function(en){
      if (en[0] && en[0].isIntersecting) load(false);
    }, { rootMargin:"400px" });
    sentIo.observe(s);
  }
  function paint(){
    var list = wkSort(wkFilter(wkFeed));
    gridEl.innerHTML = list.length ? wkGrid(list)
      : "<div class='bd-empty'><p>"+
        (wkSearch ? "검색 결과가 없습니다." : "아직 올라온 작품이 없습니다. 첫 작품을 올려 보세요.")+
        "</p></div>";
    moreEl.innerHTML = !wkMore ? ""
      : (hasIo ? "<span class='bd-sentinel' data-sentinel></span><span class='bd-loading'>더 불러오는 중…</span>"
               : "<button type='button' class='btn' data-loadmore>더 보기</button>");
    var mb = moreEl.querySelector("[data-loadmore]");
    if (mb) mb.onclick = function(){ load(false); };
    watchSentinel();
  }
  function load(first){
    if (wkBusy) return;
    wkBusy = true;
    if (first){ if (!wkFeed.length) gridEl.innerHTML = emptyNote("작품을 불러오는 중입니다."); wkCursor = null; }
    var q = fbDb.collection("works").orderBy("createdAt","desc");
    if (!first && wkCursor) q = q.startAfter(wkCursor);
    Promise.all([
      q.limit(WK_PAGE).get(),
      first ? wpContestMap()["catch"](function(){ return {}; }) : Promise.resolve(null)
    ]).then(function(res){
      var sn = res[0];
      if (curRoute()!=="gallery" || !C.contains(rows)){ wkBusy = false; return; }
      var got = [];
      sn.forEach(function(d){ var o = d.data()||{}; o.id = d.id; got.push(o); });
      if (sn.docs && sn.docs.length) wkCursor = sn.docs[sn.docs.length-1];
      wkMore = !!(sn.docs && sn.docs.length === WK_PAGE);
      wkFeed = first ? got : wkFeed.concat(got);
      /* 작성자 이름은 프로필에만 있다. 새 페이지 몫을 먼저 받아 두고 그린다 —
         카드를 그린 뒤에 이름을 끼워 넣으면 글자가 늦게 튀어 들어온다. */
      return wpFetchMany(got).then(function(){
        wkBusy = false;
        if (curRoute()!=="gallery" || !C.contains(rows)) return;
        var who = {};
        wkFeed.forEach(function(w){ if (w.uid) who[w.uid] = 1; });
        setKicker(["AI 작품", wkFeed.length+"편"]);
        setFacts([[String(wkFeed.length),"작품"],[String(Object.keys(who).length),"만든 사람"],
                  [wkFeed.length ? bdWhen(wkFeed[0].createdAt) : "—","최근 등록"]]);
        paint();
        wkPrefetchLikes(got);
        observeReveal();
      });
    }, function(e){
      wkBusy = false;
      if (curRoute()!=="gallery" || !C.contains(rows)) return;
      bdQueryFail(rows, e, function(){ wkReset(); wkLoad(rows); });
    });
  }
  load(true);
}
/* ============================================================================
   상단바 오른쪽 — 검색 · 로그인/가입

   인증은 구글 하나뿐이라 [로그인]과 [가입하기]는 같은 길로 간다. 다른 것은 문구와

/* ---- 검색 색인 ----
   공모전·지원사업·뉴스는 스냅샷을 지연 로드하고(이미 본 화면이면 캐시가 돌아온다),
   영화제·브리핑은 첫 화면이 이미 받아 둔 pub 데이터에서 꺼낸다.
   한 소스가 실패해도 그 몫만 빠진다. */
function nvNorm(s){ return String(s||"").toLowerCase().replace(/\s+/g," ").trim(); }
function nvAdd(out, type, route, title, extra, tab){
  title = String(title||"").trim();
  if (!title) return;
  out.push({ t:type, r:route, q:title, tab:tab||"", s:nvNorm(title+" "+(extra||"")) });
}
function nvBuildIndex(){
  if (nvIdxPromise) return nvIdxPromise;
  function safe(p){ return p.then(function(j){ return j; }, function(){ return null; }); }
  nvIdxPromise = Promise.all([
    safe(fetchContests("all", false)),
    safe(fetchGov(false)),
    safe(loadFeed("news"))
  ]).then(function(r){
    var out = [];
    if (r[0]) CONTEST_SECS.forEach(function(k){
      ((((r[0].sections)||{})[k])||[]).forEach(function(it){
        nvAdd(out, "공모전", "contests", it.title, it.organizer,
              it._region === "해외" ? "overseas" : "domestic");
      });
    });
    ((state.data && state.data.festivals) || []).forEach(function(f){
      nvAdd(out, "영화제", "festivals", f.name, f.host);
    });
    if (r[1]) ((r[1].items)||[]).forEach(function(it){
      nvAdd(out, "지원사업", "gov", it.nm, [it.org, it.inst].join(" "));
    });
    if (r[2]) ((r[2].items)||[]).forEach(function(it){
      nvAdd(out, "뉴스", "newsrep", it.titleKo || it.title, it.source);
    });
    sortedReports().forEach(function(rp){ nvAdd(out, "브리핑", "newsrep", rp.title, ""); });
    nvIdx = out;
    return out;
  });
  nvIdxPromise["catch"](function(){ nvIdxPromise = null; });
  return nvIdxPromise;
}
/* 띄어쓴 낱말을 모두 포함하는 것만 남긴다. 제목이 그 말로 시작하는 것이 먼저다 */
function nvFind(q){
  var n = nvNorm(q);
  if (!n || !nvIdx) return [];
  var terms = n.split(" "), hit = [];
  for (var i=0; i<nvIdx.length; i++){
    var it = nvIdx[i], ok = true;
    for (var t=0; t<terms.length; t++){
      if (it.s.indexOf(terms[t]) < 0){ ok = false; break; }
    }
    if (!ok) continue;
    var pos = nvNorm(it.q).indexOf(n);
    it.rank = pos === 0 ? 0 : (pos > 0 ? 1 : 2);
    hit.push(it);
    if (hit.length >= 60) break;
  }
  hit.sort(function(a,b){ return a.rank - b.rank; });
  return hit.slice(0, 8);
}
function nvDrawRes(){
  var box = document.getElementById("navRes");
  var inEl = document.getElementById("navSearchIn");
  if (!box || !inEl) return;
  if (!String(inEl.value||"").trim()){ box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  /* 색인이 아직 안 만들어졌는데 "없습니다"라고 하면 거짓말이다 — 그때는 기다리라고 한다 */
  if (!nvHits.length){
    box.innerHTML = "<p>"+(nvIdx ? "검색 결과가 없습니다." : "목록을 불러오는 중입니다.")+"</p>";
    return;
  }
  box.innerHTML = nvHits.map(function(it, i){
    /* href 를 진짜 주소로 둔다 — 새 탭·링크 복사가 평소대로 동작한다.
       그냥 누르면 아래 nvPick 이 가로채 검색어까지 들고 넘어간다. */
    return "<a class='"+(i===nvSel?"on":"")+"' href='"+esc(BASE+"#"+it.r)+"'"+
      " data-nvhit='"+i+"'><b>"+esc(it.t)+"</b><span>"+esc(it.q)+"</span></a>";
  }).join("");
}
function nvRun(){
  var inEl = document.getElementById("navSearchIn");
  if (!inEl) return;
  nvHits = nvFind(inEl.value);
  nvSel = -1;
  nvDrawRes();
}
/* 고른 결과의 화면으로 간다. 그 화면에 검색칸이 있으면 제목을 넣어 걸러진 채로 도착한다 */
function nvPick(i){
  var it = nvHits[i];
  if (!it) return;
  if (it.r === "contests"){
    contestTab = it.tab || contestTab;
    contestCat = "전체";
    contestSearch = it.q;
  } else if (it.r === "festivals"){
    festSearch = it.q;
  } else if (it.r === "gov"){
    govCls = "전체";
    /* AI 관련만 켜 둔 채로 보내면 찾은 공고가 그 필터에 걸려 빈 화면이 된다 */
    govAiOnly = false;
    govSearch = it.q;
  }
  nvClose();
  nvNav(it.r);
}
/* 해시 화면으로의 이동. 게시판·프로필(실제 경로)에 있을 때 location.hash 만 바꾸면
   /u/xxx#contests 가 되므로 베이스 기준으로 주소를 새로 만든다. */
function nvNav(route){
  var url = BASE + "#" + route;
  if (location.pathname + location.hash === url){
    render(); window.scrollTo({ top:0, behavior:"auto" });
    return;
  }
  history.pushState(null, "", url);
  onNav();
}
function nvClose(){
  var wrap = document.getElementById("navSearch");
  var inEl = document.getElementById("navSearchIn");
  var btn = document.getElementById("navSearchBtn");
  if (wrap) wrap.classList.remove("open");
  if (btn) btn.setAttribute("aria-expanded","false");
  if (inEl) inEl.value = "";
  nvHits = []; nvSel = -1;
  nvDrawRes();
}
/* 모바일의 돋보기. 열면 위 줄을 덮는 입력칸이 되고, 다시 누르면 닫힌다 */
function nvToggle(){
  var wrap = document.getElementById("navSearch");
  var inEl = document.getElementById("navSearchIn");
  var btn = document.getElementById("navSearchBtn");
  if (!wrap) return;
  var on = !wrap.classList.contains("open");
  if (!on){ nvClose(); return; }
  wrap.classList.add("open");
  if (btn) btn.setAttribute("aria-expanded","true");
  nvBuildIndex().then(function(){ nvRun(); }, function(){});
  if (inEl) inEl.focus();
}
/* 모바일 햄버거 — 누르면 메뉴(nav-links)가 위 줄 아래로 펼쳐진다. 다시 누르면 닫힌다.
   메뉴 항목을 누르면 화면이 바뀌며 buildNav 가 다시 그려질 때 nvBurgerClose 로 자동으로 닫힌다. */
function nvBurgerToggle(){
  var nav = document.querySelector(".nav");
  var btn = document.getElementById("navBurger");
  if (!nav) return;
  var on = !nav.classList.contains("menu-open");
  nav.classList.toggle("menu-open", on);
  if (btn) btn.setAttribute("aria-expanded", String(on));
}
function nvBurgerClose(){
  var nav = document.querySelector(".nav");
  var btn = document.getElementById("navBurger");
  if (nav) nav.classList.remove("menu-open");
  if (btn) btn.setAttribute("aria-expanded", "false");
}
function nvBind(){
  var burger = document.getElementById("navBurger");
  if (burger) burger.onclick = function(){ nvBurgerToggle(); };
  var inEl = document.getElementById("navSearchIn");
  var btn = document.getElementById("navSearchBtn");
  var box = document.getElementById("navRes");
  var auth = document.getElementById("navAuth");
  if (!inEl || !btn || !box || !auth) return;

  btn.onclick = function(){ nvToggle(); };
  /* 색인은 여기서 처음 만들어진다 — 검색할 마음이 생긴 다음이다 */
  inEl.onfocus = function(){ nvBuildIndex().then(function(){ nvRun(); }, function(){}); };
  inEl.oninput = function(){ nvRun(); };
  inEl.onkeydown = function(e){
    var k = e.key;
    if (k === "Escape"){ nvClose(); inEl.blur(); return; }
    if (!nvHits.length) return;
    if (k === "ArrowDown" || k === "ArrowUp"){
      e.preventDefault();
      nvSel += (k === "ArrowDown" ? 1 : -1);
      if (nvSel < 0) nvSel = nvHits.length - 1;
      if (nvSel >= nvHits.length) nvSel = 0;
      nvDrawRes();
      return;
    }
    if (k === "Enter"){ e.preventDefault(); nvPick(nvSel < 0 ? 0 : nvSel); }
  };
  /* mousedown 을 막아 두어야 결과를 누르는 순간 입력칸이 포커스를 잃지 않는다 —
     잃으면 아래 blur 가 목록을 먼저 닫아 click 이 오지 않는다 */
  box.onmousedown = function(e){ e.preventDefault(); };
  box.onclick = function(e){
    var a = (e.target && e.target.closest) ? e.target.closest("[data-nvhit]") : null;
    if (!a) return;
    e.preventDefault();
    nvPick(Number(a.getAttribute("data-nvhit")));
  };
  inEl.onblur = function(){
    /* 모바일 오버레이는 돋보기로 닫는다 — 여기서 닫으면 자판이 내려갈 때 같이 사라진다 */
    setTimeout(function(){
      var wrap = document.getElementById("navSearch");
      if (wrap && wrap.classList.contains("open")) return;
      nvHits = []; nvSel = -1; nvDrawRes();
    }, 160);
  };

  auth.onclick = function(e){
    var t = e.target, el;
    if (!t || !t.closest) return;
    if ((el = t.closest("[data-nvlogin]"))){ nvLoginGo(); return; }
    if ((el = t.closest("[data-nvmenu]"))){ nvMenu(!nvMenuOn); return; }
    if ((el = t.closest("[data-nvlogout]"))){ nvMenu(false); bdLogout(); return; }
    if (t.closest("a")) nvMenu(false);   /* 내 프로필 — 이동은 전역 링크 처리가 맡는다 */
  };
  /* 바깥을 누르면 닫는다.
     캡처 단계(true)에서 본다 — 버블 단계에서 보면 위 핸들러가 먼저 돌아 화면을 바꾼 뒤라
     누른 노드가 이미 제자리에 없을 수 있고, 그러면 안을 눌렀는데도 바깥으로 읽힌다. */
  document.addEventListener("click", function(e){
    if (!nvMenuOn) return;
    var t = e.target;
    if (t && t.closest && t.closest("#navAuth")) return;
    nvMenu(false);
  }, true);
}

/* ---- 관심 분야 (맞춤 추천 1단계) ----
   실제 데이터 분포에서 뽑은 다섯 갈래다(2026-08-16 실측):
   AI 영상 132·영화제 97 → 영상·영화 / AI 이미지·디자인 ~45 → 이미지·디자인 /
   AI 해커톤 57·웹·게임 → 개발·바이브코딩 / 예체능·음악 → 음악·사운드 /
   지원사업 전량(창업·사업화·멘토링…) → 창업·지원사업.
   매칭은 제목·분류·종류 문자열에 키워드가 들어 있는지만 본다 — 데이터가 적어
   정교한 추천은 오히려 엉뚱해진다. 키워드는 여기 한 곳에서만 고친다. */
var INTEREST_CATS = ["영상·영화","이미지·디자인","개발·바이브코딩","음악·사운드","창업·지원사업"];
var WP_INT_MAX = 6;   /* rules: interests.size() <= 6 */
var INTEREST_KEYS = {
  "영상·영화": ["영상","영화","비디오","video","film","ucc","vfx","모션","motion","애니","광고","마케팅","숏폼","short"],
  "이미지·디자인": ["이미지","image","디자인","design","그래픽","일러스트","캐릭터","웹툰","포스터","아트","사진"],
  "개발·바이브코딩": ["개발","코딩","코드","해커톤","hackathon","소프트웨어","게임","game","프로그","앱","웹/모바일","데이터","과학","공학","딥테크"],
  "음악·사운드": ["음악","사운드","music","sound","오디오","audio","작곡","보컬","노래","song"],
  "창업·지원사업": ["창업","지원사업","사업화","투자","스타트업","startup","펀딩","자금","보육","멘토링","서포터즈","네트워크","글로벌","판로","r&d","융자","정책자금"]
};
function homeIntMatch(it, interests){
  var hay = (String(it.kind||"")+" "+String(it.title||"")+" "+String(it.cat||"")+" "+String(it.extra||"")).toLowerCase();
  for (var i=0;i<interests.length;i++){
    var kws = INTEREST_KEYS[interests[i]] || [];
    for (var j=0;j<kws.length;j++){ if (hay.indexOf(String(kws[j]).toLowerCase())>=0) return true; }
  }
  return false;
}

/* 같은 공고가 두 소스에 들어 있는 경우가 있다(영화제이면서 해외 공모전으로도 수집된 건).
   제목과 마감일이 같으면 한 줄로 본다. */
function homeMerge(list){
  var seen = {}, out = [];
  (list || []).forEach(function(it){
    if (!it || !it.title) return;
    var key = String(it.title).replace(/\s+/g, "").toLowerCase() + "|" + it.due;
    if (seen[key]) return;
    seen[key] = 1;
    out.push(it);
  });
  out.sort(function(a, b){ return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; });
  return out;
}
function homeDays(due, today){
  var d = parseDate(due);
  if (!d) return null;
  return Math.round((d - today) / 86400000);
}
/* 오늘 마감은 "D-DAY"가 아니라 "오늘"이라고 쓴다. 남은 날짜를 세는 칸에서 오늘만은
   셀 것이 없다 — 지금 넣어야 한다는 말이 더 빨리 읽힌다. 칸이 좁아(모바일 62px)
   큰 글씨로는 두 글자까지이므로 나머지 한마디는 아래 meta 줄이 받는다. */
function homeDueRow(it, today){
  var n = homeDays(it.due, today);
  var di = ddayInfo(it.due, today);
  var meta = [];
  if (it.org) meta.push("<b>" + esc(it.org) + "</b>");
  meta.push(n === 0 ? "오늘 마감" : "마감 " + esc(it.due));
  var d = HOME_SLUG_DIR[it.kind];
  return row({ save:{ kind:(d ? d[0] : "contest"), title:it.title, org:it.org,
                      deadline:it.due||"", url:it.url },
               dd:(n === 0 ? "오늘" : di.txt), ddCls:di.cls, title:it.title || "(제목 없음)",
               tags:[it.kind, it.extra], meta:meta, url:it.url });
}

/* 영화제는 pub 데이터에 들어 있다. 이미 받아 둔 것이 있으면 그걸 쓰고, 없으면 저장소
   스냅샷을, 그것도 안 되면 파일에 박아 둔 목록을 쓴다 — 영화제 화면과 같은 순서다. */
function homeFestList(){

    .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(j){ return (j && j.festivals) || []; })
    .catch(function(){ return FESTIVALS || []; });
}

/* ---- 히어로 레이더 ----
   배경의 동심원에 실제 마감을 점으로 찍는다. 장식이 아니라 이 서비스가 하는 일의 그림이다 —
   가운데에 가까울수록 마감이 임박했고, 사흘 안쪽은 붉다. 링을 한 바퀴 도는 스윕과 합쳐
   "지금 무엇이 잡히고 있는지"가 한 장으로 보인다.

   이미지를 쓰지 않는다. 첫 화면에 그림 파일을 물리면 그만큼 늦게 뜨는데, 여기서 필요한 건
   원 몇 개와 점 몇십 개라 CSS 로 충분하다. 링과 같은 중심(76%,46%)에 좌표만 맞추면 되므로
   SVG 도 필요 없다 — 점 하나가 요소 하나다. */
function homeRadarDots(list, today){
  var el = document.getElementById("heroDots");
  if (!el) return;
  list = list || [];
  /* 앞에서부터 서른 개를 찍으면 전부 사흘 안쪽이라 화면이 온통 붉어진다(실측 30개 중 28개).
     그러면 "임박한 것이 붉다"는 뜻이 사라진다. 목록 전체에서 고르게 건너뛰며 뽑아
     오늘부터 한 달 넘게까지가 안에서 바깥으로 퍼지게 한다. */
  var out = [], n = Math.min(list.length, 30);
  var step = Math.max(1, Math.floor(list.length / n));
  /* 얼굴 회피 상자. 인물 얼굴은 사진 상단에 있고 화면에서는 대략 가로 57~81%,
     사진 박스 세로 상단 47% 안이다(초점 67% 8% 기준 실측). 점이 얼굴 위에 얹히면
     잡티처럼 보인다(대표 실보고 2026-08-15) — 그 구역에 떨어지는 점만 건너뛴다.
     left 의 vw 는 히어로가 화면 전폭이라 % 와 같고, top 의 vw 만 px 로 바꿔 비교한다. */
  var hero = document.getElementById("top");
  var bg = hero ? hero.querySelector(".hero-bg") : null;
  var heroH = hero ? hero.offsetHeight : 0;
  var photoH = (bg && bg.offsetHeight) ? bg.offsetHeight : heroH;
  for (var i = 0; i < n; i++){
    var it = list[i * step];
    if (!it) break;
    var d = homeDays(it.due, today);
    if (d === null || d < 0) continue;
    /* 반지름은 남은 날짜다. 가장 안쪽 링이 13vw 이므로 오늘 마감이 그 안에 들어온다 */
    var r = 9 + Math.min(d, 45) * 0.92;
    /* 황금각으로 흩는다 — 규칙적으로 놓으면 눈금처럼 보이고, 난수를 쓰면 그릴 때마다 달라진다 */
    var a = i * 2.39996;
    var dx = r * Math.cos(a), dy = r * Math.sin(a);
    if (heroH){
      var topPx = 0.46 * heroH + dy * window.innerWidth / 100;
      if (76 + dx > 57 && 76 + dx < 81 && topPx < photoH * 0.47) continue;
    }
    var cls = d <= 3 ? " hot" : (d <= 7 ? " warm" : "");
    /* i 가 아니라 span 이다 — 링을 그리는 .hero-radar i 규칙이 자손 i 를 전부 잡아
       점까지 26vw~104vw 짜리 원으로 만들어 버린다(2026-08-15 실측). */
    out.push("<span class='dot" + cls + "' style='left:calc(76% + " + dx.toFixed(2) +
      "vw); top:calc(46% + " + dy.toFixed(2) + "vw)'></span>");
  }
  el.innerHTML = out.join("");
}

/* 오늘 들어온 뉴스 개수. 수집물의 date 는 UTC 라 앞 10자만 자르면 하루가 밀린다 */
function homeYmd(d){
  var m = d.getMonth() + 1, dd = d.getDate();
  return d.getFullYear() + "-" + (m < 10 ? "0" + m : m) + "-" + (dd < 10 ? "0" + dd : dd);
}
function homeTodayNews(j, today){
  var ymd = homeYmd(today), n = 0;
  ((j && j.items) || []).forEach(function(it){ if (ymdKST(it.date) === ymd) n++; });
  return n;
}
function homeTechCount(j){
  if (!j) return 0;
  return ((j.github || []).length) + ((j.huggingface || []).length) + ((j.arxiv || []).length);
}

/* 세 소스를 각각 붙잡는다. 하나가 죽어도 나머지 두 종류는 그대로 나온다 —
   목록 전체가 사라지는 것보다 낫다. */
function homeFillDue(){
  var el = document.getElementById("homeDue");
  if (!el) return;
  var today = todaySeoul();
  var pC = fetchContests("all", false).then(homeFromContests, function(){ return []; });
  var pF = homeFestList().then(homeFromFestivals, function(){ return []; });
  var pG = fetchGov(false).then(homeFromGov, function(){ return []; });
  /* 숫자 줄이 마감 일색이면 공모전 사이트로 읽힌다. 성격이 다른 두 칸을 붙여
     여기가 무엇을 다루는 곳인지 숫자만 보고도 알게 한다. 둘 다 실패하면 그 칸이 빠질 뿐이다 */
  var pN = loadFeed("news").then(function(j){ return j; }, function(){ return null; });
  var pT = loadFeed("tech").then(function(j){ return j; }, function(){ return null; });

  Promise.all([pC, pF, pG, pN, pT]).then(function(res){
    if (curRoute() !== "home") return;
    var all = homeMerge(res[0].concat(res[1]).concat(res[2]));
    var open = [], today0 = 0, per = { "공모전":0, "영화제":0, "지원사업":0 };
    all.forEach(function(it){
      var n = homeDays(it.due, today);
      if (n === null || n < 0) return;
      open.push(it);
      if (n === 0) today0++;
      if (per[it.kind] != null) per[it.kind]++;
    });
    homeCounts = per;
    homeRadarDots(open, today);
    /* 오늘 마감이 있는 날에만 그 칸을 경고색으로 둔다. 전부 같은 색이면
       "오늘"과 "이번 달"이 같은 무게로 읽힌다.
       뉴스·기술 동향은 0이면 칸을 빼 버린다 — 0 을 보여 주면 비어 있는 서비스로 읽힌다. */
    var facts = [[String(open.length), "접수 중"],
                 [String(today0), "오늘 마감", today0 > 0 ? "hot" : ""]];
    var newsN = homeTodayNews(res[3], today);
    var techN = homeTechCount(res[4]);
    if (newsN > 0) facts.push([String(newsN), "오늘 새 소식"]);
    if (techN > 0) facts.push([String(techN), "기술 동향"]);
    setFacts(facts);
    var top = open.slice(0, 20);
    el.innerHTML = top.length
      ? top.map(function(it){ return homeDueRow(it, today); }).join("")
      : emptyNote("지금 접수 중인 공고가 없습니다.");
    homeLinkInner(top);
    homeFillInterests(open, today);
    homeFillMenu();
    observeReveal();
    /* 목록이 채워져 위쪽 높이가 확정된 뒤라야 구독 칸 위치가 안 어긋난다 */
    if (homeSubPending) homeScrollSub();
  });
}

/* ---- 관심 분야 마감 임박 ----
   로그인 + 관심 분야가 있을 때만 홈 맨 위에 뜬다. homeFillDue 가 이미 만든
   접수 중 목록(open)을 그대로 받아 다시 받아오지 않는다. 프로필(wpMine)이 아직
   로딩 전이면 오는 대로 다시 그린다 — 로그인 직후에도 저절로 채워진다. */
var homeIntOpen = null, homeIntToday = null;
function homeFillInterests(open, today){
  homeIntOpen = open; homeIntToday = today;
  homeIntPaint();
}
function homeIntPaint(){
  var sec = document.getElementById("homeIntSec");
  var el = document.getElementById("homeInt");
  if (!sec || !el || curRoute()!=="home") return;
  if (!bdUser){ sec.style.display = "none"; return; }        /* 로그인해야 보이는 기능 */
  if (wpMine === undefined){                                  /* 프로필 아직 모름 */
    wpMineLoad().then(function(){ homeIntPaint(); }, function(){});
    return;
  }
  var interests = (wpMine && wpMine.interests) || [];
  if (!interests.length){
    /* 미선택이면 카드 대신 안내만. 이 기능이 무엇인지, '내 계획'과 어떻게 다른지 분명히 적는다
       — 프로필에 나란히 있어 헷갈린다는 지적(대표 2026-08-16)이 있었다. */
    sec.style.display = "";
    el.innerHTML = "<p class='note'><b>관심 분야 맞춤 추천</b>입니다. 프로필에서 관심 분야(예: 영상·영화, 창업·지원사업)를 "+
      "고르면, 그 분야에 지금 접수 중인 공고의 마감이 이 자리에 자동으로 모입니다. "+
      "내가 카드마다 ♡로 하나씩 담는 <a href='"+esc(BASE+"#plan")+"'>내 계획</a>과는 다릅니다 — 이쪽은 "+
      "고른 분야에 맞춰 <b>저절로</b> 채워집니다. "+
      "<a href='"+esc(profUrl(""))+"'>프로필에서 관심 분야 정하기</a></p>";
    observeReveal();
    return;
  }
  if (!homeIntOpen){ sec.style.display = "none"; return; }    /* 아직 목록이 없다 */
  var hit = homeIntOpen.filter(function(it){ return homeIntMatch(it, interests); }).slice(0, 5);
  sec.style.display = "";
  el.innerHTML = hit.length
    ? hit.map(function(it){ return homeDueRow(it, homeIntToday); }).join("")
    : "<p class='note'>고른 분야에 지금 접수 중인 공고가 없습니다. "+
      "<a href='"+esc(profUrl(""))+"'>관심 분야 바꾸기</a></p>";
  observeReveal();
}

/* ---- 마감 알림 구독 ----
   마감 목록 바로 아래에 둔다. "놓치면 안 되겠다"고 느낀 그 자리에서 받아야 한다.
   페이지 맨 아래로 내리면 아무도 보지 않는다.

   받는 값은 이메일 하나다. 이름·전화를 같이 물으면 칸이 늘어난 만큼 사람이 준다.
   로그인도 시키지 않는다 — 마감 알림 하나 받자고 계정을 만들 사람은 없다.
   명단은 화면·공개 JSON·로그 어디에도 내보내지 않는다. firestore.rules 에서
   subscribers 는 create 만 열려 있고 read 는 아무에게도 열려 있지 않다.

   ⚠️ 화면에 "마감 3일 전에 알려드립니다"라고 적었다. 발송을 붙이는 쪽은 이 약속대로
   만들어야 한다 — 마감 사흘 전(D-3)에 그날 걸리는 공고를 보낸다. 문구를 먼저 걸어 두고
   발송이 다르게 나가면 그때부터는 거짓말이 된다. */
/* ---- 마감 행을 우리 상세 페이지로 ----
   slugs.json 의 키가 "종류|제목|주최" 라 항목에서 그대로 만들어 찾는다.
   ⚠️ 177KB 라 첫 그리기에는 얹지 않는다 — 원문 링크로 먼저 보여 주고, 파일이 도착하면
   찾아진 행만 조용히 우리 페이지로 바꾼다. 못 찾은 행은 원문 그대로 둔다. */
var HOME_SLUG_DIR = { "공모전":["contest","contests"], "영화제":["festival","festivals"],
                      "지원사업":["funding","funding"] };
function homeLinkInner(list){
  var el = document.getElementById("homeDue");
  if (!el || !(list||[]).length) return;
  wpSlugRaw().then(function(map){
    if (curRoute() !== "home" || !C.contains(el)) return;
    var rows = el.querySelectorAll(".row");
    for (var i=0; i<rows.length && i<list.length; i++){
      if (rows[i].tagName !== "A") continue;          /* 원문 주소가 없던 행은 그대로 둔다 */
      var it = list[i], d = HOME_SLUG_DIR[it.kind];
      if (!d) continue;
      var e = map[d[0] + "|" + String(it.title||"") + "|" + String(it.org||"")];
      if (!e || !e.slug) continue;
      rows[i].setAttribute("href", BASE + d[1] + "/" + encodeURIComponent(e.slug) + ".html");
    }
  }, function(){});
}
function homeCanSubscribe(){ return fbReady(); }
function homeSubscribe(email){
  return fbInit().then(function(){
    /* 메일 주소를 문서 ID 로 쓴다 — 같은 사람이 두 번 눌러도 줄이 하나만 생긴다 */
    var write = fbDb.collection("subscribers").doc(email).set({
      email: email,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      source: "home"
    });
    /* ⚠️ Firestore 는 서버에 닿지 못하면 쓰기를 대기열에 넣고 약속을 계속 붙잡고 있는다.
       거절하지 않으므로 버튼이 "등록 중…"에서 영영 멈춘다 (2026-08-15 실측: 21초까지
       아무 반응 없음). 그러면 누른 사람은 고장으로 읽고 떠난다.
       10초까지만 기다리고 실패로 돌린다. 문서 ID 가 메일 주소라서 밀렸던 쓰기가 나중에
       도착하든 그 사람이 다시 누르든 줄은 하나뿐이다 — 재시도가 안전하다. */
    return new Promise(function(resolve, reject){
      var done = false;
      var timer = setTimeout(function(){
        if (done) return;
        done = true;
        reject(new Error("시간이 초과되었습니다"));
      }, 10000);
      write.then(function(v){
        if (done) return;

      });

}

   신호를 받는다. 부드럽게 갈지 말지는 CSS scroll-behavior 가 정한다 — prefers-reduced-motion
   이면 auto 다.
   ⚠️ 홈은 스냅샷·라이브가 도착할 때마다 C 를 다시 그리고(0.3~수 초), 마감 목록이 빈

   주소의 파라미터는 처음 볼 때 바로 지운다 — 새로고침·공유에서 다시 튀지 않게. */

/* ---- 오늘의 브리핑 ----
   뉴스리포트 화면이 쓰는 데이터를 그대로 읽는다. 본문에서 출처·이미지 주소를 걷어내고
   앞 네 줄만 보여준다 — 첫 화면에서 브리핑을 다 읽게 할 생각이 없다. */
function homeBriefLines(content, n){
  var lines = String(content || "").split("\n"), out = [];
  for (var i = 0; i < lines.length && out.length < n; i++){
    var s = lines[i].replace(/\s*\(img:[^)]*\)/g, "").replace(/\s*\(출처:[^)]*\)/g, "").trim();
    if (s.indexOf("•") !== 0) continue;
    out.push(s);
  }
  return out;
}
/* 한 꼭지 = 카드 하나. 데이터는 "• [태그] 제목 — 설명 (출처:…) (img:…)" 꼴이다.
   출처는 카드 클릭용으로 남기고 img 는 버린다. 앞의 [대괄호]는 태그로 빼고,
   본문은 em dash 로 헤드라인/요약을 가른다 — 구분자가 없으면 통째로 헤드라인이다. */
function homeBriefCards(content, n){
  var lines = String(content || "").split("\n"), out = [];
  for (var i = 0; i < lines.length && out.length < n; i++){
    var s = String(lines[i]).trim();
    if (s.indexOf("•") !== 0) continue;
    s = s.replace(/^•\s*/, "");
    var url = "";
    var mSrc = s.match(/\(출처:\s*([^)]+)\)/);
    if (mSrc) url = String(mSrc[1]).trim();
    s = s.replace(/\s*\(출처:[^)]*\)/g, "").replace(/\s*\(img:[^)]*\)/g, "").trim();
    var tag = "";
    var mTag = s.match(/^\[([^\]]+)\]\s*/);
    if (mTag){ tag = mTag[1].trim(); s = s.slice(mTag[0].length).trim(); }
    var head = s, sum = "";
    var idx = s.indexOf(" — ");
    if (idx < 0){ var k = s.indexOf("—"); if (k > 0) idx = k; }
    if (idx >= 0){
      head = s.slice(0, idx).replace(/[\s—]+$/, "").trim();
      sum = s.slice(idx).replace(/^[\s—]+/, "").trim();
    }
    if (!head) continue;
    out.push({ tag:tag, head:head, sum:sum, url:ctSafeUrl(url) });
  }
  return out;
}

function homeFillBoardCards(){
  var sec = document.getElementById("homeBoardSec");
  var el = document.getElementById("homeBoardCards");
  if (!sec || !el) return;

  function renderCards(posts){
    var list = (posts || []).slice(0, 4);
    if (!list.length){ sec.style.display = "none"; return; }
    sec.style.display = "";
    el.innerHTML = list.map(function(p){
      var tag = (p.tags && p.tags.length) ? p.tags[0] : "AI레이더";
      var body = String(p.body || "");
      var firstLine = body.split(/\r?\n/)[0] || "";
      var title = firstLine.slice(0, 45) || (p.ref && p.ref.title) || bdExcerpt(body) || "자유게시판 새 소식";
      var img = p.image ? ctSafeUrl(p.image) : "";
      var mediaHtml = img
        ? "<div class='hbc-media'><img class='hbc-img' src='" + esc(img) + "' loading='lazy' alt='대표 이미지'></div>"
        : "<div class='hbc-media'><div class='hbc-noimg'>#" + esc(tag) + "</div></div>";
      return "<a class='home-board-card' href='" + esc(boardUrl(p.id)) + "'>" +
        mediaHtml +
        "<div class='hbc-body'>" +
          "<span class='hbc-tag'>#" + esc(tag) + "</span>" +
          "<h3 class='hbc-title'>" + esc(title) + "</h3>" +
          "<div class='hbc-meta'>" +
            "<span class='hbc-author'>" + esc(p.author || "AI Radar") + " · " + esc(bdWhen(p.createdAt)) + "</span>" +
            "<span class='hbc-more'>보기 ↗</span>" +
          "</div>" +
        "</div>" +
      "</a>";
    }).join("");
  }

  /* 1. 기본 캐시(SNS posts + BD_DEFAULT_SNS)로 4개 즉시 렌더링 */
  var initial = (bdSnsList && bdSnsList.length) ? bdSnsList : BD_DEFAULT_SNS;
  renderCards(initial);

  /* 2. Firestore 최신 글과 병합하여 최신화 */
  if (fbReady()){
    fbInit().then(function(){
      return fbDb.collection("posts").where("parentId", "==", null)
        .orderBy("createdAt", "desc").limit(4).get();
    }).then(function(sn){
      if (curRoute() !== "home" || !document.getElementById("homeBoardCards")) return;
      var got = [];
      sn.forEach(function(d){ var o = d.data() || {}; o.id = d.id; got.push(o); });
      var seen = {};
      got.forEach(function(p){ seen[p.id] = true; });
      var snsList = (bdSnsList && bdSnsList.length) ? bdSnsList : BD_DEFAULT_SNS;
      snsList.forEach(function(s){
        if (!seen[s.id]) got.push(s);
      });
      got.sort(function(a, b){ return (bdMs(b.createdAt) || 0) - (bdMs(a.createdAt) || 0); });
      renderCards(got);
    })["catch"](function(){});
  }
}

var io = null;
function observeReveal(){
  if (!("IntersectionObserver" in window)) return;
  if (!io) io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("visible"); io.unobserve(e.target); } });
  }, { threshold:.12 });
  C.querySelectorAll(".reveal:not(.visible)").forEach(function(el){ io.observe(el); });
}
var bar = document.getElementById("progress");
function onScroll(){
  var h = document.documentElement.scrollHeight - window.innerHeight;
  bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + "%";
}
window.addEventListener("scroll", onScroll, { passive:true });

/* ============ 이동 ============
   해시 이동(hashchange)과 경로 이동(popstate)이 같은 곳으로 모인다.
   해시만 바뀔 때는 두 이벤트가 같이 울리기도 해서, 주소가 실제로 달라졌을 때만 그린다. */
var navKey = "";
function onNav(){
  var k = location.pathname + location.hash;
  if (k === navKey) return;
  navKey = k;
  render();
  window.scrollTo({ top:0, behavior:"auto" });
}
/* 게시판 안에서의 이동. 주소를 바꾸고 그린다 — 브라우저 뒤로가기는 popstate 가 받는다 */
function bdGo(slug){
  var url = boardUrl(slug);
  if (location.pathname === url && !location.hash){
    /* 이미 그 주소다 — 주소를 또 쌓지 않고 화면만 다시 그린다 (예: 인용을 들고 피드로) */
    render(); window.scrollTo({ top:0, behavior:"auto" });
    return;
  }
  history.pushState(null, "", url);
  onNav();
}
window.addEventListener("hashchange", onNav);
window.addEventListener("popstate", onNav);

/* 같은 사이트 안에서 경로가 바뀌는 링크는 새로고침 없이 처리한다.
   href 는 그대로 진짜 주소로 두므로 새 탭·링크 복사·크롤러는 평소대로 동작한다. */
document.addEventListener("click", function(e){
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  var a = (e.target && e.target.closest) ? e.target.closest("a[href]") : null;
  if (!a || (a.target && a.target !== "_self") || a.hasAttribute("download")) return;
  var u;
  try { u = new URL(a.href, location.href); } catch(err){ return; }
  if (u.origin !== location.origin) return;
  if (u.pathname === location.pathname) return;   /* 같은 문서 안의 해시 이동은 기본 동작대로 */
  if (u.pathname !== BASE
      && u.pathname.indexOf(BASE + "board") !== 0
      && u.pathname !== BASE + "u"
      && u.pathname.indexOf(BASE + "u/") !== 0
      && u.pathname !== BASE + "join"
      && u.pathname !== BASE + "join/") return;
  e.preventDefault();
  history.pushState(null, "", u.pathname + u.search + u.hash);
  onNav();
});

/* ---- 방문 집계 (자체 · 개인정보 없음) ----
   apple-seed 처럼 방문 시 카운터를 +1 한다. 관리시스템 「AI 레이더」 화면이 이 숫자를 읽는다.
   한 페이지 로드당 1회만. 규칙이 +1 만 허용하므로 부풀리기는 막혀 있다. */
var airTracked = false;
function airVisitSource(){
  try {
    var qs = new URLSearchParams(location.search);
    var utm = (qs.get("utm_source") || "").toLowerCase().replace(/[^a-z0-9._-]/g,"").slice(0,30);
    if (utm) return "utm:" + utm;
    var ref = document.referrer || "";
    if (!ref) return "direct";
    var h = "";
    try { h = new URL(ref).hostname.toLowerCase().replace(/^www\./,""); } catch(e){ return "other"; }
    if (h === "ai-radar.kr" || h.indexOf(".ai-radar.kr") > -1) return "";   /* 내부 이동은 제외 */
    if (h.indexOf("google.") > -1) return "google";
    if (h.indexOf("naver.") > -1) return "naver";
    if (h.indexOf("chatgpt.com") > -1 || h.indexOf("openai.com") > -1) return "chatgpt";
    if (h.indexOf("youtube.") > -1 || h === "youtu.be") return "youtube";
    if (h.indexOf("instagram.") > -1) return "instagram";
    if (h.indexOf("facebook.") > -1 || h === "t.co") return "sns";
    return "other";
  } catch(e){ return "other"; }
}
function airTrackVisit(){
  if (airTracked) return;
  airTracked = true;
  /* 대표·팀 작업 방문 제외: ?notrack=1 로 이 브라우저를 제외 표시, ?notrack=0 로 해제.
     표시된 브라우저는 이후 방문을 세지 않는다(로그인 여부와 무관). */
  try {
    var _q = new URLSearchParams(location.search);
    if (_q.get("notrack") === "1"){ try { localStorage.setItem("air_notrack","1"); } catch(e){} }
    else if (_q.get("notrack") === "0"){ try { localStorage.removeItem("air_notrack"); } catch(e){} }
    try { if (localStorage.getItem("air_notrack") === "1") return; } catch(e){}
  } catch(e){}
  try {
    var day = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Seoul" });   /* YYYY-MM-DD (KST) */
    var isNew = 0;
    try { if (!localStorage.getItem("air_seen_" + day)){ isNew = 1; localStorage.setItem("air_seen_" + day, "1"); } } catch(e){}
    var src = airVisitSource();
    fbInit().then(function(){
      if (!fbDb) return;
      var inc = firebase.firestore.FieldValue.increment;
      fbDb.collection("analytics_daily").doc(day).set(
        { pageviews: inc(1), visitors: inc(isNew), date: day }, { merge: true }
      )["catch"](function(){});
      if (src) fbDb.collection("analytics_src").doc(src).set({ count: inc(1) }, { merge: true })["catch"](function(){});
    }, function(){});
  } catch(e){}
}
