/* ============ 브리핑 본문의 [유튜브 최신 영상] 섹션 ============
   뉴스리포트 본문에서는 빼고(stripYtSection), AI 유튜브 화면에서 날짜별로 모아 보여준다(ytSectionOf). */
var YT_MARK = "[유튜브 최신 영상]";
function ytSectionOf(content){
  var c = String(content||"");
  var i = c.indexOf(YT_MARK);
  if (i < 0) return "";
  var rest = c.slice(i + YT_MARK.length);
  var nx = rest.search(/\n\[[^\[\]\n]+\]/);   /* 다음 섹션 헤더 직전까지 */
  return (nx > -1 ? rest.slice(0, nx) : rest).trim();
}
function stripYtSection(content){
  var c = String(content||"");
  var i = c.indexOf(YT_MARK);
  if (i < 0) return c;
  var rest = c.slice(i + YT_MARK.length);
  var nx = rest.search(/\n\[[^\[\]\n]+\]/);
  return (c.slice(0, i) + (nx > -1 ? rest.slice(nx) : "")).replace(/\n{3,}/g, "\n\n").trim();
}
/* ============ AI 유튜브 (수집 2섹션 + 브리핑 아카이브 1섹션) ============
   자료가 두 갈래다.
   (1) 유튜브 수집 — AI 작품소개와 같은 엔드포인트(action=aivideos)를 쓰고 aivideoCache 를
       공유한다. 저쪽은 AI로 만든 영상 작품, 이쪽은 뉴스와 바이브코딩이다.
   (2) 아침 브리핑이 그날 고른 영상 — 브리핑 본문의 [유튜브 최신 영상] 섹션을 날짜별로 쌓아 둔다.
   한쪽이 없어도 다른 쪽은 그린다. 둘 다 없을 때만 안내 문구를 낸다. */
function renderYoutube(){
  setKicker(["유튜브 검색", "뉴스·바이브코딩"]);
  setFacts([["—","AI 뉴스"],["—","바이브코딩"],["—","브리핑 수집"]]);
  C.innerHTML = "<section class='section paper'><div class='inner'>"+
    emptyNote("영상을 불러오는 중입니다.")+"</div></section>";

  /* 수집이 실패해도 아카이브는 그려야 하므로 실패를 null 로 받아 넘긴다 */
  fetchAiVideos().catch(function(){ return null; }).then(function(j){
    if (curRoute()!=="youtube") return;
    var news = (j && j.news) || [], vibe = (j && j.vibe) || [];
    /* 새 영상이 매일 위로 오도록 최신 업로드순으로 세운다(대표 2026-08-17). 관리시스템은
       조회수 위주라 옛 인기영상이 위에 남았다. 업로드일이 없는 것은 뒤로. 더 많은 새 영상
       확보(수집 폭)는 관리시스템 몫이라 여기선 있는 영상 안에서 신선한 것을 앞세운다. */
    function byNew(a,b){ return String(b.published||"").localeCompare(String(a.published||"")); }
    news = news.slice().sort(byNew); vibe = vibe.slice().sort(byNew);
    var briefs = sortedReports()
      .filter(function(r){ return !!ytSectionOf(r.content); })
      .slice(0, 30);
    var counts = briefs.map(function(r){ return (ytSectionOf(r.content).match(/^•/gm)||[]).length; });
    var total = counts.reduce(function(a,b){ return a+b; }, 0);

    if (!news.length && !vibe.length && !briefs.length){
      setKicker(["대기 중"]);
      setFacts([["—","AI 뉴스"],["—","바이브코딩"],["0","브리핑 수집"]]);
      C.innerHTML = "<section class='section paper'><div class='inner'>"+
        sectionHead("Watch","아직 모인 영상이<br>없습니다.",
          "아직 모인 영상이 없습니다. 내일 아침에 다시 확인해 주세요.","")+
        "</div></section>";
      return;
    }

    var kick = [];
    if (j) kick.push("유튜브 검색", "뉴스·바이브코딩");
    if (briefs.length) kick.push("브리핑 " + briefs.length + "일치");
    kick.push((news.length + vibe.length + total) + "편");
    setKicker(kick);
    setFacts([
      [j ? String(news.length) : "—", "AI 뉴스"],
      [j ? String(vibe.length) : "—", "바이브코딩"],
      [String(total), "브리핑 수집"]
    ]);

    /* 배경은 섹션이 나올 때마다 paper·dark 를 번갈아 쓴다 — 이 사이트의 기존 규칙 */
    var alt = 0;
    function bg(){ return (alt++ % 2) ? "dark" : "paper"; }

    var html = "";
    if (j){
      html += videoSection(bg(),"News","AI 소식을<br>영상으로.", news, (j.queries||{}).news, j.generated)+
              videoSection(bg(),"Vibe Coding","바이브코딩<br>지금 뭐가 되나.", vibe, (j.queries||{}).vibe, j.generated);
    }
    if (briefs.length){
      var top = briefs[0];
      html += "<section class='section "+bg()+"'><div class='inner'>"+
        sectionHead("Briefing","아침 브리핑이<br>고른 영상.",
          "브리핑이 그날 고른 영상입니다. 썸네일을 누르면 유튜브로 갑니다.",
          "<b>"+counts[0]+"</b>편 · "+esc(String(top.report_date||"").slice(0,10)))+
        "<div class='brief-body'>"+richReport(ytSectionOf(top.content))+"</div>"+
        "</div></section>";
      if (briefs.length > 1){
        var body = briefs.slice(1).map(function(r,i){
          return "<div style='margin-bottom:34px'>"+
            "<p class='count' style='margin:0 0 12px'><b>"+esc(String(r.report_date||"").slice(0,10))+"</b> · "+counts[i+1]+"편</p>"+
            "<div class='brief-body'>"+richReport(ytSectionOf(r.content))+"</div></div>";
        }).join("");
        html += foldSection(bg(),"Archive","지난 날짜", (briefs.length-1)+"일치", body);
      }
    }
    C.innerHTML = html;
    bindFold(C);
    observeReveal();
  });
}

    list = list.filter(function(f){
      return (String(f.name||"")+" "+String(f.host||"")).toLowerCase().indexOf(fq) >= 0;
    });
  }
  var today = todaySeoul();
  var isD = function(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s||"")); };
  var open = [], closed = [], tbd = [];
  list.forEach(function(f){
    if (isD(f.deadline)){
      var d = parseDate(f.deadline);
      (d && d >= today ? open : closed).push(f);
    } else tbd.push(f);
  });
  open.sort(function(a,b){ return String(a.deadline).localeCompare(String(b.deadline)); });

  var html = "<section class='section paper'><div class='inner'>"+
    sectionHead("Open calls","지금 출품할 수<br>있는 곳.", intro,
      "<b>"+open.length+"</b>곳 · 마감 임박순")+
    "<div class='rows'>"+
    (open.length ? open.map(function(f){ return festRow(f, today); }).join("")
                 : emptyNote(fq ? "검색어와 맞는 영화제가 없습니다." : "지금 접수 중인 영화제가 없습니다."))+
    "</div>"+
    (fq ? "<p class='cta-row' style='margin-top:26px'>"+
          "<button type='button' class='btn' data-festall>전체 보기</button></p>" : "")+
    "</div></section>";

  if (tbd.length){
    html += foldSection("dark","Not announced","차기 일정 미공고", tbd.length+"곳",
      "<div class='rows'>"+tbd.map(function(f){ return festRow(f, today); }).join("")+"</div>");
  }
  if (closed.length){
    closed.sort(function(a,b){ return String(b.deadline).localeCompare(String(a.deadline)); });
    html += foldSection("paper-alt","Closed","이미 끝난 회차", closed.length+"곳",
      "<div class='rows'>"+closed.map(function(f){ return festRow(f, today); }).join("")+"</div>");
  }
  C.innerHTML = html;
  bindFold(C);
}

/* ============ AI 공모전 (외부 공개 JSON 직접 조회) ============ */
var CONTEST_URLS = {
  domestic: "https://junyeo217.github.io/ai-contest-board/data/contests.json",
  overseas: "https://junyeo217.github.io/ai-contest-board/data/overseas-contests.json"
};
/* junyeo217 은 남의 저장소다. 사라지거나 죽으면 위 주소가 통째로 실패한다 —
   그때 우리 저장소가 매일 아침 떠 둔 미러로 폴백한다(scripts/collect-feeds.mjs collectContests).
   같은 JSON 을 가공 없이 저장하므로 아래 파싱 코드가 그대로 읽는다. */
var CONTEST_SNAP = {
  domestic: BASE + "data/contests.json",
  overseas: BASE + "data/overseas-contests.json"
};
var CONTEST_BOARD = "https://junyeo217.github.io/ai-contest-board/";
var CONTEST_TTL = 10*60*1000; /* 10분 모듈 캐시 (두 파일 각각) */
var contestCache = {};
var CONTEST_SECS = ["starting_today","ongoing","awaiting_results"];
/* 탭에 "전체"를 넣었다 (대표 지시 2026-08-12). 칩 줄이 이미 "전체"로 시작하니 맨 앞이 맞다.
   기본은 국내로 둔다 — 건수는 국내 37 / 해외 34 로 비슷하지만, 한국 회사가 바로 낼 수 있는
   쪽은 국내다. 전체는 한 번 눌러 보는 자리지 매번 여는 자리가 아니다. */
var CONTEST_TABS = [["all","전체"],["domestic","국내"],["overseas","해외"]];
var contestTab = "domestic", contestCat = "전체", contestSearch = "";
/* 영화제 화면에는 검색칸이 없다. 상단바 검색으로 들어온 그 한 번만 걸러 보여 주고
   바로 비운다 — 남겨 두면 나중에 메뉴로 들어왔을 때 이유 모를 짧은 목록이 된다. */
var festSearch = "";
/* 전체 탭은 두 파일을 합친다. 각 파일 캐시를 그대로 쓰므로 탭을 오가도 새 요청이 없다. */
function mergeContests(a, b){
  var out = { generated_at:a.generated_at, generated_pair:[a.generated_at, b.generated_at], sections:{} };
  CONTEST_SECS.forEach(function(k){
    out.sections[k] = (((a.sections||{})[k])||[]).concat(((b.sections||{})[k])||[]);
  });
  return out;
}
function fetchContests(kind, force){
  if (kind === "all"){
    return Promise.all([fetchContests("domestic",force), fetchContests("overseas",force)])
      .then(function(r){ return mergeContests(r[0], r[1]); });
  }
  var c = contestCache[kind];
  if (!force && c && (Date.now()-c.t) < CONTEST_TTL) return Promise.resolve(c.data);
  /* 국내 파일에는 country 가 없다(전부 null). 합쳤을 때 어느 쪽인지 알 수 있게
     어느 파일에서 왔는지를 여기서 새겨 둔다 — 나중에 추측할 수 없는 정보다. */
  function useContest(j){
    var reg = kind === "domestic" ? "국내" : "해외";
    CONTEST_SECS.forEach(function(k){
      (((j.sections||{})[k])||[]).forEach(function(it){ it._region = reg; });
    });
    contestCache[kind] = { t:Date.now(), data:j };
    return j;
  }
  function grab(url){
    return fetch(url, { cache:"no-store" }).then(function(r){
      if (!r.ok) throw new Error("HTTP "+r.status);
      return r.json();
    });
  }
  /* 우리 스냅샷(자체 수집)을 먼저 읽는다. sections 가 있어야 쓸 수 있는 값으로 본다 —
     형식이 깨졌거나(스냅샷에 sections 없음) 못 읽으면 junyeo217 라이브로 폴백한다. */
  function validSnap(j){ return j && j.sections && typeof j.sections === "object"; }
  return grab(CONTEST_SNAP[kind]).then(function(j){
    if (!validSnap(j)) throw new Error("스냅샷에 sections 가 없다");
    return useContest(j);
  }).catch(function(){
    return grab(CONTEST_URLS[kind]).then(useContest);
  });
}
function ctFmtGen(g){ if(!g) return ""; return String(g).replace("T"," ").replace(/(:\d\d)(\.\d+)?(Z|[+-]\d\d:?\d\d)?$/,"$1").slice(0,16); }

/* ---- 힉스필드 공모전 ----
   따로 세우는 이유: 우리 회사가 영상 제작사이고, 여기 공모전은 전부 AI 영상·앱 제작
   부문인 데다 상금이 백만 달러 단위다. 목록에 섞으면 묻힌다.
   힉스필드 페이지는 자바스크립트로 그려져서 브라우저 없이는 못 읽는다 —
   매일 아침 Actions 가 실제 브라우저로 열어 뽑는다 (scripts/collect-higgsfield.mjs). */
function hfSection(){
  return loadFeed("higgsfield").then(function(j){

    var rows = items.map(function(it){
      var short = prizeShort(it.prize);

      if (it.dates) meta.push(esc(it.dates));
      if (it.status) meta.push(esc(it.status));
      /* 상금을 왼쪽 큰 칸에 넣는다. 접수 중인 것만 라임으로 뜬다(.dark .dd.soon).
         태그에 "Higgsfield"를 또 달지 않는다 — 섹션 제목이 이미 그 말을 하고 있다.
         대신 지금 낼 수 있는지를 태그로 말한다. 이 목록에서 그게 유일한 갈림길이다. */
      /* "Winners announced" 가 /announced$/ 에도 걸린다 — 발표를 먼저 본다 */
      var tag = open ? "접수 중" : (/winners?/i.test(it.status||"") ? "발표 완료" :
                /announced$/i.test(it.status||"") ? "예고" : "");
      return row({ dd: short || "—", ddCls: open ? "soon" : (short ? "far" : "tbd"),
                   title: it.title, tags:[tag], meta:meta, sum:it.desc, url:it.url,
                   save:{ kind:"contest", title:it.title, org:"Higgsfield", deadline:"", url:it.url },

    }).join("");
    return "<section class='section dark'><div class='inner'>"+
      sectionHead("Higgsfield","상금이 가장 큰<br>AI 영상 공모전.",
        "힉스필드가 직접 여는 AI 영상·앱 제작 공모전입니다. "+esc(fmtGen(j.generated))+" 기준.",
        "<b>"+items.length+"</b>건")+
      "<div class='rows'>"+rows+"</div></div></section>";
  }).catch(function(){ return ""; });

/* ---- Devpost 해커톤·공모전 ----
   "Jun 17 - Sep 01, 2026" / "Aug 08 - 12, 2026" 두 형태가 온다.
   뒤쪽에 달이 없으면 앞쪽 달을 쓴다. 연도는 문자열 끝에 한 번만 붙는다. */
var DP_MON = { Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12 };
function dpEnd(s){
  s = String(s||"");
  var year = (s.match(/(\d{4})\s*$/)||[])[1];
  var parts = s.split(/\s+[–—-]\s+/);
  if (!year || parts.length < 2) return "";
  var em = parts[1].match(/([A-Z][a-z]{2})\s+(\d{1,2})/);
  var mon = em ? DP_MON[em[1]] : DP_MON[(parts[0].match(/([A-Z][a-z]{2})/)||[])[1]];
  var day = em ? em[2] : (parts[1].match(/(\d{1,2})/)||[])[1];
  if (!mon || !day) return "";
  return year+"-"+("0"+mon).slice(-2)+"-"+("0"+day).slice(-2);
}
function dpRow(it, today){
  var end = dpEnd(it.dates);
  var di = end ? ddayInfo(end, today) : { cls:"tbd", txt:"미정" };
  var meta = [];
  var money = Number(String(it.prize||"").replace(/[^\d]/g,""));
  if (money) meta.push("<b>상금 "+esc(it.prize)+"</b>");
  if (it.dates) meta.push(esc(it.dates));
  if (it.location) meta.push(esc(it.location));
  if (it.registrations) meta.push(nfmt(it.registrations)+"명 등록");
  return row({ dd:di.txt, ddCls:di.cls, title:it.title||"(제목 없음)",
               tags:(it.themes||[]).slice(0,2), meta:meta, url:it.url,
               save:{ kind:"contest", title:it.title, org:"Devpost", deadline:end||"", url:it.url },
               talk:{ type:"공모전", title:it.title, url:it.url } });
}

function renderContests(){

    "</div></section>"+
    "<div data-hf></div><div data-dp></div>"+
    "<div data-await></div>";

  /* 힉스필드·Devpost 는 우리 저장소의 JSON 이라 공모전 보드와 따로 논다.
     하나가 늦거나 실패해도 나머지 화면은 그대로 뜬다 — 섹션만 비고 만다. */
  var hfEl = C.querySelector("[data-hf]"), dpEl = C.querySelector("[data-dp]");

  var searchEl = C.querySelector("[data-search]");
  searchEl.value = contestSearch;
  var curData = null;

  function collectCats(data){
    var set = {}, order = [];
    ["starting_today","ongoing","awaiting_results"].forEach(function(k){
      ((data.sections&&data.sections[k])||[]).forEach(function(it){
        var c = String(it.category||"").trim();
        if (c && !set[c]){ set[c]=1; order.push(c); }
      });
    });
    return order;
  }
  function drawCats(){

    }).join("");
    catsEl.querySelectorAll("[data-cat]").forEach(function(b){
      b.onclick = function(){ contestCat = b.getAttribute("data-cat"); drawCats(); drawBody(); };
    });
  }
  function match(it){
    if (contestCat!=="전체" && String(it.category||"")!==contestCat) return false;
    var q = String(contestSearch||"").trim().toLowerCase();
    if (!q) return true;
    return String(it.title||"").toLowerCase().indexOf(q)>=0 ||
           String(it.organizer||"").toLowerCase().indexOf(q)>=0;
  }
  function contestRow(it){
    var di = ddayInfo(it.submission_end, today);
    var meta = [];
    if (it.organizer) meta.push("<b>"+esc(it.organizer)+"</b>");
    var sd = String(it.submission_start||"").slice(0,10), ed = String(it.submission_end||"").slice(0,10);
    if (sd || ed) meta.push("접수 "+esc(sd||"미정")+" ~ "+esc(ed||"미정"));
    var rd = String(it.result_date||"").trim();
    if (rd && rd!=="미정") meta.push("발표 "+esc(rd.slice(0,10)));
    /* 전체 탭에서는 국내인지 해외인지가 가장 먼저 알고 싶은 것이라 그걸 태그로 세운다.

    /* 검색어가 있으면 힉스필드·Devpost 는 감춘다.

       "검색이 안 먹었다"로 읽혔다 (대표 지적 2026-08-15).
       발표 대기 칸도 걸린 것이 없으면 같이 감춘다 — 빈 접이칸만 남기지 않는다.
       검색어를 지우면 셋 다 그대로 돌아온다. */

       다크↔페이퍼 교차가 이 디자인의 리듬이라 마지막 칸을 페이퍼로 넘긴다. */

          return row({ dd:"발표", ddCls:"tbd", title:it.title||"(제목 없음)",

/* ============ AI 지원사업 (공개 API: action=pubgov) ============ */
var GOV_TTL = 10*60*1000, govCache = null;
var govAiOnly = true, govCls = "전체", govSearch = "";
var GOV_AI_RE = /AI|인공지능|생성형|딥테크|디지털|데이터/i;
/* pub·aivideos 와 같은 구조다 — data/gov-pub.json 스냅샷으로 먼저 그리고, 라이브가 늦게 와서
   다르면 화면을 다시 세우지 않고 제자리에서 갱신한다. ?action=pubgov 는 K-Startup 공고를
   전부 훑어 오느라 pub 보다도 느려서 2분 타임아웃까지 응답이 없던 적도 있다(2026-08-12 실측). */
var GOV_SNAPSHOT = BASE + "data/gov-pub.json";
var govOnLive = null;   /* 지금 그려져 있는 지원사업 화면을 제자리에서 갱신하는 함수 (renderGov 가 채운다) */

function validGov(j){ return !!(j && j.ok && (j.items||[]).length); }
/* 다시 그릴지 판단하는 최소 지문 — 공고 수 + 첫 공고명 */
function govSig(j){ var it = (j && j.items) || []; return it.length + "/" + String((it[0]||{}).nm || ""); }

function govLiveFetch(force){
  var u = API + "?action=pubgov" + (force?"&reload=1":"") + "&t=" + Date.now();
  return fetch(u, { cache:"no-store" }).then(function(r){
    if (!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(j){ govCache = { t:Date.now(), data:j, live:true }; return j; });
}
function fetchGov(force){
  if (force) return govLiveFetch(true);   /* 수동 새로고침은 라이브 직행 — 그게 이 버튼의 용도다 */
  if (govCache && (Date.now()-govCache.t) < GOV_TTL) return Promise.resolve(govCache.data);
  var live = govLiveFetch(false);
  live.catch(function(){});   /* 스냅샷으로 끝난 경우의 미처리 거부를 막는다 */
  return fetch(GOV_SNAPSHOT, { cache:"no-store" }).then(function(r){
    if (!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(j){
    if (!validGov(j)) throw new Error("bad-snapshot");
    if (govCache && govCache.live) return govCache.data;   /* 라이브가 먼저 왔으면 그쪽을 쓴다 */
    govCache = { t:Date.now(), data:j, live:false };
    live.then(function(k){
      if (curRoute()!=="gov" || !govOnLive) return;
      /* 200 인데 내용이 망가진 응답({ok:false}·빈 목록)으로 멀쩡한 스냅샷 화면을 덮지 않는다.
         이 엔드포인트는 실제로 404 HTML 을 내는 일이 있다 — 그때 에러 박스가 뜨면 손해다 */
      if (!validGov(k)) return;
      if (govSig(k) === govSig(j)) return;   /* 같으면 다시 그리지 않는다 */
      govOnLive(k);
    }, function(){});
    return j;
  }).catch(function(){ return live; });    /* 스냅샷이 없으면 지금처럼 라이브를 기다린다 */
}

         내는 쪽인지 두 갈래로 읽혔다 (대표가 바로 걸렸다, 2026-08-12).
         영화제의 "지금 출품할 수 있는 곳."과 대구를 이루는 문장으로 바꿨다.

      "<div><p class='section-intro'>지금 신청할 수 있는 AI 관련 창업지원 공고를 모았습니다.</p>"+
      "<p class='count' style='margin:14px 0 0' data-gen>불러오는 중</p></div></div>"+
      "<div class='controls'>"+
        "<button type='button' class='chip"+(govAiOnly?" on":"")+"' data-ai aria-pressed='"+govAiOnly+"'>AI 관련만</button>"+

    });

  function isAi(it){ return GOV_AI_RE.test((it.nm||"")+" "+(it.trgt||"")+" "+(it.cls||"")); }
  /* 분류·검색만 적용한 1차 통과. AI 키워드 판정은 여기서 떼어 놓는다 —
     걸러진 공고를 아래 접힌 섹션에서 그대로 다시 보여주기 위해서다. */
  function matchBase(it){

           String(it.org||"").toLowerCase().indexOf(q)>=0 ||

  function govRow(it){
    var di = ddayInfo(it.end, today);
    var orgTxt = [it.org, it.inst].filter(function(x){return x;}).filter(function(x,i,a){return a.indexOf(x)===i;}).join(" · ");

      "</div>";

    /* AI 필터가 걸러낸 나머지. 히어로가 263건이라고 말해 놓고 23건만 보이면
       나머지가 어디 갔는지 알 수 없다 — 접어 두되 숨기지는 않는다. */
    var rest = govAiOnly ? (cur.items||[]).filter(function(it){ return matchBase(it) && !isAi(it); }) : [];
    restEl.innerHTML = rest.length
      ? foldSection("dark","Rest","AI 키워드에 걸리지 않은 공고", rest.length+"건",
          "<div class='rows'>"+rest.map(govRow).join("")+"</div>")
      : "";
    bindFold(restEl);
  }
  /* 스냅샷으로 먼저 그리고, 라이브가 다르게 오면 이 함수로 제자리 갱신한다.
     renderGov 를 다시 부르지 않는 이유: 검색어 입력칸과 스크롤을 건드리지 않으려고. */
  function show(j){
    cur = j;
    if (!j || !j.ok){
      genEl.textContent = "";
      bodyEl.innerHTML = failBox(j && j.error ? String(j.error) : "잠시 뒤 다시 시도해 주세요.",
        "<a class='btn' href='https://www.k-startup.go.kr' target='_blank' rel='noopener noreferrer'>공고 사이트 열기 ↗</a>");
      return;
    }
    /* 갱신 시각은 응답에 든 서버 값 그대로다 — 스냅샷으로 그렸으면 스냅샷 시각이 보인다 */
    genEl.textContent = "총 " + (j.total||0) + "건 · " + (j.generated||"") + " 기준";
    drawChips(); drawBody();

  govOnLive = show;
  function load(force){
    bodyEl.innerHTML = emptyNote("지원사업 공고를 불러오는 중입니다.");
    fetchGov(force).then(function(j){

      bodyEl.innerHTML = failBox(String(e && e.message || e),
        "<a class='btn' href='https://www.k-startup.go.kr' target='_blank' rel='noopener noreferrer'>공고 사이트 열기 ↗</a>");

/* ============ AI 작품소개 (유튜브 검색 — AI로 만든 영상 작품) ============
   AI유튜브정보와 같은 엔드포인트를 쓰지만 보는 목록이 다르다. 저쪽은 news·vibe(AI 뉴스·바이브코딩),
   이쪽은 works(AI로 만든 영상 작품)다. 두 화면 설명에 각각 그렇게 적었다.
   순위표가 아니라 소개 화면이다 — 강의·도구 소개·리뷰는 수집에서 걸러지고, 순서도 조회수
   단독이 아니라 화제성·반응·신선도를 함께 본다. 화면 문구에 "조회수순"이라 적으면 안 된다.

   국내/해외 구분은 없앴다 (대표 지시 2026-08-12). 국내 AI 작품이 아직 드물어 국내 섹션이
   계속 1편 이하로 비어 보였다. 서버가 works 하나로 합쳐서 준다. 옛 응답(domestic·overseas)만
   오는 동안에도 화면이 살아야 하므로 works 가 없으면 둘을 이어 붙여 쓴다.

   수집은 관리시스템(Apps Script)이 한다 — 유튜브 전역 검색에는 API 키가 필요하고
   키는 이 공개 저장소에 둘 수 없다. 주소가 정해지면 AIVIDEO_API 한 줄만 채우면 된다.
   비어 있는 동안에는 목록 자리에 "아직 연결되지 않았다"고 적는다. 에러 박스는 띄우지 않는다 —
   고장난 게 아니라 아직 안 붙은 것이다. */
/* 목록과 같은 구조다 — data/aivideos.json 스냅샷으로 먼저 그리고, 라이브가 늦게 와서
   다르면 조용히 다시 그린다. 라이브(?action=aivideos)는 2026-08-12 실측 6.3~37.7초에
   404 도 잦았다. 스냅샷은 0.05초대이고, 화면에 찍히는 "수집" 시각은 스냅샷 안의 generated 다. */
var AIVIDEO_SNAPSHOT = BASE + "data/aivideos.json";
var aivideoCache = null;        /* 화면이 지금 쓰는 값 (스냅샷이거나 라이브) */
var aivideoLivePromise = null;  /* 라이브는 한 번만 부른다 */

function validAiVideos(j){ return !!(j && j.ok); }

function fetchAiVideosLive(){
  if (aivideoLivePromise) return aivideoLivePromise;
  if (!AIVIDEO_API){ aivideoLivePromise = Promise.reject(new Error("no-endpoint")); return aivideoLivePromise; }
  var u = AIVIDEO_API + (AIVIDEO_API.indexOf("?")>=0 ? "&" : "?") + "action=aivideos&t=" + Date.now();
  aivideoLivePromise = fetch(u, { cache:"no-store" })
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){ if(!validAiVideos(j)) throw new Error("bad-response"); return j; });
  aivideoLivePromise.then(function(j){
    var had = aivideoCache;
    aivideoCache = j;
    if (!had) return;                                                   /* 첫 표시는 부른 쪽이 그린다 */
    if (String(had.generated||"") === String(j.generated||"")) return;   /* 같으면 다시 그리지 않는다 */
    if (curRoute()==="aivideo") renderAiVideo();                         /* 보고 있는 화면만 */
    else if (curRoute()==="youtube") renderYoutube();
  }, function(){});
  return aivideoLivePromise;
}
function fetchAiVideos(){
  if (aivideoCache) return Promise.resolve(aivideoCache);
  var live = fetchAiVideosLive();
  live.catch(function(){});   /* 스냅샷으로 끝난 경우의 미처리 거부를 막는다 */
  return fetch(AIVIDEO_SNAPSHOT, { cache:"no-store" })
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){
      if (!validAiVideos(j)) throw new Error("bad-snapshot");
      if (!aivideoCache) aivideoCache = j;   /* 라이브가 먼저 왔으면 그쪽을 쓴다 */
      return aivideoCache;
    })
    .catch(function(){ return live; });      /* 스냅샷이 없으면 지금처럼 라이브를 기다린다 */
}
/* 브리핑 본문이 쓰는 카드(.card-grid/.item-card)를 그대로 쓴다. 영상 카드는 이미 이 시스템에 있다 */

    /* 갤러리와 같은 모달로 연다(대표 지시 2026-08-15 "같은 창에서 플레이되게").
       주소에서 영상 ID 를 못 뽑으면 예전처럼 새 탭으로 둔다. */
    var key = wkReg({ url:v.url, title:v.title, by:v.channel });
    var head = key
      ? "<button type='button' class='item-card yt' data-wkplay='"+esc(key)+"'>"
      : "<a class='item-card yt' href='"+esc(ctSafeUrl(v.url))+"' target='_blank' rel='noopener noreferrer'>";
    var card = head+
      /* 썸네일 주소도 http(s) 인지 보고 넣는다. 바깥에서 온 값이 그대로 src 로 들어가는 자리다 */
      "<img src='"+esc(ctSafeUrl(v.thumbnail))+"' alt='' loading='lazy'>"+
      "<span class='ic-body'>"+

function avKey(v){

/* 숨김 목록(hidden 컬렉션)의 문서 id 로 쓰는 안전한 키. avKey 의 "youtube:<id>" 를

   Firestore 문서 id 에 못 쓰는 문자는 모두 "_" 로 눕힌다. */

   수집 영상(수신부)은 소스를 못 건드리므로 hidden 컬렉션에 키를 적어 화면에서 영구 제거한다.
   data-avdel 값이 "pick:<문서id>" 면 삭제, "hide:<숨김키>" 면 숨김. */
function avDel(el){
  if (!fbDb) return;
  var raw = el.getAttribute("data-avdel");
  if (!raw) return;
  var isHide = raw.indexOf("hide:") === 0;
  var id = (isHide || raw.indexOf("pick:") === 0) ? raw.slice(5) : raw;
  if (!id) return;
  if (!window.confirm("이 작품을 작품소개에서 내릴까요? 되돌릴 수 없습니다.")) return;
  el.disabled = true;
  var done = function(){
    var wrap = el.closest(".av-pick");
    if (wrap && wrap.parentNode) wrap.parentNode.removeChild(wrap);
    /* 검색 중이면 avDraw 가 avAll 로 다시 그리므로, 내린 작품을 avAll 에서도 뺀다 */
    for (var i = 0; i < avAll.length; i++){
      if (isHide ? (avHideKey(avAll[i]) === id) : (avAll[i]._pickId === id)){ avAll.splice(i,1); break; }
    }
  };
  var fail = function(e){
    el.disabled = false;
    if (window.console && console.error) console.error("[작품소개 삭제]", e);
  };
  if (isHide){
    avHidden[id] = 1;   /* 즉시 필터에 반영 — 실패하면 되돌린다 */
    fbDb.collection("hidden").doc(id).set({ createdAt: firebase.firestore.FieldValue.serverTimestamp() })
      .then(done, function(e){ delete avHidden[id]; fail(e); });
  } else {
    fbDb.collection("picks").doc(id)["delete"]().then(done, fail);
  }
}

/* ============================================================================

var BD_TAGS = ["생성형AI","바이브코딩","AI정보"];   /* Firestore 가 비어도 늘 보이는 기본 태그 */

/* 기기 사진을 캔버스로 리사이즈해 data URL 로 만든다. Storage 없이 Firestore 에 바로 담기 위함 */
function bdResizeImage(file, cb){
  if (!file || !/^image\//.test(file.type||"")){ cb("이미지 파일만 올릴 수 있습니다."); return; }
  var fr = new FileReader();
  fr.onerror = function(){ cb("이미지를 읽지 못했습니다."); };
  fr.onload = function(){
    var img = new Image();
    img.onerror = function(){ cb("이미지를 열지 못했습니다."); };
    img.onload = function(){
      var max = 1200, w = img.width, h = img.height;
      if (!w || !h){ cb("이미지를 열지 못했습니다."); return; }
      if (w > max || h > max){
        if (w > h){ h = Math.round(h * max / w); w = max; }
        else { w = Math.round(w * max / h); h = max; }
      }
      var cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      var cx = cv.getContext("2d");
      cx.fillStyle = "#fff"; cx.fillRect(0, 0, w, h);
      cx.drawImage(img, 0, 0, w, h);
      var q = 0.82, out;
      try { out = cv.toDataURL("image/jpeg", q); }
      catch(e){ cb("이미지를 처리하지 못했습니다."); return; }
      while (out.length > BD_IMG_MAX && q > 0.4){ q -= 0.15; out = cv.toDataURL("image/jpeg", q); }
      if (out.length > BD_IMG_MAX){ cb("이미지 용량이 너무 큽니다. 더 작은 이미지를 올려 주세요."); return; }
      cb(null, out);
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---- SDK 지연 로딩 ----

   게시판 하나 때문에 나머지 여섯 메뉴가 안 뜨는 건 말이 안 된다.
   게시판을 처음 열 때만 세 파일을 순서대로 받고, 15초 안에 못 받으면 게시판만 포기한다. */
function bdLoadScript(src){
  if (fbScripts[src]) return fbScripts[src];
  fbScripts[src] = new Promise(function(res, rej){
    var s = document.createElement("script");
    s.src = src;
    s.async = false;
    s.onload = function(){ res(true); };
    s.onerror = function(){ rej(new Error("SDK 를 내려받지 못했습니다: " + src)); };
    document.head.appendChild(s);
  });
  return fbScripts[src];
}

function bdWhen(ts){

  if (m < 1) return "방금";
  if (m < 60) return m+"분 전";

   그래야 주소만으로 doc(slug).get() 이라 조회 색인도 필요 없다. */
function bdSlugify(body){
  var s = String(body||"")
    .replace(/https?:\/\/\S+/g, " ")
    .replace(/[^0-9A-Za-z가-힣ㄱ-ㅎㅏ-ㅣ\s-]/g, " ")

}
function bdRandHex(){

     옛 프로젝트 주소(github.io/ai-radar/)로 들어온 사람이 그 경로째 복사해 가고,
     SITE_URL 에 그 경로를 붙이면 ai-radar.kr/ai-radar/... 가 되어 깨진다.
     그래서 베이스를 섞지 않고 도메인 루트 기준으로 새로 만든다. */
  var url = SITE_URL + "/board/" + (slug ? encodeURIComponent(slug) : "");
  if (navigator.share){
    try {
      navigator.share({ title:"AI 레이더 자유게시판", text:String(text||"").slice(0,80), url:url })
        ["catch"](function(){});
      return;
    } catch(e){}
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){ bdToast("복사했습니다"); }, function(){});
  }
}

/* ---- 로그인 ---- */

      fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider())["catch"](function(){});

       조용히 한 줄만 알린다 — 상단바 버튼도 이 경로를 쓴다. */

}
function bdLogout(){

/* ---- 카드 ----
   피드와 스레드가 같은 카드를 쓴다. 같은 글이 자리마다 달라 보이면 어디서 본
   글인지 매번 다시 읽게 된다. opt.depth 는 답글 들여쓰기(0·1·2)다. */
function bdCard(p, opt){
  opt = opt || {};
  var body = String(p.body||"");
  bdBodyCache[p.id] = body;
  bdTagCache[p.id] = (p.tags||[]).slice();
  bdImgCache[p.id] = p.image || null;
  var folded = !opt.full && (body.length > BD_FOLD || body.split(/\r?\n/).length > 6);
  var ph = ctSafeUrl(p.photo||"");
  var mine = !!(bdUser && p.uid && p.uid === bdUser.uid);
  var refUrl = (p.ref && p.ref.url) ? ctSafeUrl(p.ref.url) : "";
  var root = p.rootId || p.id;
  var h = "<article class='bd-card"+(opt.depth?" d"+Math.min(opt.depth,2):"")+
          "' data-post='"+esc(p.id)+"' data-root='"+esc(root)+"'>";
  h += "<div class='bd-head'>"+
       wpAva("bd-ava", ph, p.author)+
       /* data-pu 는 프로필로 잇기 위한 표시다. 예전 글에는 프로필 정보가 없으므로
          uid 로 찾아 나중에 이름만 링크로 바꾼다(wpLinkNames) — 없으면 그대로 둔다 */
       "<b class='bd-name' data-pu='"+esc(p.uid||"")+"'>"+esc(p.author||"익명")+"</b>"+
       "<span class='bd-time'>"+esc(bdWhen(p.createdAt))+"</span></div>";
  if (p.ref && (p.ref.title || refUrl)){
    h += "<div class='bd-ref'><span class='bd-ref-k'>"+esc(p.ref.type||"링크")+"</span>"+
      (refUrl
        ? "<a href='"+esc(refUrl)+"' target='_blank' rel='noopener noreferrer nofollow'>"+
          esc(p.ref.title||refUrl)+"</a>"
        : "<span>"+esc(p.ref.title||"")+"</span>")+"</div>";
  }
  h += "<div class='bd-text"+(folded?" fold":"")+"' data-text>"+bdText(body)+"</div>";
  if (p.image){
    var imgUrl = ctSafeUrl(p.image) || (String(p.image).indexOf("data:image/") === 0 ? p.image : "");
    if (imgUrl){
      h += "<div class='bd-img-wrap'><img class='bd-img' src='"+esc(imgUrl)+
           "' loading='lazy' alt='첨부 이미지' data-bdimgpop='"+esc(imgUrl)+
           "' onclick='bdOpenImg(this.src, this.alt); return false;'></div>";
    }
  }
  if (folded) h += "<button type='button' class='bd-unfold' data-unfold>더 보기</button>";
  if ((p.tags||[]).length){
    h += "<div class='bd-tags'>"+(p.tags||[]).map(function(t){
      return "<span class='tag'>"+esc(t)+"</span>"; }).join("")+"</div>";
  }
  h += "<div class='bd-acts'>";
  /* 피드에서도 누른 자리에서 바로 답글을 쓴다. 예전에는 글 화면으로 넘어갔고,
     넘어가면서 맨 위로 올라가 읽던 자리를 잃었다(대표 지적 2026-08-15).
     답글을 "읽으러" 가는 길은 아래 인라인 상자 안에 둔다. */
  h += opt.thread
    ? "<span class='bd-act'>답글 <b class='tnum' data-rc>"+nfmt(p.replyCount||0)+"</b></span>"
    : "<button type='button' class='bd-act' data-reply='"+esc(p.id)+"'>답글 "+
      "<b class='tnum' data-rc>"+nfmt(p.replyCount||0)+"</b></button>";
  h += "<button type='button' class='bd-act"+(bdLiked[p.id]?" on":"")+"' data-like='"+esc(p.id)+"'"+
       " aria-pressed='"+(!!bdLiked[p.id])+"'>♥ <b class='tnum'>"+nfmt(p.likeCount||0)+"</b></button>";
  if (opt.thread) h += "<button type='button' class='bd-act' data-reply='"+esc(p.id)+"'>답글 쓰기</button>";
  if (bdCanShare() && !p.parentId) h += "<button type='button' class='bd-act' data-share='"+esc(p.id)+"'>공유</button>";
  if (mine){
    h += "<button type='button' class='bd-act' data-edit='"+esc(p.id)+"'>수정</button>";
    h += "<button type='button' class='bd-act' data-del='"+esc(p.id)+"'>삭제</button>";
  }
  h += "</div>";
  h += "<div class='bd-inbox' data-inbox></div>";
  h += "</article>";
  return h;
}

/* 내가 하트를 눌렀는지는 likes/{uid} 문서가 진실이다. 화면을 그린 뒤 조용히 확인해
   하트만 채운다 — 전체를 다시 그리면 펼쳐 둔 글이 도로 접힌다. */
function bdPrefetchLikes(list){
  if (!bdUser || !fbDb || !list.length) return;
  list.forEach(function(p){
    fbDb.collection("posts").doc(p.id).collection("likes").doc(bdUser.uid).get()
      .then(function(d){
        if (!d.exists) return;
        bdLiked[p.id] = true;
        var b = C.querySelector("[data-like='"+p.id+"']");
        if (b){ b.classList.add("on"); b.setAttribute("aria-pressed","true"); }
      }, function(){});
  });
}

/* ---- 카드 액션 ---- */
function bdToggleLike(el){
  if (!bdUser){ bdToast("로그인하면 좋아요를 누를 수 있습니다."); return; }
  if (!fbDb) return;
  var id = el.getAttribute("data-like");
  var on = !bdLiked[id];
  var numEl = el.querySelector("b");
  var n = Number(String(numEl.textContent||"0").replace(/[^\d]/g,"")) || 0;
  bdLiked[id] = on;
  el.classList.toggle("on", on);
  el.setAttribute("aria-pressed", String(on));
  numEl.textContent = nfmt(Math.max(0, n + (on?1:-1)));
  var doc = fbDb.collection("posts").doc(id);
  var like = doc.collection("likes").doc(bdUser.uid);
  var w = on
    ? like.set({ uid:bdUser.uid, createdAt:firebase.firestore.FieldValue.serverTimestamp() })
    : like["delete"]();
  /* likeCount 는 규칙이 "likeCount 만 ±1" 인 별도 쓰기로만 허용한다. replyCount 와
     같은 update 에 담으면 통째로 거부된다. 숫자 갱신 실패는 조용히 넘긴다 —
     하트의 진실은 likes 문서고, 숫자 하나 때문에 화면을 막지 않는다. */
  w.then(function(){
    return doc.update({ likeCount: firebase.firestore.FieldValue.increment(on?1:-1) });
  })["catch"](function(){});
}
function bdShareFrom(el){
  var card = el.closest(".bd-card");
  var t = card ? card.querySelector("[data-text]") : null;
  bdShare(el.getAttribute("data-share"), t ? t.textContent : "");
}
function bdDelete(el){
  if (!fbDb) return;
  var id = el.getAttribute("data-del");
  if (!window.confirm("이 글을 지울까요? 되돌릴 수 없습니다.")) return;
  el.disabled = true;
  fbDb.collection("posts").doc(id)["delete"]().then(function(){
    bdReset();
    if (boardPath() === id) bdGo("");   /* 보고 있던 글이 사라졌으면 피드로 */
    else render();
  }, function(e){
    el.disabled = false;
    if (window.console && console.error) console.error("[자유게시판]", e);
    bdToast("지우지 못했습니다.");
  });
}
/* 수정은 카드 자리에서 연다. 별도 화면으로 보내면 주소가 하나 더 생기고,
   슬러그를 안 바꾸기로 한 이상 그 주소는 아무 의미가 없다. */
function bdEditCard(el){
  var card = el.closest(".bd-card");
  if (!card || card.querySelector("[data-editbox]")) return;
  var id = card.getAttribute("data-post");
  var sel = (bdTagCache[id] || []).slice();
  var editImg = bdImgCache[id] || null;
  var box = document.createElement("div");
  box.className = "bd-edit";
  box.setAttribute("data-editbox","1");
  box.innerHTML =
    "<textarea class='bd-in' maxlength='"+BD_BODY_MAX+"' rows='5' data-ebody></textarea>"+
    "<div data-eimgprev></div>"+
    "<div class='bd-taglane'><div class='chips' data-etags></div>"+
      "<label class='chip' style='cursor:pointer'>📷 사진<input type='file' accept='image/*' data-eimgfile style='display:none'></label></div>"+
    "<p class='bd-msg' data-emsg></p>"+
    "<div class='bd-editacts'><button type='button' class='btn' data-esave>저장</button>"+
    "<button type='button' class='chip' data-ecancel>취소</button></div>";
  card.appendChild(box);
  var ta = box.querySelector("[data-ebody]");
  ta.value = bdBodyCache[id] || "";
  bdTagPicker(box.querySelector("[data-etags]"), sel);
  var msg = box.querySelector("[data-emsg]");
  var imgPrev = box.querySelector("[data-eimgprev]");
  var imgFile = box.querySelector("[data-eimgfile]");
  function drawEditImg(){
    if (!imgPrev) return;
    if (!editImg){ imgPrev.innerHTML = ""; return; }
    imgPrev.innerHTML = "<div class='bd-img-preview'>"+
      "<img src='"+esc(editImg)+"' alt='미리보기'>"+
      "<button type='button' class='bd-img-del' data-eimgdel title='삭제'>×</button></div>";
    var del = imgPrev.querySelector("[data-eimgdel]");
    if (del) del.onclick = function(){ editImg = null; drawEditImg(); };
  }
  if (imgFile){
    imgFile.onchange = function(){
      var f = this.files && this.files[0];
      if (!f) return;
      msg.textContent = "사진 처리 중…";
      bdResizeImage(f, function(err, out){
        if (err){ msg.textContent = err; return; }
        msg.textContent = "";
        editImg = out;
        drawEditImg();
      });
      this.value = "";
    };
  }
  drawEditImg();
  box.querySelector("[data-ecancel]").onclick = function(){ card.removeChild(box); };
  box.querySelector("[data-esave]").onclick = function(){
    var b = this;
    var body = String(ta.value||"").trim();
    if (body.length < 1 || body.length > BD_BODY_MAX){
      msg.textContent = "내용은 1자 이상 "+nfmt(BD_BODY_MAX)+"자 이하로 남겨 주세요."; return;
    }
    b.disabled = true; msg.textContent = "저장하는 중입니다.";
    /* 본인 글이라 규칙의 첫 절이 허용한다 — slug 는 건드리지 않는다 */
    fbDb.collection("posts").doc(id).update({
      body: body, tags: sel.slice(0,BD_TAG_MAX), excerpt: bdExcerpt(body),
      image: editImg || null,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function(){ bdImgCache[id] = editImg || null; bdReset(); render(); }, function(e){
      b.disabled = false;
      if (window.console && console.error) console.error("[자유게시판]", e);
      msg.textContent = "저장하지 못했습니다. 잠시 후 다시 시도해 주세요.";
    });
  };
}
/* 답글 쓰기 — 누른 글 바로 아래에서 연다. 화면은 한 픽셀도 움직이지 않는다.
   예전에는 피드에서 글 화면으로 넘어가며 맨 위로 올라갔고, 글 화면에서는 맨 아래
   입력창까지 스크롤했다. 둘 다 읽던 자리를 잃는다 — 대표 지적 2026-08-15. */
function bdOpenReply(el){
  var id = el.getAttribute("data-reply");
  var card = el.closest(".bd-card");
  var box = card ? card.querySelector("[data-inbox]") : null;
  if (!box) return;
  if (bdInline === id){ bdInline = null; box.innerHTML = ""; return; }   /* 다시 누르면 접는다 */
  /* 입력창이 둘이면 어디에 쓰는지 알 수 없다 — 열려 있던 것은 닫는다 */
  var all = C.querySelectorAll("[data-inbox]");
  for (var i=0; i<all.length; i++) all[i].innerHTML = "";
  bdInline = id;
  var root = card.getAttribute("data-root") || id;
  var nameEl = card.querySelector(".bd-name");
  var n = Number(String((card.querySelector("[data-rc]")||{}).textContent||"0").replace(/[^\d]/g,"")) || 0;
  /* 답글을 "읽으러" 가는 길은 여기 둔다 — 액션 줄에 두면 쓰려던 사람이 또 넘어간다 */
  box.innerHTML = (n && !bdInThread(card)
      ? "<a class='bd-act' href='"+esc(boardUrl(root))+"'>답글 "+nfmt(n)+"개 모두 보기 →</a>"
      : "")+
    "<div data-inreply></div>";
  bdComposer(box.querySelector("[data-inreply]"), {
    parentId: id,
    rootId: root,
    tags: (bdTagCache[root] || []),
    toName: nameEl ? String(nameEl.textContent||"") : "",
    done: function(){ bdInlineDone(box, root); }
  });
  var ta = box.querySelector("[data-cbody]");
  /* preventScroll — 포커스만으로도 브라우저가 화면을 끌어당긴다 */
  if (ta){ try { ta.focus({ preventScroll:true }); } catch(e){} }
}
/* 스레드 화면에서는 이미 그 글의 답글을 다 보고 있으므로 "모두 보기"를 붙이지 않는다 */
function bdInThread(card){ return !!card.closest("[data-thread]"); }
function bdInlineDone(box, root){
  bdInline = null;
  box.innerHTML = "";
  bdToast("답글을 올렸습니다");
  /* 숫자만 올린다. 목록을 다시 그리면 읽던 자리가 그대로 사라진다 */
  var card = C.querySelector("[data-post='"+root+"']");
  var el = card ? card.querySelector("[data-rc]") : null;
  if (el) el.textContent = nfmt((Number(String(el.textContent||"0").replace(/[^\d]/g,""))||0) + 1);
}
/* 목록 화면의 "이야기하기" — 인용 대상만 들고 게시판으로 건너간다.
   해시나 주소에 제목·URL 을 실어 나르지 않는다. 주소가 길어지고 공유도 어려워진다. */
function bdTalk(el){
  bdRef = { type: el.getAttribute("data-talk") || "",
            title: el.getAttribute("data-talk-title") || "",
            url: ctSafeUrl(el.getAttribute("data-talk-url") || "") };
  bdGo("");
}

/* 화면에 보일 이름. 프로필 닉네임이 먼저고, 없으면 구글 이름을 그대로 쓴다
   (대표 지시 2026-08-15 "별도 수정 없으면 구글 그대로, 강제하지 않게").
   바꾸고 싶으면 프로필 설정에서 언제든 바꾼다. */
function bdName(){
  return (wpMine && wpMine.nick) || (bdUser && bdUser.displayName) || "익명";
}

/* ---- 입력창 ----
   비로그인에게도 보인다. 로그인 벽을 먼저 세우면 대부분은 거기서 돌아간다 —
   쓰려고 마음먹은 다음에 물어보는 편이 훨씬 적게 잃는다.
   opt.parentId 가 있으면 답글, 없으면 원글이다. */
function bdComposer(host, opt){
  if (!host) return;
  opt = opt || {};
  var isReply = !!opt.parentId;
  var sel = isReply ? [] : bdDraft.tags;
  var toName = isReply ? String(opt.toName||"") : "";
  var ph = isReply ? "답글을 남겨 보세요" : "AI를 쓰면서 알게 된 것을 남겨 보세요";
  var attachedImg = isReply ? null : (bdDraft.image || null);

  host.innerHTML = "<div class='bd-composer'>"+
    (isReply ? (toName ? "<p class='bd-lead' style='margin-top:0'>"+esc(toName)+" 님에게</p>" : "")
             : "<div data-refbox></div>")+
    "<textarea class='bd-in bd-grow' rows='1' maxlength='"+BD_BODY_MAX+"' data-cbody"+
      " placeholder='"+esc(ph)+"' aria-label='"+esc(ph)+"'></textarea>"+
    "<div data-cimgprev></div>"+
    (isReply
      ? "<div class='bd-taglane'><label class='chip' style='cursor:pointer'>📷 사진 첨부<input type='file' accept='image/*' data-cimgfile style='display:none'></label></div>"
      : "<div class='bd-taglane'><div class='chips' data-ctags></div>"+
          "<button type='button' class='chip' data-newtag>+ 태그</button>"+
          "<label class='chip' style='cursor:pointer'>📷 사진<input type='file' accept='image/*' data-cimgfile style='display:none'></label></div>"+
        "<div class='bd-newtagbox' data-newtagbox hidden>"+
          "<input class='bd-in' type='text' maxlength='20' placeholder='새 태그 이름'"+
            " data-newtagname aria-label='새 태그 이름'>"+
          "<button type='button' class='chip' data-newtagadd>추가</button></div>")+
    "<p class='bd-msg' data-cmsg></p>"+
    "<div class='bd-cfoot'>"+
      (bdUser
        ? "<span class='bd-me'>"+
            /* 프로필이 있으면 그 사진·닉네임을 쓴다 — 구글 실명은 화면에 세우지 않는다 */
            wpAva("bd-ava", (wpMine && wpMine.photoURL) || bdUser.photoURL, bdName())+
            "<span class='bd-name'>"+esc(bdName())+"</span></span>"+
          /* 프로필로 들어가는 문은 상단바 하나로 모았다(대표 지시 2026-08-15).
             여기에도 두면 같은 것이 두 군데가 된다. */
          "<button type='button' class='bd-act' data-logout>로그아웃</button>"+
          "<span class='bd-count tnum' data-ccount></span>"+
          "<button type='button' class='btn' data-csend>"+(isReply?"답글 올리기":"올리기")+"</button>"
        : "<span class='bd-hint'>구글 계정으로 3초면 시작합니다</span>"+
          "<button type='button' class='btn' data-login>구글 계정으로 로그인</button>")+
    "</div></div>";

  var ta = host.querySelector("[data-cbody]");
  var msg = host.querySelector("[data-cmsg]");
  var countEl = host.querySelector("[data-ccount]");
  var imgPrev = host.querySelector("[data-cimgprev]");
  var imgInput = host.querySelector("[data-cimgfile]");
  var drawTags = null;

  function drawAttachedImg(){
    if (!imgPrev) return;
    if (!attachedImg){ imgPrev.innerHTML = ""; return; }
    imgPrev.innerHTML = "<div class='bd-img-preview'>"+
      "<img src='"+esc(attachedImg)+"' alt='미리보기'>"+
      "<button type='button' class='bd-img-del' data-cimgdel title='삭제'>×</button></div>";
    var del = imgPrev.querySelector("[data-cimgdel]");
    if (del) del.onclick = function(){
      attachedImg = null;
      if (!isReply) bdDraft.image = null;
      drawAttachedImg();
    };
  }
  if (imgInput){
    imgInput.onchange = function(){
      if (!bdUser){ bdToast("로그인하면 사진을 올릴 수 있습니다."); return; }
      var f = this.files && this.files[0];
      if (!f) return;
      msg.textContent = "사진 처리 중…";
      bdResizeImage(f, function(err, out){
        if (err){ msg.textContent = err; return; }
        msg.textContent = "";
        attachedImg = out;
        if (!isReply) bdDraft.image = out;
        drawAttachedImg();
      });
      this.value = "";
    };
  }
  drawAttachedImg();

  function grow(){ ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 420) + "px"; }
  function count(){ if (countEl) countEl.textContent = ta.value.length + " / " + nfmt(BD_BODY_MAX); }
  ta.value = isReply ? "" : String(bdDraft.body||"");
  ta.oninput = function(){
    grow(); count();
    if (!isReply) bdDraft.body = ta.value;   /* 로그인하러 다녀와도 남아 있게 */
  };
  grow(); count();

  /* 인용 블록 — "이야기하기"로 건너온 항목 */
  function drawRef(){
    var box = host.querySelector("[data-refbox]");
    if (!box) return;
    if (!bdRef || (!bdRef.title && !bdRef.url)){ box.innerHTML = ""; return; }
    box.innerHTML = "<div class='bd-ref'><span class='bd-ref-k'>"+esc(bdRef.type||"링크")+"</span>"+
      (bdRef.url
        ? "<a href='"+esc(bdRef.url)+"' target='_blank' rel='noopener noreferrer nofollow'>"+
          esc(bdRef.title||bdRef.url)+"</a>"
        : "<span>"+esc(bdRef.title||"")+"</span>")+
      "<button type='button' class='bd-act' data-refclear>인용 빼기</button></div>";
    box.querySelector("[data-refclear]").onclick = function(){ bdRef = null; drawRef(); };
  }
  drawRef();

  if (!isReply){
    drawTags = bdTagPicker(host.querySelector("[data-ctags]"), sel);
    var ntBtn = host.querySelector("[data-newtag]");
    var ntBox = host.querySelector("[data-newtagbox]");
    ntBtn.onclick = function(){
      if (!bdUser){ bdToast("로그인하면 태그를 만들 수 있습니다."); return; }
      ntBox.hidden = !ntBox.hidden;
      if (!ntBox.hidden) host.querySelector("[data-newtagname]").focus();
    };
    host.querySelector("[data-newtagadd]").onclick = function(){
      var b = this, nameEl = host.querySelector("[data-newtagname]");
      var n = String(nameEl.value||"").trim();
      var err = bdTagError(n);
      if (err){ msg.textContent = err; return; }
      b.disabled = true;
      /* 문서 ID 가 곧 태그 이름이라, 같은 이름이 이미 있으면 규칙이 거부한다 —
         중복은 화면이 아니라 DB 가 막는다 */
      fbDb.collection("tags").doc(n).set({
        name:n, uid:bdUser.uid, createdAt:firebase.firestore.FieldValue.serverTimestamp()
      }).then(function(){
        bdTagsDb = bdTagsDb.concat([n]);
        if (sel.length < BD_TAG_MAX) sel.push(n);
        nameEl.value = ""; ntBox.hidden = true; msg.textContent = ""; b.disabled = false;
        if (drawTags) drawTags();
      }, function(){
        b.disabled = false;
        msg.textContent = "이미 있는 태그이거나 만들지 못했습니다.";
      });
    };
  }

  var send = host.querySelector("[data-csend]");
  if (!send) return;
  send.onclick = function(){
    var body = String(ta.value||"").trim();
    if (body.length < 1 || body.length > BD_BODY_MAX){
      msg.textContent = "내용은 1자 이상 "+nfmt(BD_BODY_MAX)+"자 이하로 남겨 주세요."; return;
    }
    var tags = (isReply ? (opt.tags||[]) : sel).slice(0, BD_TAG_MAX);
    if (!isReply && tags.length < 1){ msg.textContent = "태그를 하나 이상 골라 주세요."; return; }
    send.disabled = true; msg.textContent = "올리는 중입니다.";
    var now = firebase.firestore.FieldValue.serverTimestamp();
    var doc = {
      uid: bdUser.uid,
      author: bdUser.displayName || "익명",
      photo: bdUser.photoURL || "",
      body: body,
      image: attachedImg || null,
      tags: tags,
      excerpt: bdExcerpt(body),
      parentId: isReply ? opt.parentId : null,
      ref: (!isReply && bdRef && (bdRef.title || bdRef.url))
             ? { type:String(bdRef.type||""), title:String(bdRef.title||""), url:String(bdRef.url||"") }
             : null,
      replyCount: 0,   /* 규칙이 0 을 요구한다 — 처음부터 부풀린 값으로 만들 수 없게 */
      likeCount: 0,
      createdAt: now,
      updatedAt: now
    };
    function fail(e){
      send.disabled = false;
      if (window.console && console.error) console.error("[자유게시판]", e);
      msg.textContent = "올리지 못했습니다. 잠시 후 다시 시도해 주세요.";
    }
    if (isReply){
      /* 답글은 슬러그가 필요 없다 — 주소를 갖지 않는다. rootId 는 원글의 슬러그다 */
      doc.slug = null;
      doc.rootId = opt.rootId;
      fbDb.collection("posts").add(doc).then(function(){
        /* 답글 수는 "replyCount 만 +1" 인 별도 쓰기로만 허용된다. 실패해도 답글 자체는
           이미 올라갔으므로 조용히 넘긴다 */
        return fbDb.collection("posts").doc(opt.rootId)
          .update({ replyCount: firebase.firestore.FieldValue.increment(1) })["catch"](function(){});
      }).then(function(){
        bdReplyTo = null;
        /* 인라인 답글은 자리를 지켜야 하므로 부른 쪽이 뒷정리를 한다 */
        if (opt.done) opt.done();
        else render();
      }, fail);
      return;
    }
    bdClaimSlug(body, 3).then(function(slug){
      if (!slug){ send.disabled = false; msg.textContent = "잠시 후 다시 시도해 주세요."; return; }
      doc.slug = slug;
      doc.rootId = slug;   /* 원글의 rootId 는 자기 자신이다 — 쓰기 한 번으로 끝난다 */
      return fbDb.collection("posts").doc(slug).set(doc).then(function(){
        bdDraft.body = ""; bdDraft.tags = []; bdDraft.image = null; bdRef = null;
        bdReset();
        bdGo(slug);   /* 방금 올린 글로 — 공유할 주소가 바로 손에 들어온다 */
      });
    })["catch"](fail);
  };
}

/* ---- ③ 빈 피드 방지: 오늘의 브리핑 카드 ----
   이미 쓰고 있는 공개 데이터에서 가져오고 여기서는 아무것도 쓰지 않는다.
   Firebase 가 비어 있어도 이 카드는 뜬다 — 처음 온 사람이 빈 화면을 보지 않게. */
function bdBriefCard(host){
  if (!host) return;
  var r = sortedReports()[0];
  if (!r){ host.innerHTML = ""; return; }
  var lines = String(r.content||"").split(/\r?\n/), picked = [];
  for (var i=0; i<lines.length && picked.length<4; i++){
    var t = lines[i].replace(/\*\*/g,"").trim();
    if (!t || /^#{1,6}\s/.test(t)) continue;
    t = t.replace(/^[•\-*]+\s*/,"")
         .replace(/[\(（]\s*(?:출처|링크|img)\s*:?\s*https?:\/\/[^\s)）]+\s*[\)）]?/gi,"")
         .replace(/https?:\/\/[^\s)<>"'　]+/g,"")
         .replace(/[\(（]\s*[\)）]/g,"").trim();
    if (t.length < 8) continue;
    picked.push(t.length > 120 ? t.slice(0,120)+"…" : t);
  }
  if (!picked.length){ host.innerHTML = ""; return; }
  host.innerHTML = "<div class='bd-brief'><p class='eyebrow'>오늘의 브리핑</p>"+
    "<h3>"+esc(r.title||"AI 브리핑")+"</h3>"+
    "<ul>"+picked.map(function(t){ return "<li>"+esc(t)+"</li>"; }).join("")+"</ul>"+
    "<a class='btn' href='"+esc(menuHref("newsrep"))+"'>전체 보기</a></div>";
}

/* ---- 히어로 숫자 ---- */
function bdFacts(){
  var n = bdFeed.length;
  setFacts([
    [bdMore ? n+"+" : String(n), "글"],
    [String(bdTagList().length), "태그"],
    [bdFeed.length ? bdWhen(bdFeed[0].createdAt) : "—", "최근 글"]
  ]);
}

/* ---- 피드 ---- */
function bdFeedView(el){
  bdRedrawComposer = null;
  /* 두 단이다 — 왼쪽이 글, 오른쪽이 오늘의 브리핑.
     좁아지면 한 단으로 접히고 브리핑이 위로 간다(위 @media 960px). */
  el.innerHTML =
    "<div class='bd-cols'>"+
      "<div>"+
        "<div class='controls'><div class='chips' data-filter></div></div>"+
        "<div data-comp></div>"+
        "<div data-rows></div>"+
        "<div class='bd-more' data-more></div>"+
      "</div>"+
      "<aside data-brief></aside>"+
    "</div>";
  bdBriefCard(el.querySelector("[data-brief]"));
  bdComposer(el.querySelector("[data-comp]"), {});
  var filterEl = el.querySelector("[data-filter]");
  var rowsEl = el.querySelector("[data-rows]");
  var moreEl = el.querySelector("[data-more]");
  var sentIo = null;
  var hasIo = ("IntersectionObserver" in window);

  function drawFilter(){
    var list = ["전체"].concat(bdTagList());
    if (list.indexOf(bdTag) < 0) bdTag = "전체";
    filterEl.innerHTML = list.map(function(t){
      return "<button type='button' class='chip"+(t===bdTag?" on":"")+"' data-f='"+esc(t)+"'"+
        " aria-pressed='"+(t===bdTag)+"'>"+esc(t)+"</button>";
    }).join("");
    filterEl.querySelectorAll("[data-f]").forEach(function(b){
      b.onclick = function(){ bdTag = b.getAttribute("data-f"); drawFilter(); load(true); };
    });
  }
  function watchSentinel(){
    if (sentIo){ sentIo.disconnect(); sentIo = null; }
    if (!bdMore || !hasIo) return;
    var s = moreEl.querySelector("[data-sentinel]");
    if (!s) return;
    sentIo = new IntersectionObserver(function(en){
      if (en[0] && en[0].isIntersecting) load(false);
    }, { rootMargin:"400px" });
    sentIo.observe(s);
  }
  function paint(){
    rowsEl.innerHTML = bdFeed.length
      ? bdFeed.map(function(p){ return bdCard(p, {}); }).join("")
      : "<div class='bd-empty'><p>아직 글이 없습니다. 첫 글을 남겨 보세요.</p>"+
        (bdUser ? "" : "<button type='button' class='btn' data-login>구글 계정으로 로그인</button>")+"</div>";
    /* 무한 스크롤이 기본이고, IntersectionObserver 가 없는 브라우저에서만 버튼이 남는다 */
    moreEl.innerHTML = !bdMore ? ""
      : (hasIo ? "<span class='bd-sentinel' data-sentinel></span><span class='bd-loading'>더 불러오는 중…</span>"
               : "<button type='button' class='btn' data-loadmore>더 보기</button>");
    var mb = moreEl.querySelector("[data-loadmore]");
    if (mb) mb.onclick = function(){ load(false); };
    watchSentinel();
  }
  function load(first){
    if (bdBusy) return;
    bdBusy = true;
    if (first){
      if (!bdFeed.length) rowsEl.innerHTML = emptyNote("글을 불러오는 중입니다.");
      bdCursor = null;
    }
    /* 원글만 본다. 태그 필터는 서버에서 건다 — 클라이언트에서 거르면 무한 스크롤이
       20개를 받아 3개만 보여주는 일이 생긴다. 대신 복합 색인이 하나 더 필요하다. */
    var q = fbDb.collection("posts").where("parentId","==",null);
    if (bdTag !== "전체") q = q.where("tags","array-contains",bdTag);
    q = q.orderBy("createdAt","desc");
    if (!first && bdCursor) q = q.startAfter(bdCursor);
    q.limit(BD_PAGE).get().then(function(sn){
      bdBusy = false;
      if (!bdAlive(el)) return;
      var got = [];
      sn.forEach(function(d){ var o = d.data()||{}; o.id = d.id; got.push(o); });
      /* SNS 자동 수집 글 병합 (첫 페이지일 때) */
      if (first && bdSnsList && bdSnsList.length){
        var seen = {};
        got.forEach(function(p){ seen[p.id] = true; });
        var filteredSns = bdSnsList.filter(function(s){
          if (seen[s.id]) return false;
          if (bdTag !== "전체" && (!s.tags || s.tags.indexOf(bdTag) === -1)) return false;
          return true;
        });
        got = got.concat(filteredSns);
        got.sort(function(a,b){ return (bdMs(b.createdAt)||0) - (bdMs(a.createdAt)||0); });
      }
      if (sn.docs && sn.docs.length) bdCursor = sn.docs[sn.docs.length-1];
      bdMore = got.length >= BD_PAGE && sn.docs && sn.docs.length === BD_PAGE;
      bdFeed = first ? got : bdFeed.concat(got);
      paint(); bdFacts(); bdPrefetchLikes(got); wpLinkNames(got);
      if (first) drawFilter();
    }, function(e){
      bdBusy = false;
      if (!bdAlive(el)) return;
      moreEl.innerHTML = "";
      bdQueryFail(rowsEl, e, function(){ bdReset(); load(true); });
    });
  }
  drawFilter();
  if (bdFeed.length){ paint(); bdFacts(); }   /* 캐시가 있으면 먼저 보여주고 뒤에서 새로 받는다 */
  load(true);
}

/* ---- 스레드 ---- */
function bdThreadView(el, slug){
  bdReplyTo = null;
  el.innerHTML = "<a class='bd-back' href='"+esc(boardUrl(""))+"'>← 피드</a>"+
    "<div data-thread>"+emptyNote("글을 불러오는 중입니다.")+"</div>";
  var te = el.querySelector("[data-thread]");
  var rootP = null;

  function draw(root, replies){
    var byId = {};
    replies.forEach(function(r){ byId[r.id] = r; });
    /* 3단계 이상 답글도 2단계로 눕힌다 — 375px 에서 더 들여쓰면 본문 자리가 사라진다 */
    function depthOf(p){
      var n = 1, cur = p, guard = 0;
      while (cur && cur.parentId && cur.parentId !== root.id && guard < 12){
        cur = byId[cur.parentId]; n++; guard++;
        if (!cur) break;
      }
      return Math.min(n, 2);
    }
    te.innerHTML = bdCard(root, { full:true, thread:true })+
      "<p class='bd-lead'>답글 <b class='tnum'>"+nfmt(replies.length)+"</b></p>"+
      (replies.length
        ? replies.map(function(r){ return bdCard(r, { full:true, thread:true, depth:depthOf(r) }); }).join("")
        : emptyNote("아직 답글이 없습니다. 먼저 이어 보세요."))+
      "<div data-replycomp></div>";
    bdRedrawComposer = function(){
      var to = (bdReplyTo && (bdReplyTo.id === root.id || byId[bdReplyTo.id])) ? bdReplyTo : null;
      bdComposer(te.querySelector("[data-replycomp]"), {
        parentId: to ? to.id : root.id,
        rootId: root.id,
        tags: (root.tags||[]),
        toName: to ? to.name : ""
      });
    };
    bdRedrawComposer();
    setFacts([[nfmt(replies.length),"답글"], [nfmt(root.likeCount||0),"좋아요"],
              [bdWhen(root.createdAt),"올린 때"]]);
    /* 크롤러는 JS 를 안 돌려 og 태그는 그대로지만, 탭 제목·북마크·방문 기록에는 남는다 */
    var head = String(root.excerpt || root.body || "").slice(0,40);
    document.title = (head || "글") + " — AI 레이더";
    bdPrefetchLikes([root].concat(replies));
    wpLinkNames([root].concat(replies));
  }

  function load(){
    /* SNS 자동 수집 글(정적 데이터)인지 먼저 확인 */
    var snsFound = null;
    var list = (bdSnsList && bdSnsList.length) ? bdSnsList : BD_DEFAULT_SNS;
    for (var i = 0; i < list.length; i++){
      if (list[i].id === slug){ snsFound = list[i]; break; }
    }

    fbDb.collection("posts").doc(slug).get().then(function(d){
      if (!bdAlive(el)) return null;
      if (d.exists){
        rootP = d.data()||{}; rootP.id = d.id;
      } else if (snsFound){
        rootP = JSON.parse(JSON.stringify(snsFound));
      } else {
        te.innerHTML = emptyNote("글을 찾을 수 없습니다. 지워졌거나 주소가 잘못되었을 수 있습니다.");
        return null;
      }
      var root = rootP.rootId || rootP.id;
      /* 답글 주소로 들어왔으면 그 스레드의 원글로 옮겨 준다 */
      if (root !== rootP.id){ bdGo(root); return null; }
      return fbDb.collection("posts").where("rootId","==",root).orderBy("createdAt","asc").get();
    }).then(function(sn){
      if (!bdAlive(el)) return;
      var replies = [];
      if (sn && sn.forEach){
        sn.forEach(function(d){
          if (d.id === rootP.id) return;   /* 원글은 rootId 가 자기 자신이라 같이 딸려 온다 */
          var o = d.data()||{}; o.id = d.id; replies.push(o);
        });
      }
      draw(rootP, replies);
    }, function(e){
      if (!bdAlive(el)) return;
      if (snsFound){
        rootP = JSON.parse(JSON.stringify(snsFound));
        draw(rootP, []);
      } else {
        bdQueryFail(te, e, load);
      }
    });
  }
  load();
}

/* ---- 게시판 진입 ----
   wide=true 면 720px 제한을 풀어 다른 화면과 같은 폭을 쓴다(대표 지시 2026-08-15).
   피드는 2단(글+브리핑)이라 720px 안에 가두면 글 칸이 400px 남짓으로 쪼그라들고
   화면 오른쪽 절반이 통째로 빈다 — 폭을 넓히라고 했는데 오히려 좁아 보이던 원인이다.
   글 한 줄이 너무 길어지는 것은 .bd-cols 의 글 칸 자체에서 잡는다. */
function bdShell(inner, wide){
  return "<section class='section paper'><div class='inner'>"+
    sectionHead("Board","오늘 알게 된 것,<br>한 줄이면 충분합니다.",
      "AI를 쓰면서 알게 된 것을 짧게 남기고 이어 가는 곳입니다.","")+
    "<div class='bd-wrap"+(wide?" bd-wide":"")+"'>"+inner+"</div></div></section>";
}
function renderBoard(){
  setKicker(["자유게시판"]);
  setFacts([["—","글"],[String(bdTagList().length),"태그"],["—","최근 글"]]);

  /* config 가 비면 SDK 를 아예 부르지 않는다. 브리핑 카드는 Firebase 와 무관하므로 그대로 뜬다 */
  if (!fbReady()){
    C.innerHTML = bdShell("<div data-brief></div>"+emptyNote("게시판 준비 중입니다."));
    bdBriefCard(C.querySelector("[data-brief]"));
    return;
  }
  /* 피드·스레드 모두 이 껍데기 안에서 그려진다. 넓게 쓴다 — 안쪽 .bd-cols 와
     .bd-thread 가 각자 읽기 좋은 폭을 잡으므로 여기서 묶을 필요가 없다. */
  C.innerHTML = bdShell("<div data-bd>"+emptyNote("게시판을 여는 중입니다.")+"</div>", true);
  var el = C.querySelector("[data-bd]");
  Promise.all([fbInit(), bdFetchTags(), bdLoadSnsPosts()]).then(function(){
    if (!bdAlive(el)) return;
    var slug = boardPath();
    if (slug) bdThreadView(el, slug);
    else bdFeedView(el);
  }, function(e){
    if (!bdAlive(el)) return;
    if (window.console && console.error) console.error("[자유게시판]", e);
    el.innerHTML = "<div class='fail'><h3>게시판을 불러오지 못했습니다</h3>"+
      "<p>잠시 후 다시 열어 주세요.</p>"+
      "<button type='button' class='btn' data-bdreload>다시 시도</button></div>";
    el.querySelector("[data-bdreload]").onclick = function(){ renderBoard(); };
  });
}

/* 카드 액션은 한 곳에서 위임으로 받는다. 화면을 다시 그릴 때마다 버튼마다
   onclick 을 다시 매다는 대신 여기 하나만 둔다 — 다시 그려도 끊기지 않는다. */
C.addEventListener("click", function(e){
  var t = e.target, el;
  if (!t || !t.closest) return;
  /* 안전망. 갈 곳이 없는 앵커(href="#")는 눌러도 맨 위로 튀지 않게 한다 —
     지금은 그런 앵커가 없지만, 나중에 하나만 새로 생겨도 읽던 자리가 날아간다 */
  var anc = t.closest("a[href]");
  if (anc){
    var hv = anc.getAttribute("href");
    if (!hv || hv === "#") e.preventDefault();
  }
  if ((el = t.closest("[data-talk]"))){ e.preventDefault(); bdTalk(el); return; }
  if ((el = t.closest("[data-unfold]"))){
    var card = el.closest(".bd-card");
    var tx = card ? card.querySelector("[data-text]") : null;
    if (tx) tx.classList.remove("fold");
    if (el.parentNode) el.parentNode.removeChild(el);
    return;
  }

/* ============================================================================
   프로필(공개 포트폴리오) · 작품 등록

   프로필은 설정 화면이 아니라 남에게 보여줄 주소다(/u/{슬러그}). 보여줄 주소가 생기면
   본인이 그 주소를 알린다 — 그것이 이 기능을 만든 이유이고, 그래서 화면은
   "고치는 곳"이 아니라 "보이는 곳"이 먼저다.

   ⚠️ 메일 주소는 어느 문서에도 넣지 않는다. 구글 로그인은 메일과 실명을 함께 주지만
   우리가 쓰는 것은 uid 와 프로필 사진뿐이고, 이름도 구글의 것 대신 직접 받은 닉네임을
   쓴다. firestore.rules 의 profiles 규칙이 키 목록을 못박아 한 번 더 막는다.

   ⚠️ 아래 길이 제한은 rules 와 같은 값이어야 한다 — 어긋나면 화면에서 통과한 것이
   서버에서 조용히 거부된다.
   ============================================================================ */
var WP_NICK_MAX = 20;      /* rules: nick 2~20 */
var WP_BIO_MAX = 80;       /* rules: bio <= 80 */
var WP_LINK_MAX = 200;     /* rules: link <= 200 */
var WP_PHOTO_MAX = 50000;  /* rules: photoURL <= 50000 — 업로드한 아바타(축소 data URL)를 담을 크기 */
var WK_TITLE_MAX = 60;     /* rules: title <= 60 */
var WK_DAY_MAX = 3;        /* 하루 등록 상한 — 화면에서 센다(아래 wkCountToday 주석) */
var WK_PAGE = 100;   /* 갤러리 한 페이지 크기(대표 2026-08-17). 상한이 아니다 — 이만큼 꽉 차면
                        아래 "더 보기"(무한 스크롤 sentinel · 폴백 버튼)로 계속 이어 받는다. */
var WK_HOME = 4;           /* 홈에 보여줄 최근 작품 수 */

var wpMine;                /* 내 프로필 — undefined: 아직 모름 · null: 없음 */
var wpCache = {};          /* uid → 프로필(없으면 null). 한 사람을 두 번 읽지 않는다 */
var wpFactW = "—", wpFactP = "—";
var wpAuto = false;      /* 이번 세션에서 자동 생성을 이미 시도했는가 */
var wpSlugName = {};       /* 공모전 슬러그 → 이름 */
var wpSlugPromise = null;
var wkFeed = [], wkLiked = {};
var wkFormOpen = false;    /* 「작품 올리기」를 눌렀을 때만 폼을 편다 */
var wkById = {};           /* 카드에 그려진 작품 — 모달이 여기서 값을 꺼낸다 */
var wkModal = null, wkLastFocus = null, wkPrevOverflow = "";

/* 프로필 안에서의 이동. 게시판의 bdGo 와 같은 방식이다 */
function wpGo(slug){

function wpAlive(el){ return curRoute()==="prof" && C.contains(el); }

/* ---- 프로필 사진 ----
   상단바·게시판·작품 카드·공개 프로필 네 자리가 모두 이 함수를 쓴다.
   한 곳만 고치면 다른 데서 깨진 그림이 남기 때문이다.
   주소는 바깥 것이라 자주 깨진다(핫링크 차단·삭제) — 깨지면 닉네임 첫 글자로 떨어진다. */
function wpIni(nick){
  var c = String(nick||"").trim().charAt(0);
  return /[0-9A-Za-z가-힣]/.test(c) ? c : "?";
}
/* 아바타에 쓸 수 있는 주소만 통과시킨다. 일반 http(s) 는 ctSafeUrl 로,
   업로드한 사진은 data:image 만 — 이미지 한정이라 <img src> 에서 스크립트가 못 돈다.
   ctSafeUrl 은 공모전 링크 등 곳곳에 쓰이므로 거기엔 data: 를 열지 않는다. */
function wpSafePhoto(u){
  u = String(u||"");
  if (/^data:image\/(png|jpe?g|webp);base64,[A-Za-z0-9+/=]+$/.test(u)) return u;
  return ctSafeUrl(u);
}
function wpAva(cls, photo, nick){
  var u = wpSafePhoto(photo||"");
  var ini = wpIni(nick);
  if (!u) return "<span class='"+cls+" bd-ava-x' aria-hidden='true'>"+esc(ini)+"</span>";
  /* 지연 로딩(loading=lazy)을 쓰지 않는다. 화면 밖에 있으면 아예 받지 않아
     onerror 도 오지 않고, 깨진 사진이 깨진 채로 남는다. 아바타는 작아서 아껴도 얼마 안 된다. */
  return "<img class='"+cls+"' src='"+esc(u)+"' alt=''"+
         " referrerpolicy='no-referrer' onerror=\"avaFail(this,'"+esc(ini)+"')\">";
}
/* onerror 속성에서 부르므로 전역이어야 한다(위 icMark 와 같은 방식) */
window.avaFail = function(img, ini){
  if (!img || !img.parentNode) return;
  var sp = document.createElement("span");
  sp.className = img.className + " bd-ava-x";
  sp.setAttribute("aria-hidden", "true");
  sp.textContent = ini || "?";
  img.parentNode.replaceChild(sp, img);
};

/* ---- 프로필 읽기 ----
   문서 ID 가 곧 uid 라 색인 없이 바로 읽는다. 없는 사람은 null 로 기억해 다시 묻지 않는다.
   실패는 기억하지 않는다 — 네트워크가 잠깐 끊긴 것을 "프로필 없음"으로 굳히면 안 된다. */
function wpFetch(uid){
  if (!uid || !fbDb) return Promise.resolve(null);
  if (wpCache[uid] !== undefined) return Promise.resolve(wpCache[uid]);
  return fbDb.collection("profiles").doc(uid).get().then(function(d){
    var o = d.exists ? (d.data()||{}) : null;
    if (o) o.uid = uid;
    wpCache[uid] = o;
    return o;
  }, function(){ return null; });
}
function wpFetchMany(list){
  var seen = {}, jobs = [];
  (list||[]).forEach(function(o){
    var uid = o && o.uid;
    if (!uid || seen[uid]) return;
    seen[uid] = 1;
    jobs.push(wpFetch(uid));
  });
  return Promise.all(jobs);
}
function wpMineLoad(){
  if (!bdUser){ wpMine = null; return Promise.resolve(null); }
  if (wpMine !== undefined) return Promise.resolve(wpMine);
  return wpFetch(bdUser.uid).then(function(o){ wpMine = o; return o; });
}

/* 게시판 글의 작성자 이름을 프로필로 잇는다.
   예전 글에는 프로필을 가리키는 값이 없다 — 남은 것은 uid 뿐이라 그것으로 찾는다.
   프로필이 없는 사람은 이름을 그대로 둔다. 글을 다시 그리지 않고 이름만 바꾸는 이유는
   좋아요 채우기(bdPrefetchLikes)와 같다 — 펼쳐 둔 글이 도로 접히면 안 된다. */
function wpLinkNames(list){
  if (!fbDb) return;
  var seen = {};
  (list||[]).forEach(function(p){
    var uid = p && p.uid;
    if (!uid || seen[uid] || !/^[A-Za-z0-9]+$/.test(uid)) return;
    seen[uid] = 1;
    wpFetch(uid).then(function(o){
      if (!o || !o.slug) return;
      C.querySelectorAll("[data-pu='"+uid+"']").forEach(function(el){
        el.innerHTML = "<a href='"+esc(profUrl(o.slug))+"'>"+esc(o.nick || el.textContent)+"</a>";
      });
    });
  });
}

/* ---- 슬러그 ----
   게시판 글과 같은 방식으로 만든다(bdSlugify 재사용). 이미 쓰이는 이름이면 뒤에
   네 글자를 붙여 다시 시도한다. 한 번 정해지면 바뀌지 않는다 —
   주소가 바뀌면 본인이 알려 둔 링크가 전부 죽는다. 그래서 규칙도 slug 수정을 막는다. */
function wpSlugify(nick){
  var s = bdSlugify(nick);
  if (!s || s === "." || s === ".." || /^__.*__$/.test(s) || s.length < 2) s = "user";
  if (s.length > 24) s = s.slice(0,24).replace(/-+$/,"");
  return s;
}
function wpClaimSlug(nick, tries){
  var slug = wpSlugify(nick);
  if (tries < 3) slug = slug + "-" + bdRandHex();
  return fbDb.collection("slugs").doc(slug).get().then(function(d){
    if (!d.exists) return slug;
    if (tries <= 1) return null;
    return wpClaimSlug(nick, tries-1);
  });
}
/* 오류를 사람 말로 옮긴다. 원인별로 다르게 말해야 다음에 무엇을 할지 알 수 있다.
   원본은 콘솔에 그대로 남긴다 — 화면에 코드를 늘어놓지 않는다. */
function wpErrText(e, step){
  var c = (e && e.code) ? String(e.code) : "";
  if (c.indexOf("permission-denied") >= 0)
    return step+" 권한이 거부되었습니다. 잠시 후 다시 시도해 주세요.";
  if (c.indexOf("unavailable") >= 0 || c.indexOf("deadline") >= 0)
    return "네트워크가 불안정합니다. 잠시 후 다시 시도해 주세요.";
  if (c.indexOf("unauthenticated") >= 0)
    return "로그인이 풀렸습니다. 다시 로그인해 주세요.";
  return step+" 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.";
}
/* 프로필 쓰기. 슬러그 선점과 프로필 쓰기를 나눠 어디서 실패했는지 알 수 있게 한다 —
   예전에는 두 단계와 그 뒤 화면 갱신까지 한 catch 로 묶여 있어서, 쓰기가 성공했는데도
   뒤따르는 화면 코드가 던지면 "저장하지 못했습니다"로 보였다. */
function wpWriteProfile(nick, photo){
  var now = firebase.firestore.FieldValue.serverTimestamp();
  return wpClaimSlug(nick, 5).then(function(slug){
    if (!slug) throw { code:"slug-exhausted", step:"주소" };
    return fbDb.collection("slugs").doc(slug).set({ uid:bdUser.uid, createdAt:now })
      .then(function(){ return slug; },
            function(e){ e = e || {}; e.step = "주소"; throw e; })
      .then(function(sl){
        return fbDb.collection("profiles").doc(bdUser.uid).set({
          nick: nick,
          slug: sl,
          bio: "",
          link: "",
          photoURL: String(photo||"").slice(0, WP_PHOTO_MAX),
          createdAt: now
        }).then(function(){ return sl; },
                function(e){ e = e || {}; e.step = "프로필"; throw e; });
      });
  });
}
/* 로그인하면 프로필이 저절로 생긴다. 닉네임은 구글 이름을 그대로 쓰고, 없으면 "사용자"다.
   ⚠️ 실패해도 화면에 아무것도 띄우지 않는다 — 글쓰기·작품 올리기는 프로필 없이도 되고,
   여기서 막으면 로그인 이후 전부가 이 한 번의 쓰기에 묶인다(2026-08-15 대표 지시). */
function wpAutoProfile(){
  if (!bdUser || !fbDb || wpAuto) return;
  wpAuto = true;
  wpMineLoad().then(function(o){
    if (o) return;                                   /* 이미 있다 */
    var nick = String((bdUser.displayName||"")).trim();
    if (nick.length < 2) nick = "사용자";
    if (nick.length > WP_NICK_MAX) nick = nick.slice(0, WP_NICK_MAX);
    return wpWriteProfile(nick, bdUser.photoURL || "").then(function(){
      wpCache[bdUser.uid] = undefined; wpMine = undefined;
      return wpMineLoad().then(function(){ nvAuth(); });
    });
  }, function(){}) ["catch"](function(e){
    /* 조용히 넘긴다. 다음 로그인에서 다시 시도한다 */
    if (window.console && console.warn) console.warn("[프로필] 자동 생성 실패", e);
  });
}
/* 닉네임 중복 확인 (Firestore profiles 조회) */
function wpCheckNickDuplicate(nick, myUid){
  nick = String(nick||"").trim();
  if (nick.length < 2 || nick.length > WP_NICK_MAX) {
    return Promise.resolve({ ok:false, msg:"닉네임은 2자 이상 "+WP_NICK_MAX+"자 이하로 입력해 주세요." });
  }
  if (!fbDb) return Promise.resolve({ ok:false, msg:"데이터베이스 연결 준비 중입니다." });
  return fbDb.collection("profiles").where("nick", "==", nick).limit(2).get().then(function(snap){
    var dup = false;
    snap.forEach(function(d){
      if (d.id !== myUid) dup = true;
    });
    if (dup) {
      return { ok:false, msg:"이미 사용 중인 닉네임입니다. 다른 닉네임을 입력해 주세요." };
    }
    return { ok:true, msg:"사용 가능한 닉네임입니다. ✓" };
  }, function(e){
    if (window.console && console.error) console.error("[중복확인]", e);
    return { ok:false, msg:"중복 확인 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요." };
  });
}
function wpFieldError(nick, bio, link){
  nick = String(nick||"").trim();
  if (nick.length < 2 || nick.length > WP_NICK_MAX)
    return "닉네임은 2자 이상 "+WP_NICK_MAX+"자 이하로 적어 주세요.";
  if (String(bio||"").length > WP_BIO_MAX)
    return "한 줄 소개는 "+WP_BIO_MAX+"자까지 적을 수 있습니다.";
  link = String(link||"").trim();
  if (link && !/^https:\/\/\S+$/.test(link))
    return "대표 링크는 https:// 로 시작하는 주소만 넣을 수 있습니다.";
  if (link.length > WP_LINK_MAX) return "대표 링크가 너무 깁니다.";
  return "";
}

/* ---- 프로필 화면 ---- */
/* 사진 주소는 https 만 받는다. javascript:·data: 가 그대로 src 로 들어가면 안 된다 —
   화면에서 먼저 막고, 규칙에도 같은 조건을 넣는 것이 좋다(아래 보고 참조). */
function wpPhotoError(u){
  u = String(u||"").trim();
  if (!u) return "";
  var ok = /^https:\/\/\S+$/.test(u)
        || /^data:image\/(png|jpe?g|webp);base64,[A-Za-z0-9+/=]+$/.test(u);
  if (!ok) return "프로필 사진은 https:// 주소이거나 올린 이미지여야 합니다.";
  if (u.length > WP_PHOTO_MAX) return "사진 용량이 너무 큽니다. 더 작은 이미지를 올려 주세요.";
  return "";
}
/* 기기 사진을 캔버스로 작게 줄여 data URL 로 만든다. Storage(유료) 없이 Firestore 에
   바로 담기 위해서다 — 아바타라 작아도 된다. 용량이 넘으면 화질을 낮춰 다시 뽑는다. */
function wpResizePhoto(file, cb){
  if (!file || !/^image\//.test(file.type||"")){ cb("이미지 파일만 올릴 수 있습니다."); return; }
  var fr = new FileReader();
  fr.onerror = function(){ cb("사진을 읽지 못했습니다."); };
  fr.onload = function(){
    var img = new Image();
    img.onerror = function(){ cb("사진을 열지 못했습니다."); };
    img.onload = function(){
      var max = 256, w = img.width, h = img.height;
      if (!w || !h){ cb("사진을 열지 못했습니다."); return; }
      if (w > h){ if (w > max){ h = Math.round(h * max / w); w = max; } }
      else { if (h > max){ w = Math.round(w * max / h); h = max; } }
      var cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      var cx = cv.getContext("2d");
      cx.fillStyle = "#fff"; cx.fillRect(0, 0, w, h);  /* 투명 PNG 가 검게 나오지 않게 */
      cx.drawImage(img, 0, 0, w, h);
      var q = 0.82, out;
      try { out = cv.toDataURL("image/jpeg", q); }
      catch(e){ cb("사진을 처리하지 못했습니다."); return; }
      while (out.length > WP_PHOTO_MAX && q > 0.4){ q -= 0.15; out = cv.toDataURL("image/jpeg", q); }
      if (out.length > WP_PHOTO_MAX){ cb("사진 용량이 너무 큽니다. 더 작은 이미지를 올려 주세요."); return; }
      cb(null, out);
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function wpShell(inner){
  return "<section class='section paper'><div class='inner'><div class='bd-wrap bd-wide'>"+
    inner+"</div></div></section>";

function wpFacts(pf){

function renderProfile(){
  var slug = profPath();

  if (slug === "") setFacts([]); else wpFacts(null);
  if (!fbReady()){ C.innerHTML = wpShell(emptyNote("프로필 준비 중입니다.")); return; }
  C.innerHTML = wpShell("<div data-pf>"+emptyNote("불러오는 중입니다.")+"</div>");
  var el = C.querySelector("[data-pf]");
  fbInit().then(function(){
