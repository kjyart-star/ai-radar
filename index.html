<style>
  /* =========================================================================
     AI 레이더 — lime-lab-editorial 디자인 시스템
     팔레트를 라임 온 다크로 유지한 이유: 라임 링 위의 스위프는 레이더 화면이고,
     서비스 이름이 곧 그 화면이다. 색만 빌린 게 아니라 주제에서 나온 선택이다.
     ========================================================================= */
  :root{
    --ink:#07110d;          /* 다크 배경 — 순수 검정이 아니라 초록기 도는 검정 */
    --ink-2:#0d1c16;
    --paper:#f2f1e9;        /* 크림 — 페이지 절반을 이 색이 가진다 */
    --paper-2:#e7e8dc;
    --lime:#b6ff3f;         /* 유일한 액센트. 숫자·D-day·액티브·CTA 에만 */
    --coral:#ff7358;        /* 페이퍼 섹션 전용 */
    --line-dark:rgba(255,255,255,.16);
    --line-light:rgba(7,17,13,.18);
    --muted-dark:rgba(255,255,255,.64);
    --muted-light:rgba(7,17,13,.62);
    --max:1320px;
    --navh:70px;
    /* 디스플레이와 본문을 다른 패밀리로 나눈다. 같은 패밀리로 통일하는 것이
       가장 흔한 기본값이라, 라틴 디스플레이만 Wanted Sans 로 분리했다. */
    --display:"Wanted Sans Variable","Wanted Sans",Pretendard,system-ui,sans-serif;
    --body:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--ink); color:#fff; font-family:var(--body);
        overflow-x:hidden; }
  button,a,input{ font:inherit; color:inherit; }
  button{ cursor:pointer; background:none; border:0; }
  a{ text-decoration:none; }
  img{ display:block; max-width:100%; }
  :focus-visible{ outline:2px solid var(--lime); outline-offset:3px; }
  .tnum{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  /* ---------- chrome ---------- */
  .progress{ position:fixed; inset:0 auto auto 0; z-index:100; height:3px; width:0;
             background:var(--lime); }
  .nav{ position:fixed; z-index:90; top:0; left:0; right:0; height:var(--navh);
        display:flex; align-items:center;
        padding:0 32px; border-bottom:1px solid var(--line-dark);
        background:rgba(7,17,13,.82); backdrop-filter:blur(20px); }
  /* 내용을 본문(.inner)과 같은 max-width 컨테이너로 감싸 좌측을 본문과 맞춘다(대표 2026-08-16).
     .section 도 padding:0 32px + inner 가운데정렬이라 좌측 시작점이 정확히 같아진다. */
  .nav-inner{ width:min(var(--max),100%); margin:0 auto;
        display:flex; align-items:center; justify-content:space-between; gap:20px; }
  /* 로고를 키웠다 (대표 지시 2026-08-12). 서비스 이름이 내비에서 가장 큰 글자여야
     한다 — 여기가 유일하게 브랜드를 말하는 자리다. 마크 26→34px, 워드마크 12→17px. */
  .brand{ display:flex; align-items:center; gap:13px; font-family:var(--display);
          font-size:17px; letter-spacing:.13em; font-weight:900; white-space:nowrap; }
  .brand svg{ width:34px; height:34px; display:block; }
  /* 한글 라벨이라 uppercase 와 넓은 자간을 뺐다 — 한글에는 대문자가 없고,
     자간을 벌리면 낱자가 흩어져 읽기 더 어려워진다. 크기는 13px 로 올렸다(로고 17px 대비). */
  /* 오른쪽에 검색·로그인이 붙으면서 가운데 몫이 줄었다. min-width:0 이 있어야
     좁은 창에서 메뉴 칸이 실제로 줄어들고, 넘치는 만큼은 이미 있던 overflow-x 가
     안에서 흘린다 — 페이지 자체에는 가로 스크롤이 생기지 않는다. */
  .nav-links{ display:flex; flex:1 1 auto; min-width:0; gap:24px;
              font-size:13px; letter-spacing:.01em;
              color:var(--muted-dark); font-weight:700;
              overflow-x:auto; scrollbar-width:none; }
  .nav-links::-webkit-scrollbar{ display:none; }
  .nav-links a{ white-space:nowrap; padding:6px 0; border-bottom:2px solid transparent; }
  .nav-links a:hover{ color:#fff; }
  .nav-links a.on{ color:var(--lime); border-bottom-color:var(--lime); }

  /* ---------- 상단바 오른쪽: 검색 · 로그인 ----------
     새 디자인 언어를 만들지 않는다 — 입력칸은 목록 화면이 쓰는 .search,
     버튼은 .btn, 사진은 게시판의 .bd-ava 를 그대로 쓰고 어두운 바탕에 맞는
     색만 여기서 덮는다(.btn 은 페이퍼 섹션 기준이라 그대로 두면 검정 위 검정이다). */
  .nav-right{ display:flex; align-items:center; gap:9px; flex:none; }
  .nav-search{ position:relative; }
  /* 메뉴 여덟 개와 한 줄을 나눠 써야 해서 평소에는 좁게 두고 포커스에서만 넓힌다 */
  .nav-search .search{ width:152px; min-height:38px; padding:8px 12px; font-size:12.5px;
                       border-color:var(--line-dark); color:#fff;
                       transition:width .18s ease; }
  .nav-search .search::placeholder{ color:var(--muted-dark); }
  .nav-search .search:focus{ width:236px; outline:none; border-color:var(--lime); }
  .nav-icon{ display:none; width:46px; height:46px; place-items:center; color:#fff; }
  .nav-icon svg{ width:19px; height:19px; display:block; }
  /* 모바일 햄버거 — 데스크톱에선 숨는다(메뉴가 가로줄로 보이므로) */
  .nav-burger{ display:none; width:44px; height:44px; align-items:center; justify-content:center;
               color:#fff; background:none; border:0; cursor:pointer; }
  .nav-burger svg{ width:23px; height:23px; display:block; }
  .nav-res{ position:absolute; top:calc(100% + 9px); right:0; width:min(380px,86vw);
            max-height:60vh; overflow-y:auto; z-index:95;
            background:var(--ink-2); border:1px solid var(--line-dark); }
  .nav-res[hidden]{ display:none; }
  .nav-res a,.nav-res p{ display:flex; align-items:baseline; gap:10px; margin:0;
                         padding:11px 13px; font-size:13px; line-height:1.5; color:#fff;
                         border-bottom:1px solid var(--line-dark); }
  .nav-res a:last-child{ border-bottom:0; }
  .nav-res a:hover,.nav-res a.on{ background:var(--lime); color:var(--ink); }
  .nav-res b{ flex:none; font-family:var(--display); font-size:9.5px; font-weight:800;
              letter-spacing:.1em; color:var(--lime); }
  .nav-res a:hover b,.nav-res a.on b{ color:var(--ink); }
  .nav-res span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-res p{ color:var(--muted-dark); }
  /* 로그인=테두리 · 가입하기=라임 채움. 둘 다 .btn 이고 색만 다르다 */
  .nav .btn{ display:inline-flex; align-items:center; min-height:40px; padding:10px 15px;
             border-color:var(--line-dark); color:#fff; white-space:nowrap; }
  .nav .btn:hover{ background:#fff; border-color:#fff; color:var(--ink); }
  .nav .btn.solid{ background:var(--lime); border-color:var(--lime); color:var(--ink); }
  .nav .btn.solid:hover{ background:#fff; border-color:#fff; }
  .nav-auth{ position:relative; display:flex; align-items:center; gap:9px; }
  .nav-me{ display:flex; align-items:center; gap:8px; max-width:176px; min-height:40px;
           padding:4px 11px 4px 4px; border:1px solid var(--line-dark); border-radius:999px;
           color:#fff; font-size:12.5px; font-weight:700; }
  .nav-me:hover{ border-color:var(--lime); }
  .nav-me .bd-ava{ width:28px; height:28px; }
  .nav-me span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-menu{ position:absolute; top:calc(100% + 9px); right:0; min-width:154px; z-index:95;
             background:var(--ink-2); border:1px solid var(--line-dark); }
  .nav-menu[hidden]{ display:none; }
  .nav-menu a,.nav-menu button{ display:block; width:100%; text-align:left; padding:13px 14px;
                                font-size:13px; font-weight:700; color:#fff;
                                border-bottom:1px solid var(--line-dark); }
  .nav-menu button{ border-bottom:0; }
  .nav-menu a:hover,.nav-menu button:hover{ background:var(--lime); color:var(--ink); }

  /* ---------- hero ---------- */
  /* 한동안 "메뉴 카드가 첫 화면에 걸치게" 히어로를 58vh 까지 눌러 뒀는데, 그렇게 하니
     첫 화면이 메인 페이지가 아니라 띠배너 한 줄로 보였다. 첫인상은 이 화면 하나가
     정한다 — 히어로의 존재감이 먼저다 (대표 지시 2026-08-15).
     메뉴가 아래에 걸쳐 보이는 건 있으면 좋은 것이지, 그걸 위해 히어로를 납작하게
     만들 이유는 되지 않는다. 대신 아래쪽에 .hero::before 로 "더 있다"는 표시만 남긴다. */
  /* 26vw 항은 와이드 화면 보정이다. 높이가 vh 에만 묶이면 화면이 넓어질수록
     사진 세로가 더 많이 잘려 인물 얼굴이 프레임을 벗어난다(대표 실보고 2026-08-15,
     전체화면에서 눈 위가 잘림). 폭에 비례해 하한을 올리면 어느 화면비에서도
     사진 세로의 46% 이상이 보인다 — 26/55.8(사진 세로÷가로 비 57.8%…의 근사) 계산값. */
  /* 86vh/900px: 메뉴가 히어로 안으로 들어온 뒤 상단이 눌려 보였다(대표 실보고 2026-08-15
     "너무 좁아 보임"). 사진이 주인공인 화면이라 세로를 거의 채워도 된다 —
     메뉴 첫 줄이 첫 화면에 걸리는 것은 포기해도 좋다고 대표가 정했다. */
  /* 높이는 여기 한 곳에서만 갈린다 (대표 지시 2026-08-15).
     홈은 사진이 주인공이라 크게 쓰고(.has-photo), 사진이 없는 나머지 화면은
     같은 높이를 물려받으면 검은 여백만 커진다 — 예전 값(576px 계열)으로 되돌린다.
     브레이크포인트마다 흩뿌리지 않는다. 아래 반응형은 사진 있는 홈만 따로 손댄다. */
  .hero{ position:relative; min-height:max(min(58vh, 576px), 22vw); display:flex; align-items:flex-end;
         overflow:hidden; border-bottom:1px solid var(--line-dark); }
  .hero.has-photo{ min-height:max(min(76vh, 800px), 28vw); }
  /* 아래에 더 있다는 표시. 화살표는 쓰지 않는다 — 1px 선으로만 말하는 화면에
     아이콘이 하나 들어오면 그것만 튄다. 히어로 아래쪽 빈 여백 안에 두어
     제목·본문·숫자 줄 어느 것과도 겹치지 않는다. */
  .hero::before{ content:""; position:absolute; z-index:3; left:50%; bottom:12px;
                 width:1px; height:20px; pointer-events:none;
                 background:linear-gradient(180deg, rgba(182,255,63,0) 0%,
                   rgba(182,255,63,.55) 100%); }
  /* 배경 사진은 홈에서만 켠다(.has-photo 는 drawHero 가 붙인다). 다른 화면은
     지금처럼 검은 바탕 위 레이더 그대로다.
     쌓임 순서는 아래에서 위로 사진 → 어둠막(::after) → 레이더 → 글이다.
     video 로 갈아끼울 자리라 이 블록만 통째로 바꾸면 되게 따로 떼어 뒀다. */
  .hero-bg{ position:absolute; inset:0; z-index:0; display:none; }
  .hero.has-photo .hero-bg{ display:block; }
  /* 슬라이드쇼: img 여러 장을 겹쳐 두고 opacity 로 전환한다.
     active 클래스가 있는 한 장만 보이고 나머지는 투명하다.
     transition 은 1초 — 3초 노출 + 1초 페이드 = 체감 4초 주기.
     object-position: 58% 12% — 얼굴이 잘리지 않도록 초점 고정. */
  .hero-bg img{ position:absolute; inset:0; width:100%; height:100%;
                object-fit:cover; object-position:58% 12%;
                display:block; opacity:0; transition:opacity 1s ease; }
  .hero-bg img.active{ opacity:1; }
  .hero-radar{ position:absolute; inset:0; z-index:2; pointer-events:none; }
  .hero-radar i{ position:absolute; left:76%; top:46%; translate:-50% -50%;
                 border:1px solid rgba(182,255,63,.24); border-radius:50%; }
  .hero-radar i:nth-child(1){ width:26vw; height:26vw; }
  .hero-radar i:nth-child(2){ width:52vw; height:52vw; }
  .hero-radar i:nth-child(3){ width:78vw; height:78vw; }
  .hero-radar i:nth-child(4){ width:104vw; height:104vw; opacity:.6; }
  /* 링 위에 찍히는 실제 마감. 안쪽일수록 임박했고 사흘 안쪽은 붉다.
     margin 으로 반 칸 당겨 점의 중심을 좌표에 맞춘다. */
  .hero-dots{ position:absolute; inset:0; }
  .hero-dots .dot{ position:absolute; width:7px; height:7px; margin:-3.5px 0 0 -3.5px;
                   border-radius:50%; background:var(--lime); opacity:.42; }
  .hero-dots .dot.warm{ opacity:.8; }
  /* 테두리는 1px 링이다 — 흐릿한 글로우를 쓰면 레이더가 아니라 조명이 된다 */
  .hero-dots .dot.hot{ background:var(--coral); opacity:1;
                       box-shadow:0 0 0 3px rgba(255,115,88,.2); }
  .hero-sweep{ position:absolute; left:76%; top:46%; width:104vw; height:104vw;
               translate:-50% -50%; border-radius:50%;
               background:conic-gradient(from 0deg,
                 rgba(182,255,63,.10) 0deg, rgba(182,255,63,0) 40deg,
                 rgba(182,255,63,0) 360deg);
               animation:sweep 9s linear infinite; }
  /* 스위프의 앞날을 1px 실선으로 못박는다. 이게 없으면 원뿔형 조명처럼 보인다 —
     레이더는 빛이 아니라 선이 도는 화면이다. */
  .hero-sweep::before{ content:""; position:absolute; left:50%; top:0; width:1px;
                       height:50%; background:rgba(182,255,63,.55); }
  @keyframes sweep{ to{ rotate:360deg; } }
  .hero::after{ content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
                background:linear-gradient(90deg, rgba(7,17,13,.96) 0%,
                  rgba(7,17,13,.72) 46%, rgba(7,17,13,.30) 100%); }
  /* 사진 위 어둠막 — 인물 얼굴 구역(중앙 우측 상단)은 투명하게 비치고 텍스트 구역만 또렷하게 대비 확보 */
  .hero.has-photo::after{
    background:
      linear-gradient(0deg, rgba(7,17,13,1) 0%, rgba(7,17,13,.82) 20%,
        rgba(7,17,13,.4) 42%, rgba(7,17,13,0) 62%),
      linear-gradient(180deg, rgba(7,17,13,.5) 0%, rgba(7,17,13,.15) 24%,
        rgba(7,17,13,0) 50%),
      linear-gradient(90deg, rgba(7,17,13,.94) 0%, rgba(7,17,13,.82) 34%,
        rgba(7,17,13,.42) 58%, rgba(7,17,13,.08) 100%); }
  /* 레이더는 남긴다(대표 지시) — 이 서비스의 시그니처라 사진이 깔렸다고 뺄 것이 아니다.
     다만 스위프가 오른쪽 인물 위를 가로지르면 얼굴에 선이 걸리므로,
     오른쪽으로 갈수록 사라지게 마스크한다. */
  .hero.has-photo .hero-radar{
    -webkit-mask-image:linear-gradient(90deg, #000 0%, #000 44%, transparent 76%);
    mask-image:linear-gradient(90deg, #000 0%, #000 44%, transparent 76%); }
  /* 사진 위에서는 스위프가 그림에 묻혀 도는 게 안 보인다. 라임 농도만 조금 올리고
     (.10 → .18, 앞날 1px 선 .55 → .72) 속도를 늦춘다 — 사진 위에서 9초는 부산스럽다.
     전역 9s 는 그대로 둔다. 다른 화면은 지금 속도가 맞다.
     평면 그라디언트와 1px 실선은 그대로다. 글로우·블러는 여기서도 쓰지 않는다. */
  .hero.has-photo .hero-sweep{ animation-duration:26s;
    background:conic-gradient(from 0deg,
      rgba(182,255,63,.18) 0deg, rgba(182,255,63,0) 40deg,
      rgba(182,255,63,0) 360deg); }
  .hero.has-photo .hero-sweep::before{ background:rgba(182,255,63,.72); }
  /* 사진 히어로에서는 하단 경계선을 지운다 — 바닥이 이미 --ink 100% 로 녹아
     다음 섹션과 한 면이 되는데, 1px 선이 남으면 그 자리에 다시 이음새가 생긴다. */
  .hero.has-photo{ border-bottom-color:transparent; }
  /* 상단 패딩 44→110px: 헤드라인이 더 아래서 시작해 사진 위쪽(얼굴 구역)이 비어 보인다.
     모바일(680px 이하)은 아래 반응형이 따로 잡으므로 여기 값이 새지 않는다. */
  /* 상단 여백도 홈만 크다. 110px 은 사진 위쪽(얼굴 구역)을 비우려고 준 값이라
     사진이 없는 화면에서는 그냥 빈 검정이 된다 — 예전 값 44px 로 둔다. */
  .hero-content{ position:relative; z-index:3; width:min(var(--max), calc(100% - 64px));
                 margin:0 auto; padding:calc(var(--navh) + 44px) 0 42px; }
  .hero.has-photo .hero-content{ padding-top:calc(var(--navh) + 110px); }
  .kicker{ display:flex; gap:9px; flex-wrap:wrap; margin-bottom:22px; }
  .pill{ border:1px solid rgba(255,255,255,.35); border-radius:999px; padding:7px 12px;
         font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; }
  .pill.accent{ background:var(--lime); color:var(--ink); border-color:var(--lime);
                font-weight:900; }
  /* 라틴 디스플레이에만 강한 음수 자간을 준다. 한글에 -.075em 을 주면 글자가
     뭉개져서 오히려 싸구려가 된다 — 한글 라인은 -.02em 까지만. */
  .hero h1{ margin:0; max-width:960px; font-family:var(--display); font-weight:900;
            font-size:clamp(64px, 10.5vw, 152px); letter-spacing:-.075em;
            line-height:.82; text-transform:uppercase; }
  .hero h1 em{ display:block; margin-top:20px; color:var(--lime); font-style:normal;
               font-family:var(--body); font-weight:800; font-size:.26em;
               letter-spacing:-.02em; line-height:1.15; text-transform:none; }
  /* 히어로 속 메뉴 자리. 홈에서만 drawHero 가 채운다 — 다른 화면은 빈 div 하나라
     자리도 차지하지 않는다(margin 은 :empty 로 걷는다). */
  #heroMenuWrap{ margin-top:84px; }
  #heroMenuWrap:empty{ margin-top:0; }
  #heroMenuWrap .eyebrow{ color:var(--lime); }
  .hero-bottom{ margin-top:36px; display:grid;
                grid-template-columns:minmax(0,600px) 1fr; gap:60px; align-items:end; }
  .hero-copy{ margin:0; color:rgba(255,255,255,.8); font-size:clamp(16px, 1.7vw, 21px);
              line-height:1.65; word-break:keep-all; }
  /* 홈은 성격이 다른 네 칸을 쓴다(마감 둘 + 소식 + 기술) — 숫자만 보고도
     여기가 마감만 다루는 곳이 아니라는 것이 보이게 하기 위해서다 */
  .hero-facts.four{ grid-template-columns:repeat(4,1fr); }
  .hero-facts{ display:grid; grid-template-columns:repeat(3,1fr);
               border-top:1px solid var(--line-dark); }
  .hero-fact{ padding:15px 12px 0 0; min-width:0; }
  .hero-fact b{ display:block; color:var(--lime); font-family:var(--display);
                font-size:clamp(24px,3.2vw,34px); letter-spacing:-.05em; line-height:1; }
  .hero-fact span{ display:block; margin-top:7px; color:var(--muted-dark); font-size:10px;
                   letter-spacing:.1em; text-transform:uppercase; font-weight:700;
                   word-break:keep-all; }

  /* ---------- section shell ---------- */
  .section{ padding:104px 32px; scroll-margin-top:var(--navh); }
  .inner{ width:min(var(--max),100%); margin:0 auto; }
  .paper{ background:var(--paper); color:var(--ink); }
  .paper-alt{ background:var(--paper-2); color:var(--ink); }
  .dark{ background:var(--ink); color:#fff; }
  .section-head{ display:grid; grid-template-columns:1fr minmax(260px,440px); gap:56px;
                 align-items:end; margin-bottom:40px; }
  .eyebrow{ margin:0 0 14px; font-family:var(--display); font-size:11px; font-weight:800;
            letter-spacing:.18em; text-transform:uppercase; color:var(--coral); }
  .dark .eyebrow{ color:var(--lime); }
  .section h2{ margin:0; font-size:clamp(36px,5vw,68px); letter-spacing:-.025em;
               line-height:1.08; font-weight:800; word-break:keep-all; }
  .section-intro{ margin:0; color:var(--muted-light); font-size:15px; line-height:1.75;
                  word-break:keep-all; }
  .dark .section-intro{ color:var(--muted-dark); }
  .count{ font-family:var(--display); font-size:12px; font-weight:800; letter-spacing:.12em;
          text-transform:uppercase; color:var(--muted-light); white-space:nowrap; }
  .dark .count{ color:var(--muted-dark); }
  .count b{ color:var(--ink); font-size:15px; }
  .dark .count b{ color:var(--lime); }

  /* ---------- filters ---------- */
  .controls{ display:flex; flex-wrap:wrap; gap:10px; align-items:center;
             margin-bottom:26px; }
  .chip{ border:1px solid var(--line-light); border-radius:999px; padding:9px 14px;
         font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:700;
         min-height:38px; }
  .chip:hover,.chip.on{ background:var(--ink); color:var(--paper);
                        border-color:var(--ink); }
  .dark .chip{ border-color:var(--line-dark); color:#fff; }
  .dark .chip:hover,.dark .chip.on{ background:var(--lime); color:var(--ink);
                                    border-color:var(--lime); }
  .search{ flex:1 1 220px; min-width:0; min-height:38px; padding:9px 13px;
           border:1px solid var(--line-light); background:transparent; font-size:14px; }
  .search::placeholder{ color:var(--muted-light); }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }

  /* ---------- list rows (핵심 반복 단위) ---------- */
  .rows{ border-top:1px solid var(--line-light); }
  .dark .rows{ border-top-color:var(--line-dark); }
  /* 홈의 마감 목록만 두 단이다. 스무 건을 한 줄로 세우면 화면이 지나치게 길어져
     아래 블록(구독·브리핑)까지 내려오는 사람이 줄어든다.
     기본 grid 흐름 그대로라 왼쪽에서 오른쪽으로 한 줄씩 채운다 — 위아래로 먼저
     내려가면 D-day 순서를 눈으로 따라갈 수 없다.
     좁은 화면은 아래 반응형(960px)에서 한 단으로 되돌린다. */
  .rows.two{ display:grid; grid-template-columns:1fr 1fr; column-gap:40px; }
  .row{ display:grid; grid-template-columns:96px 1fr; gap:26px; align-items:start;
        padding:22px 16px 24px; border-bottom:1px solid var(--line-light);
        transition:background .18s ease, color .18s ease; }
  .dark .row{ border-bottom-color:var(--line-dark); }
  @media (hover:hover){
    .row:hover{ background:var(--ink); color:#fff; }
    .dark .row:hover{ background:var(--lime); color:var(--ink); }
    .row:hover .r-meta,.row:hover .r-sum,.row:hover .r-title-en{ color:rgba(255,255,255,.72); }
    .dark .row:hover .r-meta,.dark .row:hover .r-sum,.dark .row:hover .r-title-en{ color:rgba(7,17,13,.72); }
    .row:hover .tag{ border-color:rgba(255,255,255,.4); }
    .dark .row:hover .tag{ border-color:rgba(7,17,13,.4); }
    .row:hover .dd{ color:var(--lime); }
    .dark .row:hover .dd{ color:var(--ink); }
  }
  .dd{ font-family:var(--display); font-weight:800; font-size:29px; letter-spacing:-.045em;
       line-height:1; text-align:right; padding-top:2px; }
  .dd.soon{ color:var(--coral); }
  .dark .dd.soon{ color:var(--lime); }
  .dd.over{ opacity:.38; }
  .dd.tbd{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; opacity:.55;
           padding-top:9px; }
  /* 내 계획에서는 D-day 가 주인공이다 — 마감 관리 허브라 크게 세운다.
     칸을 함께 넓혀 D-DAY(다섯 글자)까지 넘치지 않게 한다. */
  .plan-rows .row{ grid-template-columns:128px 1fr; }
  .plan-rows .dd{ font-size:clamp(28px,6vw,44px); }
  .plan-rows .dd.tbd{ font-size:11px; }
  .r-main{ min-width:0; }
  /* keep-all 은 한글 어절을 지키려고 남긴다. 다만 그것만 있으면 공백 없는 긴 문자열
     (HF 모델 ID, GitHub owner/repo)이 375px 에서 안 끊겨 문서에 가로 스크롤이 생긴다.
     anywhere 는 넘칠 때만 개입해서 한글 줄바꿈은 그대로 둔다. */
  .r-title{ font-size:clamp(17px,1.5vw,20px); font-weight:800; letter-spacing:-.02em;
            line-height:1.35; word-break:keep-all; overflow-wrap:anywhere; }
  /* 번역 제목 아래 붙는 영문 원문. 기계번역은 틀릴 때가 있어 원문을 지우면 확인할 길이
     없어진다. 다만 읽는 순서는 한글이 먼저라 원문은 메타 정보 크기로 낮춘다.
     긴 영문 제목이 375px 를 넘지 않도록 break-word 를 준다. */
  .r-title-en{ margin-top:6px; font-size:12.5px; font-weight:600; letter-spacing:0;
               line-height:1.45; color:var(--muted-light); overflow-wrap:break-word; }
  .dark .r-title-en{ color:var(--muted-dark); }
  /* 태그 값은 외부 JSON 에서 그대로 온다(공모전 category, Devpost kind 등).
     카테고리 여러 개가 콤마로 이어진 긴 값이 오면 nowrap 때문에 375px 를 넘겨
     문서에 가로 스크롤이 생긴다 — max-width 로 잘라 말줄임한다. */
  .tag{ display:inline-block; margin-left:8px; border:1px solid var(--line-light);
        border-radius:999px; padding:3px 9px; font-size:10px; font-weight:700;
        letter-spacing:.08em; vertical-align:middle; white-space:nowrap;
        max-width:100%; overflow:hidden; text-overflow:ellipsis; box-sizing:border-box; }
  .dark .tag{ border-color:var(--line-dark); }
  .r-meta{ margin-top:9px; color:var(--muted-light); font-size:12.5px; line-height:1.6;
           word-break:keep-all; }
  .dark .r-meta{ color:var(--muted-dark); }
  .r-meta i{ font-style:normal; opacity:.4; margin:0 7px; }
  .r-meta b{ font-weight:700; }
  .r-sum{ margin-top:8px; color:var(--muted-light); font-size:13px; line-height:1.6;
          word-break:keep-all; display:-webkit-box; -webkit-line-clamp:2;
          -webkit-box-orient:vertical; overflow:hidden; }
  .dark .r-sum{ color:var(--muted-dark); }

  /* ---------- fold ---------- */
  .fold-head{ display:flex; align-items:end; justify-content:space-between; gap:24px;
              width:100%; text-align:left; padding:0 0 24px;
              border-bottom:1px solid var(--line-light); margin-bottom:0; }
  .dark .fold-head{ border-bottom-color:var(--line-dark); }
  .fold-sign{ font-family:var(--display); font-size:26px; font-weight:800; line-height:1; }
  [data-foldsec] .fold-body{ padding-top:26px; }
  [data-foldsec].collapsed .fold-body{ display:none; }
  [data-foldsec] .fold-sign::after{ content:"–"; }
  [data-foldsec].collapsed .fold-sign::after{ content:"+"; }

  /* ---------- briefing body (richReport 출력물) ---------- */
  .brief-head{ display:grid; grid-template-columns:1fr auto; gap:24px; align-items:end;
               padding-bottom:22px; border-bottom:1px solid var(--line-light);
               margin-bottom:30px; }
  .brief-head h3{ margin:0; font-size:clamp(26px,3.4vw,44px); letter-spacing:-.03em;
                  line-height:1.1; font-weight:800; word-break:keep-all; }
  .brief-date{ font-family:var(--display); font-size:clamp(18px,2.2vw,28px); font-weight:800;
               letter-spacing:-.04em; white-space:nowrap; }
  .brief-body{ white-space:pre-wrap; word-break:keep-all; font-size:15px; line-height:1.8;
               color:var(--muted-light); }
  .dark .brief-body{ color:var(--muted-dark); }
  /* ---------- 브리핑 카드뉴스 (홈 「밤사이…」) ----------
     꼭지 하나 = 카드 하나. auto-fit 이라 데스크톱은 4열/2열, 모바일은 1열이고
     카드가 넷보다 적어도 격자가 깨지지 않는다. 어두운 섹션이라 대비를 실측해 맞췄다
     (헤드라인 #fff 15.9:1 · 요약 rgba(255,255,255,.74) 8.8:1 · 태그 라임 12.6:1). */
  .brief-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
                gap:14px; }
  .brief-card{ display:flex; flex-direction:column; gap:9px; min-width:0;
               border:1px solid var(--line-dark); padding:18px;
               transition:background .18s ease, color .18s ease, border-color .18s ease; }
  @media (hover:hover){
    .brief-card:hover{ background:var(--lime); border-color:var(--lime); color:var(--ink); }
    .brief-card:hover .bc-tag,.brief-card:hover .bc-head,.brief-card:hover .bc-sum{ color:var(--ink); }
  }
  .bc-tag{ font-family:var(--display); font-size:11px; font-weight:800; letter-spacing:.14em;
           text-transform:uppercase; color:var(--lime); }
  .bc-head{ font-size:16px; font-weight:800; letter-spacing:-.01em; line-height:1.4; color:#fff;
            word-break:keep-all; display:-webkit-box; -webkit-line-clamp:3;
            -webkit-box-orient:vertical; overflow:hidden; }
  .bc-sum{ font-size:13px; line-height:1.6; color:rgba(255,255,255,.74); word-break:keep-all;
           display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  /* 본문에 섞인 맨 링크만 밑줄. 카드는 테두리가 이미 링크임을 말한다. */
  .brief-body a:not(.item-card):not(.yt-thumb):not(.news-card){
    text-decoration:underline; text-underline-offset:3px; }
  /* 원문에 이미 빈 줄이 있고 .brief-body 가 pre-wrap 이라 여백이 두 번 들어간다.
     여기 마진은 작게 잡는다. */
  .sec-label{ display:block; margin:20px 0 14px; font-size:clamp(21px,2.4vw,29px);
              font-weight:800; letter-spacing:-.025em; line-height:1.2;
              color:var(--ink); white-space:normal; word-break:keep-all; }
  .dark .sec-label{ color:#fff; }
  .sec-label:first-child{ margin-top:0; }
  /* 1단계 헤더는 브리핑 제목과 겹친다. 지우지는 않고 작은 라벨로 낮춘다. */
  .sec-label.meta{ margin:0 0 6px; font-family:var(--display); font-size:11px;
                   font-weight:800; letter-spacing:.16em; text-transform:uppercase;
                   color:var(--coral); }
  .dark .sec-label.meta{ color:var(--lime); }
  .card-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px;
              margin:14px 0 20px; white-space:normal; }
  /* 썸네일을 112 → 184px 로 키웠다 (대표 지시 2026-08-12, "썸네일이 잘 보이게").
     16:9 는 그대로 두고 칸만 넓혔다. 카드가 한 칸에 580px 가까이 되므로 제목 자리는
     380px 넘게 남는다 — 제목이 더 접히지 않는 선에서 최대로 키운 값이다. */
  /* 영상 카드는 <a> 였다가 모달을 여는 <button> 이 되었다 — 생김새는 같아야 한다.
     .yt-thumb 는 글 속에 인라인으로 놓이므로 폭을 100% 로 늘리지 않는다 */
  button.item-card{ width:100%; text-align:left; }
  /* 작품소개 관리자 삭제 — picks 카드에만 오버레이한다 */
  .av-pick{ position:relative; }
  .av-pick > .item-card{ width:100%; }
  .av-del{ position:absolute; top:10px; right:10px; z-index:3; padding:6px 12px 6px 26px;
           font-size:11px; font-family:var(--body); font-weight:700; letter-spacing:.01em; color:#fff;
           background:rgba(9,20,15,.55); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
           border:1px solid rgba(255,255,255,.26); border-radius:999px; cursor:pointer; line-height:1;
           opacity:.82;
           transition:opacity .16s ease, background .16s ease, border-color .16s ease; }
  /* 휴지통 아이콘(인라인 SVG, data URI) — 텍스트 왼쪽에 */
  .av-del::before{ content:""; position:absolute; left:10px; top:50%; width:11px; height:11px;
           margin-top:-5.5px; background:no-repeat center/contain;
           background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14'/></svg>"); }
  .av-pick:hover .av-del{ opacity:1; }
  .av-del:hover{ background:#e5442f; border-color:#e5442f; opacity:1; }
  /* 삭제 버튼이 긴 제목 위로 겹치지 않게 — 관리자 카드의 제목만 오른쪽을 비운다 */
  .av-pick .ic-title{ padding-right:62px; }
  button.yt-thumb{ text-align:left; }
  .item-card{ display:grid; grid-template-columns:184px 1fr; gap:15px; align-items:start;
              border:1px solid var(--line-light); padding:13px;
              transition:background .18s ease, color .18s ease; }
  .dark .item-card{ border-color:var(--line-dark); }
  .item-card img{ width:184px; height:104px; object-fit:cover; background:var(--ink-2); }
  .item-card:not(.photo):not(.yt) img{ width:38px; height:38px; object-fit:contain;
                                       background:none; }
  /* 원문에 아이콘이 없을 때 쓰는 우리 마크. 구글 파비콘 서비스는 아이콘이 없으면
     404 를 주므로(2026-08-13 실측: k-startup.go.kr) onerror 로 이 자리로 떨어진다.
     그림 대신 타이포로 간다 — 소스마다 그림을 만들면 아이덴티티가 흩어진다 */
  .ic-mark{ width:38px; height:38px; display:grid; place-items:center;
            background:var(--ink); color:var(--lime);
            font-size:13px; font-weight:900; letter-spacing:.02em; }
  .dark .ic-mark{ background:var(--lime); color:var(--ink); }
  .item-card:hover .ic-mark{ background:var(--lime); color:var(--ink); }
  .dark .item-card:hover .ic-mark{ background:var(--ink); color:var(--lime); }
  @media (hover:hover){
    .item-card:hover{ background:var(--ink); color:#fff; }
    .dark .item-card:hover{ background:var(--lime); color:var(--ink); }
  }
  .ic-body{ display:block; min-width:0; }
  .ic-title{ display:block; font-size:14px; font-weight:800; line-height:1.4;
             letter-spacing:-.015em; word-break:keep-all; }
  .ic-desc{ display:-webkit-box; margin-top:5px; font-size:12.5px; line-height:1.55;
            opacity:.68; word-break:keep-all; -webkit-line-clamp:2;
            -webkit-box-orient:vertical; overflow:hidden; }
  .ic-url{ display:block; margin-top:8px; font-size:10px; font-weight:700;
           letter-spacing:.08em; text-transform:uppercase; opacity:.5; }
  .yt-thumb,.news-card{ display:inline-grid; grid-auto-flow:column; gap:10px;
                        align-items:center; border:1px solid var(--line-light);
                        padding:9px 12px; margin:5px 0; white-space:normal;
                        vertical-align:middle; }
  .dark .yt-thumb,.dark .news-card{ border-color:var(--line-dark); }
  .yt-thumb img{ width:96px; height:54px; object-fit:cover; }
  .nc-ico{ width:18px; height:18px; }
  .nc-domain{ font-size:12px; font-weight:700; }
  .nc-go{ font-size:10px; letter-spacing:.08em; text-transform:uppercase; opacity:.55; }

  /* ---------- archive ---------- */
  .arch{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:0;
         border-top:1px solid var(--line-dark); border-left:1px solid var(--line-dark); }
  /* 브리핑 아카이브는 button, 홈의 메뉴 안내는 a 다 — 생김새는 같은 칸이다 */
  .arch button,.arch a{ text-align:left; padding:20px 18px; border-bottom:1px solid var(--line-dark);
                border-right:1px solid var(--line-dark); display:block; width:100%;
                transition:background .18s ease, color .18s ease; }
  .arch button:hover,.arch a:hover{ background:var(--lime); color:var(--ink); }
  .arch button.on{ background:var(--lime); color:var(--ink); }
  .arch .a-date{ display:block; font-family:var(--display); font-size:21px; font-weight:800;
                 letter-spacing:-.04em; }
  .arch .a-title{ display:block; margin-top:7px; font-size:12px; opacity:.62;
                  word-break:keep-all; }
  /* 홈의 메뉴 카드는 여덟 개다. auto-fill 에 230px 만 주면 넓은 화면에서 다섯 칸이 되어
     5 + 3 으로 떨어지고 마지막 줄이 반쯤 비어 보인다. 한 칸이 최소 1/4 이 되게 해서
     4 + 4 로 맞춘다. 좁아지면 230px 규칙이 다시 살아나 세 칸·두 칸으로 줄고,
     680px 아래에서는 아래 반응형의 .arch 규칙이 한 칸으로 만든다.
     (클래스를 .arch 와 겹쳐 쓰지 않고 따로 둔 이유: .arch.menu-cards 로 쓰면
      특정도가 높아져 모바일 1칸 규칙을 이겨 버린다) */
  .menu-cards{ grid-template-columns:repeat(auto-fill,minmax(max(230px,25%),1fr)); }
  /* 카드는 일곱이다(지금 보고 있는 홈은 카드로 만들지 않는다). 네 칸 그리드에서
     4 + 3 이 되어 오른쪽 아래 한 칸이 빈다. 자유게시판 카드를 두 칸으로 늘려 채운다 —
     앞의 여섯은 우리가 모아다 보여주는 곳이고 이곳만 사람이 쓰는 곳이라
     넓게 두는 편이 뜻에도 맞는다. 680px 아래에서는 한 칸씩 흐르므로 되돌린다. */
  .menu-cards a.wide{ grid-column:span 2; }

  /* ---------- 홈 ----------
     홈의 제목만 한글 문장이다. 위 .hero h1 은 라틴 대문자 전용이라(-.075em·uppercase)
     한글을 그대로 넣으면 자간이 뭉개진다. 크기를 낮추고 자간을 -.02em 까지만 준다.
     min-height 는 숫자가 오기 전 빈 자리를 잡아 두는 값이다 — 두 줄분이라
     문장이 채워져도 화면이 밀리지 않는다. */
  .hero h1.h-home{ font-family:var(--body); font-weight:800; text-transform:none;
                   font-size:clamp(36px, 6.1vw, 86px); letter-spacing:-.025em;
                   line-height:1.18; max-width:1000px; word-break:keep-all; }
  .hero h1.h-home b{ font-family:var(--display); font-weight:900; color:var(--lime);
                     letter-spacing:-.05em; }
  /* 홈 본문에 들어가는 사진. 모서리는 각지게 둔다 — 이 화면에서 둥근 것은
     pill 과 점뿐이고, 블록에 라운드를 주면 여기만 다른 디자인이 된다. */
  .home-photo{ display:block; width:100%; max-width:100%; height:auto; margin-top:30px; }
  /* 오늘 마감이 있는 날만 그 칸을 경고색으로 둔다 (setFacts 의 "hot") */
  .hero-fact.hot b{ color:var(--coral); }
  .hero-fact.hot span{ color:var(--coral); opacity:.9; }

  /* 마감 알림 구독 — 칸 하나와 버튼 하나. 둘 다 손가락으로 누를 수 있는 크기(44px 이상) */
  .sub-form{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; max-width:560px; }
  .sub-input{ flex:1 1 260px; min-height:46px; }
  .sub-form .btn{ display:inline-flex; align-items:center; min-height:46px; }
  .sub-note{ margin:14px 0 0; max-width:560px; color:var(--muted-light);
             font-size:12px; line-height:1.7; word-break:keep-all; }
  .sub-msg{ margin:0; font-size:clamp(17px,1.6vw,21px); font-weight:800;
            letter-spacing:-.02em; word-break:keep-all; }
  .cta-row{ display:flex; flex-wrap:wrap; gap:10px; margin:0; }
  .cta-row .btn{ display:inline-flex; align-items:center; min-height:44px; }

  /* ---------- states ---------- */
  .note{ padding:52px 16px; text-align:center; color:var(--muted-light);
         font-size:14px; word-break:keep-all; }
  .dark .note{ color:var(--muted-dark); }
  .fail{ border:1px solid var(--line-light); padding:38px 26px; text-align:center; }
  .dark .fail{ border-color:var(--line-dark); }
  .fail h3{ margin:0 0 10px; font-size:22px; letter-spacing:-.02em; font-weight:800; }
  .fail p{ margin:0 0 18px; color:var(--muted-light); font-size:14px; line-height:1.7;
           word-break:keep-all; }
  .dark .fail p{ color:var(--muted-dark); }
  .btn{ display:inline-block; border:1px solid var(--ink); padding:11px 18px; font-size:11px;
        font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
  .btn:hover{ background:var(--ink); color:var(--paper); }
  .dark .btn{ border-color:var(--lime); color:var(--lime); }
  .dark .btn:hover{ background:var(--lime); color:var(--ink); }

  /* ---------- footer ---------- */
  footer{ padding:52px 32px; background:#030705; border-top:1px solid var(--line-dark); }
  .footer-inner{ width:min(var(--max),100%); margin:0 auto; display:flex; align-items:end;
                 justify-content:space-between; gap:30px; }
  .footer-brand{ font-family:var(--display); font-size:clamp(44px,9vw,120px); font-weight:900;
                 letter-spacing:-.06em; line-height:.85; }
  .footer-meta{ color:var(--muted-dark); font-size:11px; line-height:1.9; text-align:right;
                word-break:keep-all; }
  .footer-meta a{ text-decoration:underline; text-underline-offset:2px; }
  .footer-meta button{ color:var(--lime); font-size:11px; font-weight:800;
                       letter-spacing:.1em; text-transform:uppercase; }

  /* ---------- 목록 → 게시판 건너가는 버튼 ---------- */
  /* .row 는 통째로 <a> 다. 그 안에 <button> 을 넣으면 링크 안의 버튼이 되어
     브라우저마다 다르게 동작한다 — 형제로 두고 테두리만 감싼 쪽에 넘긴다. */
  .row-wrap{ border-bottom:1px solid var(--line-light); }
  .dark .row-wrap{ border-bottom-color:var(--line-dark); }
  .row-wrap > .row{ border-bottom:0; padding-bottom:8px; }
  /* 담기·이야기하기가 나란히 선다. 예전에는 이야기하기 하나뿐이라 margin auto 로
     밀어 두었는데, 둘이 되면서 줄로 묶었다 — 안쪽 margin 은 아래에서 지운다 */
  .row-acts{ display:flex; flex-wrap:wrap; justify-content:flex-end; align-items:center;
             gap:8px; padding:0 16px 16px; }
  .row-acts .row-talk{ margin:0; }
  .row-save{ border:1px solid var(--line-light); border-radius:999px; padding:6px 12px;
             font-size:10.5px; font-weight:800; letter-spacing:.04em; color:var(--muted-light);
             white-space:nowrap; }
  .row-save:hover{ border-color:var(--ink); color:var(--ink); }
  .row-save.on{ background:var(--ink); border-color:var(--ink); color:var(--lime); }
  .dark .row-save{ border-color:var(--line-dark); color:var(--muted-dark); }
  .dark .row-save:hover{ border-color:var(--lime); color:var(--lime); }
  .dark .row-save.on{ background:var(--lime); border-color:var(--lime); color:var(--ink); }
  .row-talk{ display:block; margin:0 16px 16px auto; border:1px solid var(--line-light);
             border-radius:999px; padding:6px 12px; font-size:10px; font-weight:800;
             letter-spacing:.08em; text-transform:uppercase; color:var(--muted-light); }
  .row-talk:hover{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .dark .row-talk{ border-color:var(--line-dark); color:var(--muted-dark); }
  .dark .row-talk:hover{ background:var(--lime); color:var(--ink); border-color:var(--lime); }

  /* ---------- board — 스레드형 피드 ---------- */
  /* 새 디자인 언어를 만들지 않는다. 카드는 .row 와 같은 1px 선 문법을 쓰고 색은
     기존 토큰만 쓴다. 여기 새로 생긴 건 목록에 없던 것(입력창·아바타·액션)뿐이다.
     한 줄로 읽히게 폭을 720px 로 묶는다 — 피드는 표가 아니라 대화다. */
  .bd-wrap{ max-width:720px; }
  /* 게시판은 다른 화면과 같은 폭을 쓴다(대표 지시 2026-08-15 "좌우가 좁다").
     다만 글줄까지 1320px 로 늘리면 한 줄이 너무 길어 읽기 어려워지므로,
     글은 760px 로 잡고 남는 오른쪽을 오늘의 브리핑이 사이드로 쓴다.
     960px 아래에서는 한 단으로 접히고, 그때 브리핑이 위로 올라간다(order:-1) —
     좁은 화면에서 빈 피드를 먼저 만나지 않게 하려던 원래 의도 그대로다. */
  .bd-wide{ max-width:none; }
  /* 1fr 이어야 한다. minmax(0,760px) + justify-content 로 두면 트랙이 내용 크기로
     줄어들어(글이 짧으면 400px 남짓) 오른쪽 절반이 통째로 비었다 — 대표 실보고
     2026-08-15 "게시판이 더 좁아짐". 1fr 은 남는 폭을 글이 다 쓰게 한다. */
  .bd-cols{ display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,340px);
            gap:56px; align-items:start; }
  .bd-thread{ max-width:760px; }
  .bd-back{ display:inline-block; margin-bottom:20px; font-family:var(--display); font-size:11px;
            font-weight:800; letter-spacing:.12em; text-transform:uppercase;
            color:var(--muted-light); }
  .bd-brief{ border:1px solid var(--line-light); padding:20px; margin-bottom:24px; }
  .bd-brief h3{ margin:0 0 12px; font-size:19px; font-weight:800; letter-spacing:-.02em;
                line-height:1.35; word-break:keep-all; }
  .bd-brief ul{ margin:0 0 18px; padding-left:17px; color:var(--muted-light);
                font-size:13.5px; line-height:1.7; word-break:keep-all; }
  .bd-brief li{ margin-bottom:6px; }
  .bd-composer{ border:1px solid var(--line-light); padding:15px 16px; margin-bottom:6px; }
  .bd-in{ width:100%; padding:10px 12px; border:1px solid var(--line-light);
          background:transparent; font-size:15px; line-height:1.6; }
  /* 한 줄로 시작해 입력한 만큼만 늘어난다(스크립트가 scrollHeight 로 잰다).
     처음부터 큰 상자를 세워 두면 "길게 써야 하나" 싶어져서 아무도 안 쓴다. */
  .bd-grow{ min-height:44px; max-height:420px; border:0; padding:6px 0; resize:none;
            overflow-y:auto; }
  .bd-taglane{ display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-top:12px; }
  .bd-newtagbox{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .bd-newtagbox[hidden]{ display:none; }
  .bd-newtagbox .bd-in{ flex:1 1 180px; width:auto; font-size:13px; }
  .bd-cfoot{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:13px;
             padding-top:12px; border-top:1px solid var(--line-light); }
  .bd-cfoot .btn{ margin-left:auto; }
  .bd-hint,.bd-count{ font-size:12px; color:var(--muted-light); }
  .bd-me{ display:flex; align-items:center; gap:8px; min-width:0; font-size:13px; font-weight:700; }
  .bd-ava{ width:30px; height:30px; border-radius:50%; object-fit:cover; flex:none;
           background:var(--paper-2); }
  /* 사진이 없거나 깨졌을 때의 자리. 빈 원 대신 닉네임 첫 글자를 넣는다 —
     바깥 주소를 쓰는 사진은 핫링크 차단으로 깨지는 일이 흔하다. */
  .bd-ava-x{ display:grid; place-items:center; background:var(--ink); color:var(--lime);
             font-family:var(--display); font-weight:800; font-size:12px; letter-spacing:0; }
  .pf-ava.bd-ava-x{ font-size:26px; }
  .bd-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
            max-width:min(42vw,220px); }
  .bd-card{ border-bottom:1px solid var(--line-light); padding:19px 0; }
  /* 답글 들여쓰기는 2단계까지만이다. 더 깊어지면 375px 에서 본문 자리가 사라진다 */
  .bd-card.d1{ padding-left:19px; border-left:1px solid var(--line-light); }
  .bd-card.d2{ padding-left:38px; border-left:1px solid var(--line-light); }
  .bd-head{ display:flex; align-items:center; gap:9px; min-width:0; margin-bottom:10px; }
  .bd-time{ font-size:11.5px; color:var(--muted-light); white-space:nowrap; }
  .bd-ref{ display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; margin:0 0 11px;
           border-left:2px solid var(--coral); padding:5px 0 5px 11px; font-size:13px;
           line-height:1.55; word-break:keep-all; overflow-wrap:anywhere; }
  .bd-ref-k{ font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
             color:var(--coral); }
  .bd-ref a{ text-decoration:underline; text-underline-offset:3px; }
  /* 본문은 사용자가 쓴 값이라 길이를 예측할 수 없다 — 375px 에서 가로 스크롤이
     생기지 않게 anywhere 로 끊는다 */
  .bd-text{ font-size:15px; line-height:1.75; word-break:keep-all; overflow-wrap:anywhere; }
  .bd-text a{ color:inherit; text-decoration:underline; text-underline-offset:3px; word-break:break-all; }
  .bd-text a:hover{ color:var(--lime-dark, #4d7c0f); }
  .bd-img-wrap{ margin:14px 0 8px; max-width:100%; border-radius:4px; overflow:hidden; }
  .bd-img{ display:block; max-width:100%; max-height:500px; width:auto; height:auto; object-fit:contain;
           border:1px solid var(--line-light); border-radius:4px; cursor:zoom-in; }
  .dark .bd-img{ border-color:var(--line-dark); }
  .bd-img-preview{ position:relative; display:inline-block; margin:10px 0 4px; }
  .bd-img-preview img{ max-width:180px; max-height:130px; border-radius:4px; border:1px solid var(--line-light); }
  .dark .bd-img-preview img{ border-color:var(--line-dark); }
  .bd-img-del{ position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
               background:var(--ink); color:#fff; font-size:11px; line-height:20px; text-align:center;
               cursor:pointer; border:none; padding:0; }
  .bd-video-card{ display:inline-flex; align-items:center; gap:12px; margin:8px 0; padding:8px 12px;
                  background:rgba(0,0,0,.03); border:1px solid var(--line-light); border-radius:6px;
                  text-decoration:none !important; color:inherit; max-width:100%; vertical-align:middle; cursor:pointer; }
  .dark .bd-video-card{ background:rgba(255,255,255,.04); border-color:var(--line-dark); }
  .bd-video-thumb{ width:96px; height:54px; object-fit:cover; border-radius:4px; flex-shrink:0; }
  .bd-video-info{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .bd-video-badge{ font-size:10px; font-weight:800; letter-spacing:.08em; color:var(--coral); }
  .bd-video-title{ font-size:13px; font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dark .bd-video-title{ color:#fff; }
  .bd-video-card:hover{ border-color:var(--lime); }
  .bd-media-modal{ position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,.82);
                   display:flex; align-items:center; justify-content:center; padding:16px;
                   backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
  .bd-media-box{ background:var(--bg); border:1px solid var(--line-dark); border-radius:8px;
                 max-width:920px; width:100%; max-height:92vh; display:flex; flex-direction:column;
                 overflow:hidden; box-shadow:0 24px 64px rgba(0,0,0,.45); }
  .dark .bd-media-box{ background:#16191d; }

  /* ---------- 프로필 · 작품 ----------
     새로 만든 것은 아래 여섯 줄뿐이다. 나머지(카드·칩·버튼·액션 줄)는

  /* min-width:0 · overflow-wrap 은 375px 에서 가로 스크롤을 막는 장치다 —
     끊기지 않는 20자 닉네임이 들어와도 칸을 밀어내지 못한다 */
  .pf-head{ display:flex; align-items:center; gap:15px; }
  .pf-head > div{ min-width:0; }
  .pf-ava{ width:64px; height:64px; border-radius:50%; object-fit:cover; flex:none;

  /* ---------- 그 자리에서 재생하는 모달 ---------- */
  .wk-modal{ position:fixed; inset:0; z-index:200; display:none; align-items:center;

  /* 16:9 영상이 화면 안에서 최대한 크게. 폭만 제한하면 세로로 넘치거나(넓은 화면) 작게
     남는다(높은 화면). 세 가지 중 가장 작은 값 — 가로 96vw · 상한 1920px · 세로에 맞춘 폭
     ((가용높이)*16/9) — 으로 잡으면 어떤 해상도에서도 넘치지 않고 꽉 찬다.
     160px 는 제목·출처·닫기·여백(위아래)이 쓰는 세로 높이의 넉넉한 어림값이다. */
  .wk-box{ width:min(96vw, 1920px, calc((100vh - 160px) * 16 / 9)); }
  .wk-mhead{ display:flex; align-items:flex-start; gap:14px; margin-bottom:12px; color:#fff; }
  .wk-mtitle{ margin:0; font-size:17px; font-weight:800; letter-spacing:-.02em; line-height:1.45;
              word-break:keep-all; }
  .wk-mby{ margin:5px 0 0; font-size:12.5px; color:var(--muted-dark); }
  .wk-x{ margin-left:auto; flex:none; width:44px; height:44px; display:grid; place-items:center;
         font-size:23px; line-height:1; color:#fff; border:1px solid var(--line-dark); }
  .wk-x:hover{ background:var(--lime); border-color:var(--lime); color:var(--ink); }
  /* 16:9 를 지키는 자리. iframe 은 열 때 만들어 여기에 채운다 */
  .wk-frame{ position:relative; width:100%; aspect-ratio:16/9; background:#000; }
  .wk-frame iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .wk-mfoot{ margin:12px 0 0; font-size:12px; }
  .wk-mfoot a{ color:var(--muted-dark); text-decoration:underline; text-underline-offset:3px; }
  .wk-mfoot a:hover{ color:var(--lime); }
  /* 움직임을 줄이라고 한 사람에게는 등장 효과를 주지 않는다 */
  @media (prefers-reduced-motion: no-preference){
    .wk-modal.on .wk-box{ animation:wkIn .18s ease; }
  }
  @keyframes wkIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
  @media (max-width:680px){
    .wk-modal{ padding:14px; }
    .wk-mtitle{ font-size:15px; }
  }

  /* ---------- 작품 갤러리 ----------
     썸네일이 먼저 오고 정보는 그 아래 두 줄이다(제목 / 만든 사람 · 메타).
     영상 목록에서는 이 배치가 표준이라 처음 온 사람도 설명 없이 읽는다.
     칸 최소폭 300px — 1320px 안쪽에서 네 칸, 태블릿에서 두 칸, 모바일에서 한 칸이 된다. */
  .wk-bar{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:8px; }
  .wk-bar .btn{ margin-left:auto; display:inline-flex; align-items:center; min-height:46px; }
  .wk-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
            gap:30px 22px; margin-top:22px; }
  .wk-thumb{ display:block; aspect-ratio:16/9; overflow:hidden; background:var(--ink-2); }

  .wk-noimg{ display:grid; place-items:center; width:100%; height:100%;

  @media (hover:hover){ .wk-card:hover .wk-title{ color:var(--coral); } }
  .dark .wk-card:hover .wk-title{ color:var(--lime); }
  .wk-info{ margin-top:12px; }
  /* 제목은 두 줄까지만. 세 줄이 되면 칸마다 높이가 달라져 격자가 흔들린다 */
  .wk-title{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
             overflow:hidden; font-size:14.5px; font-weight:800; line-height:1.45;
             letter-spacing:-.015em; word-break:keep-all; }
  .wk-by{ display:flex; align-items:center; gap:8px; margin-top:10px; min-width:0; }
  .wk-by .bd-ava{ width:24px; height:24px; }
  .wk-meta{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:8px;
            font-size:11.5px; color:var(--muted-light); }
  .dark .wk-meta{ color:var(--muted-dark); }

  /* ---------- motion ---------- */
  .reveal{ opacity:0; transform:translateY(24px);
           transition:opacity .7s ease, transform .7s ease; }
  .reveal.visible{ opacity:1; transform:none; }

    *{ scroll-behavior:auto !important; }

  /* ---------- responsive ---------- */
  @media (max-width:960px){
    .hero-bottom,.section-head{ grid-template-columns:1fr; gap:26px; }
    .card-grid{ grid-template-columns:1fr; }
    /* 두 단으로 두면 한 칸이 460px 밑으로 내려가는데, 왼쪽 D-day 칸 96px 을 빼면
       제목에 남는 폭이 모자라 공고명이 서너 줄로 접힌다. 한 단으로 되돌린다. */
    .rows.two{ grid-template-columns:1fr; column-gap:0; }
    /* 게시판 두 단이 한 단으로 접힌다. 브리핑은 위로 올린다 —

    .bd-cols{ grid-template-columns:1fr; gap:0; }
    .bd-cols aside{ order:-1; margin-bottom:8px; }

  /* 1040px 아래에서는 검색을 돋보기 하나로 접는다. 실측(2026-08-15): 900px 에서
     입력칸을 펴 둔 채로는 메뉴 아홉 개 중 121px 이 스크롤 뒤로 숨었다 —
     붙여 둔 기능 때문에 원래 있던 메뉴가 안 보이면 바꾼 쪽이 잘못한 것이다.
     버튼을 하나로 줄여 84px 을 벌었지만 메뉴가 아홉이 되어 기준은 오히려 올라갔다.
     돋보기는 오버레이 위(z-index)에 남아 닫기 버튼을 겸한다 — 닫기를 따로 세우면
     375px 위 줄이 로고·돋보기·닫기·로그인 넷이 되어 로고가 밀린다. */
  @media (max-width:1040px){
    .nav-icon{ display:grid; position:relative; z-index:97; }
    .nav-search{ position:static; }
    .nav-search .search{ display:none; }
    .nav-search.open .search{ display:block; position:fixed; top:0; left:0; right:0;

  /* 노트북 폭(1280 안팎)에서 로고+메뉴 여덟+검색+버튼 둘이 한 줄에 겨우 들어간다.
     메뉴 간격과 검색창을 먼저 줄인다 — 줄이는 순서를 정해 두지 않으면
     제일 중요한 메뉴가 먼저 잘린다. */
  @media (max-width:1180px){
    .nav{ padding:0 20px; gap:14px; }
    .nav-links{ gap:16px; font-size:12.5px; }
    .nav-search .search{ width:118px; }
    .nav-search .search:focus{ width:200px; }
    .nav .btn{ padding:10px 12px; }
  }
  @media (max-width:760px){
    /* 좁은 화면에서는 메뉴를 햄버거(☰) 뒤로 접는다(대표 2026-08-17, 참고: 애플시드).
       위 줄 하나(로고 + 검색·로그인·햄버거)만 두고, 메뉴는 햄버거를 눌러 드롭다운으로 편다.
       --navh 를 한 줄 높이로 되돌린다 — 메뉴가 내비 높이를 차지하지 않고 오버레이로 뜨므로. */
    :root{ --navh:62px; }
    .nav{ padding:0 18px; }
    .nav-inner{ gap:10px; }
    .nav-burger{ display:inline-flex; }
    /* 메뉴는 기본으로 숨고(햄버거로 연다), 열면 위 줄 아래 전체폭 드롭다운으로 뜬다 */
    .nav-links{ display:none; }

  @media (max-width:680px){
    /* 위 줄이 52px 이라 오버레이 높이도 그만큼으로 낮춘다(위 980 규칙을 덮는다) */

    /* 모바일 전용 object-position 오버라이드를 두지 않는다 — 위의 초점 고정 값(67% 8%)이

    /* 메뉴가 히어로 안으로 들어오며 모바일 히어로가 1300px 가까이 길어졌다.
       cover 로 그 높이를 다 채우면 가로 창이 16% 까지 좁아져 얼굴이 화면을 통째로

    .hero.has-photo .hero-bg{ bottom:auto; height:700px;

    .hero h1{ font-size:clamp(52px,17vw,92px); }

    /* 네 칸을 375px 에 한 줄로 세우면 한 칸이 80px 밑으로 내려가 라벨이 세 줄로 접힌다 */

       가로로 나란히 두면 제목 자리가 150px 밖에 안 남아 글자가 잘게 접힌다.

  }

<script>
(function(){
"use strict";

/* ============ 주소 체계 ============
   메뉴 다섯은 예전부터 해시(#contests)로 다녔고 그 링크가 이미 밖에 나가 있다.
   게시판만 실제 경로(/board/{slug})를 쓴다 — 나중에 글마다 정적 페이지를 만들 때
   주소가 그대로여야 이미 공유된 링크가 살아남는다.
   그래서 라우터는 두 방식을 함께 본다: 경로가 board 면 게시판, 아니면 기존 해시 그대로.

   베이스는 실행 중에 구한다. 하드코딩하면 어느 한쪽이 반드시 깨지기 때문이다 —
   지금은 자체 도메인 루트("/")이고 로컬도 "/" 지만, 옛 프로젝트 주소
   (kjyart-star.github.io/ai-radar/)로 들어오는 링크에서는 "/ai-radar/" 다.
   이 계산 덕분에 도메인을 옮겨도 아래 라우팅은 손댈 것이 없었다. */

/* GitHub Pages 는 /board/{slug} 에 해당하는 파일이 없으면 404.html 을 준다.
   404.html 이 원래 주소를 sessionStorage 에 담아 사이트 루트로 보내고, 여기서 되돌린다.
   BASE 를 계산하기 전에 되돌려야 한다 — 순서가 바뀌면 베이스가 루트로 잡힌다. */
(function restorePath(){
  try {
    var p = sessionStorage.getItem("airadar_path");
    if (!p) return;
    sessionStorage.removeItem("airadar_path");
    /* 저장된 값을 그대로 믿지 않는다. 같은 출처의 절대 경로만 통과시킨다 */
    if (p.charAt(0) === "/" && p.charAt(1) !== "/") history.replaceState(null, "", p);
  } catch(e){}
})();

/* 실제 경로를 쓰는 화면은 둘이다 — 게시판(/board/{슬러그})과 프로필(/u/{슬러그}).
   둘 다 앞부분을 잘라 베이스를 구한다. 404.html 의 정규식도 같은 모양이어야 한다. */
var BASE = (function(){
  var p = location.pathname;
  var m = p.match(/^(.*\/)(?:board|u|join)(?:\/|$)/);
  if (m) return m[1];
  return p.replace(/[^\/]*$/, "");
})();

/* 지금 주소가 게시판이면 슬러그("" = 피드)를, 아니면 null 을 준다 */
function boardPath(){
  var p = location.pathname;
  if (p === BASE + "board" || p === BASE + "board/") return "";
  if (p.indexOf(BASE + "board/") === 0){
    var rest = p.slice((BASE + "board/").length).replace(/\/+$/, "");
    try { return decodeURIComponent(rest); } catch(e){ return rest; }
  }
  return null;
}
function boardUrl(slug){ return BASE + "board/" + (slug ? encodeURIComponent(slug) : ""); }

/* 프로필도 같은 방식이다. 슬러그가 없는 /u/ 는 "내 프로필 편집"이다 —
   남에게 보여줄 주소(/u/{슬러그})와 내가 고치는 자리를 한 경로 아래 둔다.
   빈 슬러그가 편집 화면이라 프로필 슬러그는 최소 두 글자다(아래 wpSlugify). */
function profPath(){
  var p = location.pathname;
  if (p === BASE + "u" || p === BASE + "u/") return "";
  if (p.indexOf(BASE + "u/") === 0){
    var rest = p.slice((BASE + "u/").length).replace(/\/+$/, "");
    try { return decodeURIComponent(rest); } catch(e){ return rest; }
  }
  return null;
}
function profUrl(slug){ return BASE + "u/" + (slug ? encodeURIComponent(slug) : ""); }

/* 가입·로그인 안내 화면. 상단바 버튼 하나로도 로그인은 되지만, 밖에서 이 주소만
   받아 들어오는 사람에게는 "여기가 무엇을 하는 곳이고 왜 로그인하는지"를 보여 줄
   자리가 필요하다. 이미 로그인한 사람에게는 볼 것이 없으므로 홈으로 보낸다. */
function joinPath(){
  var p = location.pathname;
  return (p === BASE + "join" || p === BASE + "join/") ? "" : null;
}
function joinUrl(){ return BASE + "join"; }

/* ============ 공개 API (키 불필요·읽기 전용) ============
   ⚠️ 2026-08-12: 옛 주소가 404 로 죽어 다섯 메뉴가 전부 "데이터를 불러오지 못했습니다" 였다.
   관리시스템 웹앱에 **새 배포**를 만들면 URL 이 바뀌는데, 이 파일은 그걸 모른 채 옛 주소를
   계속 불렀다. 화면 자체는 떠서 겉으로는 멀쩡해 보인다 — 조용히 죽는 부류다.

/* 리포트 본문을 리치 카드로 렌더링: "• 제목 — 요약 (출처: URL)" 줄을
   [썸네일 | 제목·설명·링크] 가로 카드로 변환 (유튜브=영상 썸네일, 뉴스=언론사 아이콘/기사 사진) */
function richReport(s){
  var lines = String(s==null?"":s).replace(/\*\*/g,"").split("\n");
  var out = [], cardBuf = [], seenT = [];
  /* 연속된 카드 라인은 2열 그리드(card-grid)로 묶는다 */
  function flushCards(){
    if (cardBuf.length){
      out.push("<span class='card-grid'>"+cardBuf.join("")+"</span>");
      cardBuf = [];
    }
  }
  for (var i=0;i<lines.length;i++){
    var t = lines[i].trim();
    /* (img: URL) 마커 = 기사 사진 → 사진 카드로 렌더 */
    var imgM = t.match(/[\(（]\s*img\s*:\s*(https?:\/\/[^\s)）]+)\s*[\)）]/i);
    var photo = imgM ? imgM[1] : "";
    if (imgM) t = t.replace(imgM[0], "").trim();
    var um = t.match(/(https?:\/\/[^\s)<>"'　]+)/);
    if (/^[•\-*]/.test(t) && um){
      var url = um[1];
      var body = t.replace(/^[•\-*]+\s*/,"")
        .replace(/[\(（]\s*(?:출처|링크)\s*:?\s*https?:\/\/[^\s)）]+\s*[\)）]?/g,"")
        .replace(/https?:\/\/[^\s)<>"'　]+/g,"")
        .replace(/[\(（]\s*[\)）]/g,"").trim();
      var title = body, desc = "";
      var dash = body.indexOf(" — "); if (dash < 0) dash = body.indexOf(" - ");
      if (dash > -1){ title = body.slice(0,dash).trim(); desc = body.slice(dash+3).trim(); }
      var ym = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{6,20})/);
      /* 같은 사건을 여러 언론사가 다룬 근접 중복 기사는 하나만 보인다(대표 2026-08-17).
         언론사마다 제목을 다르게 쓰고 앞에 수식을 붙이기도 해서("AI가 화면 밖 현실로…서울 AI 허브…"
         vs "서울 AI 허브, 22일…") 앞부분 비교로는 못 잡는다. 단어(토큰)를 얼마나 공유하는지로 본다 —
         짧은 쪽 단어의 60% 이상을 공유하면 같은 기사로 본다. 유튜브(ym)는 규칙에서 뺀다. */
      if (!ym){
        var _toks = String(title).toLowerCase().split(/[^가-힣a-z0-9]+/)
                      .filter(function(w){ return w.length >= 2; });
        var _dup = false;
        for (var _si=0; _si<seenT.length && _toks.length>=3; _si++){
          var _o = seenT[_si], _both = 0, _oi;
          for (_oi=0; _oi<_toks.length; _oi++){ if (_o.indexOf(_toks[_oi]) >= 0) _both++; }
          if (_both >= Math.min(_toks.length, _o.length) * 0.6){ _dup = true; break; }
        }
        if (_dup) continue;
        if (_toks.length) seenT.push(_toks);
      }
      var hh = url.match(/^https?:\/\/([^\/]+)/); var hst = hh ? hh[1].replace(/^www\./,"") : "";
      var img, cls, go;
      if (ym){ img = "https://i.ytimg.com/vi/"+ym[1]+"/mqdefault.jpg"; cls = "yt"; go = "youtube.com · 영상 보기"; }
      else if (photo){ img = photo; cls = "news photo"; go = hst+" · 기사 보기 ↗"; }
      else { img = "https://www.google.com/s2/favicons?domain="+hst+"&sz=128"; cls = "news"; go = hst+" · 기사 보기 ↗"; }
      /* 사진 → 파비콘 → 우리 마크 순으로 떨어진다.
         원문 이미지를 최대한 쓰되, 없으면 지구본 대신 우리 것을 세운다 (대표 지시 2026-08-13) */
      var mk = " onerror=\"icMark(this,'"+esc(hst)+"')\" onload=\"icCheck(this,'"+esc(hst)+"')\"";
      var onerr = photo
        ? " onerror=\"this.onerror=null;this.src='https://www.google.com/s2/favicons?domain="+esc(hst)+"&sz=128';"+
          "this.closest('.item-card').classList.remove('photo');"+
          "this.onerror=function(){icMark(this,'"+esc(hst)+"')};this.onload=function(){icCheck(this,'"+esc(hst)+"')}\""
        : mk;
      /* 유튜브 카드만 모달로 연다. 기사 카드는 원문으로 나가는 것이 맞다 */
      var vk = ym ? wkReg({ url:url, title:title, by:"" }) : "";
      var ch = vk
        ? "<button type='button' class='item-card "+cls+"' data-wkplay='"+esc(vk)+"'>"
        : "<a class='item-card "+cls+"' href='"+esc(url)+"' target='_blank' rel='noopener noreferrer'>";
      cardBuf.push(ch+
        "<img src='"+esc(ctSafeUrl(img))+"' alt='' loading='lazy'"+onerr+">"+
        "<span class='ic-body'><span class='ic-title'>"+esc(title)+"</span>"+
        (desc ? "<span class='ic-desc'>"+esc(desc)+"</span>" : "")+
        "<span class='ic-url'>"+esc(go)+"</span></span>"+(vk ? "</button>" : "</a>"));
    } else {
      if (t === "" && cardBuf.length){ continue; } /* 카드 사이 빈 줄로 그리드가 끊기지 않게 */
      flushCards();
      /* 관리시스템이 붙이는 내부 표기 줄은 사용자에게 보이지 않게 버린다
         (예: "(자동 요약 미사용 — 수집 목록 원문)"). 대표 지시 2026-08-16 */
      if (/^[\(（]\s*자동\s*요약/.test(t)){ continue; }
      /* "# 제목", "## [생성형 AI]" 같은 헤더 줄을 라벨로 조판한다. 원문 문자열은
         건드리지 않고 보이는 형태만 바꾼다 — 그냥 두면 #이 그대로 찍힌다. */
      var hm = t.match(/^(#{1,6})\s+(.+)$/);
      if (hm){
        out.push("<span class='sec-label"+(hm[1].length===1?" meta":"")+"'>"+
          esc(hm[2].replace(/^\[/,"").replace(/\]$/,""))+"</span>");
      } else {
        out.push(linkify(lines[i]));
      }
    }
  }
  flushCards();
  return out.join("\n");
}

  return new Date(+p[0], +p[1]-1, +p[2]); }
/* 수집물의 date 는 RSS 원문 그대로라 UTC 다. 앞 10자만 자르면 9시간이 밀려
   오늘 아침 7시 기사가 어제 날짜로 찍힌다 (2026-08-13 실측: 07:26 KST → "2026-08-12").
   회사 규칙이 "날짜는 절대 표기"이므로 보이는 날짜는 KST 로 맞춘다.
   날짜만 있고 시각이 없는 값(2026-08-12)은 변환하지 않고 그대로 쓴다 — 이미 날짜다. */
function ymdKST(s){
  var v = String(s||"");
  if (!v) return "";
  if (v.length <= 10) return v.slice(0,10);
  var d = new Date(v);
  if (isNaN(d)) return v.slice(0,10);
  try {
    return d.toLocaleDateString("sv-SE", { timeZone:"Asia/Seoul" });  /* sv-SE → YYYY-MM-DD */
  } catch(e){ return v.slice(0,10); }
}
function ddayInfo(due, today){

  if (dd){ var diff = Math.round((dd-today)/86400000);
    txt = diff===0?"D-DAY": diff>0?("D-"+diff):("D+"+(-diff));
    cls = diff<0?"over": diff<=3?"soon": diff<=7?"mid":"far"; }
  return { cls:cls, txt:txt };
}

/* 원문 아이콘이 없을 때 <img> 를 우리 마크로 바꾼다.

/* ---- 수집물 공용 포맷 ----
   뉴스·커뮤니티·기술동향은 마감이 없어 D-day 를 쓸 수 없다. 대신 왼쪽 큰 칸에

   세 섹션이 같은 의미의 칸을 쓰도록 통일했다. 칸마다 뜻이 다르면 읽을 때마다 다시 배워야 한다. */
function agoText(iso){
  var t = Date.parse(iso||"");
  if (isNaN(t)) return "—";
  var m = Math.round((Date.now()-t)/60000);
  if (m < 1) return "방금";
  if (m < 60) return m+"분 전";
  var h = Math.round(m/60);
  if (h < 24) return h+"시간 전";
  var d = Math.round(h/24);
  return d < 30 ? d+"일 전" : Math.round(d/30)+"개월 전";
}
function nfmt(n){
  n = Number(n);
  if (!isFinite(n)) return "";
  return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}
/* 큰 수를 한 칸에 넣기 위한 축약. 385950 → 386K, 12345678 → 1,235만 */
function kfmt(n){
  n = Number(n);
  if (!isFinite(n) || n < 0) return "";
  if (n >= 100000000) return (n/100000000).toFixed(1).replace(/\.0$/,"")+"억";
  if (n >= 10000) return nfmt(n/10000)+"만";
  if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,"")+"K";
  return String(n);
}
/* "$1,000,000" → "$1M" (왼쪽 큰 칸에 넣을 상금 축약. 원본은 meta 에 그대로 남긴다) */
function prizeShort(s){
  var n = Number(String(s||"").replace(/[^\d]/g,""));
  if (!n) return "";
  if (n >= 1000000) return "$"+(n/1000000).toFixed(n%1000000?1:0).replace(/\.0$/,"")+"M";
  if (n >= 1000) return "$"+Math.round(n/1000)+"K";
  return "$"+n;
}

   브라우저마다 다른 모양이 나오므로 조각(formatToParts)으로 직접 조립한다.

function fmtGen(iso){
  var d = new Date(iso||"");
  if (isNaN(d)) return String(iso||"");
  var g = {};
  new Intl.DateTimeFormat("en-CA",{ timeZone:"Asia/Seoul", year:"numeric", month:"2-digit",
    day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false })
    .formatToParts(d).forEach(function(p){ g[p.type] = p.value; });
  return g.year+"-"+g.month+"-"+g.day+" "+g.hour+":"+g.minute+" KST";
}

/* 마감이 오늘부터 N일 이내인 건수 — 히어로 숫자에 쓴다 */
function dueWithin(list, key, days, today){
  var n = 0;
  (list||[]).forEach(function(it){
    var d = parseDate(it[key]); if (!d) return;
    var diff = Math.round((d-today)/86400000);
    if (diff >= 0 && diff <= days) n++;
  });
  return n;
}

/* 히어로 슬라이드쇼.
   image/a001~a004.png 를 3초마다 크로스페이드로 전환한다.
   홈에서만 동작하고 다른 화면으로 이동하면 타이머를 멈춘다.
   마크업의 img.src 는 상대 경로라 /board/{slug} 같은 경로에서 깨질 수 있어
   홈 진입 시 BASE 기준으로 보정한다. */
var heroBgTimer = null;
var heroBgIdx = 0;
function startHeroSlide(){
  var bg = document.getElementById("heroBg");
  if (!bg) return;
  var imgs = bg.querySelectorAll("img");
  if (!imgs.length) return;
  /* src 상대 경로를 BASE 기준으로 한 번 보정한다 */
  if (String(imgs[0].getAttribute("src")).indexOf(BASE) !== 0){
    for (var k = 0; k < imgs.length; k++){
      var orig = imgs[k].getAttribute("src");
      /* 이미 BASE 로 시작하거나 http 절대경로이면 건드리지 않는다 */
      if (orig && orig.indexOf("http") !== 0 && orig.indexOf(BASE) !== 0){
        imgs[k].setAttribute("src", BASE + orig);
      }
    }
  }
  /* 이미 실행 중이면 중복 시작하지 않는다 */
  if (heroBgTimer) return;
  function next(){
    var bg2 = document.getElementById("heroBg");
    if (!bg2) { heroBgTimer = null; return; }
    var imgs2 = bg2.querySelectorAll("img");
    if (!imgs2.length) { heroBgTimer = null; return; }
    /* 현재 active 해제 */
    imgs2[heroBgIdx % imgs2.length].classList.remove("active");
    heroBgIdx = (heroBgIdx + 1) % imgs2.length;
    imgs2[heroBgIdx].classList.add("active");
    heroBgTimer = setTimeout(next, 3000);
  }
  heroBgTimer = setTimeout(next, 3000);
}
function stopHeroSlide(){
  if (heroBgTimer){ clearTimeout(heroBgTimer); heroBgTimer = null; }
}
function drawHero(route){
  var h = HERO[route] || HERO[DEFAULT_ROUTE];
  var t = document.getElementById("heroTitle");
  /* 배경 사진은 홈에서만 켠다. 다른 화면은 지금 그대로 검은 바탕 위 레이더다. */
  var hero = document.getElementById("top");
  if (hero){
    if (route === "home"){
      hero.classList.add("has-photo");
      startHeroSlide();
    } else {
      hero.classList.remove("has-photo");
      stopHeroSlide();
    }
  }
  /* 홈만 한글 문장 제목이라 라틴 대문자 조판(-.075em·uppercase)을 쓰면 글자가 뭉개진다.
     문구에 든 <br> 은 한글 줄바꿈을 손으로 잡아 둔 것이라 그대로 넣는다 —
     상수이고 바깥에서 들어온 값이 아니다. */
  var mw = document.getElementById("heroMenuWrap");
  if (route === "home"){
    t.className = "h-home";
    t.innerHTML = HOME_COPY.h1;
    document.getElementById("heroCopy").textContent = HOME_COPY.sub;
    /* 히어로 메뉴 카드는 제거했다(대표 2026-08-17) — 상단 네비(가로메뉴·모바일 햄버거)에
       같은 메뉴가 이미 다 있어 중복이고, 사진 위에 카드 8개를 얹으니 히어로가 지저분해졌다.
       비워 두면 #heroMenuWrap:empty 규칙으로 여백도 사라진다. */
    if (mw) mw.innerHTML = "";
    return;
  }
  t.className = "";
  t.innerHTML = esc(h.latin) + "<em>" + esc(h.ko) + "</em>";
  /* 마감 점·메뉴 카드는 홈의 것이다 — 다른 화면까지 따라다니면 안 된다 */
  var dots = document.getElementById("heroDots");
  if (dots) dots.innerHTML = "";
  if (mw) mw.innerHTML = "";

function setFacts(list){

     "—" 는 지우지 않는다 — 아직 데이터가 오기 전이라는 뜻이고, 그 자리를 잡아 두어야
     숫자가 채워질 때 화면이 밀리지 않는다. */
  list = list.filter(function(f){ return String(f[0]) !== "0"; });

/* 목록 한 줄 — 다섯 화면이 전부 이 단위를 쓴다 */
function row(o){
  var dd = "<div class='dd tnum "+esc(o.ddCls)+"'>"+esc(o.dd)+"</div>";
  var tags = (o.tags||[]).filter(Boolean).map(function(t){
    return "<span class='tag'>"+esc(t)+"</span>"; }).join("");
  var inner = dd + "<div class='r-main'>"+
    "<div class='r-title'>"+esc(o.title)+tags+"</div>"+
    /* titleEn 은 번역문을 제목 자리에 올렸을 때만 채워진다 (수집기의 titleKo).
       원문을 지우지 않는 이유는 CSS 주석(.r-title-en)에 적어 뒀다. */
    (o.titleEn ? "<div class='r-title-en'>"+esc(o.titleEn)+"</div>" : "")+
    (o.meta && o.meta.length ? "<div class='r-meta'>"+o.meta.filter(Boolean).join("<i>·</i>")+"</div>" : "")+
    (o.sum ? "<div class='r-sum'>"+esc(o.sum)+"</div>" : "")+"</div>";
  var url = ctSafeUrl(o.url);
  var el = url ? "<a class='row' href='"+esc(url)+"' target='_blank' rel='noopener noreferrer'>"+inner+"</a>"
               : "<div class='row'>"+inner+"</div>";
  /* o.talk 가 있으면 게시판으로 건너가는 버튼을 붙인다. 목록에서 본 것을 두고
     바로 이야기할 자리가 없으면, 게시판은 늘 빈 채로 남는다.
     버튼을 <a class='row'> 안에 넣지 않는 이유는 CSS 주석(.row-wrap)에 적어 뒀다. */
  if (!o.talk && !o.save) return el;
  /* 담기와 이야기하기는 둘 다 행(링크) 바깥에 둔다 — 안에 넣으면 누를 때마다
     원문으로 튀어 나간다. 바깥에 두면 클릭이 섞이지 않아 stopPropagation 도 필요 없다. */
  var acts = "";
  if (o.save) acts += saveBtn(o.save);
  if (o.talk){
    acts += "<button type='button' class='row-talk' data-talk='"+esc(o.talk.type||"")+"'"+
      " data-talk-title='"+esc(o.talk.title||"")+"'"+
      " data-talk-url='"+esc(ctSafeUrl(o.talk.url||""))+"'>이야기하기</button>";
  }
  return "<div class='row-wrap'>"+el+"<div class='row-acts'>"+acts+"</div></div>";
}

/* ============ 담기(북마크) ============
   메인에 "마감 3일 전에 알려드립니다"라고 적어 두었는데 무엇의 마감을 보낼지가
   정해져 있지 않았다. 담은 것이 그 답이다 — 담긴 것만 알려 준다.
   그래서 이것은 편의 기능이 아니라 알림과 재방문의 축이다.

   ⚠️ 식별자는 매일 수집이 갱신돼도 같은 항목이 같은 값이어야 한다. 그래서 제목·주최에서
   계산한다(FNV-1a 32비트). data/slugs.json 의 슬러그를 쓰지 않는 이유는 그 파일이
   177KB 라 목록을 그리는 시점에 없을 수 있고, 있을 때와 없을 때 키가 달라지면
   같은 항목이 두 번 담기기 때문이다 — 그건 이 기능의 생명을 끊는다. */
var SV_MAX = 300;
var svMine = {}, svLoaded = false, svPending = null;
function svHash(str){
  var h = 2166136261, i;
  str = String(str||"");
  for (i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    /* FNV 곱셈을 시프트로 편다 — 그냥 곱하면 2^53 을 넘겨 값이 틀어진다 */
    h = (h + ((h<<1) + (h<<4) + (h<<7) + (h<<8) + (h<<24))) >>> 0;
  }
  return h.toString(36);
}
function svKey(kind, title, org){
  return String(kind||"x") + "-" + svHash(String(title||"") + "|" + String(org||""));
}
function saveBtn(sv){
  /* 이미 담긴 항목은 그때 만든 키를 그대로 쓴다. 여기서 다시 계산하면 주최를 모르는
     화면(내 계획)에서 다른 키가 나와, 빼려던 버튼이 새로 담아 버린다. */
  var k = sv.key || svKey(sv.kind, sv.title, sv.org);
  var on = !!svMine[k];
  return "<button type='button' class='row-save"+(on?" on":"")+"' data-save='"+esc(k)+"'"+
    " data-sv-kind='"+esc(sv.kind||"")+"' data-sv-title='"+esc(sv.title||"")+"'"+
    " data-sv-due='"+esc(sv.deadline||"")+"' data-sv-url='"+esc(ctSafeUrl(sv.url||""))+"'"+
    " aria-pressed='"+on+"' title='"+(on?"담은 것에서 빼기":"내 계획에 담기")+"'>"+
    (on ? "♥ 담음" : "♡ 담기")+"</button>";
}
function svLoad(){
  if (!bdUser || !fbDb){ svMine = {}; svLoaded = false; return Promise.resolve({}); }
  if (svLoaded) return Promise.resolve(svMine);
  return fbDb.collection("saves").doc(bdUser.uid).collection("items").limit(SV_MAX).get()
    .then(function(sn){
      var m = {};
      sn.forEach(function(d){ var o = d.data()||{}; o.id = d.id; m[d.id] = o; });
      svMine = m; svLoaded = true;
      return m;
    }, function(e){
      if (window.console && console.warn) console.warn("[담기] 목록을 읽지 못했습니다", e);
      return svMine;
    });
}
/* 화면을 다시 그리지 않고 그 버튼만 바꾼다 — 목록 스크롤을 잃지 않게 */
function svPaint(key){
  var on = !!svMine[key];
  C.querySelectorAll("[data-save='"+key+"']").forEach(function(b){
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", String(on));
    b.textContent = on ? "♥ 담음" : "♡ 담기";
  });
  if (curRoute() === "home") homeFillSub();
}
function svFromEl(el){
  return { key: el.getAttribute("data-save"),
           kind: el.getAttribute("data-sv-kind") || "",
           title: el.getAttribute("data-sv-title") || "",
           deadline: el.getAttribute("data-sv-due") || "",
           url: el.getAttribute("data-sv-url") || "" };
}
function svWrite(o){
  var doc = fbDb.collection("saves").doc(bdUser.uid).collection("items").doc(o.key);
  return doc.set({
    kind: String(o.kind||"").slice(0,10),
    key: String(o.key||"").slice(0,60),
    title: String(o.title||"").slice(0,200),
    deadline: String(o.deadline||"").slice(0,10),
    url: String(o.url||"").slice(0,500),
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}
function svToggle(el){
  var o = svFromEl(el);
  if (!o.key) return;
  if (!bdUser){
    /* 담으려던 것을 기억해 두었다가 로그인하면 자동으로 담는다 */
    svPending = o;
    bdToast("로그인하면 담을 수 있습니다");
    nvLoginGo();
    return;
  }
  if (!fbDb) return;
  var had = !!svMine[o.key];
  /* 먼저 화면을 바꾸고 뒤에서 쓴다. 실패하면 되돌린다 */
  if (had) delete svMine[o.key]; else svMine[o.key] = o;
  svPaint(o.key);
  var w = had
    ? fbDb.collection("saves").doc(bdUser.uid).collection("items").doc(o.key)["delete"]()
    : svWrite(o);
  w.then(function(){
    if (!had) bdToast("내 계획에 담았습니다");
  }, function(e){
    if (had) svMine[o.key] = o; else delete svMine[o.key];
    svPaint(o.key);
    if (window.console && console.error) console.error("[담기]", e);
    bdToast(had ? "빼지 못했습니다" : "담지 못했습니다");
  });
}
/* 로그인 직후, 담으려다 만 것이 있으면 그때 담는다 */
function svFlush(){
  if (!svPending || !bdUser || !fbDb) return;
  var o = svPending; svPending = null;
  svWrite(o).then(function(){
    svMine[o.key] = o;
    svPaint(o.key);
    bdToast("내 계획에 담았습니다");
  }, function(){});
}
function emptyNote(msg){ return "<p class='note'>"+esc(msg)+"</p>"; }
function failBox(msg, extra){
  return "<div class='fail'><h3>데이터를 불러오지 못했습니다</h3>"+
    "<p>"+esc(msg||"네트워크 상태를 확인한 뒤 다시 시도해 주세요.")+"</p>"+
    (extra||"<button class='btn' data-retry>다시 시도</button>")+"</div>";
}
function bindRetry(root){
  var b = root.querySelector("[data-retry]");
  if (!b) return;
  b.onclick = function(){
    state.loading = true; state.error = null; render();
    loadData().catch(function(e){ state.loading=false; state.error=e.message||String(e); }).then(render);
  };
}

/* ============ 데이터 (공개 목록 API — 읽기 전용) ============
   목록은 두 곳에서 온다. 순서가 곧 첫 로딩 속도다.
   (1) data/pub.json — 우리 저장소 스냅샷. 같은 출처라 0.05~0.27초에 온다. 이걸로 먼저 그린다
   (2) ?action=pub — 살아있는 값. 2026-08-12 실측 6.0~68.5초, 세 번에 한 번은 404 였다.
       늦게 와서 스냅샷과 내용이 다를 때만 조용히 다시 그린다. 같으면 그리지 않는다 —
       멀쩡한 화면을 다시 세우면 그게 깜빡임이다
   라이브가 끝내 실패해도 스냅샷이 있으면 화면은 정상이다. 그때 stamp() 가 보여주는 시각은
   스냅샷 안에 든 서버 생성 시각이다 — 없는 신선도를 지어내지 않는다. */
var PUB_SNAPSHOT = BASE + "data/pub.json";

function validPub(j){ return !!(j && (j.reports || j.festivals)); }
/* 다시 그릴지 판단하는 최소 지문 — 리포트 수 · 최신 발행일 · 영화제 수.
   generated 는 넣지 않는다. 매번 달라져 내용이 같아도 다시 그리게 된다 */
function pubSig(j){
  var rs = (j && j.reports) || [], last = "";
  for (var i=0;i<rs.length;i++){ var d = String(rs[i].report_date||""); if (d > last) last = d; }
  return rs.length + "/" + last + "/" + (((j && j.festivals) || []).length);
}
function applyPub(j){
  state.data = j; state.loading = false; state.error = null;
  stamp();
}
function loadPubSnapshot(){
  return fetch(PUB_SNAPSHOT, { cache:"no-store" })
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(j){
      if (!validPub(j)) throw new Error("스냅샷 형식이 올바르지 않습니다");
      if (state.pubLive) return null;   /* 라이브가 먼저 왔으면 스냅샷은 버린다 */
      applyPub(j);
      return j;
    });
}
function loadData(){
  return fetch(API + "?action=pub&t=" + Date.now(), { cache:"no-store" })
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(j){
      if (!validPub(j)) throw new Error("응답 형식이 올바르지 않습니다");
      state.pubChanged = !state.data || pubSig(state.data) !== pubSig(j);
      state.pubLive = true;
      applyPub(j);
      return j;
    });
}
function stamp(){
  var el = document.getElementById("footStamp");
  if (el && state.data && state.data.generated) el.textContent = "목록 갱신 " + state.data.generated + " (KST)";
}

/* ============ 뉴스리포트 — 바깥 소스 섹션 ============
   관리시스템 브리핑(위쪽)은 하루 한 번 사람이 읽을 수 있게 정리된 것이고,
   아래 세 섹션은 원문 피드를 그대로 세운 것이다. 성격이 달라 섞지 않는다.
   전부 우리 저장소의 JSON 을 읽는다 — 원본 소스는 CORS 를 열어 주지 않는다. */
function newsSection(){
  return loadFeed("news").then(function(j){
    var items = (j && j.items) || [];
    if (!items.length) return "";
    var rows = items.map(function(it){
      var meta = [];
      if (it.source && it.source !== it.feed) meta.push("<b>"+esc(it.source)+"</b>");
      if (it.date) meta.push(esc(ymdKST(it.date)));
      return row({ dd:agoText(it.date), ddCls:"tbd",
                   title:it.titleKo || it.title, titleEn:it.titleKo ? it.title : "",
                   tags:[it.feed], meta:meta, sum:it.summary, url:it.url });
    }).join("");
    return "<section class='section paper-alt'><div class='inner'>"+
      sectionHead("Newswire","오늘의<br>AI 뉴스.",
        "국내외 AI 뉴스를 최신순으로 모았습니다. "+esc(fmtGen(j.generated))+" 기준.",
        "<b>"+items.length+"</b>건")+
      "<div class='rows'>"+rows+"</div></div></section>";
  }).catch(function(){ return ""; });
}
function communitySection(){
  return loadFeed("community").then(function(j){
    var items = (j && j.items) || [];
    if (!items.length) return "";
    var rows = items.map(function(it){
      var meta = [];
      if (it.points != null) meta.push("<b>"+nfmt(it.points)+"점</b>");
      if (it.comments != null) meta.push("댓글 "+nfmt(it.comments));
      if (it.date) meta.push(esc(ymdKST(it.date)));
      return row({ dd:agoText(it.date), ddCls:"tbd",
                   title:it.titleKo || it.title, titleEn:it.titleKo ? it.title : "",
                   tags:[it.source], meta:meta, sum:it.summary, url:it.url });
    }).join("");
    return "<section class='section dark'><div class='inner'>"+
      sectionHead("Community","커뮤니티에서<br>도는 이야기.",
        "기사가 되기 전에 개발자들 사이에서 먼저 도는 이야기입니다. "+esc(fmtGen(j.generated))+" 기준.",
        "<b>"+items.length+"</b>건")+
      "<div class='rows'>"+rows+"</div></div></section>";
  }).catch(function(){ return ""; });
}
/* 기술 동향은 매일 볼 것이 아니라 필요할 때 여는 자료다 — 접어 둔다.
   메뉴를 새로 만들지 않은 이유이기도 하다(대표가 방금 메뉴를 확정했다). */
function techSection(){
  return loadFeed("tech").then(function(j){
    if (!j) return "";
    var ax = j.arxiv||[], gh = j.github||[], hf = j.huggingface||[];
    var n = ax.length + gh.length + hf.length;
    if (!n) return "";
    function group(label, note, rows){
      return "<p class='count' style='margin:0 0 14px'><b>"+esc(label)+"</b> · "+esc(note)+"</p>"+
             "<div class='rows' style='margin-bottom:38px'>"+rows+"</div>";
    }
    /* 바로 써 볼 수 있는 것을 위에 둔다 — 코드(GitHub) → 모델(Hugging Face) → 논문(arXiv) 순.
       논문은 읽고 이해하는 데 시간이 들어 맨 아래가 맞다. */
    var body = "";
    if (gh.length) body += group("GitHub", gh.length+"곳 · 최근 7일 안에 갱신된 ai 토픽 저장소를 별 많은 순으로",
      gh.map(function(it){
        var meta = [];
        if (it.language) meta.push(esc(it.language));
        if (it.date) meta.push("갱신 "+esc(ymdKST(it.date)));
        return row({ dd:kfmt(it.stars), ddCls:"far", title:it.title,
                     tags:["별 "+nfmt(it.stars)], meta:meta, sum:it.summary, url:it.url });
      }).join(""));
    if (hf.length) body += group("Hugging Face", hf.length+"개 · 트렌딩 모델",
      hf.map(function(it){
        var meta = [];
        if (it.task) meta.push(esc(it.task));
        if (it.downloads != null) meta.push("내려받기 "+nfmt(it.downloads));
        if (it.date) meta.push(esc(ymdKST(it.date)));
        return row({ dd:it.likes != null ? kfmt(it.likes) : "—", ddCls:"far", title:it.title,
                     tags:["좋아요"], meta:meta, url:it.url });
      }).join(""));
    if (ax.length) body += group("arXiv cs.AI", ax.length+"편 · 최근 등록순",
      ax.map(function(it){
        return row({ dd:agoText(it.date), ddCls:"tbd",
                     title:it.titleKo || it.title, titleEn:it.titleKo ? it.title : "",
                     tags:["논문"], meta:[esc(ymdKST(it.date))], sum:it.summary, url:it.url });
      }).join(""));
    body = "<p class='section-intro' style='margin:0 0 30px'>"+
      "새 논문과 모델이 어디로 향하는지 봅니다. "+
      esc(fmtGen(j.generated))+" 기준.</p>" + body;
    return foldSection("paper-alt","Research","기술 동향", n+"건", body);
  }).catch(function(){ return ""; });
}

function fillNewsExtra(){
  var el = C.querySelector("[data-extra]");
  if (!el) return;
  Promise.all([newsSection(), communitySection(), techSection()]).then(function(parts){
    if (curRoute()!=="newsrep") return;   /* 라우트를 떠났으면 버린다 */
    el.innerHTML = parts.join("");

  });
}

/* ============ 뉴스리포트 ============ */
/* reportSelId 는 "사람이 지난 브리핑을 눌러서 고른 것"만 담는다.
   자동으로 채우면 스냅샷(어제)으로 먼저 그릴 때 어제 것이 고정되고,
   라이브(오늘)가 와서 다시 그려도 어제 것이 목록에 남아 있어 그대로 머문다.
   2026-08-13 실측 — 지표는 21호인데 본문은 8/12 였다. */
var reportSelId = null;
function sortedReports(){
  return ((state.data && state.data.reports) || []).slice()
    .sort(function(a,b){ return String(b.report_date||"").localeCompare(String(a.report_date||"")); });
}
function renderReports(){
  var all = sortedReports();
  if (!all.length){
    setKicker(["대기 중"]);
    setFacts([["0","발행된 브리핑"],["—","최신 발행일"],["매일 아침","발행 주기"]]);
    C.innerHTML = "<section class='section paper'><div class='inner'>"+
      sectionHead("Briefing","아직 발행된 브리핑이<br>없습니다.",
        "브리핑은 매일 아침 자동으로 올라옵니다. 잠시 뒤 다시 열어 주세요.","")+
      "</div></section><div data-extra></div>";
    fillNewsExtra();
    return;
  }
  /* 고른 것이 목록에서 사라졌으면 선택을 버리고 최신으로 돌아간다.
     남아 있으면 그대로 둔다 — 사람이 지난 브리핑을 보는 중일 수 있다 */
  if (reportSelId && !findById(all, reportSelId)) reportSelId = null;
  var latest = String(all[0].report_date||"").slice(0,10);
  setKicker(["매일 아침 발행", latest + " 발행", all.length + "호"]);

  C.innerHTML =
    "<section class='section paper' id='brief'><div class='inner'>"+
      "<div class='section-head'><div><p class='eyebrow'>Today</p>"+
      "<h2>오늘 아침의<br>AI 브리핑.</h2></div>"+
      "<p class='section-intro'>밤사이 나온 AI 소식을 매일 아침 한 장으로 정리합니다.</p></div>"+
      "<div data-brief></div>"+
    "</div></section>"+
    /* 바깥 소스 세 섹션은 브리핑 바로 아래에 온다. 보관함(지난 브리핑)은 다시 찾아볼 때
       쓰는 자리라 맨 끝으로 내렸다 — 매일 새로 오는 것이 위, 쌓아 두는 것이 아래다. */
    "<div data-extra></div>"+
    "<section class='section dark'><div class='inner'>"+
      sectionHead("Archive","지난 브리핑","날짜를 누르면 맨 위 본문이 그 날짜로 바뀝니다.",
        "<b>"+all.length+"</b>호 보관")+
      "<div class='arch' data-arch></div>"+
    "</div></section>";
  fillNewsExtra();

  var briefEl = C.querySelector("[data-brief]");
  var archEl = C.querySelector("[data-arch]");

  function drawBrief(){
    var r = findById(all, reportSelId) || all[0];
    var body = richReport(stripYtSection(r.content||""));
    var items = (String(r.content||"").match(/^[•\-*]\s/gm)||[]).length;
    setFacts([
      [String(all.length), "발행된 브리핑"],
      [String(r.report_date||"").slice(5,10).replace("-","/"), "이 브리핑 발행일"],

    ]);
    briefEl.innerHTML =
      "<div class='brief-head'><h3>"+esc(r.title||"(제목 없음)")+"</h3>"+
      "<div class='brief-date tnum'>"+esc(String(r.report_date||"").slice(0,10))+"</div></div>"+
      "<div class='brief-body'>"+body+"</div>";
  }
  function drawArch(){
    archEl.innerHTML = all.map(function(r){
      var on = String(r.id)===String(reportSelId) ? " class='on'" : "";
      return "<button type='button'"+on+" data-pick='"+esc(r.id)+"'>"+
        "<span class='a-date tnum'>"+esc(String(r.report_date||"").slice(0,10))+"</span>"+
        "<span class='a-title'>"+esc(r.title||"(제목 없음)")+"</span></button>";
    }).join("");
